# EXPERIMENTAL ONLY: built-in StikJIT for MeloNX.
# This workflow exists only on feature/stikjit-melonx and never updates main or
# backup/stable-20260829-build164.
workflows:
  ios-stikjit-melonx-165-experimental:
    name: NeoStation iOS Build 165 - StikJIT MeloNX Experimental
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - neostation_secrets

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: feature/stikjit-melonx
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Verify experiment is isolated from stable code
        script: |
          set -euo pipefail
          BASE='b839ef10722ecbcfee721bdb7deb8f31431082cd'
          git cat-file -e "$BASE^{commit}" 2>/dev/null || git fetch --no-tags origin "$BASE"

          unexpected=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              codemagic.yaml|pubspec.yaml|lib/services/ios_shortcut_jit_launch_service.dart|lib/services/stikjit_melonx_service.dart|packages/stikjit_bridge/*)
                ;;
              *)
                echo "Unexpected experimental change: $file"
                unexpected=1
                ;;
            esac
          done < <(git diff --name-only "$BASE"...HEAD)
          [ "$unexpected" -eq 0 ]

          git diff --quiet "$BASE"...HEAD -- lib/services/rpcs3_library_service.dart
          git diff --quiet "$BASE"...HEAD -- lib/services/screenscraper_service.dart
          git diff --quiet "$BASE"...HEAD -- lib/services/melonx_library_service.dart
          grep -q 'final selected = await ExternalFolderAccess.resolveBookmarkedFolder' \
            lib/services/rpcs3_library_service.dart
          grep -q 'version: 1.0.0+163' pubspec.yaml
          echo 'Experiment isolation verified. Stable RPCS3, ScreenScraper and MeloNX library code are untouched.'

      - name: Prepare verified build-time defines
        script: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys

          required = (
              'SCREENSCRAPER_DEV_ID',
              'SCREENSCRAPER_DEV_PASSWORD',
          )
          values = {name: os.environ.get(name, '') for name in required}
          missing = [name for name, value in values.items() if not value]
          if missing:
              print('Missing required Codemagic variables: ' + ', '.join(missing))
              sys.exit(1)

          malformed = [
              name for name, value in values.items()
              if value != value.strip() or '\n' in value or '\r' in value
          ]
          if malformed:
              print('Malformed Codemagic variables: ' + ', '.join(malformed))
              sys.exit(1)

          values['NEOSTATION_EXPERIMENTAL_STIKJIT_MELONX'] = 'true'
          values['NEOSTATION_MELONX_BUNDLE_ID'] = 'com.nur.nx'

          output = pathlib.Path('.dart-defines.json')
          output.write_text(json.dumps(values, ensure_ascii=False), encoding='utf-8')
          output.chmod(0o600)
          print('ScreenScraper credentials and experimental StikJIT flag are ready.')
          PY

      - name: Verify ScreenScraper developer credentials
        script: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          query = urllib.parse.urlencode({
              'devid': os.environ['SCREENSCRAPER_DEV_ID'],
              'devpassword': os.environ['SCREENSCRAPER_DEV_PASSWORD'],
              'softname': 'neostation-1.0.0-ios',
              'output': 'json',
          })
          request = urllib.request.Request(
              'https://api.screenscraper.fr/api2/ssinfraInfos.php?' + query,
              headers={'User-Agent': 'NeoStation/1.0', 'Accept': 'application/json'},
          )
          try:
              with urllib.request.urlopen(request, timeout=40) as response:
                  status = response.status
                  body = response.read()
          except urllib.error.HTTPError as error:
              status = error.code
              body = error.read()

          print(f'ScreenScraper developer diagnostic HTTP status: {status}')
          if status != 200:
              raise SystemExit('ScreenScraper developer credentials were rejected.')

          payload = json.loads(body.decode('utf-8'))
          header = payload.get('header') if isinstance(payload, dict) else None
          success = header.get('success') if isinstance(header, dict) else None
          if str(success).lower() not in {'true', '1'}:
              raise SystemExit('ScreenScraper diagnostic did not report success.')
          print('ScreenScraper developer credentials accepted.')
          PY

      - name: Download, verify and patch StikJIT 1.5.0
        script: |
          set -euo pipefail
          ARCHIVE=/tmp/StikJIT.xcframework.zip
          EXTRACT=/tmp/neostation-stikjit
          DEST=packages/stikjit_bridge/ios/Frameworks
          rm -rf "$EXTRACT" "$DEST/StikJIT.xcframework" "$ARCHIVE"
          mkdir -p "$EXTRACT" "$DEST"

          curl -fL --retry 3 --retry-delay 2 \
            'https://github.com/StikDebug/StikJIT/releases/download/1.5.0/StikJIT.xcframework.zip' \
            -o "$ARCHIVE"
          echo '444b8d439df8455c34afbb51e279fd225265279195475f9b3fdbcf3a71a27e85  /tmp/StikJIT.xcframework.zip' \
            | shasum -a 256 -c -

          unzip -q "$ARCHIVE" -d "$EXTRACT"
          FRAMEWORK=$(find "$EXTRACT" -type d -name 'StikJIT.xcframework' -print -quit)
          test -n "$FRAMEWORK"
          cp -R "$FRAMEWORK" "$DEST/StikJIT.xcframework"

          # StikJIT 1.5.0 was archived with BUILD_LIBRARY_FOR_DISTRIBUTION=YES
          # while exporting a public enum named StikJIT from a module also named
          # StikJIT. Its own release build warns about Swift issue #56573. The
          # resulting textual module interface contains module-qualified names
          # such as StikJIT.DDIPaths, which newer Swift compilers can resolve as
          # a member of enum StikJIT instead of a type in module StikJIT.
          #
          # Verify the official archive checksum first, then patch only the
          # ephemeral textual interfaces used by this experimental build. The
          # framework executable itself is not modified.
          python3 - <<'PY'
          from pathlib import Path

          root = Path('packages/stikjit_bridge/ios/Frameworks/StikJIT.xcframework')
          interfaces = sorted(root.rglob('*.swiftinterface'))
          if not interfaces:
              raise SystemExit('StikJIT XCFramework contains no textual Swift interfaces.')

          total = 0
          for interface in interfaces:
              text = interface.read_text(encoding='utf-8')
              before = text

              # Top-level DDIPaths was incorrectly module-qualified.
              text = text.replace('StikJIT.DDIPaths', 'DDIPaths')
              # Nested public types may be emitted as StikJIT.StikJIT.Type;
              # drop only the module prefix and keep the enum qualification.
              text = text.replace('StikJIT.StikJIT.', 'StikJIT.')

              changed = int(before != text)
              if changed:
                  interface.write_text(text, encoding='utf-8')
                  total += 1
                  print(f'Patched Swift #56573 interface: {interface}')

          if total == 0:
              raise SystemExit('Expected invalid StikJIT 1.5.0 interface references were not found.')

          remaining = []
          for interface in interfaces:
              text = interface.read_text(encoding='utf-8')
              if 'StikJIT.DDIPaths' in text or 'StikJIT.StikJIT.' in text:
                  remaining.append(str(interface))
          if remaining:
              raise SystemExit('Invalid StikJIT module-qualified references remain: ' + ', '.join(remaining))

          print(f'Applied Swift #56573 workaround to {total} StikJIT interface file(s).')
          PY

          DEVICE_BIN=$(find "$DEST/StikJIT.xcframework" \
            -path '*ios-arm64*' -type f -name 'StikJIT' -print -quit)
          test -n "$DEVICE_BIN"

          SYMBOLS=/tmp/stikjit-symbols.txt
          nm -gU "$DEVICE_BIN" > "$SYMBOLS"
          grep -Fq '_tunnel_create_rppairing' "$SYMBOLS"
          grep -Fq '_remote_server_connect_rsd' "$SYMBOLS"
          grep -Fq '_process_control_new' "$SYMBOLS"
          grep -Fq '_process_control_launch_app' "$SYMBOLS"
          grep -Fq '_idevice_error_free' "$SYMBOLS"
          echo 'StikJIT checksum, Swift interfaces and required process-control exports verified.'

      - name: Resolve Flutter dependencies
        script: flutter pub get

      - name: Verify experimental Dart formatting and run analyzer diagnostics
        script: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed \
            lib/services/ios_shortcut_jit_launch_service.dart \
            lib/services/stikjit_melonx_service.dart \
            packages/stikjit_bridge/lib/stikjit_bridge.dart

          set +e
          flutter analyze --no-fatal-warnings --no-fatal-infos
          ANALYZE_STATUS=$?
          set -e
          if [ "$ANALYZE_STATUS" -ne 0 ]; then
            echo "WARNING: flutter analyze returned $ANALYZE_STATUS; continuing to real iOS compilation."
          fi

      - name: Regenerate real iOS platform from bootstrap
        script: |
          set -euo pipefail
          if [ -f ios/.codemagic_bootstrap ] || [ ! -f ios/Runner/Info.plist ]; then
            rm -rf ios
            flutter create \
              --platforms=ios \
              --org com.neogamelab \
              --project-name neostation \
              .
          fi
          test -f ios/Runner.xcodeproj/project.pbxproj
          test -f ios/Runner/Info.plist
          test -f ios/Podfile

      - name: Patch iOS 18 runtime configuration
        script: |
          set -euo pipefail
          python3 build-utils/patch_ios_video_player_audio_session.py

          DEVICE_INFO_FILE=$(find "$HOME/.pub-cache" \
            -path '*device_info_plus*/FPPDeviceInfoPlusPlugin.m' \
            2>/dev/null | head -1 || true)
          if [ -n "$DEVICE_INFO_FILE" ]; then
            sed -i '' '/isiOSAppOnVision/d' "$DEVICE_INFO_FILE"
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          podfile = Path('ios/Podfile')
          text = podfile.read_text(encoding='utf-8')
          pattern = re.compile(r"(?m)^\s*#?\s*platform\s+:ios\s*,\s*['\"][^'\"]+['\"]\s*$")
          replacement = "platform :ios, '18.0'"
          if pattern.search(text):
              text = pattern.sub(replacement, text, count=1)
          else:
              text = replacement + '\n\n' + text
          podfile.write_text(text, encoding='utf-8')
          PY

          grep -Eq "^platform :ios, ['\"]18\.0['\"]$" ios/Podfile

          python3 - <<'PY'
          from pathlib import Path
          import re

          project = Path('ios/Runner.xcodeproj/project.pbxproj')
          text = project.read_text(encoding='utf-8')
          text, count = re.subn(
              r'IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;',
              'IPHONEOS_DEPLOYMENT_TARGET = 18.0;',
              text,
          )
          if count == 0:
              raise SystemExit('Runner project did not contain an iOS deployment target to patch.')
          project.write_text(text, encoding='utf-8')
          print(f'Patched {count} Runner deployment target entries to iOS 18.0.')
          PY

          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c 'Delete :UISupportedInterfaceOrientations' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations array' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Delete :UISupportedInterfaceOrientations~ipad' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations~ipad array' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationLandscapeLeft' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationLandscapeRight' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :UIFileSharingEnabled bool true' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :LSSupportsOpeningDocumentsInPlace bool true' "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy -c 'Delete :CFBundleURLTypes' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes array' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes:0 dict' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes:0:CFBundleURLName string com.neogamelab.neostation' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes:0:CFBundleURLSchemes array' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string neostation' "$PLIST"

          /usr/libexec/PlistBuddy -c 'Delete :LSApplicationQueriesSchemes' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :LSApplicationQueriesSchemes array' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :LSApplicationQueriesSchemes:0 string retroarch' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :LSApplicationQueriesSchemes:1 string shortcuts' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :LSApplicationQueriesSchemes:2 string armsx2' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :LSApplicationQueriesSchemes:3 string melonx' "$PLIST"
          plutil -lint "$PLIST"

      - name: Generate iOS icon
        script: |
          dart run flutter_launcher_icons
          chmod +x build-utils/force_ios_fork_icon.sh
          build-utils/force_ios_fork_icon.sh

      - name: Install CocoaPods with StikJIT bridge
        script: |
          set -euo pipefail
          grep -Eq "^platform :ios, ['\"]18\.0['\"]$" ios/Podfile
          cd ios
          pod install --repo-update
          grep -q 'stikjit_bridge' Podfile.lock
          test -d .symlinks/plugins/stikjit_bridge/ios/Frameworks/StikJIT.xcframework
          echo 'CocoaPods resolved StikJIT bridge with Runner platform iOS 18.0.'

      - name: Configure experimental Flutter release
        script: |
          set -euo pipefail
          flutter build ios \
            --release \
            --no-codesign \
            --config-only \
            --build-number=165 \
            --dart-define-from-file=.dart-defines.json

      - name: Verify defines reached Xcode
        script: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          import pathlib

          config = pathlib.Path('ios/Flutter/Generated.xcconfig')
          if not config.is_file():
              raise SystemExit('Generated.xcconfig was not generated.')

          values = {}
          for line in config.read_text(encoding='utf-8').splitlines():
              if '=' in line:
                  key, value = line.split('=', 1)
                  values[key] = value

          encoded = values.get('DART_DEFINES', '')
          decoded = {
              base64.b64decode(item).decode('utf-8')
              for item in encoded.split(',') if item
          }
          expected = {
              'SCREENSCRAPER_DEV_ID=' + os.environ['SCREENSCRAPER_DEV_ID'],
              'SCREENSCRAPER_DEV_PASSWORD=' + os.environ['SCREENSCRAPER_DEV_PASSWORD'],
              'NEOSTATION_EXPERIMENTAL_STIKJIT_MELONX=true',
              'NEOSTATION_MELONX_BUNDLE_ID=com.nur.nx',
          }
          if expected - decoded:
              raise SystemExit('Required Dart defines are missing from Xcode configuration.')
          if values.get('FLUTTER_BUILD_NUMBER') != '165':
              raise SystemExit('FLUTTER_BUILD_NUMBER is not 165.')
          print('ScreenScraper and experimental StikJIT defines are embedded exactly.')
          PY

      - name: Build unsigned experimental iOS app
        script: |
          set -euo pipefail
          rm -rf build/ios/DerivedData build/ios/unsigned
          mkdir -p build/ios
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            PROVISIONING_PROFILE_SPECIFIER='' \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build | tee build/ios/xcodebuild-unsigned.log

      - name: Package and verify Build 165 IPA
        script: |
          set -euo pipefail
          APP_PATH=$(find build/ios/DerivedData/Build/Products/Release-iphoneos \
            -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP_PATH"

          mkdir -p build/ios/unsigned/Payload
          cp -R "$APP_PATH" build/ios/unsigned/Payload/NeoStation.app
          PLIST=build/ios/unsigned/Payload/NeoStation.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST" | grep -qx '165'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST" | grep -qx 'com.neogamelab.neostation'

          test -d build/ios/unsigned/Payload/NeoStation.app/Frameworks/StikJIT.framework
          test -f build/ios/unsigned/Payload/NeoStation.app/Frameworks/StikJIT.framework/StikJIT

          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")
          OTOOL=/tmp/neostation-otool.txt
          otool -L "build/ios/unsigned/Payload/NeoStation.app/$EXECUTABLE" > "$OTOOL"
          grep -Fq 'StikJIT.framework/StikJIT' "$OTOOL"

          (
            cd build/ios/unsigned
            zip -qry ../../../NeoStation-iOS-Build-165-StikJIT-Experimental.ipa Payload
          )
          shasum -a 256 NeoStation-iOS-Build-165-StikJIT-Experimental.ipa \
            | tee NeoStation-iOS-Build-165-StikJIT-Experimental.sha256
          echo 'Build 165 contains the StikJIT framework and is linked by NeoStation.'

      - name: Remove temporary build inputs
        script: rm -f .dart-defines.json

    artifacts:
      - NeoStation-iOS-Build-165-StikJIT-Experimental.ipa
      - NeoStation-iOS-Build-165-StikJIT-Experimental.sha256
      - build/ios/xcodebuild-unsigned.log

    publishing:
      scripts:
        - name: Publish experimental Build 165 to GitHub Releases
          script: |
            set -euo pipefail
            if [ -z "${Ghtoken:-}" ]; then
              echo 'Codemagic secret Ghtoken is missing.'
              exit 1
            fi
            export GH_TOKEN="$Ghtoken"
            command -v gh >/dev/null 2>&1 || brew install gh

            TAG='ios-build-165-stikjit-melonx-exp'
            IPA='NeoStation-iOS-Build-165-StikJIT-Experimental.ipa'
            SHA='NeoStation-iOS-Build-165-StikJIT-Experimental.sha256'
            NOTES='EXPERIMENTAL branch-only build. Stable backup is untouched. MeloNX launches use NeoStation built-in StikJIT 1.5.0 with universal.js instead of opening StikDebug. Requires a valid pairing file, LocalDevVPN connectivity, Developer Mode, and a MeloNX installation signed with the entitlements required by MeloNX. The existing Shortcut/StikDebug route remains the default in normal builds.'

            if gh release view "$TAG" --repo TarbleFR/neostation-ios >/dev/null 2>&1; then
              gh release upload "$TAG" "$IPA" "$SHA" \
                --repo TarbleFR/neostation-ios --clobber
            else
              gh release create "$TAG" "$IPA" "$SHA" \
                --repo TarbleFR/neostation-ios \
                --target "$CM_COMMIT" \
                --title 'NeoStation iOS Build 165 - StikJIT MeloNX Experimental' \
                --notes "$NOTES"
            fi
