# Codemagic trigger: Build 164 ScreenScraper pipeline-only
workflows:
  ios-screenscraper-164:
    name: NeoStation iOS Build 164 - ScreenScraper Codemagic Fix
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - neostation_secrets

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: build/screenscraper-164-codemagic
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Verify application source is unchanged from Build 163
        script: |
          set -euo pipefail
          BASE='e41704a617e9e4a8e421159db23337ae668fe5ab'
          git cat-file -e "$BASE^{commit}" 2>/dev/null || git fetch --no-tags origin "$BASE"
          CHANGED=$(git diff --name-only "$BASE"...HEAD | sort)
          if [ "$CHANGED" != 'codemagic.yaml' ]; then
            echo 'Build 164 must be pipeline-only. Unexpected changed files:'
            printf '%s\n' "$CHANGED"
            exit 1
          fi
          grep -q 'version: 1.0.0+163' pubspec.yaml
          grep -q 'final selected = await ExternalFolderAccess.resolveBookmarkedFolder' \
            lib/services/rpcs3_library_service.dart
          echo 'Application source matches Build 163; only codemagic.yaml changed.'

      - name: Validate ScreenScraper Codemagic secrets
        script: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys

          names = (
              'SCREENSCRAPER_DEV_ID',
              'SCREENSCRAPER_DEV_PASSWORD',
          )
          values = {name: os.environ.get(name, '') for name in names}

          missing = [name for name, value in values.items() if not value]
          if missing:
              print('Missing required Codemagic ScreenScraper variables: ' + ', '.join(missing))
              sys.exit(1)

          malformed = [
              name
              for name, value in values.items()
              if value != value.strip() or '\n' in value or '\r' in value
          ]
          if malformed:
              print('Malformed ScreenScraper variables: ' + ', '.join(malformed))
              sys.exit(1)

          # JSON avoids .env parsing edge cases if a developer password contains
          # characters that have special meaning in dotenv-style files.
          defines_file = pathlib.Path('.dart-defines.json')
          defines_file.write_text(
              json.dumps(values, ensure_ascii=False),
              encoding='utf-8',
          )
          defines_file.chmod(0o600)
          print('ScreenScraper Codemagic variables are present and a secure Dart-defines JSON file was generated.')
          PY

      - name: ScreenScraper API diagnostic (non-blocking)
        script: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          query = urllib.parse.urlencode(
              {
                  'devid': os.environ['SCREENSCRAPER_DEV_ID'],
                  'devpassword': os.environ['SCREENSCRAPER_DEV_PASSWORD'],
                  # Runtime NeoStation supplies its own versioned softname on-device.
                  # This CI call is diagnostics only and must never gate IPA creation.
                  'softname': 'neostation-1.0.0-ios',
                  'output': 'json',
              }
          )
          request = urllib.request.Request(
              'https://api.screenscraper.fr/api2/ssinfraInfos.php?' + query,
              headers={
                  'User-Agent': 'NeoStation/1.0',
                  'Accept': 'application/json',
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=40) as response:
                  status = response.status
                  body = response.read()
          except urllib.error.HTTPError as error:
              status = error.code
              body = error.read()
          except Exception as error:
              print(
                  'WARNING: ScreenScraper CI diagnostic network failure: '
                  + type(error).__name__
                  + '. Continuing because runtime access is tested on the iOS device.'
              )
              raise SystemExit(0)

          print(f'ScreenScraper CI diagnostic HTTP status: {status}')
          if status != 200:
              print(
                  'WARNING: ScreenScraper returned a non-200 response to the Codemagic runner. '
                  'Continuing: this runner-side diagnostic is not used to decide whether the '
                  'developer values are embedded in the IPA.'
              )
              raise SystemExit(0)

          try:
              payload = json.loads(body.decode('utf-8'))
          except Exception:
              print('WARNING: ScreenScraper CI diagnostic returned non-JSON data. Continuing build.')
              raise SystemExit(0)

          header = payload.get('header') if isinstance(payload, dict) else None
          success = header.get('success') if isinstance(header, dict) else None
          if str(success).lower() not in {'true', '1'}:
              print('WARNING: ScreenScraper CI diagnostic did not report success. Continuing build.')
              raise SystemExit(0)

          print('ScreenScraper developer credentials were accepted by the CI diagnostic endpoint.')
          PY

      - name: Resolve Flutter dependencies
        script: flutter pub get

      - name: Regenerate real iOS platform from bootstrap
        script: |
          set -euo pipefail
          if [ -f ios/.codemagic_bootstrap ] || [ ! -f ios/Runner/Info.plist ]; then
            rm -rf ios
            flutter create \
              --platforms=ios \
              --org com.neogamelab \
              --project-name neostation \
              .
          fi
          test -f ios/Runner.xcodeproj/project.pbxproj
          test -f ios/Runner/Info.plist

      - name: Patch iOS runtime configuration
        script: |
          set -euo pipefail
          python3 build-utils/patch_ios_video_player_audio_session.py

          DEVICE_INFO_FILE=$(find "$HOME/.pub-cache" \
            -path "*device_info_plus*/FPPDeviceInfoPlusPlugin.m" \
            2>/dev/null | head -1 || true)
          if [ -n "$DEVICE_INFO_FILE" ]; then
            sed -i '' '/isiOSAppOnVision/d' "$DEVICE_INFO_FILE"
          fi

          if [ -f ios/Podfile ]; then
            sed -i '' "s/platform :ios, '13.0'/platform :ios, '18.0'/" ios/Podfile || true
          fi
          sed -i '' \
            's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 18.0;/g' \
            ios/Runner.xcodeproj/project.pbxproj || true

          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.neogamelab.neostation" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string neostation" "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :LSApplicationQueriesSchemes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:0 string retroarch" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:1 string shortcuts" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:2 string armsx2" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:3 string melonx" "$PLIST"
          plutil -lint "$PLIST"

      - name: Generate iOS icon
        script: |
          dart run flutter_launcher_icons
          chmod +x build-utils/force_ios_fork_icon.sh
          build-utils/force_ios_fork_icon.sh

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update

      - name: Configure Flutter release with verified ScreenScraper defines
        script: |
          set -euo pipefail
          flutter build ios \
            --release \
            --no-codesign \
            --config-only \
            --build-number=164 \
            --dart-define-from-file=.dart-defines.json

      - name: Verify ScreenScraper defines reached Xcode
        script: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          import pathlib
          import sys

          config = pathlib.Path('ios/Flutter/Generated.xcconfig')
          if not config.is_file():
              print('Generated.xcconfig was not generated.')
              sys.exit(1)

          values = {}
          for line in config.read_text(encoding='utf-8').splitlines():
              if '=' in line:
                  key, value = line.split('=', 1)
                  values[key] = value

          encoded = values.get('DART_DEFINES', '')
          if not encoded:
              print('DART_DEFINES is missing from Generated.xcconfig.')
              sys.exit(1)

          decoded = set()
          for item in encoded.split(','):
              if not item:
                  continue
              try:
                  decoded.add(base64.b64decode(item).decode('utf-8'))
              except Exception:
                  print('Generated DART_DEFINES contains an invalid Base64 entry.')
                  sys.exit(1)

          expected = {
              'SCREENSCRAPER_DEV_ID=' + os.environ['SCREENSCRAPER_DEV_ID'],
              'SCREENSCRAPER_DEV_PASSWORD=' + os.environ['SCREENSCRAPER_DEV_PASSWORD'],
          }
          if not expected.issubset(decoded):
              print('Exact ScreenScraper developer defines are missing from Xcode configuration.')
              sys.exit(1)

          if values.get('FLUTTER_BUILD_NUMBER') != '164':
              print('FLUTTER_BUILD_NUMBER is not 164 in Generated.xcconfig.')
              sys.exit(1)

          print('Both exact ScreenScraper developer defines are embedded in Xcode configuration.')
          print('Flutter build number 164 is configured.')
          PY

      - name: Build unsigned iOS app
        script: |
          set -euo pipefail
          rm -rf build/ios/DerivedData build/ios/unsigned
          mkdir -p build/ios
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build | tee build/ios/xcodebuild-unsigned.log

      - name: Package Build 164 IPA
        script: |
          set -euo pipefail
          APP_PATH=$(find build/ios/DerivedData/Build/Products/Release-iphoneos \
            -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP_PATH"
          mkdir -p build/ios/unsigned/Payload
          cp -R "$APP_PATH" build/ios/unsigned/Payload/NeoStation.app
          (
            cd build/ios/unsigned
            zip -qry ../../../NeoStation-iOS-Build-164.ipa Payload
          )
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' \
            build/ios/unsigned/Payload/NeoStation.app/Info.plist | grep -qx '164'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
            build/ios/unsigned/Payload/NeoStation.app/Info.plist | grep -qx 'com.neogamelab.neostation'
          shasum -a 256 NeoStation-iOS-Build-164.ipa | tee NeoStation-iOS-Build-164.sha256

      - name: Remove temporary ScreenScraper defines file
        script: rm -f .dart-defines.json

    artifacts:
      - NeoStation-iOS-Build-164.ipa
      - NeoStation-iOS-Build-164.sha256
      - build/ios/xcodebuild-unsigned.log

    publishing:
      scripts:
        - name: Publish Build 164 to GitHub Releases
          script: |
            set -euo pipefail
            if [ -z "${Ghtoken:-}" ]; then
              echo 'Codemagic secret Ghtoken is missing.'
              exit 1
            fi
            export GH_TOKEN="$Ghtoken"
            command -v gh >/dev/null 2>&1 || brew install gh
            TAG='ios-build-164-screenscraper-codemagic'
            if gh release view "$TAG" --repo TarbleFR/neostation-ios >/dev/null 2>&1; then
              gh release upload "$TAG" \
                NeoStation-iOS-Build-164.ipa \
                NeoStation-iOS-Build-164.sha256 \
                --repo TarbleFR/neostation-ios \
                --clobber
            else
              gh release create "$TAG" \
                NeoStation-iOS-Build-164.ipa \
                NeoStation-iOS-Build-164.sha256 \
                --repo TarbleFR/neostation-ios \
                --target "$CM_COMMIT" \
                --title 'NeoStation iOS Build 164 - ScreenScraper Codemagic Fix' \
                --notes 'Codemagic pipeline-only correction. Application source is unchanged from Build 163. ScreenScraper developer variables are required, serialized through a JSON Dart-defines file, and verified exactly in Generated.xcconfig before Xcode compilation. The runner-side API diagnostic is intentionally non-blocking because runtime ScreenScraper access occurs on the iOS device.'
            fi
