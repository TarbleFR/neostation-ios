name: NeoStation Build 299 RPCS3 preflight

run-name: Build 299 RPCS3 preflight • ${{ github.sha }}

on:
  push:
    branches:
      - experimental
    paths:
      - '.github/workflows/ios-build299-preflight.yml'
      - 'packages/rpcs3_jit_helper/ios/Resources/rpcs3-universal.js'
      - 'test/rpcs3_debugger_handshake_test.js'
      - 'test/rpcs3_stop_reply_behavior_test.js'
      - 'test/rpcs3_loader_stability_280_test.py'
      - 'test/rpcs3_build285_core_handoff_test.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: neostation-build-299-rpcs3-preflight
  cancel-in-progress: true

jobs:
  preflight:
    name: Validate Core and debugger protocol
    runs-on: macos-15
    timeout-minutes: 20
    env:
      RPCS3_CORE_HOST_SHA: 453eeda703d42ee4b9854083f3a8d04071453fe7
      RPCS3_CORE_RUN_ID: '35535109526'
      RPCS3_CORE_SHA256: e3e6d48984616492322cd5ef88959b71be6d0915fae22223b271b42fe7ba5aa8
      RPCS3_SOURCE_COMMIT: 22f1152783cef1f7e04af7b1c895173e28fd5b03

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source and workflow syntax
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 -m py_compile \
            build-utils/patch_rpcs3_build295_fixed_reservation.py \
            build-utils/validate_rpcs3_embedded_core.py \
            test/rpcs3_build295_fixed_reservation_test.py \
            test/rpcs3_loader_stability_280_test.py \
            test/rpcs3_build285_core_handoff_test.py
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/ios-build299-preflight.yml", aliases: true)'

      - name: Validate debugger protocol regressions
        shell: bash
        run: |
          set -euo pipefail
          node test/rpcs3_debugger_handshake_test.js
          node test/rpcs3_stop_reply_behavior_test.js
          python3 test/rpcs3_loader_stability_280_test.py
          python3 test/rpcs3_build285_core_handoff_test.py

      - name: Refuse Core source drift
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$RPCS3_CORE_HOST_SHA" "$GITHUB_SHA" -- \
            build-utils/build_rpcs3_embedded_core.sh \
            build-utils/patch_rpcs3_build266_v09_core.py \
            build-utils/patch_rpcs3_build295_fixed_reservation.py \
            build-utils/validate_rpcs3_embedded_core.py \
            build-utils/rpcs3 \
            test/rpcs3_build295_fixed_reservation_test.py \
            .github/workflows/rpcs3-core.yml

      - name: Download validated RPCS3 Core
        uses: actions/download-artifact@v4
        with:
          name: RPCS3Core-${{ env.RPCS3_CORE_HOST_SHA }}
          run-id: ${{ env.RPCS3_CORE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/rpcs3-native

      - name: Validate exact Core identity
        shell: bash
        run: |
          set -euo pipefail
          CORE="dist/rpcs3-native/libRPCS3Core.dylib"
          IDENTITY="dist/rpcs3-native/identity.json"
          test -s "$CORE"
          test -s "$IDENTITY"
          python3 build-utils/validate_rpcs3_embedded_core.py "$CORE"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          core = Path('dist/rpcs3-native/libRPCS3Core.dylib')
          identity = json.loads(Path('dist/rpcs3-native/identity.json').read_text())
          actual = hashlib.sha256(core.read_bytes()).hexdigest()
          assert identity['host_commit'] == os.environ['RPCS3_CORE_HOST_SHA'], identity
          assert identity['source_commit'] == os.environ['RPCS3_SOURCE_COMMIT'], identity
          assert identity['abi_version'] == 30, identity
          assert identity['architectures'] == ['arm64'], identity
          assert identity['sha256'] == os.environ['RPCS3_CORE_SHA256'], identity
          assert actual == identity['sha256'], (actual, identity)
          assert identity['reservation'] == 'vm_allocate fixed, no VM_FLAGS_OVERWRITE', identity
          assert identity['reservation_marker'] == 'NEOSTATION_BUILD295_FIXED_JIT_RESERVATION_V1', identity
          print(json.dumps(identity, indent=2))
          PY
          grep -a -q 'NEOSTATION_BUILD295_FIXED_JIT_RESERVATION_V1' "$CORE"
          file "$CORE"
          nm -gU "$CORE" > /tmp/rpcs3-build299-exports.txt
          grep -q '_rpcs3_ios_initialize$' /tmp/rpcs3-build299-exports.txt
          grep -q '_rpcs3_ios_boot_game$' /tmp/rpcs3-build299-exports.txt
          grep -q '_neostation_rpcs3_ios_save_state$' /tmp/rpcs3-build299-exports.txt
