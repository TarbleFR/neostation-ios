name: KartPad official IPA donor audit
run-name: KartPad donor audit • ${{ github.sha }}

on:
  push:
    branches: [experimental]
    paths:
      - '.github/workflows/kartpad-donor-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Download exact official KartPad iOS release
        run: |
          set -euo pipefail
          URL='https://github.com/chrissotraidis/kartpad/releases/download/v0.5.1-experimental.1/KartPad-v0.5.1-experimental.1-ios-unsigned.ipa'
          curl -fL --retry 3 --retry-delay 2 "$URL" -o "$RUNNER_TEMP/kartpad.ipa"
          echo '1474809c8e14447c159c30902aaf66b022db89d28a3181d69acfac3467508f58  '"$RUNNER_TEMP/kartpad.ipa" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/kartpad"
          unzip -q "$RUNNER_TEMP/kartpad.ipa" -d "$RUNNER_TEMP/kartpad"
          APP="$(find "$RUNNER_TEMP/kartpad/Payload" -maxdepth 1 -type d -name '*.app' | head -n1)"
          test -n "$APP"
          BIN="$APP/KartPad"
          test -f "$BIN"
          echo "KARTPAD_APP=$APP" >> "$GITHUB_ENV"
          echo "KARTPAD_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Audit Mach-O topology and translated-code visibility
        run: |
          set -euo pipefail
          mkdir -p build/kartpad-donor-audit
          {
            echo '=== file ==='
            file "$KARTPAD_BIN"
            echo
            echo '=== Mach-O header ==='
            otool -hv "$KARTPAD_BIN"
            echo
            echo '=== build version ==='
            xcrun vtool -show-build "$KARTPAD_BIN"
            echo
            echo '=== load commands summary ==='
            otool -l "$KARTPAD_BIN" | egrep 'cmd |cmdsize|name |path |entryoff|stacksize' || true
            echo
            echo '=== dependencies ==='
            otool -L "$KARTPAD_BIN"
            echo
            echo '=== sections ==='
            size -m "$KARTPAD_BIN"
            echo
            echo '=== globally visible symbols of interest ==='
            nm -g "$KARTPAD_BIN" 2>&1 | egrep 'NeoKartPad|RuntimeMain|KartPadMobile|aurora_|func_[0-9A-Fa-f]{8}|UIApplicationMain| main$' | head -n 500 || true
            echo
            echo '=== all symbols of interest ==='
            nm "$KARTPAD_BIN" 2>&1 | egrep 'RuntimeMain|NeoKartPad|KartPadMobile|func_[0-9A-Fa-f]{8}|UIApplicationMain| main$' | head -n 1000 || true
            echo
            echo '=== generated function symbol count ==='
            nm "$KARTPAD_BIN" 2>/dev/null | grep -Ec 'func_[0-9A-Fa-f]{8}' || true
          } | tee build/kartpad-donor-audit/report.txt

      - name: Test whether the release executable is linkable as a Core donor
        run: |
          set -uo pipefail
          mkdir -p build/kartpad-donor-audit
          {
            echo '=== ld relocatable donor test ==='
            set +e
            xcrun --sdk iphoneos ld -r "$KARTPAD_BIN" -o "$RUNNER_TEMP/kartpad-reloc.o"
            echo "ld_r_status=$?"
            test -e "$RUNNER_TEMP/kartpad-reloc.o" && file "$RUNNER_TEMP/kartpad-reloc.o"
            echo
            echo '=== install_name_tool identity test on copy ==='
            cp "$KARTPAD_BIN" "$RUNNER_TEMP/kartpad-dylib-test"
            python3 - "$RUNNER_TEMP/kartpad-dylib-test" <<'PY'
          import struct,sys
          p=sys.argv[1]
          data=bytearray(open(p,'rb').read())
          magic=struct.unpack_from('<I',data,0)[0]
          assert magic == 0xfeedfacf, hex(magic)
          filetype=struct.unpack_from('<I',data,12)[0]
          print('original_filetype', filetype)
          assert filetype == 2, filetype
          struct.pack_into('<I',data,12,6)
          open(p,'wb').write(data)
          print('patched_filetype', struct.unpack_from('<I',data,12)[0])
          PY
            otool -hv "$RUNNER_TEMP/kartpad-dylib-test"
            xcrun install_name_tool -id '@rpath/KartPadCore.framework/KartPadCore' "$RUNNER_TEMP/kartpad-dylib-test"
            echo "install_name_status=$?"
            otool -D "$RUNNER_TEMP/kartpad-dylib-test" || true
            codesign --remove-signature "$RUNNER_TEMP/kartpad-dylib-test" 2>/dev/null || true
            codesign -s - --force "$RUNNER_TEMP/kartpad-dylib-test"
            echo "adhoc_sign_status=$?"
          } 2>&1 | tee build/kartpad-donor-audit/relink.txt
          exit 0

      - name: Record app contents relevant to runtime reuse
        run: |
          set -euo pipefail
          {
            echo '=== app root ==='
            find "$KARTPAD_APP" -maxdepth 2 -type f -print | sed "s|$KARTPAD_APP/||" | sort
            echo
            echo '=== large files ==='
            find "$KARTPAD_APP" -type f -size +1M -print0 | xargs -0 ls -lh
          } > build/kartpad-donor-audit/contents.txt

      - uses: actions/upload-artifact@v4
        with:
          name: KartPad-official-IPA-donor-audit
          path: build/kartpad-donor-audit/
          if-no-files-found: error
          retention-days: 14
