name: Refresh 0.0.1 notices only

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/refresh-release-0.0.1-notices.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh companion notices without touching IPA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: '0.0.1'
      RELEASE_COMMIT: '5e6dc00b35b7bb7847c24198d9f4b08ade8ed9a0'
      IPA_SHA256: 'e1017b96842ec970be3ed0cd981083ee945d069cf76e689a4ca3c81339299b46'
      IPA_SIZE: '143538718'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable IPA before changes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/before.json"
          IPA_ID="$(jq -r '.assets[] | select(.name=="NeoStation.ipa") | .id' "$RUNNER_TEMP/before.json")"
          IPA_UPDATED="$(jq -r '.assets[] | select(.name=="NeoStation.ipa") | .updated_at' "$RUNNER_TEMP/before.json")"
          IPA_SIZE_ACTUAL="$(jq -r '.assets[] | select(.name=="NeoStation.ipa") | .size' "$RUNNER_TEMP/before.json")"
          test "$IPA_SIZE_ACTUAL" = "$IPA_SIZE"
          jq -e --arg commit "$RELEASE_COMMIT" '.target_commitish == $commit' "$RUNNER_TEMP/before.json" >/dev/null
          {
            echo "ORIGINAL_IPA_ID=$IPA_ID"
            echo "ORIGINAL_IPA_UPDATED=$IPA_UPDATED"
          } >> "$GITHUB_ENV"

          mkdir -p "$RUNNER_TEMP/ipa"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"             --pattern 'NeoStation.ipa' --dir "$RUNNER_TEMP/ipa"
          echo "$IPA_SHA256  $RUNNER_TEMP/ipa/NeoStation.ipa" | sha256sum -c -

      - name: Rebuild only companion legal assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT/legal" "$OUT/existing"

          cp LICENSE.md "$OUT/legal/NeoStation-GPL-3.0.txt"
          cp NOTICE.md "$OUT/legal/NeoStation-NOTICE.md"
          cp docs/LEGAL_AND_CREDITS.md "$OUT/legal/LEGAL_AND_CREDITS.md"
          cp docs/RELEASE_0.0.1_SOURCE_MANIFEST.md             "$OUT/legal/RELEASE_0.0.1_SOURCE_MANIFEST.md"
          cp -R assets/legal/. "$OUT/legal/"

          (
            cd "$OUT"
            zip -qr NeoStation-0.0.1-Licenses-and-Notices.zip legal
          )
          cp docs/RELEASE_0.0.1_SOURCE_MANIFEST.md             "$OUT/NeoStation-0.0.1-Source-Manifest.md"

          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"             --pattern 'NeoStation-0.0.1-NeoStation-Source.tar.gz'             --dir "$OUT/existing"

          {
            echo "$IPA_SHA256  NeoStation.ipa"
            cd "$OUT"
            sha256sum               NeoStation-0.0.1-Licenses-and-Notices.zip               NeoStation-0.0.1-Source-Manifest.md
            sha256sum existing/NeoStation-0.0.1-NeoStation-Source.tar.gz               | sed 's#existing/##'
          } > "$OUT/NeoStation-0.0.1-SHA256SUMS.txt"

      - name: Add System Art creators to release credits
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG"             --jq '.body' > "$RUNNER_TEMP/release.md"

          python3 - <<'PY'
          from pathlib import Path
          p = Path("$RUNNER_TEMP/release.md")
          text = p.read_text()

          if "**NeoStation Assets**" not in text:
              marker = "| **RetroArch / libretro** |"
              rows = (
                  "| **NeoStation Assets** | Optional runtime-downloaded System Art from "
                  "**misobadev/neostation-assets**. Original creative assets are "
                  "CC BY-NC-SA 4.0; console trademarks remain with their owners. |\n"
                  "| **RiiSU / iiSU** | RiiSU by **mult1v4c**; system art icons credited "
                  "to **iiSU Interpreted for ES-DE** and inspiration to **iiSU Network**. "
                  "RiiSU stays remotely hosted and is downloaded only when selected. |\n"
              )
              if marker not in text:
                  raise SystemExit("Release credits table marker not found")
              text = text.replace(marker, rows + marker, 1)

          if "System Art license note" not in text:
              anchor = "Full maintained legal record:"
              note = (
                  "> **System Art license note:** optional NeoStation Assets content is "
                  "fetched at runtime and its original creative assets are CC BY-NC-SA "
                  "4.0. RiiSU remains hosted by its upstream project; no standalone "
                  "RiiSU license file was visible when integrated, so NeoStation records "
                  "attribution without claiming additional redistribution rights.\n\n"
              )
              if anchor not in text:
                  raise SystemExit("Release legal-record marker not found")
              text = text.replace(anchor, note + anchor, 1)

          p.write_text(text)
          PY

      - name: Upload only companion files and release text
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/out"
          gh release upload "$RELEASE_TAG"             "$OUT/NeoStation-0.0.1-Licenses-and-Notices.zip"             "$OUT/NeoStation-0.0.1-Source-Manifest.md"             "$OUT/NeoStation-0.0.1-SHA256SUMS.txt"             --repo "$GITHUB_REPOSITORY" --clobber

          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"             --notes-file "$RUNNER_TEMP/release.md"

      - name: Prove IPA is byte-identical and metadata-identical
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/after.json"
          IPA_ID="$(jq -r '.assets[] | select(.name=="NeoStation.ipa") | .id' "$RUNNER_TEMP/after.json")"
          IPA_UPDATED="$(jq -r '.assets[] | select(.name=="NeoStation.ipa") | .updated_at' "$RUNNER_TEMP/after.json")"
          IPA_SIZE_ACTUAL="$(jq -r '.assets[] | select(.name=="NeoStation.ipa") | .size' "$RUNNER_TEMP/after.json")"

          test "$IPA_ID" = "$ORIGINAL_IPA_ID"
          test "$IPA_UPDATED" = "$ORIGINAL_IPA_UPDATED"
          test "$IPA_SIZE_ACTUAL" = "$IPA_SIZE"
          jq -e --arg commit "$RELEASE_COMMIT" '.target_commitish == $commit' "$RUNNER_TEMP/after.json" >/dev/null

          rm -rf "$RUNNER_TEMP/ipa-after"
          mkdir -p "$RUNNER_TEMP/ipa-after"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"             --pattern 'NeoStation.ipa' --dir "$RUNNER_TEMP/ipa-after"
          echo "$IPA_SHA256  $RUNNER_TEMP/ipa-after/NeoStation.ipa" | sha256sum -c -

          echo "UNCHANGED_IPA_ID=$IPA_ID"
          echo "UNCHANGED_IPA_UPDATED=$IPA_UPDATED"
          echo "UNCHANGED_IPA_SHA256=$IPA_SHA256"
