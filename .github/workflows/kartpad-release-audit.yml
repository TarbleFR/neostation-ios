name: KartPad official release embedding audit
run-name: KartPad release audit • ${{ github.sha }}

on:
  push:
    branches: [experimental]
    paths:
      - '.github/workflows/kartpad-release-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kartpad-release-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Download official KartPad Apple release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/kartpad-release-audit
          cd build/kartpad-release-audit
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/chrissotraidis/kartpad/releases/download/v0.5.1-experimental.1/KartPad-v0.5.1-experimental.1-ios-unsigned.ipa \
            -o KartPad.ipa
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/chrissotraidis/kartpad/releases/download/v0.5.1-experimental.1/KartPad-v0.5.1-experimental.1-source.tar.gz \
            -o KartPad-source.tar.gz
          echo "1474809c8e14447c159c30902aaf66b022db89d28a3181d69acfac3467508f58  KartPad.ipa" | shasum -a 256 -c -
          echo "3a7f14e76d289efb398c1f42b3817e9eacd828cceef4d40d185663743c916360  KartPad-source.tar.gz" | shasum -a 256 -c -

      - name: Inspect official IPA Mach-O and bundle
        shell: bash
        run: |
          set -euo pipefail
          ROOT=build/kartpad-release-audit
          rm -rf "$ROOT/ipa"
          mkdir -p "$ROOT/ipa"
          ditto -x -k "$ROOT/KartPad.ipa" "$ROOT/ipa"
          APP="$(find "$ROOT/ipa/Payload" -maxdepth 1 -type d -name '*.app' | head -n1)"
          test -n "$APP"
          EXE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          BIN="$APP/$EXE_NAME"
          test -f "$BIN"
          {
            echo "APP=$APP"
            echo "EXECUTABLE=$EXE_NAME"
            file "$BIN"
            echo
            echo "=== MACH HEADER ==="
            otool -hv "$BIN"
            echo
            echo "=== BUILD ==="
            xcrun vtool -show-build "$BIN"
            echo
            echo "=== DEPENDENCIES ==="
            otool -L "$BIN"
            echo
            echo "=== BUNDLE CONTENTS ==="
            find "$APP" -maxdepth 3 -type f | sed "s#^$APP/##" | sort
            echo
            echo "=== DYNAMIC FRAMEWORKS ==="
            find "$APP" -type d -name '*.framework' -print || true
            echo
            echo "=== RELEVANT GLOBAL SYMBOLS ==="
            nm -gU "$BIN" 2>/dev/null | grep -E 'NeoKartPad|RuntimeMain|KartPadMobile|aurora_|WiiCompiled|RMCP01|SDL_GetWindows|SDL_HideWindow|SDL_ShowWindow|SDL_PauseAudioDevice|SDL_ResumeAudioDevice' || true
            echo
            echo "=== RELEVANT ALL SYMBOLS ==="
            nm "$BIN" 2>/dev/null | grep -E 'NeoKartPad|RuntimeMain|KartPadMobile|aurora_|WiiCompiled|RMCP01|SDL_GetWindows|SDL_HideWindow|SDL_ShowWindow|SDL_PauseAudioDevice|SDL_ResumeAudioDevice' | head -n 300 || true
          } | tee "$ROOT/ipa-audit.txt"

          if find "$APP" -type f \( -name '*.dylib' -o -path '*.framework/*' \) | grep -q .; then
            echo "HAS_DYNAMIC_COMPONENTS=1" >> "$GITHUB_ENV"
          else
            echo "HAS_DYNAMIC_COMPONENTS=0" >> "$GITHUB_ENV"
          fi
          if nm "$BIN" 2>/dev/null | grep -q 'NeoKartPadRuntimeRunGuest'; then
            echo "HAS_EMBED_ENTRY=1" >> "$GITHUB_ENV"
          else
            echo "HAS_EMBED_ENTRY=0" >> "$GITHUB_ENV"
          fi
          if nm "$BIN" 2>/dev/null | grep -q 'RuntimeMain'; then
            echo "HAS_RUNTIME_MAIN=1" >> "$GITHUB_ENV"
          else
            echo "HAS_RUNTIME_MAIN=0" >> "$GITHUB_ENV"
          fi

      - name: Inspect published source archive for translated graph
        shell: bash
        run: |
          set -euo pipefail
          ROOT=build/kartpad-release-audit
          tar -tzf "$ROOT/KartPad-source.tar.gz" > "$ROOT/source-files.txt"
          {
            echo "=== translation-like paths ==="
            grep -E '(^|/)(private|generated|build_shards|functions|func_[0-9A-Fa-f]+\.cpp)' "$ROOT/source-files.txt" | head -n 500 || true
            echo
            echo "=== candidate shard manifests ==="
            grep -E 'build_shards/shards\.cmake$' "$ROOT/source-files.txt" || true
          } | tee "$ROOT/source-audit.txt"

          MANIFEST_COUNT="$(grep -cE 'build_shards/shards\.cmake$' "$ROOT/source-files.txt" || true)"
          FUNC_COUNT="$(grep -cE '/func_[0-9A-Fa-f]+\.cpp$' "$ROOT/source-files.txt" || true)"
          echo "SOURCE_MANIFEST_COUNT=$MANIFEST_COUNT" >> "$GITHUB_ENV"
          echo "SOURCE_FUNC_COUNT=$FUNC_COUNT" >> "$GITHUB_ENV"

      - name: Produce embedding verdict
        shell: bash
        run: |
          set -euo pipefail
          ROOT=build/kartpad-release-audit
          {
            echo "officialIpaSha256=1474809c8e14447c159c30902aaf66b022db89d28a3181d69acfac3467508f58"
            echo "hasDynamicComponents=$HAS_DYNAMIC_COMPONENTS"
            echo "hasNeoStationEmbedEntry=$HAS_EMBED_ENTRY"
            echo "hasRuntimeMainSymbol=$HAS_RUNTIME_MAIN"
            echo "sourceShardManifestCount=$SOURCE_MANIFEST_COUNT"
            echo "sourceTranslatedFunctionCount=$SOURCE_FUNC_COUNT"
            if [ "$SOURCE_MANIFEST_COUNT" -gt 0 ] && [ "$SOURCE_FUNC_COUNT" -ge 29637 ]; then
              echo "verdict=SOURCE_GRAPH_AVAILABLE"
            elif [ "$HAS_DYNAMIC_COMPONENTS" = "1" ]; then
              echo "verdict=INSPECT_DYNAMIC_COMPONENTS"
            else
              echo "verdict=STANDALONE_EXECUTABLE_ONLY"
            fi
          } | tee "$ROOT/verdict.txt"

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: KartPad-release-audit-${{ github.sha }}
          path: build/kartpad-release-audit/*.txt
          if-no-files-found: error
          retention-days: 14
