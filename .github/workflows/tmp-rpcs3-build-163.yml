name: Build NeoStation iOS RPCS3 Fix 163

on:
  push:
    branches:
      - rollback/testflight-clean-20260823

permissions:
  contents: write

concurrency:
  group: neostation-ios-rpcs3-fix-163
  cancel-in-progress: false

jobs:
  build-ios-ipa:
    if: ${{ !contains(github.event.head_commit.message, '[rpcs3-fixed]') }}
    runs-on: macos-15
    timeout-minutes: 120
    env:
      SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
      SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}

    steps:
      - name: Checkout rollback branch
        uses: actions/checkout@v4
        with:
          ref: rollback/testflight-clean-20260823
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply RPCS3-only immediate folder activation fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          service_path = Path('lib/services/rpcs3_library_service.dart')
          source = service_path.read_text(encoding='utf-8')
          old = """    final selected = await ExternalFolderAccess.pickAndBookmarkFolder(\n      key: bookmarkKey,\n    );\n    if (selected == null) return null;\n\n    final normalized = await _normalizeDataRoot(selected);\n"""
          new = """    final picked = await ExternalFolderAccess.pickAndBookmarkFolder(\n      key: bookmarkKey,\n    );\n    if (picked == null) return null;\n\n    // The document picker grant is temporary. Re-resolve the freshly stored\n    // RPCS3 bookmark immediately so this session owns an active\n    // security-scoped URL before discovery starts. Without this, iOS can make\n    // the first scan look empty until NeoStation is restarted.\n    final selected = await ExternalFolderAccess.resolveBookmarkedFolder(\n      key: bookmarkKey,\n    );\n    if (selected == null) {\n      throw StateError('RPCS3 Data folder could not be activated.');\n    }\n\n    final normalized = await _normalizeDataRoot(selected);\n"""
          if old not in source:
              raise SystemExit('Expected RPCS3 linkAndSync block was not found; refusing broad patch.')
          source = source.replace(old, new, 1)
          service_path.write_text(source, encoding='utf-8')

          pubspec_path = Path('pubspec.yaml')
          pubspec = pubspec_path.read_text(encoding='utf-8')
          if 'version: 1.0.0+162' not in pubspec:
              raise SystemExit('Expected Build 162 version was not found.')
          pubspec_path.write_text(
              pubspec.replace('version: 1.0.0+162', 'version: 1.0.0+163', 1),
              encoding='utf-8',
          )
          PY

          dart format lib/services/rpcs3_library_service.dart

          changed="$(git diff --name-only | sort)"
          expected=$'lib/services/rpcs3_library_service.dart\npubspec.yaml'
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected changed files:"
            printf '%s\n' "$changed"
            exit 1
          fi

          grep -q "final picked = await ExternalFolderAccess.pickAndBookmarkFolder" lib/services/rpcs3_library_service.dart
          grep -q "final selected = await ExternalFolderAccess.resolveBookmarkedFolder" lib/services/rpcs3_library_service.dart
          grep -q "version: 1.0.0+163" pubspec.yaml

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Validate RPCS3-only fix
        shell: bash
        run: |
          set -euo pipefail
          flutter test test/rpcs3_library_service_test.dart
          flutter test test/rpcs3_stage3_test.dart
          flutter test test/rpcs3_stage6_test.dart
          flutter test test/rpcs3_stage7_test.dart
          flutter test test/ios_selective_rollback_test.dart
          flutter analyze --no-fatal-warnings --no-fatal-infos

          changed="$(git diff --name-only | sort)"
          expected=$'lib/services/rpcs3_library_service.dart\npubspec.yaml'
          if [ "$changed" != "$expected" ]; then
            echo "Validation altered unexpected files:"
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Commit validated RPCS3 fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NeoStation RPCS3 Builder"
          git config user.email "actions@users.noreply.github.com"
          git add lib/services/rpcs3_library_service.dart pubspec.yaml
          git commit -m "Fix immediate RPCS3 library sync [rpcs3-fixed]"
          git push origin HEAD:rollback/testflight-clean-20260823

      - name: Prepare ScreenScraper build environment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          values = {
              'SCREENSCRAPER_DEV_ID': os.environ.get('SCREENSCRAPER_DEV_ID', ''),
              'SCREENSCRAPER_DEV_PASSWORD': os.environ.get('SCREENSCRAPER_DEV_PASSWORD', ''),
          }
          pathlib.Path('.env').write_text(
              '\n'.join(f'{k}={v}' for k, v in values.items()) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Regenerate real iOS platform from bootstrap
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ios/.codemagic_bootstrap ] || [ ! -f ios/Runner/Info.plist ]; then
            rm -rf ios
            flutter create \
              --platforms=ios \
              --org com.neogamelab \
              --project-name neostation \
              .
          fi
          test -f ios/Runner.xcodeproj/project.pbxproj
          test -f ios/Runner/Info.plist

      - name: Patch iOS runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 build-utils/patch_ios_video_player_audio_session.py

          DEVICE_INFO_FILE=$(find "$HOME/.pub-cache" \
            -path "*device_info_plus*/FPPDeviceInfoPlusPlugin.m" \
            2>/dev/null | head -1 || true)
          if [ -n "$DEVICE_INFO_FILE" ]; then
            sed -i '' '/isiOSAppOnVision/d' "$DEVICE_INFO_FILE"
          fi

          if [ -f ios/Podfile ]; then
            sed -i '' "s/platform :ios, '13.0'/platform :ios, '18.0'/" ios/Podfile || true
          fi
          sed -i '' \
            's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 18.0;/g' \
            ios/Runner.xcodeproj/project.pbxproj || true

          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.neogamelab.neostation" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string neostation" "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :LSApplicationQueriesSchemes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:0 string retroarch" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:1 string shortcuts" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:2 string armsx2" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:3 string melonx" "$PLIST"
          plutil -lint "$PLIST"

      - name: Generate NeoStation iOS icon
        shell: bash
        run: |
          dart run flutter_launcher_icons
          chmod +x build-utils/force_ios_fork_icon.sh
          build-utils/force_ios_fork_icon.sh

      - name: Install CocoaPods
        shell: bash
        run: |
          cd ios
          pod install --repo-update

      - name: Configure Flutter release
        shell: bash
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --config-only \
            --dart-define-from-file=.env

      - name: Build unsigned iOS application
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/ios/DerivedData build/ios/unsigned
          mkdir -p build/ios

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build | tee build/ios/xcodebuild-unsigned.log

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=$(find build/ios/DerivedData/Build/Products/Release-iphoneos \
            -maxdepth 1 -type d -name '*.app' -print -quit)
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo 'Unsigned Runner.app was not produced.'
            exit 1
          fi

          mkdir -p build/ios/unsigned/Payload
          cp -R "$APP_PATH" build/ios/unsigned/Payload/NeoStation.app
          (
            cd build/ios/unsigned
            zip -qry ../../../NeoStation-iOS-Build-163.ipa Payload
          )
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' \
            build/ios/unsigned/Payload/NeoStation.app/Info.plist | grep -qx '163'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
            build/ios/unsigned/Payload/NeoStation.app/Info.plist | grep -qx 'com.neogamelab.neostation'
          shasum -a 256 NeoStation-iOS-Build-163.ipa | tee NeoStation-iOS-Build-163.sha256

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeoStation-iOS-Build-163
          path: |
            NeoStation-iOS-Build-163.ipa
            NeoStation-iOS-Build-163.sha256
            build/ios/xcodebuild-unsigned.log
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary environment file
        if: always()
        run: rm -f .env
