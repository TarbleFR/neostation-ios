name: NeoPlay isolated integration checks
on:
  push:
    branches: [feature/neoplay, experimental]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neoplay-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Windows receiver independently
        working-directory: tools/neoplay-receiver
        run: |
          npm ci --ignore-scripts
          npm test
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Fetch the reviewed NeoPlay reference revisions
        # The Build397 feature revision is no longer reachable from a branch;
        # the integration gate compares the bridge with it and with the v2
        # frame-protocol revision by exact SHA, so fetch both explicitly.
        run: git fetch --no-tags origin f4b65f09d5a71ad2e0c72ab347b3df285c98b0f7 fb744a8e5eb50abc8fb03837a9398b9100bd25e6
      - name: Validate all NeoPlay languages and dialog lifecycle
        run: |
          dart analyze lib/widgets/main_menu_tab_strip.dart lib/widgets/header.dart lib/l10n/neoplay_companion_locale.dart lib/widgets/neoplay_game_hud_host.dart lib/widgets/neoplay_apple_tv_card.dart lib/l10n/neoplay_locale.dart lib/widgets/neoplay_dialog.dart packages/neoplay_bridge/lib/neoplay_bridge.dart lib/screens/settings_screen/new_settings_options/tools_settings_content.dart
          flutter test test/neoplay_locale_test.dart test/neoplay_dialog_test.dart test/neoplay_companion_test.dart test/main_menu_tab_strip_test.dart
          python3 test/neoplay_config_test.py
          python3 test/neoplay_ipa_packaging_test.py
          python3 test/neoplay_build397_integration_test.py
          python3 test/check_neo_swap_scope.py
          python3 test/neoplay_companion_contract_test.py
  native:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate isolated native harness
        run: |
          xcodebuild -version
          gem install xcodeproj --no-document --user-install
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          python3 test/neoplay_deployment_project_test.py
          ruby build-utils/neoplay_native_project.rb
          pod install --project-directory=build/neoplay-native
          python3 test/neoplay_pod_graph_test.py
      - name: Compile Cast SDK and independently test both production encoders
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,a in d["devices"].items() if "iOS-18" in k for x in a if "iPhone" in x["name"]))')
          echo "$DEVICE" > build/neoplay-native/device.txt
          set -o pipefail
          xcodebuild test -workspace build/neoplay-native/NPCheck.xcworkspace -scheme NPCheck -parallel-testing-enabled NO -destination "id=$DEVICE" -resultBundlePath build/neoplay-native/Results.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/neoplay-native/build.log
      - name: Collect encoded fixtures even when a media assertion fails
        if: always()
        run: |
          python3 build-utils/neoplay/collect_fixtures.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NeoPlay-native-evidence-${{ github.sha }}
          path: |
            build/neoplay-native/build.log
            build/neoplay-native/pod-graph.json
            build/neoplay-native/Results.xcresult
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NeoPlay-encoded-fixtures-${{ github.sha }}
          path: build/neoplay-native/fixtures
          if-no-files-found: error
          retention-days: 7
  windows-playback:
    needs: native
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: NeoPlay-encoded-fixtures-${{ github.sha }}
          path: build/neoplay-fixtures
      - name: Decode real iOS-encoded picture and sound in Windows Edge
        working-directory: tools/neoplay-receiver
        run: |
          npm ci --ignore-scripts
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.63.0
          node playback-smoke.mjs ../../build/neoplay-fixtures/windows.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NeoPlay-Windows-playback-${{ github.sha }}
          path: tools/neoplay-receiver/test-output
          retention-days: 7
