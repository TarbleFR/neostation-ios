          'build-utils/Gemfile.dolphin') }}-${{ env.CACHE_NAMESPACE }}
    - name: Upload encrypted IPA and verification reports
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: build/encrypted-delivery/
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
    - name: Collect diagnostic evidence
      if: always()
      run: |
        mkdir -p build/delivery
        cp "$RUNNER_TEMP/neostation-fast-xcodebuild.log" build/delivery/xcodebuild.log 2>/dev/null || true
        cp "$RUNNER_TEMP/flutter-aot-timings.json" build/delivery/flutter-aot-timings.json 2>/dev/null || true

        python3 build-utils/delivery_cipher.py artifact build/delivery build/encrypted-diagnostics
    - name: Upload diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}-diagnostics
        path: build/encrypted-diagnostics/
        if-no-files-found: warn
        retention-days: 14
    - name: Remove temporary secrets
      if: always()
      shell: bash
      run: rm -f .dart-defines.json
    if: ${{ inputs.benchmark == true || contains(github.event.head_commit.message, '[benchmark-build]') }}
