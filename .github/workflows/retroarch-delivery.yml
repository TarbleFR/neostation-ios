          --identity build/stikjit-current/identity.json \
          --report dist/stikjit-compatibility.json
        python3 - <<'PY'
        import zipfile,plistlib,os
        with zipfile.ZipFile('dist/'+os.environ['IPA_NAME']+'.ipa') as z:
