name: NeoStation RetroArch • Build 427 • SideStore
run-name: NeoStation Build ${{ inputs.build_number || '427' }} • ${{ github.sha }} • embedded libretro
'on':
  push:
    branches:
    - experimental
  workflow_dispatch:
    inputs:
      build_number:
        description: New delivery build number
        required: true
        default: '427'
        type: string
      benchmark:
        description: Measure a cold and a cached build on comparable macOS runners
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: neostation-retroarch-delivery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    if: ${{ github.event_name == 'workflow_dispatch' || (contains(github.event.head_commit.message, '[retroarch-delivery]') && !contains(github.event.head_commit.message, '[retroarch-relaunch-only]') && !contains(github.event.head_commit.message, '[retroarch-source-proof]') && !contains(github.event.head_commit.message, '[retroarch-receiver-ipa]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CI: 'true'
      BOT: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
    - &id001
      name: Checkout exact candidate
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Reuse successful unchanged Dart validation
      id: dart-evidence
      uses: actions/cache@v4
      # The key also covers the native files some Dart tests read (the bridge's
      # Objective-C sources and headers, the cores manifest), so a native-only
      # change re-runs them instead of reusing an older result. The same
      # expression is recorded and re-checked below.
      with:
        path: build/delivery/dart-validation.json
        key: neostation-validation-v1-ubuntu24.04-${{ runner.arch }}-flutter3.47.2-${{ hashFiles('lib/**','packages/**/*.dart','packages/**/pubspec.yaml','assets/**','test/**/*.dart','pubspec.lock','pubspec.yaml','packages/libretro_internal_bridge/ios/Classes/*.m','packages/libretro_internal_bridge/ios/Classes/*.h','build-utils/libretro/cores.json')
          }}
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.47.2
        channel: stable
        cache: true
      if: ${{ steps.dart-evidence.outputs.cache-hit != 'true' }}
    - name: Verify closed validation input tree and previous CI success
      run: python3 build-utils/verify_delivery_reuse.py
    - name: Analyze the changed integration and its restored dependencies
      run: |-
        flutter pub get --enforce-lockfile
        flutter analyze --no-fatal-infos
      if: ${{ steps.dart-evidence.outputs.cache-hit != 'true' }}
    - name: Reproduce the seven-root registration defect on the unchanged 422 code
      if: ${{ steps.dart-evidence.outputs.cache-hit != 'true' }}
      run: |
        python3 - <<'PYTHON'
        import json,subprocess
        from pathlib import Path
        source=Path('lib/providers/sqlite_config_provider/scanning.dart')
        candidate=source.read_bytes()
        try:
            source.write_bytes(subprocess.check_output(['git','show','00285ba5cfec694d59e1ca2bcf9de31418fd4e1a:'+str(source)]))
            result=subprocess.run(['flutter','test','--machine','test/rom_folder_registration_test.dart','--plain-name','seven old roots do not block a new RetroArch folder or its games'],text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            lines=[]
            for line in result.stdout.splitlines():
                try: lines.append(json.loads(line))
                except json.JSONDecodeError: pass
            failures=[x for x in lines if isinstance(x,dict) and x.get('type')=='error' and 'NEW_RETROARCH_ROOT_NOT_REGISTERED' in x.get('error','')]
            if result.returncode==0 or not failures:
                print(result.stdout)
                raise SystemExit('Expected registration failure was not reproduced; refusing the IPA')
            Path('build/delivery/folder-cap-reproduction.json').write_text(json.dumps({'baseline':'00285ba5cfec694d59e1ca2bcf9de31418fd4e1a','existingRootCount':7,'expectedFailureObserved':True,'errors':failures},indent=2))
            print('Confirmed: Build422 refuses the eighth root before scanning. Candidate restored for validation.')
        finally:
            source.write_bytes(candidate)
        PYTHON
    - name: Validate changed library, callback, launch and restart behavior
      run: |
        flutter test test/rom_folder_registration_test.dart test/library_scan_restart_test.dart test/retroarch_library_protocol_test.dart test/retroarch_library_cache_test.dart test/retroarch_launch_diagnostics_test.dart test/retroarch_sync_locale_test.dart test/rom_scan_symlink_alias_test.dart test/rom_scan_emulator_default_test.dart test/ios_selective_rollback_test.dart test/armsx2_retroarch_routing_isolation_test.dart test/game_repository_test.dart test/system_repository_test.dart test/config_repository_test.dart test/scraper_repository_test.dart test/sqlite_database_service_hidden_files_test.dart test/ios_rom_library_root_resolver_test.dart test/libretro_locale_test.dart test/libretro_core_catalog_test.dart test/frontend_media_gate_test.dart test/rpcs3_embedded_identity_test.dart test/libretro_skin_service_test.dart test/libretro_skin_catalog_test.dart test/libretro_skin_manager_test.dart test/libretro_playlist_actions_test.dart test/ios_library_root_relocation_test.dart test/neostation_rom_library_test.dart
        python3 - <<'PY'
        import json,os
        from pathlib import Path
        Path("build/delivery/dart-validation.json").write_text(json.dumps({"result":"passed","testedSHA":os.environ["GITHUB_SHA"],"key":"neostation-validation-v1-ubuntu24.04-${{ runner.arch }}-flutter3.47.2-${{ hashFiles('lib/**','packages/**/*.dart','packages/**/pubspec.yaml','assets/**','test/**/*.dart','pubspec.lock','pubspec.yaml','packages/libretro_internal_bridge/ios/Classes/*.m','packages/libretro_internal_bridge/ios/Classes/*.h','build-utils/libretro/cores.json') }}","tool":"Flutter 3.47.2, Ubuntu 24.04"}))
        PY
      if: ${{ steps.dart-evidence.outputs.cache-hit != 'true' }}
    - name: Verify reused Dart evidence and changed pipeline guards
      run: |
        python3 - <<'PY'
        import json
        from pathlib import Path
        record=json.loads(Path('build/delivery/dart-validation.json').read_text())
        assert record['result']=='passed'
        assert record['key']
        assert record['tool']=='Flutter 3.47.2, Ubuntu 24.04'
        assert record['key']=='neostation-validation-v1-ubuntu24.04-${{ runner.arch }}-flutter3.47.2-${{ hashFiles('lib/**','packages/**/*.dart','packages/**/pubspec.yaml','assets/**','test/**/*.dart','pubspec.lock','pubspec.yaml','packages/libretro_internal_bridge/ios/Classes/*.m','packages/libretro_internal_bridge/ios/Classes/*.h','build-utils/libretro/cores.json') }}'
        print('Dart tests validated at',record['testedSHA'],'; exact locked input key verified')
        PY
        python3 test/retroarch_baseline_scope_test.py
        python3 test/delivery_pipeline_test.py
        python3 test/libretro_route_contract_test.py
        python3 test/libretro_core_options_test.py
        python3 test/libretro_shader_catalog_test.py
        python3 test/libretro_frontend_ui_contract_test.py
        python3 test/integrated_import_tab_contract_test.py
        python3 test/localization_12_locale_coverage_test.py
        python3 test/cheats_media_source_contract_test.py
    - name: Preserve validation provenance
      uses: actions/upload-artifact@v4
      with:
        name: NeoStation-${{ inputs.build_number || '427' }}-validation-${{ github.sha }}
        path: build/delivery/
        if-no-files-found: error
        retention-days: 14
  native:
    if: ${{ github.event_name == 'workflow_dispatch' || (contains(github.event.head_commit.message, '[retroarch-delivery]') && !contains(github.event.head_commit.message, '[retroarch-relaunch-only]') && !contains(github.event.head_commit.message, '[retroarch-source-proof]') && !contains(github.event.head_commit.message, '[retroarch-receiver-ipa]')) }}
    runs-on: macos-15
    # Room for the frontend, shader (possibly with a Metal toolchain download)
    # and iPhone compile-and-link checks added to the Swift and host checks.
    timeout-minutes: 35
    steps:
    - *id001
    - name: Select Xcode 26.3 for NeoPlay and Google Cast
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3'
    - name: Verify prior Swift success for identical transport inputs
      id: native-evidence
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python3 - <<'PYTHON'
        import json,os,subprocess
        from pathlib import Path
        reference='55aaba962b04c125db0b215afbe1120a9c953c32'
        paths=['packages/external_folder_access/ios/Classes/RetroArchURLHandoff.swift','packages/external_folder_access/ios/Classes/ExternalFolderAccessPlugin.swift','test/retroarch_url_handoff_test.swift']
        same=all(subprocess.check_output(['git','show',reference+':'+p])==Path(p).read_bytes() for p in paths)
        same=same and subprocess.check_output(['xcodebuild','-version']).decode().strip()=='Xcode 26.3\nBuild version 17C529'
        same=same and subprocess.check_output(['xcrun','--sdk','iphoneos','--show-sdk-version']).decode().strip()=='26.2'
        reused=False
        if same:
            run=json.loads(subprocess.check_output(['gh','api','repos/TarbleFR/neostation-ios/actions/runs/37844950677']))
            jobs=json.loads(subprocess.check_output(['gh','api','repos/TarbleFR/neostation-ios/actions/runs/37844950677/jobs']))['jobs']
            job=next(j for j in jobs if j['name']=='native')
            reused=run['head_sha']==reference and job['conclusion']=='success' and all(s['conclusion']=='success' for s in job['steps'])
        with open(os.environ['GITHUB_OUTPUT'],'a') as handle:handle.write('reused='+str(reused).lower()+'\n')
        print('Swift validation reused from run 37844950677' if reused else 'Swift transport inputs require new validation')
        PYTHON
    - name: Validate changed Swift transport and compile the actual iPhone plugin
      if: ${{ steps.native-evidence.outputs.reused != 'true' }}
      run: |-
        swiftc -warnings-as-errors packages/external_folder_access/ios/Classes/RetroArchURLHandoff.swift test/retroarch_url_handoff_test.swift -o "$RUNNER_TEMP/retroarch-handoff"
        "$RUNNER_TEMP/retroarch-handoff"
        xcrun swiftc -parse -target arm64-apple-ios18.0 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" packages/external_folder_access/ios/Classes/ExternalFolderAccessPlugin.swift packages/external_folder_access/ios/Classes/RetroArchURLHandoff.swift
    - name: Run the embedded libretro host against a test core
      run: python3 test/libretro_host_test.py
    - name: Run the portable libretro frontend modules (geometry, controls, settings, skins)
      # Runs even when an earlier native check failed, so one round reports
      # every native problem; the job still fails and blocks the IPA.
      if: ${{ !cancelled() }}
      run: python3 test/libretro_frontend_test.py
    - name: Compile and render every libretro shader preset with Metal
      if: ${{ !cancelled() }}
      run: python3 test/libretro_shader_test.py
    - name: Compile and link every libretro bridge source for iPhone
      if: ${{ !cancelled() }}
      run: python3 test/libretro_ios_syntax_test.py
  cold:
    name: Release device build • cold
    runs-on: macos-15
    timeout-minutes: 60
    needs:
    - checks
    - native
    env:
      BUILD_NUMBER: ${{ inputs.build_number || '427' }}
      DELIVERY_RECIPIENT: build-utils/delivery-424-recipient.pem
      IPA_NAME: NeoStation
      ARTIFACT_NAME: NeoStation-Build-${{ inputs.build_number || '427' }}-${{ github.sha }}-cold
      KARTPAD_CORE_RUN_ID: ${{ inputs.kartpad_core_run_id || '36322395443' }}
      KARTPAD_CORE_HOST_SHA: ${{ inputs.kartpad_core_host_sha || '3934ac9d333247d5374b9fb7d71f8ef49bbcd79e' }}
      KARTPAD_CANDIDATE: '1'
      DOLPHIN_SHA: 7cac54161659421ed95c2cd1c0b0746539a4cd38
      DOLPHIN_CORE_HOST_SHA: ae7d46f90dff64ce698b8c18e0c12510dbae96fe
      ARMSX2_CORE_HOST_SHA: 899d3c44f8f465c8da0d93c763817ffca519c00c
      ARMSX2_CORE_RUN_ID: '37641466835'
      RPCS3_CORE_HOST_SHA: afb33454db50236485bd5ec963a722dcb5f65610
      RPCS3_CORE_RUN_ID: '37620034517'
      DUSKLIGHT_CORE_HOST_SHA: 899d3c44f8f465c8da0d93c763817ffca519c00c
      DUSKLIGHT_CORE_RUN_ID: '37641472546'
      LIBRETRO_CORES_HOST_SHA: 48635465f4bdb324db4ff41b8b9815ff101ad360
      LIBRETRO_CORES_RUN_ID: '37945318237'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      BUNDLE_GEMFILE: ${{ github.workspace }}/build-utils/Gemfile.dolphin
      SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
      SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
      DELIVERY_METRICS: ${{ github.workspace }}/build/delivery/timings.jsonl
      CACHE_NAMESPACE: ${{ (inputs.benchmark == true || contains(github.event.head_commit.message, '[benchmark-build]')) && github.run_id || 'normal' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUNDLE_PATH: ${{ github.workspace }}/build/ruby-gems
      DELIVERY_MODE: cold
    steps:
    - name: Checkout exact candidate
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Select Xcode 26.3 for NeoPlay and Google Cast
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3'
    - name: Set up Flutter 3.47.2
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.47.2
        channel: stable
        cache: true
        cache-key: neostation-benchmark-sdk-${{ runner.os }}-${{ runner.arch }}-3.47.2-${{ env.CACHE_NAMESPACE }}
        pub-cache-key: neostation-benchmark-pub-${{ runner.os }}-${{ runner.arch }}-3.47.2-${{ hashFiles('pubspec.lock') }}-${{ env.CACHE_NAMESPACE }}
    - name: Record exact build environment and start measurement
      run: |
        mkdir -p build/delivery
        python3 build-utils/delivery_benchmark.py environment
        python3 build-utils/verify_delivery_reuse.py
    - name: Record empty device build cache
      id: state
      uses: actions/cache/restore@v4
      with:
        path: .ci-cache
        key: neostation-device-v2-${{ runner.os }}-${{ runner.arch }}-xcode26.3-flutter3.47.2-${{ github.sha }}-${{ env.BUILD_NUMBER }}-${{ hashFiles('pubspec.lock',
          'build-utils/Gemfile.dolphin') }}-${{ env.CACHE_NAMESPACE }}
    - name: Assert the benchmark device cache is empty
      if: ${{ inputs.benchmark == true || contains(github.event.head_commit.message, '[benchmark-build]') }}
      run: test "${{ steps.state.outputs.cache-hit }}" != true
    - name: Resolve locked Dart dependencies
      run: python3 build-utils/delivery_metrics.py dart_dependencies flutter pub get --enforce-lockfile
    - name: Prepare lightweight build tools
      shell: bash
      run: |
        set -euo pipefail
        export BUNDLE_PATH="$GITHUB_WORKSPACE/build/ruby-gems"
        echo "BUNDLE_PATH=$BUNDLE_PATH" >> "$GITHUB_ENV"
        python3 build-utils/delivery_metrics.py ruby_dependencies bundle install
    - name: Generate iOS host
      shell: bash
      run: |
        set -euo pipefail
        flutter config --no-enable-swift-package-manager
        test ! -d ios
        python3 build-utils/delivery_metrics.py host_scaffold_and_registrant python3 packages/dolphin_internal_bridge/ci/build_support.py scaffold
    - name: Download validated Build 350 native donor
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        # Artifact 10932894067 (run 36323843067) was purged on 7 October 2026.
        # The same Build 350 IPA is published as release 0.0.1; require its
        # exact SHA-256. Only its native Core and UI resources are used,
        # never its JIT framework.
        mkdir -p build/native-donor
        gh release download 0.0.1 --repo "$GITHUB_REPOSITORY" --pattern NeoStation.ipa --dir build/native-donor
        echo "e1017b96842ec970be3ed0cd981083ee945d069cf76e689a4ca3c81339299b46  build/native-donor/NeoStation.ipa" | shasum -a 256 -c -
    - name: Reuse validated native runtimes
      shell: bash
      run: |
        set -euo pipefail
        # Core/resource bootstrap only. JIT comes exclusively from source below.
        python3 build-utils/prepare_fast_native_runtime.py \
          build/native-donor --build-number "$BUILD_NUMBER"
    - name: Restore unchanged canonical StikJIT compilation interfaces
      id: stik
      uses: actions/cache@v4
      # The prior successful device job populated this exact source/tool key.
      # Native interfaces remain reusable independently of host benchmark caches.
      with:
        path: build/stikjit-current
        key: stikjit-interfaces-v1-${{ runner.os }}-${{ runner.arch }}-xcode26.3-${{ hashFiles('build-utils/stikjit/source.json','build-utils/patch_stikjit_rpcs3.py','build-utils/patch_stikjit_compat.py','build-utils/install_patched_stikjit.py','build-utils/build_patched_stikjit.py')
          }}-37844950677
    - name: Build canonical StikJIT from pinned sources for iOS 18 26 and 27
      shell: bash
      run: |
        set -euo pipefail
        command -v xcodegen || brew install xcodegen
        python3 build-utils/build_patched_stikjit.py 2>&1 | tee "$RUNNER_TEMP/neoswap-stikjit-step.log"
        python3 test/stikjit_unified_build_test.py 2>&1 | tee -a "$RUNNER_TEMP/neoswap-stikjit-step.log"
      if: ${{ steps.stik.outputs.cache-hit != 'true' }}
    - name: Install verified cached StikJIT interfaces
      if: ${{ steps.stik.outputs.cache-hit == 'true' }}
      run: python3 build-utils/install_patched_stikjit.py build/stikjit-current/StikJIT.xcframework
    - name: Require completed exact NeoSwap Core before artifact download
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        python3 - <<'PYCOREWAIT'
        import json,os,subprocess,time
        endpoint='repos/TarbleFR/neostation-ios/actions/runs/'+os.environ['RPCS3_CORE_RUN_ID']
        deadline=time.monotonic()+7200
        while True:
            result=json.loads(subprocess.check_output(['gh','api',endpoint]))
            assert result['head_sha']==os.environ['RPCS3_CORE_HOST_SHA'],result
            if result['status']=='completed':
                assert result['conclusion']=='success',result
                print('Verified successful exact NeoSwap Core',result['id'],result['head_sha'])
                break
            assert time.monotonic()<deadline,'NeoSwap Core did not finish within the allowed wait'
            print('Waiting for exact Core',result['id'],result['status'],flush=True)
            time.sleep(30)
        PYCOREWAIT
    - name: Download pinned passive RPCS3 Core
      uses: actions/download-artifact@v4
      with:
        name: RPCS3Core-${{ env.RPCS3_CORE_HOST_SHA }}
        run-id: ${{ env.RPCS3_CORE_RUN_ID }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: dist/rpcs3-native
    - name: Verify and install passive RPCS3 Core
      shell: bash
      run: |
        set -euo pipefail
        SOURCE=dist/rpcs3-native/libRPCS3Core.dylib
        IDENTITY=dist/rpcs3-native/identity.json
        CORE=packages/rpcs3_internal_bridge/ios/Frameworks/libRPCS3Core.dylib
        test -s "$SOURCE"
        test -s "$IDENTITY"
        test -s "$CORE"
        # The artifact's source, canonical patch, compiler recipe, binary
        # checks and native ABI must all be from the same Core commit.
        # RPCS3_CORE_INPUTS_BEGIN
        git diff --exit-code "$RPCS3_CORE_HOST_SHA" "$GITHUB_SHA" -- \
          build-utils/build_rpcs3_embedded_core.sh \
          build-utils/materialize_rpcs3_core.py \
          build-utils/apply_rpcs3_llvm_patch.py \
          build-utils/rpcs3/canonical-source.json \
          build-utils/rpcs3/embedded-core.patch \
          build-utils/rpcs3/llvm-aarch64-ghc-emergency-spill.patch \
          build-utils/rpcs3_core_syntax_gate.py \
          build-utils/validate_rpcs3_embedded_core.py \
          build-utils/validate_rpcs3_passive_dlopen.py \
          build-utils/patch_rpcs3_build301_passive_dlopen.py \
          packages/rpcs3_internal_bridge/ios/Classes/Rpcs3CoreABI.h \
          packages/neo_swap/ios/Classes/NeoSwap.h \
          packages/neo_swap/ios/Classes/NeoSwapClientStats.h \
          packages/neo_swap/ios/Classes/NeoSwapRelay.h \
          native/neoswap/NeoSwapClient.h \
          test/neo_swap_core_pin_test.py \
          test/neoswap_rpcs3_allocator_test.cpp \
          test/neoswap_cpu_buffers_test.cpp \
          test/rpcs3_neoswap_vulkan_buffer_test.py \
          test/native/rpcs3_neoswap_vulkan_buffer_test.cpp \
          test/rpcs3_neoswap_relay_test.py \
          test/native/rpcs3_neoswap_relay_test.cpp \
          test/rpcs3_core_syntax_gate_test.py \
          test/rpcs3_embedded_core_validator_test.py \
          test/rpcs3_preprocessor_balance_test.py \
          test/rpcs3_build301_passive_dlopen_test.py \
          test/rpcs3_atomic_startup_test.py \
          test/rpcs3_failed_startup_test.py \
          test/rpcs3_build264_gow3_core_test.py \
          test/rpcs3_build351_gow3_engine_test.py \
          test/rpcs3_build353_xitrix_v010_test.py \
          test/rpcs3_armsx3_performance_patch_test.py \
          test/rpcs3_build352_gow3_memory_test.py \
          test/rpcs3_ios_ppu_compile_budget_test.cpp \
          test/rpcs3_ppu_no_size_split_policy_test.cpp \
          test/rpcs3_xitrix_v0101_native_test.py \
          test/native/rpcs3_spu_analyzer_support.h \
          test/native/rpcs3_spu_branch_analyzer_test.cpp \
          test/rpcs3_spu_warmup_test.py \
          test/native/rpcs3_spu_warmup_test.cpp \
          test/native/rpcs3_vk_memory_pressure_test.cpp \
          test/native/rpcs3_vk_conditional_render_test.cpp \
          test/native/rpcs3_neoswap_stats_getter_test.cpp \
          .github/workflows/rpcs3-core.yml \
          native/neoswap-storage/StorageABI.h \
          native/neoswap-storage/Client.h \
          native/neoswap-storage/ShaderKey.h \
          test/rpcs3_shader_storage_test.py \
          test/native/rpcs3_shader_storage_client_test.cpp \
          native/neoswap-storage/SourceABI.h \
          native/neoswap-storage/SourceClient.h \
          native/neoswap-storage/SourceClient.cpp \
          native/neoswap-storage/FrameClient.h \
          native/neoswap-storage/VideoBuffer.h \
          test/rpcs3_video_frame_archive_test.py \
          test/native/rpcs3_video_frame_archive_test.cpp \
          build-utils/run_vdec_archive_validation.sh \
          test/rpcs3_source_archive_test.py \
          test/native/rpcs3_source_archive_client_test.cpp
        # RPCS3_CORE_INPUTS_END
        # The independent host broker/donation is rebuilt by this IPA job.
        # Only the Core source, client ABI, recipe and native tests are pinned.
        python3 test/neo_swap_core_pin_test.py
        python3 - <<'PY'
        import json, os, shutil, sys
        from pathlib import Path
        sys.path.insert(0, 'build-utils')
        sys.path.insert(0, 'test')
        from neo_swap_core_pin_test import validate_core_input_identity
        from validate_rpcs3_ipa import validate_core_identity
        from validate_rpcs3_embedded_core import validate_core
        from validate_rpcs3_passive_dlopen import validate as validate_passive_dlopen

        source = Path('dist/rpcs3-native/libRPCS3Core.dylib')
        identity_path = Path('dist/rpcs3-native/identity.json')
