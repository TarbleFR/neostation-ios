name: Apply Gallica Import-Only Library Policy

on:
  pull_request:
    branches:
      - feature/library-native
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: library-gallica-import-only-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: Apply Gallica import-only policy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/library-native
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply source policy and repository cleanup
        run: |
          set -euo pipefail
          python3 tools/apply_gallica_import_only_cleanup.py
          dart format \
            lib/screens/library_screen/library_screen.dart \
            lib/services/library_addon_service.dart \
            test/library_addon_service_test.dart \
            test/library_no_native_sources_test.dart
          git diff --check

      - name: Resolve dependencies
        run: flutter pub get

      - name: Validate Library compatibility
        run: |
          set -o pipefail
          flutter test test/library_addon_service_test.dart
          flutter test test/library_catalog_service_test.dart
          flutter test test/library_metadata_provider_service_test.dart
          flutter test test/library_no_native_sources_test.dart
          flutter test test/fin_library_service_test.dart
          flutter test test/fin_persistence_regression_test.dart

      - name: Analyze changed Library sources
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Commit validated cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Library policy already applied."
            exit 0
          fi
          git commit -m "refactor: make Gallica import-only in Library"
          git push origin HEAD:feature/library-native
