name: RPCS3 Internal iOS Test
run-name: RPCS3 Internal iOS Test • ${{ github.sha }}

on:
  push:
    branches:
      - feature/rpcs3-internal-engine-v1
    paths:
      - .github/workflows/rpcs3-internal-ios-build.yml

permissions:
  contents: read

concurrency:
  group: neostation-rpcs3-internal-ios-test
  cancel-in-progress: true

jobs:
  build:
    name: Build NeoStation + RPCS3 Internal IPA
    runs-on: macos-15
    timeout-minutes: 180
    env:
      BUILD_NUMBER: '215'
      IPA_NAME: 'NeoStation-iOS-RPCS3-Internal-Test-215'
      ARTIFACT_NAME: 'NeoStation-iOS-RPCS3-Internal-Test-215'
      DOLPHIN_SHA: 7cac54161659421ed95c2cd1c0b0746539a4cd38
      HOMEBREW_NO_AUTO_UPDATE: '1'
      BUNDLE_GEMFILE: ${{ github.workspace }}/build-utils/Gemfile.dolphin
      CCACHE_DIR: ${{ github.workspace }}/.dolphin-ccache
      SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
      SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}

    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify RPCS3/Dolphin isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check
          git fetch origin main
          git diff --exit-code origin/main -- \
            packages/dolphin_internal_bridge \
            packages/dolphin_jit_helper \
            native/dolphin_internal_helper
          ! grep -R "com.xitrix.RPCS3\|openJitRequest" \
            lib/services/rpcs3_launch_service.dart \
            lib/services/rpcs3_internal_service.dart

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Prepare build tools
        run: |
          set -euo pipefail
          export BUNDLE_PATH="$RUNNER_TEMP/neostation-ruby-gems"
          echo "BUNDLE_PATH=$BUNDLE_PATH" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$RUNNER_TEMP/dolphin-ios" >> "$GITHUB_ENV"
          mkdir -p build/dolphin-ci
          bundle install
          command -v cmake >/dev/null || brew install cmake
          command -v ninja >/dev/null || brew install ninja
          command -v ccache >/dev/null || brew install ccache
          ccache --max-size=2G

      - name: Prepare build definitions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          required = ('SCREENSCRAPER_DEV_ID', 'SCREENSCRAPER_DEV_PASSWORD')
          values = {key: os.environ.get(key, '').strip() for key in required}
          missing = [key for key, value in values.items() if not value]
          if missing:
              raise SystemExit('Missing build secrets: ' + ', '.join(missing))
          values.update({
              'NEOSTATION_EXPERIMENTAL_STIKJIT_MELONX': 'true',
              'NEOSTATION_MELONX_BUNDLE_ID': 'com.nur.nx',
              'NEOSTATION_EXPERIMENTAL_STIKJIT_ARMSX2': 'true',
              'NEOSTATION_ARMSX2_BUNDLE_ID': 'xyz.aethersx2.AetherSX2',
          })
          Path('.dart-defines.json').write_text(json.dumps(values))
          PY

      - name: Restore shared StikJIT 1.5.0
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://github.com/StikDebug/StikJIT/releases/download/1.5.0/StikJIT.xcframework.zip' \
            -o "$RUNNER_TEMP/StikJIT.xcframework.zip"
          python3 packages/dolphin_internal_bridge/ci/build_support.py stik \
            "$RUNNER_TEMP/StikJIT.xcframework.zip"
          test -f packages/stikjit_bridge/ios/Frameworks/StikJIT.xcframework/ios-arm64/StikJIT.framework/StikJIT

      - name: Materialize verified RPCS3 Core
        run: |
          set -euo pipefail
          python3 build-utils/materialize_rpcs3_internal.py core
          test -f packages/rpcs3_internal_bridge/ios/Frameworks/libRPCS3Core.dylib
          test "$(stat -f%z packages/rpcs3_internal_bridge/ios/Frameworks/libRPCS3Core.dylib)" = "65876624"

      - name: Analyze and test
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter analyze --no-fatal-infos
          flutter test --no-pub
          git diff --exit-code -- pubspec.yaml pubspec.lock

      - name: Generate iOS host
        run: |
          set -euo pipefail
          flutter config --no-enable-swift-package-manager
          python3 packages/dolphin_internal_bridge/ci/build_support.py scaffold

      - name: Restore pinned Dolphin build product
        id: core-cache
        uses: actions/cache/restore@v4
        with:
          key: dolphin-v3-ios-arm64-xcode16.4-7cac5416-${{ hashFiles('build-utils/patch_dolphin_internal_core_v2.py', 'packages/dolphin_internal_bridge/core/**') }}
          path: |
            ${{ runner.temp }}/dolphin-ios/build-iphoneos-Release/Source/iOS/Library/libdolphin.dylib
            ${{ runner.temp }}/dolphin-ios/Data/Sys
            ${{ runner.temp }}/dolphin-ios/Source/iOS/Library/NeoStationBridge.mm
            ${{ runner.temp }}/dolphin-ios/Source/iOS/Library/CMakeLists.txt
            ${{ runner.temp }}/dolphin-ios/Source/Core/Common/MemoryUtil_iOS_LuckTXM.cpp

      - name: Restore compiler cache
        if: steps.core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          key: dolphin-v3-ccache-xcode16.4-${{ github.run_id }}
          restore-keys: dolphin-v3-ccache-xcode16.4-
          path: .dolphin-ccache

      - name: Compile pinned Dolphin core
        id: compile-core
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/dolphin-ios"
          rm -rf "$SRC"
          git init "$SRC"
          git -C "$SRC" remote add origin https://github.com/OatmealDome/dolphin-ios.git
          git -C "$SRC" fetch --depth 1 origin "$DOLPHIN_SHA"
          git -C "$SRC" checkout --detach FETCH_HEAD
          git -C "$SRC" submodule update --init --recursive --depth 1
          test "$(git -C "$SRC" rev-parse HEAD)" = "$DOLPHIN_SHA"
          python3 build-utils/patch_dolphin_internal_core_v2.py "$SRC"
          cmake -S "$SRC" -B "$SRC/build-iphoneos-Release" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$SRC/Externals/ios-cmake/ios.toolchain.cmake" \
            -DPLATFORM=OS64 -DDEPLOYMENT_TARGET=17.4 -DENABLE_VISIBILITY=ON \
            -DENABLE_BITCODE=OFF -DENABLE_ARC=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS=-fPIC -DIOS=ON -DENABLE_ANALYTICS=NO \
            -DUSE_SYSTEM_LIBS=OFF -DENABLE_TESTS=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache
          cmake --build "$SRC/build-iphoneos-Release" --target dolphin --parallel 3

      - name: Prepare Dolphin framework
        id: dolphin-framework
        run: |
          set -euo pipefail
          python3 packages/dolphin_internal_bridge/ci/build_support.py framework "$RUNNER_TEMP/dolphin-ios"

      - name: Save pinned Dolphin core
        if: steps.core-cache.outputs.cache-hit != 'true' && steps.dolphin-framework.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          key: dolphin-v3-ios-arm64-xcode16.4-7cac5416-${{ hashFiles('build-utils/patch_dolphin_internal_core_v2.py', 'packages/dolphin_internal_bridge/core/**') }}
          path: |
            ${{ runner.temp }}/dolphin-ios/build-iphoneos-Release/Source/iOS/Library/libdolphin.dylib
            ${{ runner.temp }}/dolphin-ios/Data/Sys
            ${{ runner.temp }}/dolphin-ios/Source/iOS/Library/NeoStationBridge.mm
            ${{ runner.temp }}/dolphin-ios/Source/iOS/Library/CMakeLists.txt
            ${{ runner.temp }}/dolphin-ios/Source/Core/Common/MemoryUtil_iOS_LuckTXM.cpp

      - name: Package DolphiniOS touchscreen resources
        run: python3 packages/dolphin_internal_bridge/ci/materialize_touch_resources.py --source "$RUNNER_TEMP/dolphin-ios"

      - name: Configure Flutter release and embedded engines
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --config-only --no-pub \
            --build-number="$BUILD_NUMBER" --dart-define-from-file=.dart-defines.json
          python3 packages/dolphin_internal_bridge/ci/build_support.py configure
          python3 build-utils/configure_rpcs3_ios_v1.py
          dart run flutter_launcher_icons
          bash build-utils/force_ios_fork_icon.sh
          env -u BUNDLE_GEMFILE -u BUNDLE_PATH pod install --project-directory=ios
          xcodebuild -list -workspace ios/Runner.xcworkspace
          git diff --exit-code -- pubspec.yaml pubspec.lock

      - name: Verify generated RPCS3 host
        shell: bash
        run: |
          set -euo pipefail
          test -d ios/RPCS3JITHelper
          grep -q "RPCS3JITHelper" ios/Runner.xcodeproj/project.pbxproj
          grep -q "rpcs3_jit_helper" ios/Podfile
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          p = plistlib.loads(Path('ios/Runner/Runner.entitlements').read_bytes())
          required = {
              'get-task-allow': True,
              'com.apple.developer.kernel.extended-virtual-addressing': True,
              'com.apple.developer.kernel.increased-memory-limit': True,
              'com.apple.developer.kernel.increased-debugging-memory-limit': True,
          }
          missing = [k for k, v in required.items() if p.get(k) != v]
          if missing:
              raise SystemExit('RPCS3 entitlements missing: ' + ', '.join(missing))
          PY

      - name: Compile unsigned iOS app
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/RPCS3DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' PROVISIONING_PROFILE_SPECIFIER='' \
            COMPILER_INDEX_STORE_ENABLE=NO build

      - name: Verify RPCS3 products in Runner.app
        shell: bash
        run: |
          set -euo pipefail
          APP=build/ios/RPCS3DerivedData/Build/Products/Release-iphoneos/Runner.app
          test -d "$APP"
          find "$APP" -maxdepth 3 -print | sort | grep -E 'RPCS3|rpcs3|libRPCS3Core' || true
          test -f "$APP/Frameworks/libRPCS3Core.dylib"
          test -d "$APP/PlugIns/RPCS3JITHelper.appex"

      - name: Package IPA
        run: |
          set -euo pipefail
          rm -rf build/ios/DolphinDerivedData
          ln -s "$PWD/build/ios/RPCS3DerivedData" build/ios/DolphinDerivedData
          git diff --check
          python3 packages/dolphin_internal_bridge/ci/build_support.py package
          mkdir -p dist-rpcs3
          cp -a dist/. dist-rpcs3/
          ls -lah dist-rpcs3

      - name: Upload RPCS3 internal IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist-rpcs3/
          if-no-files-found: error
          retention-days: 14

      - name: Save compiler cache
        if: always() && steps.compile-core.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          key: dolphin-v3-ccache-xcode16.4-${{ github.run_id }}
          path: .dolphin-ccache

      - name: Remove temporary build secrets
        if: always()
        run: rm -f .dart-defines.json
