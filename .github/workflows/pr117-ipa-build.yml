name: Validate NeoStation iOS
run-name: NeoStation iOS Clean Build 211 • ${{ github.sha }}

on:
  push:

permissions:
  contents: write

concurrency:
  group: neostation-ios-release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Purge retired cloud feature
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.cleanup.outputs.changed }}
    steps:
      - name: Checkout exact requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Remove retired cloud feature and audit tree
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G 'build-utils/.retired-cloud-cleanup-*.part' > /dev/null; then
            cat build-utils/.retired-cloud-cleanup-*.part > /tmp/retired_cleanup.b64
            python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          payload = Path('/tmp/retired_cleanup.b64').read_text().strip()
          raw = gzip.decompress(base64.b64decode(payload, validate=True))
          expected = '69f4d86f4a17920d7508ff5125331f459aad70dbe6d927ab5b88f6e4dd4ff87f'
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f'Cleanup payload checksum mismatch: {actual}')
          Path('/tmp/retired_cleanup.py').write_bytes(raw)
          PY
            python3 /tmp/retired_cleanup.py
            rm -f build-utils/.retired-cloud-cleanup-*.part /tmp/retired_cleanup.py /tmp/retired_cleanup.b64
          fi

          python3 - <<'PY'
          from pathlib import Path
          brand = 'Neo' + 'Sync'
          low = brand.lower()
          snake = 'neo' + '_sync'
          forbidden = (brand, low, snake, brand.upper())
          violations = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              rel = path.as_posix()
              if any(token in rel for token in forbidden):
                  violations.append(rel)
                  continue
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue
              if any(token in text for token in forbidden):
                  violations.append(rel)
          residual = ('SyncManager', 'ISyncProvider', 'syncProvider',
                      'cloudSyncEnabled', 'cloud_sync_enabled',
                      'save' + 'SessionToken', 'onSessionStopped', 'withSaveAccess')
          for root in (Path('lib'), Path('test')):
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file():
                      continue
                  try:
                      text = path.read_text()
                  except UnicodeDecodeError:
                      continue
                  if any(token in text for token in residual):
                      violations.append(path.as_posix())
          if violations:
              raise SystemExit('Retired cloud feature remnants: ' + ', '.join(sorted(set(violations))[:80]))
          PY
          git diff --check

          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "Tarble FR"
            git config user.email "f9wynyv9qy@privaterelay.appleid.com"
            git add -A
            git commit -m "refactor: remove retired cloud synchronization"
            git push origin HEAD:"$GITHUB_REF_NAME"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: prepare
    if: needs.prepare.outputs.changed != 'true'
    name: Build and audit NeoStation IPA
    runs-on: macos-15
    timeout-minutes: 180
    env:
      BUILD_NUMBER: '211'
      IPA_NAME: 'NeoStation-iOS-Clean-Build-211'
      ARTIFACT_NAME: 'NeoStation-iOS-Clean-Build-211'
      DOLPHIN_SHA: 7cac54161659421ed95c2cd1c0b0746539a4cd38
      HOMEBREW_NO_AUTO_UPDATE: '1'
      BUNDLE_GEMFILE: ${{ github.workspace }}/build-utils/Gemfile.dolphin
      CCACHE_DIR: ${{ github.workspace }}/.dolphin-ccache
      SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
      SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}

    steps:
      - name: Checkout exact requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate candidate build number
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          value = os.environ['BUILD_NUMBER']
          if not re.fullmatch(r'[1-9][0-9]{0,8}', value) or int(value) <= 198:
              raise SystemExit('Use a candidate build number greater than stable Build 198.')
          PY

      - name: Snapshot source and verify isolation before compilation
        run: |
          set -euo pipefail
          echo "BUNDLE_PATH=$RUNNER_TEMP/dolphin-ruby-gems" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$RUNNER_TEMP/dolphin-ios" >> "$GITHUB_ENV"
          mkdir -p build/dolphin-ci
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git archive --format=zip --output=build/dolphin-ci/source-review.zip HEAD \
            build-utils docs lib native packages test pubspec.yaml pubspec.lock
          git rev-parse HEAD > build/dolphin-ci/source-commit.txt
          git diff --check
          python3 -m unittest discover -s test -p 'dolphin_*test.py' -v 2>&1 | tee build/dolphin-ci/ipa-validator-tests.txt

      - name: Upload auditable source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: NeoStation-source-${{ github.run_id }}
          path: |
            build/dolphin-ci/source-review.zip
          if-no-files-found: error
          retention-days: 14

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Record toolchain and install pinned Ruby dependency
        run: |
          set -euo pipefail
          { xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; flutter --version; ruby --version; command -v ruby; bundle --version; pod --version; } | tee build/dolphin-ci/toolchain.txt
          bundle install
          cp build-utils/Gemfile.dolphin.lock build/dolphin-ci/Gemfile.dolphin.lock
          command -v cmake >/dev/null || brew install cmake
          command -v ninja >/dev/null || brew install ninja
          command -v ccache >/dev/null || brew install ccache
          ccache --max-size=2G

      - name: Prepare existing emulator build definitions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          required = ('SCREENSCRAPER_DEV_ID', 'SCREENSCRAPER_DEV_PASSWORD')
          values = {key: os.environ.get(key, '').strip() for key in required}
          missing = [key for key, value in values.items() if not value]
          if missing:
              raise SystemExit('Missing build secrets: ' + ', '.join(missing))
          values.update({
              'NEOSTATION_EXPERIMENTAL_STIKJIT_MELONX': 'true',
              'NEOSTATION_MELONX_BUNDLE_ID': 'com.nur.nx',
              'NEOSTATION_EXPERIMENTAL_STIKJIT_ARMSX2': 'true',
              'NEOSTATION_ARMSX2_BUNDLE_ID': 'xyz.aethersx2.AetherSX2',
              'NEOSTATION_EXPERIMENTAL_STIKJIT_RPCS3': 'true',
              'NEOSTATION_RPCS3_BUNDLE_ID': 'com.xitrix.RPCS3',
          })
          Path('.dart-defines.json').write_text(json.dumps(values))
          PY

      - name: Restore verified StikJIT 1.5.0
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://github.com/StikDebug/StikJIT/releases/download/1.5.0/StikJIT.xcframework.zip' -o "$RUNNER_TEMP/StikJIT.xcframework.zip"
          python3 packages/dolphin_internal_bridge/ci/build_support.py stik "$RUNNER_TEMP/StikJIT.xcframework.zip"

      - name: Analyze and test every existing integration
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter analyze --no-fatal-infos 2>&1 | tee build/dolphin-ci/flutter-analyze.txt
          flutter test --no-pub 2>&1 | tee build/dolphin-ci/flutter-tests.txt
          git diff --exit-code -- pubspec.yaml pubspec.lock

      - name: Generate iOS host without modifying application sources
        run: |
          set -euo pipefail
          flutter config --no-enable-swift-package-manager
          python3 packages/dolphin_internal_bridge/ci/build_support.py scaffold

      - name: Restore exact pinned Dolphin build product
        id: core-cache
        uses: actions/cache/restore@v4
        with:
          key: dolphin-v3-ios-arm64-xcode16.4-7cac5416-${{ hashFiles('build-utils/patch_dolphin_internal_core_v2.py', 'packages/dolphin_internal_bridge/core/**') }}
          path: |
            ${{ runner.temp }}/dolphin-ios/build-iphoneos-Release/Source/iOS/Library/libdolphin.dylib
            ${{ runner.temp }}/dolphin-ios/Data/Sys
            ${{ runner.temp }}/dolphin-ios/Source/iOS/Library/NeoStationBridge.mm
            ${{ runner.temp }}/dolphin-ios/Source/iOS/Library/CMakeLists.txt
            ${{ runner.temp }}/dolphin-ios/Source/Core/Common/MemoryUtil_iOS_LuckTXM.cpp

      - name: Restore compiler cache
        if: steps.core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          key: dolphin-v3-ccache-xcode16.4-${{ github.run_id }}
          restore-keys: dolphin-v3-ccache-xcode16.4-
          path: .dolphin-ccache

      - name: Compile pinned real Dolphin arm64 core
        id: compile-core
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/dolphin-ios"
          rm -rf "$SRC"
          git init "$SRC"
          git -C "$SRC" remote add origin https://github.com/OatmealDome/dolphin-ios.git
          git -C "$SRC" fetch --depth 1 origin "$DOLPHIN_SHA"
          git -C "$SRC" checkout --detach FETCH_HEAD
          git -C "$SRC" submodule update --init --recursive --depth 1
          test "$(git -C "$SRC" rev-parse HEAD)" = "$DOLPHIN_SHA"
          python3 build-utils/patch_dolphin_internal_core_v2.py "$SRC"
          cmake -S "$SRC" -B "$SRC/build-iphoneos-Release" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$SRC/Externals/ios-cmake/ios.toolchain.cmake" \
            -DPLATFORM=OS64 -DDEPLOYMENT_TARGET=17.4 -DENABLE_VISIBILITY=ON \
            -DENABLE_BITCODE=OFF -DENABLE_ARC=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS=-fPIC -DIOS=ON -DENABLE_ANALYTICS=NO \
            -DUSE_SYSTEM_LIBS=OFF -DENABLE_TESTS=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache \
            2>&1 | tee build/dolphin-ci/dolphin-configure.txt
          cmake --build "$SRC/build-iphoneos-Release" --target dolphin --parallel 3 \
            2>&1 | tee build/dolphin-ci/dolphin-core-build.txt
          ccache --show-stats | tee build/dolphin-ci/ccache.txt

      - name: Validate core ABI and prepare embedded framework
        id: framework
        run: |
          set -euo pipefail
          python3 packages/dolphin_internal_bridge/ci/build_support.py framework "$RUNNER_TEMP/dolphin-ios"

      - name: Save verified pinned core for native build retries
        if: steps.core-cache.outputs.cache-hit != 'true' && steps.framework.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          key: dolphin-v3-ios-arm64-xcode16.4-7cac5416-${{ hashFiles('build-utils/patch_dolphin_internal_core_v2.py', 'packages/dolphin_internal_bridge/core/**') }}
          path: |
            ${{ runner.temp }}/dolphin-ios/build-iphoneos-Release/Source/iOS/Library/libdolphin.dylib
            ${{ runner.temp }}/dolphin-ios/Data/Sys
            ${{ runner.temp }}/dolphin-ios/Source/iOS/Library/NeoStationBridge.mm
            ${{ runner.temp }}/dolphin-ios/Source/iOS/Library/CMakeLists.txt
            ${{ runner.temp }}/dolphin-ios/Source/Core/Common/MemoryUtil_iOS_LuckTXM.cpp

      - name: Package original DolphiniOS touchscreen resources
        run: python3 packages/dolphin_internal_bridge/ci/materialize_touch_resources.py --source "$RUNNER_TEMP/dolphin-ios"

      - name: Exercise in-game menu and original touchscreen on iOS Simulator
        continue-on-error: true
        run: |
          set -euo pipefail
          env -u BUNDLE_GEMFILE -u BUNDLE_PATH ruby packages/dolphin_internal_bridge/ci/test_session_ui.rb \
            2>&1 | tee build/dolphin-ci/session-ui-tests.txt

      - name: Configure Flutter release and test helper idempotence
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --config-only --no-pub \
            --build-number="$BUILD_NUMBER" --dart-define-from-file=.dart-defines.json \
            2>&1 | tee build/dolphin-ci/flutter-configure.txt
          python3 packages/dolphin_internal_bridge/ci/build_support.py configure
          dart run flutter_launcher_icons
          bash build-utils/force_ios_fork_icon.sh
          env -u BUNDLE_GEMFILE -u BUNDLE_PATH pod install --project-directory=ios \
            2>&1 | tee build/dolphin-ci/pod-install.txt
          xcodebuild -list -workspace ios/Runner.xcworkspace 2>&1 | tee build/dolphin-ci/xcode-schemes.txt
          git diff --exit-code -- pubspec.yaml pubspec.lock

      - name: Compile NeoStation and Dolphin helper without signing
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DolphinDerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' PROVISIONING_PROFILE_SPECIFIER='' \
            COMPILER_INDEX_STORE_ENABLE=NO build \
            2>&1 | tee build/dolphin-ci/xcodebuild.txt

      - name: Audit actual Mach-O linkage and package the IPA
        run: |
          set -euo pipefail
          git diff --check
          python3 packages/dolphin_internal_bridge/ci/build_support.py package
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('dist/dolphin-build-report.json')
          report = json.loads(path.read_text())
          report['branch'] = os.environ['GITHUB_REF_NAME']
          path.write_text(json.dumps(report, indent=2) + '\n')
          PY

      - name: Upload unsigned IPA for sideload signing
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Save incremental compiler cache
        if: always() && steps.compile-core.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          key: dolphin-v3-ccache-xcode16.4-${{ github.run_id }}
          path: .dolphin-ccache

      - name: Remove temporary build secrets
        if: always()
        run: rm -f .dart-defines.json

      - name: Upload compilation diagnostics without secrets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-Diagnostics
          path: build/dolphin-ci/
          if-no-files-found: warn
          retention-days: 14

      - name: Purge non-main branches after validated main build
        if: success() && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          url = f'https://api.github.com/repos/{repo}/git/matching-refs/heads/'
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
              refs = json.load(response)
          for item in refs:
              ref = item.get('ref', '')
              if ref == 'refs/heads/main' or not ref.startswith('refs/heads/'):
                  continue
              short_ref = ref.removeprefix('refs/')
              endpoint = f'https://api.github.com/repos/{repo}/git/refs/{urllib.parse.quote(short_ref, safe="/")}'
              request = urllib.request.Request(endpoint, headers=headers, method='DELETE')
              with urllib.request.urlopen(request) as response:
                  if response.status != 204:
                      raise SystemExit(f'Failed to delete {ref}: HTTP {response.status}')
              print(f'Deleted {ref}')
          PY

      - name: Remove temporary validation workflow
        if: success() && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          path = '.github/workflows/pr117-ipa-build.yml'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          encoded = urllib.parse.quote(path, safe='/')
          url = f'https://api.github.com/repos/{repo}/contents/{encoded}?ref=main'
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
              current = json.load(response)
          payload = json.dumps({
              'message': 'ci: remove temporary validation workflow',
              'sha': current['sha'],
              'branch': 'main',
          }).encode()
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/contents/{encoded}',
              headers={**headers, 'Content-Type': 'application/json'},
              data=payload,
              method='DELETE',
          )
          with urllib.request.urlopen(request) as response:
              if response.status not in (200, 201):
                  raise SystemExit(f'Workflow deletion failed: HTTP {response.status}')
          print('Temporary workflow deleted from main')
          PY
