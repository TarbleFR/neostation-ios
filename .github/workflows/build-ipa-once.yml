name: NeoStation iOS Build 249
run-name: NeoStation iOS Build 249 (ISO integrity + God of War III + silent mode) • ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - fix/rpcs3-audio-session-build243

permissions:
  contents: read

concurrency:
  group: neostation-ios-build-249
  cancel-in-progress: true

jobs:
  build:
    name: Build NeoStation IPA
    runs-on: macos-15
    timeout-minutes: 240
    env:
      BUILD_NUMBER: '249'
      IPA_NAME: 'NeoStation-iOS-Build-249'
      ARTIFACT_NAME: 'NeoStation-iOS-Build-249'
      DOLPHIN_SHA: 7cac54161659421ed95c2cd1c0b0746539a4cd38
      STIKJIT_SHA: 640fac91de403fdb85a3778aa0bbb7f30737b74c
      HOMEBREW_NO_AUTO_UPDATE: '1'
      BUNDLE_GEMFILE: ${{ github.workspace }}/build-utils/Gemfile.dolphin
      CCACHE_DIR: ${{ github.workspace }}/.dolphin-ccache
      SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
      SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Apply Build 249 RPCS3 host and UI patches
        shell: bash
        run: |
          set -euo pipefail
          git apply --check build-utils/patches/rpcs3_build243_host.patch
          git apply build-utils/patches/rpcs3_build243_host.patch
          git apply --check build-utils/patches/rpcs3_build243_menu_transition.patch
          git apply build-utils/patches/rpcs3_build243_menu_transition.patch
          git apply --check build-utils/patches/rpcs3_build246_safe_controls.patch
          git apply build-utils/patches/rpcs3_build246_safe_controls.patch
          git apply --check build-utils/patches/rpcs3_build247_localization.patch
          git apply build-utils/patches/rpcs3_build247_localization.patch
          git apply --check build-utils/patches/grid_title_build243.patch
          git apply build-utils/patches/grid_title_build243.patch
          python3 test/rpcs3_ingame_ui_contract_test.py

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Verify RPCS3 input ABI and IPA validator before compiling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/rpcs3-ci
          CONTRACT_SRC="$RUNNER_TEMP/rpcs3-input-contract-source"
          mkdir -p "$CONTRACT_SRC/rpcs3/ios"
          curl -fL --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/XITRIX/rpcs3/22f1152783cef1f7e04af7b1c895173e28fd5b03/rpcs3/ios/RPCS3IOS.h \
            -o "$CONTRACT_SRC/rpcs3/ios/RPCS3IOS.h"
          test "$(git hash-object "$CONTRACT_SRC/rpcs3/ios/RPCS3IOS.h")" = 20526d090154733100d83fea27c20201db86c7f1
          python3 test/rpcs3_input_abi_test.py "$CONTRACT_SRC" 2>&1 | tee build/rpcs3-ci/input-abi.log
          python3 test/rpcs3_input_bridge_test.py 2>&1 | tee build/rpcs3-ci/input-routing.log
          python3 test/rpcs3_ipa_validation_test.py 2>&1 | tee build/rpcs3-ci/ipa-validator.log
          python3 test/rpcs3_ingame_ui_contract_test.py 2>&1 | tee build/rpcs3-ci/ingame-ui.log

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Prepare build tools
        shell: bash
        run: |
          set -euo pipefail
          export BUNDLE_PATH="$RUNNER_TEMP/dolphin-ruby-gems"
          echo "BUNDLE_PATH=$BUNDLE_PATH" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$RUNNER_TEMP/dolphin-ios" >> "$GITHUB_ENV"
          mkdir -p build/dolphin-ci
          bundle install
          command -v cmake >/dev/null || brew install cmake
          command -v ninja >/dev/null || brew install ninja
          command -v ccache >/dev/null || brew install ccache
          brew list llvm@22 >/dev/null 2>&1 || brew install llvm@22
          ccache --max-size=3G

      - name: Prepare emulator build definitions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          required = ('SCREENSCRAPER_DEV_ID', 'SCREENSCRAPER_DEV_PASSWORD')
          values = {key: os.environ.get(key, '').strip() for key in required}
          missing = [key for key, value in values.items() if not value]
          if missing:
              raise SystemExit('Missing build secrets: ' + ', '.join(missing))
          values.update({
              'NEOSTATION_EXPERIMENTAL_STIKJIT_MELONX': 'true',
              'NEOSTATION_MELONX_BUNDLE_ID': 'com.nur.nx',
              'NEOSTATION_EXPERIMENTAL_STIKJIT_ARMSX2': 'true',
              'NEOSTATION_ARMSX2_BUNDLE_ID': 'xyz.aethersx2.AetherSX2',
          })
          Path('.dart-defines.json').write_text(json.dumps(values))
          PY

      - name: Build patched StikJIT 1.5.0
        shell: bash
        run: |
          set -euo pipefail
          STIK_SRC="$RUNNER_TEMP/StikJIT-1.5.0"
          STIK_XCFRAMEWORK="$RUNNER_TEMP/StikJIT.xcframework"
          rm -rf "$STIK_SRC" "$STIK_XCFRAMEWORK"
          git init -q "$STIK_SRC"
          git -C "$STIK_SRC" remote add origin https://github.com/StikDebug/StikJIT.git
          git -C "$STIK_SRC" fetch --depth 1 origin "$STIKJIT_SHA"
          git -C "$STIK_SRC" checkout -q --detach FETCH_HEAD
          test "$(git -C "$STIK_SRC" rev-parse HEAD)" = "$STIKJIT_SHA"

          python3 build-utils/patch_stikjit_rpcs3.py "$STIK_SRC"
          python3 build-utils/patch_stikjit_rpcs3.py "$STIK_SRC"
          python3 test/stikjit_rpcs3_patch_test.py "$STIK_SRC"
          python3 -m py_compile build-utils/patch_stikjit_rpcs3.py build-utils/install_patched_stikjit.py

          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          pushd "$STIK_SRC" >/dev/null
          xcodegen generate
          xcodebuild archive \
            -project StikJIT.xcodeproj \
            -scheme StikJIT \
            -destination 'generic/platform=iOS' \
            -archivePath build/StikJIT-iOS \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            CODE_SIGNING_ALLOWED=NO
          xcodebuild -create-xcframework \
            -framework build/StikJIT-iOS.xcarchive/Products/Library/Frameworks/StikJIT.framework \
            -output "$STIK_XCFRAMEWORK"
          popd >/dev/null

          python3 build-utils/install_patched_stikjit.py "$STIK_XCFRAMEWORK"
          STIK_BIN="packages/stikjit_bridge/ios/Frameworks/StikJIT.xcframework/ios-arm64/StikJIT.framework/StikJIT"
          STIK_STRINGS="$RUNNER_TEMP/stikjit-build246.strings"
          strings "$STIK_BIN" > "$STIK_STRINGS"
          grep -q 'NEOSTATION_STIKJIT_RPCS3_V1' "$STIK_STRINGS"
          find packages/stikjit_bridge/ios/Frameworks/StikJIT.xcframework/ios-arm64/StikJIT.framework \
            -name universal.js -print -exec grep -q 'NEOSTATION_STIKJIT_UNIVERSAL_V1' {} \;

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          key: neostation-ios-ccache-xcode16.4-${{ github.run_id }}
          restore-keys: |
            neostation-ios-ccache-xcode16.4-
            dolphin-v3-ccache-xcode16.4-
          path: .dolphin-ccache

      - name: Build patched RPCS3 iOS Core
        shell: bash
        run: |
          set -euo pipefail
          bash build-utils/build_rpcs3_embedded_core.sh 2>&1 | tee "$RUNNER_TEMP/rpcs3-core-build.log"
          python3 test/rpcs3_input_abi_test.py "$RUNNER_TEMP/neostation-rpcs3-embedded/rpcs3" 2>&1 | tee build/rpcs3-ci/built-core-input-abi.log
          BUILT_CORE=build/rpcs3-embedded-core/libRPCS3Core.dylib
          CORE=packages/rpcs3_internal_bridge/ios/Frameworks/libRPCS3Core.dylib
          test -s "$BUILT_CORE"
          mkdir -p "$(dirname "$CORE")"
          cp -f "$BUILT_CORE" "$CORE"
          chmod 0755 "$CORE"
          nm -g "$CORE" > build/rpcs3-embedded-core/symbols.txt
          for symbol in \
            _rpcs3_ios_run_llvm_self_test \
            _rpcs3_ios_update_config_database \
            _rpcs3_ios_set_game_setting \
            _rpcs3_ios_get_performance_metrics \
            _neostation_rpcs3_ios_save_state \
            _neostation_rpcs3_ios_enumerate_savestates_live \
            _rpcs3_ios_get_boot_progress \
            _rpcs3_ios_set_pad_state \
            _rpcs3_ios_stop_emulation \
            _rpcs3_ios_delete_game; do
            grep -q " $symbol$" build/rpcs3-embedded-core/symbols.txt || {
              echo "Required RPCS3 symbol missing: $symbol" >&2
              exit 1
            }
          done
          python3 build-utils/validate_rpcs3_embedded_core.py "$CORE"
          shasum -a 256 "$CORE"

      - name: Analyze and test
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter analyze --no-fatal-infos
          flutter test --no-pub
          python3 test/rpcs3_jit_handshake_test.py
          python3 test/rpcs3_memory_preflight_test.py
          python3 test/rpcs3_host_entitlements_test.py
          python3 test/rpcs3_input_bridge_test.py
          python3 test/rpcs3_ingame_ui_contract_test.py
          python3 -m py_compile test/rpcs3_jit_memory_test.py test/stikjit_rpcs3_patch_test.py test/rpcs3_input_bridge_test.py test/rpcs3_input_abi_test.py test/rpcs3_neostation_session_patch_test.py test/rpcs3_serial_profile_patch_test.py test/rpcs3_iso_integrity_patch_test.py test/rpcs3_ingame_ui_contract_test.py build-utils/patch_rpcs3_neostation_session.py build-utils/patch_rpcs3_serial_profiles.py build-utils/patch_rpcs3_iso_integrity.py build-utils/validate_rpcs3_ipa.py
          git diff --exit-code -- pubspec.yaml pubspec.lock

      - name: Generate iOS host
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-enable-swift-package-manager
          python3 packages/dolphin_internal_bridge/ci/build_support.py scaffold

      - name: Restore pinned Dolphin build product
        id: core-cache
        uses: actions/cache/restore@v4
        with:
          key: dolphin-v3-ios-arm64-xcode16.4-7cac5416-${{ hashFiles('build-utils/patch_dolphin_internal_core_v2.py', 'packages/dolphin_internal_bridge/core/**') }}
          path: |
            ${{ runner.temp }}/dolphin-ios/build-iphoneos-Release/Source/iOS/Library/libdolphin.dylib
            ${{ runner.temp }}/dolphin-ios/Data/Sys
            ${{ runner.temp }}/dolphin-ios/Source/iOS/Library/NeoStationBridge.mm
            ${{ runner.temp }}/dolphin-ios/Source/iOS/Library/CMakeLists.txt
            ${{ runner.temp }}/dolphin-ios/Source/Core/Common/MemoryUtil_iOS_LuckTXM.cpp

      - name: Compile pinned Dolphin core
        id: compile-core
        if: steps.core-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/dolphin-ios"
          rm -rf "$SRC"
          git init "$SRC"
          git -C "$SRC" remote add origin https://github.com/OatmealDome/dolphin-ios.git
          git -C "$SRC" fetch --depth 1 origin "$DOLPHIN_SHA"
          git -C "$SRC" checkout --detach FETCH_HEAD
          git -C "$SRC" submodule update --init --recursive --depth 1
          test "$(git -C "$SRC" rev-parse HEAD)" = "$DOLPHIN_SHA"
          python3 build-utils/patch_dolphin_internal_core_v2.py "$SRC"
          cmake -S "$SRC" -B "$SRC/build-iphoneos-Release" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$SRC/Externals/ios-cmake/ios.toolchain.cmake" \
            -DPLATFORM=OS64 -DDEPLOYMENT_TARGET=17.4 -DENABLE_VISIBILITY=ON \
            -DENABLE_BITCODE=OFF -DENABLE_ARC=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS=-fPIC -DIOS=ON -DENABLE_ANALYTICS=NO \
            -DUSE_SYSTEM_LIBS=OFF -DENABLE_TESTS=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache
          cmake --build "$SRC/build-iphoneos-Release" --target dolphin --parallel 3

      - name: Prepare Dolphin framework
        id: framework
        shell: bash
        run: |
          set -euo pipefail
          python3 packages/dolphin_internal_bridge/ci/build_support.py framework "$RUNNER_TEMP/dolphin-ios"

      - name: Save pinned Dolphin core
        if: steps.core-cache.outputs.cache-hit != 'true' && steps.framework.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          key: dolphin-v3-ios-arm64-xcode16.4-7cac5416-${{ hashFiles('build-utils/patch_dolphin_internal_core_v2.py', 'packages/dolphin_internal_bridge/core/**') }}
          path: |
            ${{ runner.temp }}/dolphin-ios/build-iphoneos-Release/Source/iOS/Library/libdolphin.dylib
            ${{ runner.temp }}/dolphin-ios/Data/Sys
            ${{ runner.temp }}/dolphin-ios/Source/iOS/Library/NeoStationBridge.mm
            ${{ runner.temp }}/dolphin-ios/Source/iOS/Library/CMakeLists.txt
            ${{ runner.temp }}/dolphin-ios/Source/Core/Common/MemoryUtil_iOS_LuckTXM.cpp

      - name: Package DolphiniOS touchscreen resources
        shell: bash
        run: python3 packages/dolphin_internal_bridge/ci/materialize_touch_resources.py --source "$RUNNER_TEMP/dolphin-ios"

      - name: Configure Flutter release
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --config-only --no-pub \
            --build-number="$BUILD_NUMBER" --dart-define-from-file=.dart-defines.json
          python3 packages/dolphin_internal_bridge/ci/build_support.py configure
          python3 build-utils/configure_rpcs3_ios_v2.py
          dart run flutter_launcher_icons
          bash build-utils/force_ios_fork_icon.sh
          env -u BUNDLE_GEMFILE -u BUNDLE_PATH pod install --project-directory=ios
          xcodebuild -list -workspace ios/Runner.xcworkspace
          git diff --exit-code -- pubspec.yaml pubspec.lock

      - name: Compile unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DolphinDerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' PROVISIONING_PROFILE_SPECIFIER='' \
            COMPILER_INDEX_STORE_ENABLE=NO build 2>&1 | tee "$RUNNER_TEMP/neostation-xcodebuild.log"

      - name: Embed patched RPCS3 Core
        shell: bash
        run: |
          set -euo pipefail
          python3 build-utils/embed_rpcs3_core_lazy.py

      - name: Embed RPCS3 entitlements in Runner for sideloading
        shell: bash
        run: python3 build-utils/embed_rpcs3_host_entitlements.py

      - name: Package and validate IPA
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 packages/dolphin_internal_bridge/ci/build_support.py package 2>&1 | tee build/rpcs3-ci/package.log
          python3 build-utils/validate_rpcs3_ipa.py --build-number "$BUILD_NUMBER" --commit "$GITHUB_SHA" 2>&1 | tee build/rpcs3-ci/validation.log
          shasum -a 256 dist/*.ipa | tee "dist/$IPA_NAME.sha256"
          ls -lah dist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Collect compact build diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p build/rpcs3-ci
          for file in rpcs3-core-build.log neostation-xcodebuild.log; do
            if [ -f "$RUNNER_TEMP/$file" ]; then
              tail -n 400 "$RUNNER_TEMP/$file" > "build/rpcs3-ci/$file"
            fi
          done
          printf 'commit=%s\nbuild=%s\n' "$GITHUB_SHA" "$BUILD_NUMBER" > build/rpcs3-ci/build.txt

      - name: Upload compact build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-diagnostics
          path: build/rpcs3-ci/
          if-no-files-found: warn
          retention-days: 7

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          key: neostation-ios-ccache-xcode16.4-${{ github.run_id }}
          path: .dolphin-ccache

      - name: Remove temporary build secrets
        if: always()
        shell: bash
        run: rm -f .dart-defines.json
