name: NeoStation Build 265 source audit
run-name: Build 265 source audit • ${{ github.sha }}
on:
  workflow_dispatch:
  push:
    branches: [experimental]
permissions:
  contents: read
concurrency:
  group: neostation-ios-build-264
  cancel-in-progress: true
jobs:
  sources:
    name: Prepare exact sources for regression fixes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export Build 264 and pinned RPCS3 sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-audit
          git archive --format=tar.gz ec0373de3abb16de1815e47d0a7b406715a1eca0 > source-audit/neostation-264.tar.gz
          git init -q "$RUNNER_TEMP/rpcs3-audit"
          git -C "$RUNNER_TEMP/rpcs3-audit" remote add origin https://github.com/XITRIX/rpcs3.git
          git -C "$RUNNER_TEMP/rpcs3-audit" fetch --depth 1 origin 22f1152783cef1f7e04af7b1c895173e28fd5b03
          git -C "$RUNNER_TEMP/rpcs3-audit" archive --format=tar.gz FETCH_HEAD > source-audit/rpcs3-pinned.tar.gz
          sha256sum source-audit/*.tar.gz > source-audit/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Build-265-pinned-source-audit
          path: source-audit/
          retention-days: 2
          if-no-files-found: error
          compression-level: 0
