name: NeoStation Build 265 source integration
run-name: Integrate Build 265 sources • ${{ github.sha }}
on:
  workflow_dispatch:
  push:
    branches: [experimental]
permissions:
  contents: write
concurrency:
  group: neostation-ios-build-265-integration
  cancel-in-progress: true
jobs:
  integrate:
    name: Commit narrowly scoped Build 265 source changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experimental
          fetch-depth: 0
      - name: Integrate and verify tracked sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 build-utils/integrate_build265.py
          python3 build-utils/integrate_build265.py
          python3 test/theme_importer_retirement_test.py
          python3 test/rpcs3_build265_host_test.py
          git diff --check
          git add -- THEMES.md lib/l10n/app_locale*.dart lib/main.dart lib/providers/theme_provider.dart lib/screens/settings_screen/new_settings_options/themes_settings_content.dart lib/services/custom_theme_service.dart lib/themes/app_themes.dart lib/themes/custom_theme.dart lib/widgets/theme_card.dart test/custom_theme_test.dart build-utils/build_rpcs3_embedded_core.sh packages/rpcs3_internal_bridge/ios/Classes/Rpcs3InternalBridgePlugin.mm
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: retire theme importer and wire Build 265 RPCS3 core improvements'
            git push origin HEAD:experimental
          fi
          git show --stat --oneline HEAD
