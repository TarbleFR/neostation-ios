name: NeoStation iOS Build 218
run-name: NeoStation iOS Build 218 • ${{ github.sha }}

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-ipa-once.yml

permissions:
  contents: read

concurrency:
  group: neostation-ios-build-218
  cancel-in-progress: true

jobs:
  build:
    name: Build NeoStation IPA
    runs-on: macos-15
    timeout-minutes: 180
    env:
      BUILD_NUMBER: '218'
      IPA_NAME: 'NeoStation-iOS-Build-218'
      ARTIFACT_NAME: 'NeoStation-iOS-Build-218'
      DOLPHIN_SHA: 7cac54161659421ed95c2cd1c0b0746539a4cd38
      HOMEBREW_NO_AUTO_UPDATE: '1'
      BUNDLE_GEMFILE: ${{ github.workspace }}/build-utils/Gemfile.dolphin
      CCACHE_DIR: ${{ github.workspace }}/.dolphin-ccache
      SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
      SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify cleaned source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          forbidden = ('Neo' + 'Sync', ('Neo' + 'Sync').lower(), 'neo' + '_sync')
          violations = []
          for root_name in ('lib', 'assets', 'test'):
              root = Path(root_name)
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file():
                      continue
                  rel = path.as_posix()
                  if any(token in rel for token in forbidden):
                      violations.append(rel)
                      continue
                  try:
                      text = path.read_text()
                  except UnicodeDecodeError:
                      continue
                  if any(token in text for token in forbidden):
                      violations.append(rel)
          if violations:
              raise SystemExit('Retired sync remnants: ' + ', '.join(sorted(set(violations))[:50]))
          PY

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Prepare build tools
        run: |
          set -euo pipefail
          export BUNDLE_PATH="$RUNNER_TEMP/dolphin-ruby-gems"
          echo "BUNDLE_PATH=$BUNDLE_PATH" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$RUNNER_TEMP/dolphin-ios" >> "$GITHUB_ENV"
          mkdir -p build/dolphin-ci
          bundle install
          command -v cmake >/dev/null || brew install cmake
          command -v ninja >/dev/null || brew install ninja
          command -v ccache >/dev/null || brew install ccache
          ccache --max-size=2G

      - name: Prepare emulator build definitions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          required = ('SCREENSCRAPER_DEV_ID', 'SCREENSCRAPER_DEV_PASSWORD')
          values = {key: os.environ.get(key, '').strip() for key in required}
          missing = [key for key, value in values.items() if not value]
          if missing:
              raise SystemExit('Missing build secrets: ' + ', '.join(missing))
          values.update({
              'NEOSTATION_EXPERIMENTAL_STIKJIT_MELONX': 'true',
              'NEOSTATION_MELONX_BUNDLE_ID': 'com.nur.nx',
              'NEOSTATION_EXPERIMENTAL_STIKJIT_ARMSX2': 'true',
              'NEOSTATION_ARMSX2_BUNDLE_ID': 'xyz.aethersx2.AetherSX2',
          })
          Path('.dart-defines.json').write_text(json.dumps(values))
          PY

      - name: Restore StikJIT 1.5.0
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://github.com/StikDebug/StikJIT/releases/download/1.5.0/StikJIT.xcframework.zip' -o "$RUNNER_TEMP/StikJIT.xcframework.zip"
          python3 packages/dolphin_internal_bridge/ci/build_support.py stik "$RUNNER_TEMP/StikJIT.xcframework.zip"

      - name: Materialize verified RPCS3 Core
        run: |
          set -euo pipefail
          python3 build-utils/materialize_rpcs3_internal.py core
          test -s packages/rpcs3_internal_bridge/ios/Frameworks/libRPCS3Core.dylib

      - name: Analyze and test
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter analyze --no-fatal-infos
          flutter test --no-pub
          git diff --exit-code -- pubspec.yaml pubspec.lock

      - name: Generate iOS host
        run: |
          set -euo pipefail
          flutter config --no-enable-swift-package-manager
          python3 packages/dolphin_internal_bridge/ci/build_support.py scaffold

      - name: Restore pinned Dolphin build product
        id: core-cache
        uses: actions/cache/restore@v4
        with:
          key: dolphin-v3-ios-arm64-xcode16.4-7cac5416-${{ hashFiles('build-utils/patch_dolphin_internal_core_v2.py', 'packages/dolphin_internal_bridge/core/**') }}
          path: |
            ${{ runner.temp }}/dolphin-ios/build-iphoneos-Release/Source/iOS/Library/libdolphin.dylib
            ${{ runner.temp }}/dolphin-ios/Data/Sys
            ${{ runner.temp }}/dolphin-ios/Source/iOS/Library/NeoStationBridge.mm
            ${{ runner.temp }}/dolphin-ios/Source/iOS/Library/CMakeLists.txt
            ${{ runner.temp }}/dolphin-ios/Source/Core/Common/MemoryUtil_iOS_LuckTXM.cpp

      - name: Restore compiler cache
        if: steps.core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          key: dolphin-v3-ccache-xcode16.4-${{ github.run_id }}
          restore-keys: dolphin-v3-ccache-xcode16.4-
          path: .dolphin-ccache

      - name: Compile pinned Dolphin core
        id: compile-core
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/dolphin-ios"
          rm -rf "$SRC"
          git init "$SRC"
          git -C "$SRC" remote add origin https://github.com/OatmealDome/dolphin-ios.git
          git -C "$SRC" fetch --depth 1 origin "$DOLPHIN_SHA"
          git -C "$SRC" checkout --detach FETCH_HEAD
          git -C "$SRC" submodule update --init --recursive --depth 1
          test "$(git -C "$SRC" rev-parse HEAD)" = "$DOLPHIN_SHA"
          python3 build-utils/patch_dolphin_internal_core_v2.py "$SRC"
          cmake -S "$SRC" -B "$SRC/build-iphoneos-Release" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$SRC/Externals/ios-cmake/ios.toolchain.cmake" \
            -DPLATFORM=OS64 -DDEPLOYMENT_TARGET=17.4 -DENABLE_VISIBILITY=ON \
            -DENABLE_BITCODE=OFF -DENABLE_ARC=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS=-fPIC -DIOS=ON -DENABLE_ANALYTICS=NO \
            -DUSE_SYSTEM_LIBS=OFF -DENABLE_TESTS=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache
          cmake --build "$SRC/build-iphoneos-Release" --target dolphin --parallel 3

      - name: Prepare Dolphin framework
        id: framework
        run: |
          set -euo pipefail
          python3 packages/dolphin_internal_bridge/ci/build_support.py framework "$RUNNER_TEMP/dolphin-ios"

      - name: Save pinned Dolphin core
        if: steps.core-cache.outputs.cache-hit != 'true' && steps.framework.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          key: dolphin-v3-ios-arm64-xcode16.4-7cac5416-${{ hashFiles('build-utils/patch_dolphin_internal_core_v2.py', 'packages/dolphin_internal_bridge/core/**') }}
          path: |
            ${{ runner.temp }}/dolphin-ios/build-iphoneos-Release/Source/iOS/Library/libdolphin.dylib
            ${{ runner.temp }}/dolphin-ios/Data/Sys
            ${{ runner.temp }}/dolphin-ios/Source/iOS/Library/NeoStationBridge.mm
            ${{ runner.temp }}/dolphin-ios/Source/iOS/Library/CMakeLists.txt
            ${{ runner.temp }}/dolphin-ios/Source/Core/Common/MemoryUtil_iOS_LuckTXM.cpp

      - name: Package DolphiniOS touchscreen resources
        run: python3 packages/dolphin_internal_bridge/ci/materialize_touch_resources.py --source "$RUNNER_TEMP/dolphin-ios"

      - name: Configure Flutter release
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --config-only --no-pub \
            --build-number="$BUILD_NUMBER" --dart-define-from-file=.dart-defines.json
          python3 packages/dolphin_internal_bridge/ci/build_support.py configure
          python3 build-utils/configure_rpcs3_ios_v2.py
          dart run flutter_launcher_icons
          bash build-utils/force_ios_fork_icon.sh
          env -u BUNDLE_GEMFILE -u BUNDLE_PATH pod install --project-directory=ios
          xcodebuild -list -workspace ios/Runner.xcworkspace
          git diff --exit-code -- pubspec.yaml pubspec.lock

      - name: Compile unsigned iOS app
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DolphinDerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' PROVISIONING_PROFILE_SPECIFIER='' \
            COMPILER_INDEX_STORE_ENABLE=NO build

      - name: Embed dormant RPCS3 Core
        run: |
          set -euo pipefail
          python3 build-utils/embed_rpcs3_core_lazy.py

      - name: Package IPA
        run: |
          set -euo pipefail
          git diff --check
          python3 packages/dolphin_internal_bridge/ci/build_support.py package
          python3 - <<'PY'
          import glob
          import plistlib
          import zipfile
          from pathlib import Path

          matches = sorted(glob.glob('dist/*.ipa'))
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one IPA, found {matches}')
          ipa = Path(matches[0])
          with zipfile.ZipFile(ipa) as archive:
              names = archive.namelist()
              cores = [name for name in names if name.endswith('/Frameworks/libRPCS3Core.dylib')]
              helpers = [name for name in names if '/PlugIns/RPCS3JITHelper.appex/' in name]
              if len(cores) != 1:
                  raise SystemExit(f'Embedded RPCS3 Core missing or duplicated: {cores}')
              if archive.getinfo(cores[0]).file_size < 60_000_000:
                  raise SystemExit('Embedded RPCS3 Core is unexpectedly small')
              if not helpers:
                  raise SystemExit('Embedded RPCS3 JIT helper extension is missing')

          entitlements = Path('dist/NeoStation-signing.entitlements')
          payload = plistlib.loads(entitlements.read_bytes())
          forbidden = (
              'get-task-allow',
              'com.apple.developer.kernel.extended-virtual-addressing',
              'com.apple.developer.kernel.increased-memory-limit',
              'com.apple.developer.kernel.increased-debugging-memory-limit',
          )
          present = [key for key in forbidden if key in payload]
          if present:
              raise SystemExit(
                  'Build 218 must not force user-specific entitlements: ' + ', '.join(present)
              )
          print(f'RPCS3 lazy IPA validation passed: {cores[0]} + RPCS3JITHelper; neutral entitlements')
          PY
          ls -lah dist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Save compiler cache
        if: always() && steps.compile-core.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          key: dolphin-v3-ccache-xcode16.4-${{ github.run_id }}
          path: .dolphin-ccache

      - name: Remove temporary build secrets
        if: always()
        run: rm -f .dart-defines.json
