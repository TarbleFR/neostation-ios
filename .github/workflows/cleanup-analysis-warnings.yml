name: Clean Canonical Analysis Warnings

on:
  push:
    branches:
      - cleanup/canonical
    paths:
      - '.github/workflows/cleanup-analysis-warnings.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/canonical
          fetch-depth: 0

      - name: Apply warning cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new, label, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{label}: anchor missing in {path}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          replace(
              'lib/providers/file_provider.dart',
              '        return directory.list().toList();',
              '        return await directory.list().toList();',
              'file-provider awaited directory listing',
          )
          replace(
              'lib/services/game/game_list_service.dart',
              '        return _loadFavoriteGames();',
              '        return await _loadFavoriteGames();',
              'game-list awaited favorites',
          )
          replace(
              'lib/services/neo_assets_service.dart',
              '      return Future.wait(\n        baseList.map((theme) async {',
              '      return await Future.wait(\n        baseList.map((theme) async {',
              'neo-assets awaited enrichment',
          )
          replace(
              'lib/services/retroarch_library_service.dart',
              "import 'package:external_folder_access/external_folder_access.dart';\n",
              '',
              'RetroArch unused external-folder import',
          )
          replace(
              'lib/l10n/rpcs3_library_locale.dart',
              "import 'package:flutter/foundation.dart';\n",
              '',
              'RPCS3 locale redundant foundation import',
          )
          replace(
              'lib/services/screenscraper_service.dart',
              "import 'package:flutter/foundation.dart';\n",
              '',
              'ScreenScraper redundant foundation import',
          )

          # The payload validator is used by production fallback code as well as tests.
          media = Path('lib/services/screenscraper/media_downloader.dart')
          text = media.read_text(encoding='utf-8')
          text = text.replace("import 'package:flutter/foundation.dart';\n", '')
          text = text.replace(
              '  @visibleForTesting\n  static bool isValidMediaPayload(',
              '  static bool isValidMediaPayload(',
              1,
          )
          media.write_text(text, encoding='utf-8')

          # Remove three unreachable library-control helpers flagged by the analyzer.
          library = Path('lib/screens/library_screen/library_screen.dart')
          text = library.read_text(encoding='utf-8')
          pattern = re.compile(
              r"\n  void _cycleLanguageFilter\(\) \{.*?\n  \}\n\n"
              r"  void _toggleAlphabeticalSort\(\) \{.*?\n  \}\n\n"
              r"  void _jumpToNextLetter\(\) \{.*?\n  \}\n(?=\n  String _firstLetter)",
              re.S,
          )
          text, n = pattern.subn('\n', text, count=1)
          if n != 1:
              raise SystemExit('library dead helper block not found')
          library.write_text(text, encoding='utf-8')

          # RPCS3 title lookup is a real production API. Keep the test wrapper but
          # route production code through an unannotated method.
          catalog = Path('lib/services/rpcs3_title_catalog_service.dart')
          text = catalog.read_text(encoding='utf-8')
          old = """  @visibleForTesting\n  static String? resolveFromCatalogForTesting(\n    String titleId,\n    Map<String, String> catalog,\n  ) {\n    final normalized = normalizeTitleId(titleId);\n    final title = catalog[normalized]?.trim();\n    return title == null || title.isEmpty ? null : title;\n  }\n"""
          new = """  static String? resolveFromCatalog(\n    String titleId,\n    Map<String, String> catalog,\n  ) {\n    final normalized = normalizeTitleId(titleId);\n    final title = catalog[normalized]?.trim();\n    return title == null || title.isEmpty ? null : title;\n  }\n\n  @visibleForTesting\n  static String? resolveFromCatalogForTesting(\n    String titleId,\n    Map<String, String> catalog,\n  ) => resolveFromCatalog(titleId, catalog);\n"""
          if old not in text:
              raise SystemExit('RPCS3 title resolver anchor missing')
          text = text.replace(old, new, 1)
          text = text.replace(
              '    return resolveFromCatalogForTesting(titleId, catalog);',
              '    return resolveFromCatalog(titleId, catalog);',
              1,
          )
          catalog.write_text(text, encoding='utf-8')

          rpcs3 = Path('lib/services/rpcs3_library_service.dart')
          text = rpcs3.read_text(encoding='utf-8')
          text = text.replace("import 'dart:typed_data';\n", '', 1)
          text = text.replace(
              'Rpcs3TitleCatalogService.resolveFromCatalogForTesting(',
              'Rpcs3TitleCatalogService.resolveFromCatalog(',
          )
          text = text.replace(
              '    final safeLimit = limit.clamp(start, bytes.length) as int;',
              '    final safeLimit = limit.clamp(start, bytes.length);',
              1,
          )
          pattern = re.compile(
              r"\n  static Future<String\?> _findEntityByBasename\(.*?\n    return walk\(root, 0\);\n  \}\n",
              re.S,
          )
          text, n = pattern.subn('\n', text, count=1)
          if n != 1:
              raise SystemExit('RPCS3 unused basename finder not found')
          rpcs3.write_text(text, encoding='utf-8')

          for file in [
              'lib/providers/file_provider.dart',
              'lib/services/game/game_list_service.dart',
              'lib/services/neo_assets_service.dart',
              'lib/services/retroarch_library_service.dart',
              'lib/l10n/rpcs3_library_locale.dart',
              'lib/services/screenscraper_service.dart',
              'lib/services/screenscraper/media_downloader.dart',
              'lib/screens/library_screen/library_screen.dart',
              'lib/services/rpcs3_title_catalog_service.dart',
              'lib/services/rpcs3_library_service.dart',
          ]:
              if not Path(file).exists():
                  raise SystemExit(f'missing cleaned file: {file}')
          PY
          git diff --check
          rm -f .github/workflows/cleanup-analysis-warnings.yml

      - name: Commit warning cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NeoStation CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove dead code and analyzer warnings'
          git push origin HEAD:cleanup/canonical
