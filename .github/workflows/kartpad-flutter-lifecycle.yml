name: KartPad real Flutter and SDL lifecycle
# Every IPA candidate needs this evidence at its exact commit; other pushes
# are skipped unless they touch KartPad (tagged commits).
on:
  workflow_dispatch:
  push:
    branches: [experimental]
permissions:
  contents: read
  actions: read
jobs:
  flutter-sdl:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[neoswap-ipa]') || contains(github.event.head_commit.message, '[kartpad') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            ios: iOS-18
          - runner: xcode-27
            ios: iOS-27
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      PROBE_IOS: ${{ matrix.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        if: matrix.runner == 'macos-15'
        with:
          xcode-version: '16.4'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      # The KartPadCore-3934ac9d run (36322395443) was purged on 7 October 2026
      # and its official KartPad source IPA is no longer published. The
      # published NeoStation 0.0.1 IPA embeds that exact artifact; restore it
      # with every byte checked against the pinned identity.
      - name: Restore the pinned KartPad donor Core
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p evidence "$RUNNER_TEMP/kartpad-donor-ipa"
          gh release download 0.0.1 --repo "$GITHUB_REPOSITORY" --pattern NeoStation.ipa --dir "$RUNNER_TEMP/kartpad-donor-ipa"
          python3 build-utils/restore_kartpad_donor_from_ipa.py "$RUNNER_TEMP/kartpad-donor-ipa/NeoStation.ipa" donor > evidence/donor-restore.json
          test -f donor/identity.json
          python3 build-utils/kartpad/validate_donor_artifact.py donor > evidence/donor-validation.json
          cp donor/identity.json evidence/donor-identity.json
          python3 - <<'PY'
          import json
          assert json.load(open('donor/identity.json'))['host_commit']=='3934ac9d333247d5374b9fb7d71f8ef49bbcd79e'
          PY
      - name: Build real Flutter host probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source.txt
          flutter create --platforms=ios --org com.neostation --project-name kartpad_host_probe "$RUNNER_TEMP/flutter-probe"
          PROBE="$RUNNER_TEMP/flutter-probe"
          cp test/kartpad_flutter_probe.dart "$PROBE/lib/main.dart"
          cp test/kartpad_flutter_probe.mm "$PROBE/ios/Runner/ProbePlugin.mm"
          mkdir -p "$PROBE/ios/MenuProbe"
          cp test/kartpad_menu_probe.swift "$PROBE/ios/MenuProbe/"
          cp packages/kartpad_internal_bridge/ios/Classes/KartPadHostWindow*.h "$PROBE/ios/Runner/"
          cp packages/kartpad_internal_bridge/ios/Classes/KartPadHostWindowAwaiter.mm "$PROBE/ios/Runner/"
          cp native/kartpad/core/SessionRunLoop.h "$PROBE/ios/Runner/"
          cp native/kartpad/core/UIKitEventPump.h "$PROBE/ios/Runner/"
          curl -fL --retry 3 https://raw.githubusercontent.com/chrissotraidis/wiicompiled/d0b8dec62a8c98dd45736a996ae18327ada8fe3f/aurora-main/include/aurora/aurora.h -o "$PROBE/ios/Runner/aurora-probe-api.h"
          echo "3959cc80683a3f674353a77b452219fc7276a2b55b96d5f42e90f5043f12908d  $PROBE/ios/Runner/aurora-probe-api.h" | shasum -a 256 -c -
          python3 - "$PROBE" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])/'ios/Runner'
          header=root/'Runner-Bridging-Header.h'
          header.write_text(header.read_text()+'\n#import <Flutter/Flutter.h>\n@interface ProbePlugin : NSObject <FlutterPlugin>\n@end\n')
          app=root/'AppDelegate.swift'
          text=app.read_text()
          marker='GeneratedPluginRegistrant.register(with: engineBridge.pluginRegistry)'
          assert marker in text, text
          app.write_text(text.replace(marker,marker+'\n    ProbePlugin.register(with: engineBridge.pluginRegistry.registrar(forPlugin: "ProbePlugin")!)'))
          PY
          ruby - "$PROBE" <<'RUBY'
          require 'xcodeproj'
          project=Xcodeproj::Project.open(File.join(ARGV[0],'ios/Runner.xcodeproj'))
          group=project.main_group['Runner']
          ref=group.new_file('ProbePlugin.mm')
          target=project.targets.find {|t| t.name=='Runner'}
          target.source_build_phase.add_file_reference(ref)
          target.source_build_phase.add_file_reference(group.new_file('KartPadHostWindowAwaiter.mm'))
          target.build_configurations.each {|c| c.build_settings['CLANG_CXX_LANGUAGE_STANDARD']='c++20'}
          phase=target.new_shell_script_build_phase('Embed simulator donor fixture')
          phase.shell_script='python3 "$GITHUB_WORKSPACE/test/embed_kartpad_probe.py"'
          phase.always_out_of_date='1'
          ui=project.new_target(:ui_test_bundle,'MenuProbe',:ios,'17.4')
          ui.add_dependency(target)
          ui_group=project.main_group.new_group('MenuProbe','MenuProbe')
          ui.source_build_phase.add_file_reference(ui_group.new_file('kartpad_menu_probe.swift'))
          ui.build_configurations.each do |c|
            c.build_settings['TEST_TARGET_NAME']='Runner'
            c.build_settings['PRODUCT_NAME']='MenuProbe'
            c.build_settings['PRODUCT_BUNDLE_IDENTIFIER']='com.neostation.kartpadMenuProbe'
            c.build_settings['GENERATE_INFOPLIST_FILE']='YES'
            c.build_settings['SWIFT_VERSION']='5.0'
            c.build_settings['TARGETED_DEVICE_FAMILY']='1,2'
          end
          project.root_object.attributes['TargetAttributes'][ui.uuid]={'TestTargetID'=>target.uuid}
          scheme=Xcodeproj::XCScheme.new
          scheme.add_build_target(target)
          scheme.add_build_target(ui)
          scheme.add_test_target(ui)
          # The pinned official KartPad runtime queries SDL/UIKit window size from
          # Aurora's frame worker. That runtime is validated separately by the five
          # automatic launch/return cycles above. XCTest enables Main Thread Checker
          # by default and turns that unchanged donor behavior into a probe-only
          # SIGABRT on iOS 18, so keep MTC out of this UI-navigation test action.
          scheme.test_action.disable_main_thread_checker=true
          scheme.save_as(project.path,'MenuProbe')
          project.save
          RUBY
          cd "$PROBE"
          flutter build ios --simulator --debug
          xcodebuild build-for-testing -project ios/Runner.xcodeproj -scheme MenuProbe \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/menuDerivedData" CODE_SIGNING_ALLOWED=NO \
            > "$GITHUB_WORKSPACE/evidence/menu-build.log" 2>&1
      - name: Embed exact donor instructions and run probe
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/flutter-probe/build/ios/iphonesimulator/Runner.app"
          ditto donor/KartPadRuntime.framework "$APP/Frameworks/KartPadRuntime.framework"
          ditto donor/runtime-resources "$APP"
          python3 - "$APP/Frameworks/KartPadRuntime.framework/KartPadRuntime" <<'PY'
          from pathlib import Path
          import struct,sys
          p=Path(sys.argv[1]); b=bytearray(p.read_bytes()); cursor=32; count=0
          for _ in range(struct.unpack_from('<I',b,16)[0]):
              cmd,size=struct.unpack_from('<II',b,cursor)
              if cmd==0x32:
                  assert struct.unpack_from('<I',b,cursor+8)[0]==2
                  struct.pack_into('<I',b,cursor+8,7); count+=1
              cursor+=size
          assert count==1
          p.write_bytes(b)
          PY
          codesign --force --sign - "$APP/Frameworks/KartPadRuntime.framework"
          codesign --force --sign - "$APP"
          xcrun simctl list devices available --json > evidence/simulators.json
          xcodebuild -version > evidence/xcode.txt
          DEVICE="$(python3 -c 'import json,os; print(next(d["udid"] for runtime,group in json.load(open("evidence/simulators.json"))["devices"].items() if os.environ["PROBE_IOS"] in runtime for d in group if "iPhone" in d["name"]))')"
          echo "PROBE_DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          BUNDLE="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")"
          DATA="$(xcrun simctl get_app_container "$DEVICE" "$BUNDLE" data)"
          echo "PROBE_DATA=$DATA" >> "$GITHUB_ENV"
          xcrun simctl launch --console "$DEVICE" "$BUNDLE" > evidence/flutter-console.log 2>&1 &
          for i in $(seq 1 90); do
            if [ -f "$DATA/Documents/flutter-probe.json" ] && python3 - "$DATA/Documents/flutter-probe.json" <<'PY'
          import json,sys
          rows=json.load(open(sys.argv[1])); sys.exit(0 if rows[-1]['stage'] in ('success','failure','native_failure') else 1)
          PY
            then break; fi
            sleep 1
          done
          cp "$DATA/Documents/flutter-probe.json" evidence/flutter-probe.json
          cat evidence/flutter-probe.json
          python3 - <<'PY'
          import json
          rows=json.load(open('evidence/flutter-probe.json'))
          assert rows[-1]['stage']=='success', rows[-1]
          assert len([r for r in rows if r['stage']=='launch_acknowledged'])==5
          assert len([r for r in rows if r['stage']=='waiter_contract_passed'])==1
          after=[r for r in rows if r['stage']=='after']
          assert len(after)==5
          assert all(r['values']['arguments']['frames']>0 and r['values']['arguments']['delayMs']<2000 for r in after)
          PY
      - name: Negative control - unbound guest-stack pump stalls Flutter
        timeout-minutes: 3
        run: |
          set -euo pipefail
          cp evidence/flutter-probe.json evidence/automatic-cycles.json
          BUNDLE=com.neostation.kartpadHostProbe
          xcrun simctl terminate "$PROBE_DEVICE" "$BUNDLE"
          xcrun simctl launch --console "$PROBE_DEVICE" "$BUNDLE" --unsafe-fiber-probe > evidence/unsafe-fiber-console.log 2>&1 &
          for i in $(seq 1 60); do
            if python3 - "$PROBE_DATA/Documents/flutter-probe.json" <<'PY'
          import json,sys,time
          rows=json.load(open(sys.argv[1]))
          returned=[r for r in rows if r['stage']=='returned']
          is_fiber=any(r['stage']=='guest_stack_begin' for r in rows)
          sys.exit(0 if is_fiber and returned and time.time()-returned[-1]['time']>2 else 1)
          PY
            then break; fi
            sleep 1
          done
          cp "$PROBE_DATA/Documents/flutter-probe.json" evidence/unsafe-fiber-probe.json
          python3 - <<'PY'
          import json
          rows=json.load(open('evidence/unsafe-fiber-probe.json'))
          assert rows[-1]['stage']=='returned', rows[-1]
          assert len([r for r in rows if r['stage']=='guest_stack_end'])==1
          assert not any(r['stage'] in ('launch_acknowledged','after','success') for r in rows)
          PY
      - name: Exercise SDL event pumping on the donor ARM64 guest stack
        timeout-minutes: 3
        run: |
          set -euo pipefail
          BUNDLE=com.neostation.kartpadHostProbe
          xcrun simctl terminate "$PROBE_DEVICE" "$BUNDLE"
          xcrun simctl launch --console "$PROBE_DEVICE" "$BUNDLE" --fiber-probe > evidence/fiber-console.log 2>&1 &
          for i in $(seq 1 90); do
            if [ -f "$PROBE_DATA/Documents/flutter-probe.json" ] && python3 - "$PROBE_DATA/Documents/flutter-probe.json" <<'PY'
          import json,sys
          rows=json.load(open(sys.argv[1]))
          is_fiber=any(r['stage']=='guest_stack_begin' for r in rows)
          sys.exit(0 if is_fiber and rows[-1]['stage'] in ('success','failure','native_failure') else 1)
          PY
            then break; fi
            sleep 1
          done
          cp "$PROBE_DATA/Documents/flutter-probe.json" evidence/fiber-probe.json
          python3 - <<'PY'
          import json
          rows=json.load(open('evidence/fiber-probe.json'))
          assert rows[-1]['stage']=='success', rows[-1]
          assert len([r for r in rows if r['stage']=='guest_stack_begin'])==5
          assert len([r for r in rows if r['stage']=='guest_stack_end'])==5
          assert all(r['values']['guardBound'] and r['values']['skipped']>0 and r['values']['hostPumps']>0 for r in rows if r['stage']=='guest_stack_end')
          after=[r for r in rows if r['stage']=='after']
          assert len(after)==5
          assert all(r['values']['arguments']['frames']>0 and r['values']['arguments']['delayMs']<2000 for r in after)
          PY
      - name: Exercise the real settings menu with XCTest
        timeout-minutes: 10
        run: |
          set -euo pipefail
          xcodebuild test-without-building -project "$RUNNER_TEMP/flutter-probe/ios/Runner.xcodeproj" \
            -scheme MenuProbe -destination "platform=iOS Simulator,id=$PROBE_DEVICE" \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/menuDerivedData" \
            -resultBundlePath "$PWD/evidence/menu-result.xcresult" \
            CODE_SIGNING_ALLOWED=NO > evidence/menu-xcodebuild.log 2>&1
          DATA="$(xcrun simctl get_app_container "$PROBE_DEVICE" com.neostation.kartpadHostProbe data)"
          echo "PROBE_DATA=$DATA" >> "$GITHUB_ENV"
          cp "$DATA/Documents/flutter-probe.json" evidence/menu-probe.json
          python3 - <<'PY'
          import json
          rows=json.load(open('evidence/menu-probe.json'))
          assert rows[-1]['stage']=='success', rows[-1]
          assert len([r for r in rows if r['stage']=='launch_acknowledged'])==5
          assert len([r for r in rows if r['stage']=='waiter_contract_passed'])==1
          assert len([r for r in rows if r['stage']=='menu_exit_requested'])==5
          PY
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p evidence
          if [ -n "${PROBE_DATA:-}" ]; then
            PROBE_DATA="$(xcrun simctl get_app_container "$PROBE_DEVICE" com.neostation.kartpadHostProbe data)"
            cp "$PROBE_DATA/Documents/flutter-probe.json" evidence/ || true
          fi
          PROBE_PID="$(pgrep -x Runner | head -1 || true)"
          if [ -n "$PROBE_PID" ]; then
            sample "$PROBE_PID" 2 -file evidence/threads.txt || true
          fi
          cp ~/Library/Logs/DiagnosticReports/Runner* evidence/ 2>/dev/null || true
          if [ -n "${PROBE_DEVICE:-}" ]; then
            xcrun simctl spawn "$PROBE_DEVICE" log show --last 3m --style compact --predicate 'process == "Runner"' > evidence/system.log 2>&1 || true
            xcrun simctl shutdown "$PROBE_DEVICE" || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KartPad-Flutter-probe-${{ matrix.ios }}-${{ github.sha }}
          path: evidence/
          retention-days: 7
