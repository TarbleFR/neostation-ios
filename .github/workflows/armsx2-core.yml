name: ARMSX2 native core
run-name: ARMSX2 native core • ${{ github.sha }}
on:
  push:
    branches: [experimental]
    paths:
      - '.github/workflows/armsx2-core.yml'
      - 'packages/armsx2_internal_bridge/**'
      - 'packages/armsx2_jit_helper/**'
      - 'build-utils/armsx2/**'
      - 'test/armsx2_bios_hacks_test.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: armsx2-native-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Compile pinned ARMSX2 iOS framework
    runs-on: macos-26
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read immutable source revision
        id: source
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          source = json.loads(Path('build-utils/armsx2/source.json').read_text())
          assert source['repository'] == 'https://github.com/ARMSX2/ARMSX2.git'
          assert re.fullmatch('[0-9a-f]{40}', source['revision'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('revision=' + source['revision'], file=output)
          PY
      - uses: actions/checkout@v4
        with:
          repository: ARMSX2/ARMSX2
          ref: ${{ steps.source.outputs.revision }}
          path: .native-sources/ARMSX2
          submodules: recursive
          persist-credentials: false
      - name: Export exact host sources
        run: |
          mkdir -p "$RUNNER_TEMP/armsx2-host-source"
          git archive HEAD | gzip > "$RUNNER_TEMP/armsx2-host-source/neostation.tar.gz"
          printf 'host=%s\narmsx2=%s\n' "$GITHUB_SHA" '${{ steps.source.outputs.revision }}' > "$RUNNER_TEMP/armsx2-host-source/identity.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ARMSX2-host-source-${{ github.sha }}
          path: ${{ runner.temp }}/armsx2-host-source/
          if-no-files-found: error
          retention-days: 3
      - name: Select Xcode and validate scripts
        run: |
          set -euo pipefail
          sudo xcode-select -switch /Applications/Xcode.app
          xcodebuild -version
          python3 -m py_compile build-utils/armsx2/*.py
          bash -n build-utils/armsx2/build_core.sh
          git diff --check
      - name: Compile native core and verify binary ABI
        run: bash build-utils/armsx2/build_core.sh .native-sources/ARMSX2
      - uses: actions/upload-artifact@v4
        with:
          name: ARMSX2Core-${{ github.sha }}
          path: dist/armsx2/
          if-no-files-found: error
          retention-days: 14
      - name: Collect native diagnostics
        if: always()
        run: |
          mkdir -p build/armsx2-diagnostics
          cp build/armsx2-core/*.log build/armsx2-diagnostics/ 2>/dev/null || true
          cp build/armsx2-core/CMakeCache.txt build/armsx2-diagnostics/ 2>/dev/null || true
          printf 'host=%s\narmsx2=%s\n' "$GITHUB_SHA" '${{ steps.source.outputs.revision }}' > build/armsx2-diagnostics/identity.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ARMSX2Core-diagnostics-${{ github.sha }}
          path: build/armsx2-diagnostics/
          if-no-files-found: error
          retention-days: 7
