name: Patch Build 262 integration

on:
  push:
    branches:
      - work/full-theme-build262-sync260
    paths:
      - .github/workflows/patch-build262-integration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: work/full-theme-build262-sync260
          fetch-depth: 0

      - name: Apply Build 262 integration
        run: python3 build-utils/patch_build262_integration.py

      - name: Align Dolphin hacks contract with Build 260 implementation
        run: sed -i 's/NEOSTATION_DOLPHIN_HACKS_V1/graphics.hack_applied/' test/full_theme_category_contract_test.py

      - name: Validate preservation contract
        run: python3 test/full_theme_category_contract_test.py

      - name: Keep workflow update for direct GitHub write
        run: git checkout -- .github/workflows/build-ipa-once.yml

      - name: Commit converged Build 262 sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tarble FR'
          git config user.email 'f9wynyv9qy@privaterelay.appleid.com'
          git add \
            lib/screens/settings_screen/new_settings_options/themes_settings_content.dart \
            lib/services/full_theme_service.dart \
            build-utils/build_rpcs3_embedded_core.sh \
            build-utils/configure_local_jit_tunnel.py \
            test/full_theme_category_contract_test.py
          if git diff --cached --quiet; then
            echo 'Build 262 source integration already applied.'
            exit 0
          fi
          git commit -m 'Build 262: preserve 260 features and expose full-theme category'
          git push origin HEAD:work/full-theme-build262-sync260
