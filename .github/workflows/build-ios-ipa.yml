name: Build NeoStation iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
      SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
      GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Validate current fixes
        run: |
          set -euo pipefail
          dart format \
            lib/main.dart \
            lib/l10n/manic_emu_locale.dart \
            lib/screens/game_screen/game_settings_dialog/game_settings_emulator_tab.dart \
            lib/screens/settings_screen/new_settings_options/directories_settings_content.dart \
            lib/services/config_service.dart \
            lib/services/game/game_launch_service.dart \
            lib/services/ios_emulator_preference_service.dart \
            lib/services/manic_emu_launch_service.dart \
            lib/services/retroarch_library_service.dart \
            lib/widgets/ios_emulator_choice_screen.dart \
            lib/widgets/permission_check_wrapper.dart \
            lib/widgets/setup_wizard.dart \
            test/ios_emulator_choice_screen_test.dart \
            test/manic_emu_launch_service_test.dart \
            test/manic_emu_locale_test.dart \
            test/manic_emu_routing_test.dart
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test || echo "::warning::Existing cross-platform test-suite failures do not block the iOS IPA build"

      - name: Prepare build environment
        run: |
          set -euo pipefail
          mkdir -p build/ci
          python3 - <<'PY'
          import os, pathlib
          required = {
              'SCREENSCRAPER_DEV_ID': os.environ.get('SCREENSCRAPER_DEV_ID', ''),
              'SCREENSCRAPER_DEV_PASSWORD': os.environ.get('SCREENSCRAPER_DEV_PASSWORD', ''),
          }
          missing = [key for key, value in required.items() if not value]
          if missing:
              raise SystemExit('Missing required secrets: ' + ', '.join(missing))
          values = {
              **required,
              'GOOGLE_BOOKS_API_KEY': os.environ.get('GOOGLE_BOOKS_API_KEY', ''),
          }
          pathlib.Path('.env').write_text(
              '\n'.join(f'{key}={value}' for key, value in values.items()) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Patch Flutter plugins for current Xcode
        run: |
          set -euo pipefail
          PLUGIN_FILE="$HOME/.pub-cache/hosted/pub.dev/flutter_localization-0.4.1/ios/flutter_localization/Sources/flutter_localization/FlutterLocalizationPlugin.swift"
          test -f "$PLUGIN_FILE"
          python3 - "$PLUGIN_FILE" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          source = path.read_text(encoding='utf-8')
          if 'registrar.messenger(),' in source:
              path.write_text(
                  source.replace('registrar.messenger(),', 'registrar.messenger()'),
                  encoding='utf-8',
              )
          elif 'registrar.messenger()' not in source:
              raise SystemExit('Could not patch flutter_localization')
          PY
          DEVICE_INFO_FILE=$(find "$HOME/.pub-cache" -path "*device_info_plus*/FPPDeviceInfoPlusPlugin.m" -print -quit)
          if [ -n "$DEVICE_INFO_FILE" ]; then
            sed -i '' '/isiOSAppOnVision/d' "$DEVICE_INFO_FILE"
          fi

      - name: Scaffold and configure iOS
        run: |
          set -euo pipefail
          flutter create --platforms=ios --org com.neogamelab --project-name neostation .
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '18.0'/" ios/Podfile || true
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 18.0;/g' ios/Runner.xcodeproj/project.pbxproj || true
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.neogamelab.neostation" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string neostation" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :LSApplicationQueriesSchemes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:0 string retroarch" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:1 string shortcuts" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:2 string armsx2" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:3 string melonx" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:4 string manicemu" "$PLIST"
          plutil -lint "$PLIST"

      - name: Generate fork icon
        run: |
          dart run flutter_launcher_icons
          chmod +x build-utils/force_ios_fork_icon.sh
          build-utils/force_ios_fork_icon.sh

      - name: Install CocoaPods
        run: cd ios && pod install --repo-update

      - name: Build unsigned application
        run: flutter build ios --release --no-codesign --dart-define-from-file=.env

      - name: Package and verify unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find build/ios/iphoneos build/ios/Release-iphoneos -maxdepth 2 -type d -name '*.app' -print 2>/dev/null | head -n 1)
          test -n "$APP_PATH"
          test ! -d "$APP_PATH/_CodeSignature"
          test ! -f "$APP_PATH/embedded.mobileprovision"
          rm -rf build/ipa-package
          mkdir -p build/ipa-package/Payload
          cp -R "$APP_PATH" build/ipa-package/Payload/NeoStation.app
          (cd build/ipa-package && zip -qr ../../NeoStation-iOS-Unsigned-Build148.ipa Payload)
          test -s NeoStation-iOS-Unsigned-Build148.ipa
          shasum -a 256 NeoStation-iOS-Unsigned-Build148.ipa | tee build/ci/ipa-sha256.txt

      - name: Upload verified IPA
        uses: actions/upload-artifact@v4
        with:
          name: NeoStation-iOS-Unsigned-Build148
          path: |
            NeoStation-iOS-Unsigned-Build148.ipa
            build/ci/ipa-sha256.txt
          if-no-files-found: error

      - name: Cleanup secrets
        if: always()
        run: rm -f .env
