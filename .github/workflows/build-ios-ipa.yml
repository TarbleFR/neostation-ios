name: Legacy NeoStation iOS IPA build

# Automatic iOS builds now run on Codemagic via codemagic.yaml.
# Keep this workflow manual-only so pushes to main do not start a duplicate
# GitHub Actions macOS build.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  legacy-build-disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Use the Codemagic ios-ipa workflow for NeoStation iOS builds."
