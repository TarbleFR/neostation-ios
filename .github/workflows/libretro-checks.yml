name: Libretro engine checks
'on':
  push:
    branches:
    - Claude
    paths:
    - .github/workflows/libretro-checks.yml
    - packages/libretro_internal_bridge/**
    - lib/services/libretro_*.dart
    - lib/l10n/libretro_locale.dart
    - lib/widgets/libretro_internal_playlist_actions.dart
    - lib/services/game/game_launch_service.dart
    - lib/screens/game_screen/my_games_list.dart
    - lib/screens/game_screen/game_settings_dialog/game_settings_emulator_tab.dart
    - test/libretro_*
    - test/libretro_host/**
    - build-utils/libretro/**
    - build-utils/validate_libretro_ipa.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: libretro-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Select Xcode 26.3
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3'
    - name: Run the portable host against a test core
      run: python3 test/libretro_host_test.py
    - name: Run the portable frontend modules (geometry, controls, settings, skins)
      # Runs even when an earlier native check failed, so one CI round reports every
      # native problem; the job still fails.
      if: ${{ !cancelled() }}
      run: python3 test/libretro_frontend_test.py
    - name: Compile and render every shader preset with Metal
      if: ${{ !cancelled() }}
      run: python3 test/libretro_shader_test.py
    - name: Compile every bridge and rcheevos source for iPhone
      if: ${{ !cancelled() }}
      run: python3 test/libretro_ios_syntax_test.py
  dart:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.47.2
        channel: stable
        cache: true
    - name: Analyze
      run: |
        flutter pub get --enforce-lockfile
        flutter analyze --no-fatal-infos
    - name: Libretro, launch and library tests
      run: |
        flutter test test/libretro_locale_test.dart test/libretro_core_catalog_test.dart test/frontend_media_gate_test.dart test/rom_folder_registration_test.dart test/library_scan_restart_test.dart test/retroarch_library_protocol_test.dart test/retroarch_library_cache_test.dart test/retroarch_launch_diagnostics_test.dart test/retroarch_sync_locale_test.dart test/ios_selective_rollback_test.dart test/armsx2_retroarch_routing_isolation_test.dart test/game_repository_test.dart test/system_repository_test.dart test/rpcs3_embedded_identity_test.dart test/audio_policy_service_test.dart
    - name: Download the libretro cores pinned by the delivery
      uses: actions/download-artifact@v4
      with:
        name: LibretroCores-48635465f4bdb324db4ff41b8b9815ff101ad360
        run-id: '37945318237'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: dist/libretro
    - name: Source contracts
      run: |
        python3 test/libretro_core_options_test.py --cores dist/libretro
        python3 test/libretro_route_contract_test.py
        python3 test/integrated_import_tab_contract_test.py
        python3 test/localization_12_locale_coverage_test.py
        python3 test/cheats_media_source_contract_test.py
        python3 test/retroarch_baseline_scope_test.py
        python3 test/game_audio_handoff_test.py
