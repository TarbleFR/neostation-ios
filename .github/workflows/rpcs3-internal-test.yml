name: RPCS3 Internal Test 215
run-name: RPCS3 Internal Test 215 • ${{ github.sha }}

on:
  push:
    branches:
      - feature/rpcs3-internal-engine-v1
    paths:
      - .github/workflows/rpcs3-internal-test.yml

permissions:
  contents: read

concurrency:
  group: neostation-rpcs3-internal-test-215
  cancel-in-progress: true

jobs:
  build:
    name: Build RPCS3 Internal Test IPA
    runs-on: macos-15
    timeout-minutes: 180
    env:
      BUILD_NUMBER: '215'
      IPA_NAME: 'NeoStation-iOS-RPCS3-Internal-Test-215'
      ARTIFACT_NAME: 'NeoStation-iOS-RPCS3-Internal-Test-215'
      DOLPHIN_SHA: 7cac54161659421ed95c2cd1c0b0746539a4cd38
      HOMEBREW_NO_AUTO_UPDATE: '1'
      BUNDLE_GEMFILE: ${{ github.workspace }}/build-utils/Gemfile.dolphin
      CCACHE_DIR: ${{ github.workspace }}/.dolphin-ccache
      SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
      SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}

    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify RPCS3 branch isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check
          git fetch origin main
          git diff --exit-code origin/main -- \
            packages/dolphin_internal_bridge \
            packages/dolphin_jit_helper \
            native/dolphin_internal_helper
          test ! -e packages/rpcs3_internal_bridge/ios/Classes/Rpcs3HostJit.mm
          grep -q 'Rpcs3JitBridgePlugin' packages/rpcs3_internal_bridge/ios/Classes/Rpcs3CompositeBridgePlugin.mm
          grep -q 'script: .universal' packages/rpcs3_jit_helper/ios/Classes/Rpcs3JITRequestHandlerBase.swift
          ! grep -R -n 'openJitRequest' lib/services/rpcs3_launch_service.dart lib/services/rpcs3_internal_service.dart

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Prepare build tools
        run: |
          set -euo pipefail
          export BUNDLE_PATH="$RUNNER_TEMP/neostation-ruby-gems"
          echo "BUNDLE_PATH=$BUNDLE_PATH" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$RUNNER_TEMP/dolphin-ios" >> "$GITHUB_ENV"
          mkdir -p build/dolphin-ci
          bundle install
          command -v cmake >/dev/null || brew install cmake
          command -v ninja >/dev/null || brew install ninja
          command -v ccache >/dev/null || brew install ccache
          ccache --max-size=2G

      - name: Prepare emulator build definitions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          required = ('SCREENSCRAPER_DEV_ID', 'SCREENSCRAPER_DEV_PASSWORD')
          values = {key: os.environ.get(key, '').strip() for key in required}
          missing = [key for key, value in values.items() if not value]
          if missing:
              raise SystemExit('Missing build secrets: ' + ', '.join(missing))
          values.update({
              'NEOSTATION_EXPERIMENTAL_STIKJIT_MELONX': 'true',
              'NEOSTATION_MELONX_BUNDLE_ID': 'com.nur.nx',
              'NEOSTATION_EXPERIMENTAL_STIKJIT_ARMSX2': 'true',
              'NEOSTATION_ARMSX2_BUNDLE_ID': 'xyz.aethersx2.AetherSX2',
          })
          Path('.dart-defines.json').write_text(json.dumps(values))
          PY

      - name: Restore StikJIT 1.5.0
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://github.com/StikDebug/StikJIT/releases/download/1.5.0/StikJIT.xcframework.zip' \
            -o "$RUNNER_TEMP/StikJIT.xcframework.zip"
          python3 packages/dolphin_internal_bridge/ci/build_support.py \
            stik "$RUNNER_TEMP/StikJIT.xcframework.zip"

      - name: Materialize verified RPCS3 Core
        run: |
          set -euo pipefail
          python3 build-utils/materialize_rpcs3_internal.py core
          test -f packages/rpcs3_internal_bridge/ios/Frameworks/libRPCS3Core.dylib
          shasum -a 256 packages/rpcs3_internal_bridge/ios/Frameworks/libRPCS3Core.dylib

      - name: Analyze and test
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter analyze --no-fatal-infos
          flutter test --no-pub
          git diff --exit-code -- pubspec.yaml pubspec.lock

      - name: Generate iOS host
        run: |
          set -euo pipefail
          flutter config --no-enable-swift-package-manager
          python3 packages/dolphin_internal_bridge/ci/build_support.py scaffold

      - name: Restore pinned Dolphin build product
        id: dolphin-core-cache
        uses: actions/cache/restore@v4
        with:
          key: dolphin-v3-ios-arm64-xcode16.4-7cac5416-${{ hashFiles('build-utils/patch_dolphin_internal_core_v2.py', 'packages/dolphin_internal_bridge/core/**') }}
          path: |
            ${{ runner.temp }}/dolphin-ios/build-iphoneos-Release/Source/iOS/Library/libdolphin.dylib
            ${{ runner.temp }}/dolphin-ios/Data/Sys
            ${{ runner.temp }}/dolphin-ios/Source/iOS/Library/NeoStationBridge.mm
            ${{ runner.temp }}/dolphin-ios/Source/iOS/Library/CMakeLists.txt
            ${{ runner.temp }}/dolphin-ios/Source/Core/Common/MemoryUtil_iOS_LuckTXM.cpp

      - name: Restore Dolphin compiler cache
        if: steps.dolphin-core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          key: dolphin-v3-ccache-xcode16.4-${{ github.run_id }}
          restore-keys: dolphin-v3-ccache-xcode16.4-
          path: .dolphin-ccache

      - name: Compile pinned Dolphin core when cache is absent
        id: compile-dolphin-core
        if: steps.dolphin-core-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/dolphin-ios"
          rm -rf "$SRC"
          git init "$SRC"
          git -C "$SRC" remote add origin https://github.com/OatmealDome/dolphin-ios.git
          git -C "$SRC" fetch --depth 1 origin "$DOLPHIN_SHA"
          git -C "$SRC" checkout --detach FETCH_HEAD
          git -C "$SRC" submodule update --init --recursive --depth 1
          test "$(git -C "$SRC" rev-parse HEAD)" = "$DOLPHIN_SHA"
          python3 build-utils/patch_dolphin_internal_core_v2.py "$SRC"
          cmake -S "$SRC" -B "$SRC/build-iphoneos-Release" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$SRC/Externals/ios-cmake/ios.toolchain.cmake" \
            -DPLATFORM=OS64 -DDEPLOYMENT_TARGET=17.4 -DENABLE_VISIBILITY=ON \
            -DENABLE_BITCODE=OFF -DENABLE_ARC=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS=-fPIC -DIOS=ON -DENABLE_ANALYTICS=NO \
            -DUSE_SYSTEM_LIBS=OFF -DENABLE_TESTS=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache
          cmake --build "$SRC/build-iphoneos-Release" --target dolphin --parallel 3

      - name: Prepare existing Dolphin framework
        run: |
          set -euo pipefail
          python3 packages/dolphin_internal_bridge/ci/build_support.py \
            framework "$RUNNER_TEMP/dolphin-ios"

      - name: Package existing DolphiniOS touchscreen resources
        run: |
          python3 packages/dolphin_internal_bridge/ci/materialize_touch_resources.py \
            --source "$RUNNER_TEMP/dolphin-ios"

      - name: Configure Flutter and isolated RPCS3 host
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --config-only --no-pub \
            --build-number="$BUILD_NUMBER" --dart-define-from-file=.dart-defines.json
          python3 packages/dolphin_internal_bridge/ci/build_support.py configure
          python3 build-utils/configure_rpcs3_ios_v1.py
          dart run flutter_launcher_icons
          bash build-utils/force_ios_fork_icon.sh
          env -u BUNDLE_GEMFILE -u BUNDLE_PATH pod install --project-directory=ios
          xcodebuild -list -workspace ios/Runner.xcworkspace
          grep -q "target 'RPCS3JITHelper' do" ios/Podfile
          grep -q 'RPCS3JITHelper' ios/Runner.xcodeproj/project.pbxproj
          grep -q 'com.neogamelab.neostation.rpcs3jithelper' ios/Runner.xcodeproj/project.pbxproj
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          ent = plistlib.loads(Path('ios/Runner/Runner.entitlements').read_bytes())
          required = (
              'get-task-allow',
              'com.apple.developer.kernel.extended-virtual-addressing',
              'com.apple.developer.kernel.increased-memory-limit',
              'com.apple.developer.kernel.increased-debugging-memory-limit',
          )
          missing = [key for key in required if ent.get(key) is not True]
          if missing:
              raise SystemExit('Missing RPCS3 host entitlements: ' + ', '.join(missing))
          PY
          git diff --exit-code -- pubspec.yaml pubspec.lock

      - name: Compile unsigned iOS app
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/RPCS3InternalDerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' PROVISIONING_PROFILE_SPECIFIER='' \
            COMPILER_INDEX_STORE_ENABLE=NO build

      - name: Package IPA
        run: |
          set -euo pipefail
          git diff --check
          python3 packages/dolphin_internal_bridge/ci/build_support.py package
          ls -lah dist

      - name: Verify RPCS3 payload
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          ipas = list(Path('dist').glob('*.ipa'))
          if len(ipas) != 1:
              raise SystemExit(f'Expected one IPA, found {len(ipas)}')
          ipa = ipas[0]
          with zipfile.ZipFile(ipa) as z:
              names = z.namelist()
          core = [n for n in names if n.endswith('/Frameworks/libRPCS3Core.dylib')]
          helper = [n for n in names if '/PlugIns/RPCS3JITHelper.appex/' in n]
          if len(core) != 1:
              raise SystemExit(f'Expected one embedded RPCS3 Core, found {core}')
          if not helper:
              raise SystemExit('RPCS3JITHelper.appex is missing from the IPA')
          if any('/RPCS3.app/' in n for n in names):
              raise SystemExit('Standalone RPCS3.app must not be embedded')
          print(f'RPCS3 Core: {core[0]}')
          print('RPCS3 JIT helper: present')
          print('Standalone RPCS3 app: absent')
          PY

      - name: Upload test IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Save Dolphin compiler cache
        if: always() && steps.compile-dolphin-core.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          key: dolphin-v3-ccache-xcode16.4-${{ github.run_id }}
          path: .dolphin-ccache

      - name: Remove temporary build secrets
        if: always()
        run: rm -f .dart-defines.json
