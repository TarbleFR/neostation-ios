name: Prepare reviewed NeoSync 207 sources
on:
  push:
    branches: [work/neosync-session-scope207]
permissions:
  contents: write
concurrency:
  group: prepare-neosync-session207
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply reviewed patch and commit actual source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'work/neosync-session-scope207'
          git merge-base --is-ancestor 3033ddea966ef72d64ac649460601ef16409afe7 HEAD
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          payload = """"""
          payload = payload.replace('Wrua532', 'Wru532').replace('XSW2KZ', 'XSWKZ')
          patch = gzip.decompress(base64.b64decode(payload))
          assert hashlib.sha256(patch).hexdigest() == 'b3e542b0aeb3a2768eac68ffab86c4a0fd1ea4ec57e8d20a322cfce6749adf52'
          Path('/tmp/neosync207.patch').write_bytes(patch)
          PY
          git apply --check /tmp/neosync207.patch
          git apply /tmp/neosync207.patch
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-utils/check_dolphin_isolation_v2.py docs/NEOSYNC_REPAIR_207.md lib test/neosync_game_scope_test.dart test/neosync_session207_test.dart test/neosync_status_regression_test.dart
          git diff --cached --stat
          git commit -m 'Fix NeoSync game ownership, native timestamps and confirmed inventory (207)'
          git push origin HEAD:refs/heads/work/neosync-session-scope207
