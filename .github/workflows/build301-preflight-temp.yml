name: Temporary Build 301 preflight
# fixture-revision: 2

on:
  push:
    branches:
      - experimental
    paths:
      - '.github/workflows/build301-preflight-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Build 301 source and packaging contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate Python and Ruby helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            build-utils/patch_rpcs3_build301_passive_dlopen.py \
            build-utils/validate_rpcs3_passive_dlopen.py \
            build-utils/prepare_ios_icon_fallback.py \
            build-utils/validate_rpcs3_ipa.py \
            test/rpcs3_build301_passive_dlopen_test.py \
            test/rpcs3_ipa_validation_test.py
          ruby -c build-utils/add_ios_icon_fallback_resources.rb

      - name: Validate passive-dlopen source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 test/rpcs3_build301_passive_dlopen_test.py

      - name: Validate final IPA icon contract tests
        shell: bash
        run: |
          set -o pipefail
          python3 test/rpcs3_ipa_validation_test.py -v 2>&1 | tee /tmp/build301-preflight.log

      - name: Validate workflow wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'python3 build-utils/prepare_ios_icon_fallback.py' .github/workflows/ios-ci.yml
          grep -q 'bundle exec ruby build-utils/add_ios_icon_fallback_resources.rb' .github/workflows/ios-ci.yml
          grep -q 'SPRINGBOARD_ICON_FILES' build-utils/validate_rpcs3_ipa.py

      - name: Upload preflight traceback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build301-preflight-traceback-${{ github.sha }}
          path: /tmp/build301-preflight.log
          if-no-files-found: warn
          retention-days: 1
