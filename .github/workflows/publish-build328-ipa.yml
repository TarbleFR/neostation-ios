name: Publish Build 328 IPA direct
run-name: Publish Build 328 IPA • ${{ github.sha }}

on:
  push:
    branches: [experimental]
    paths:
      - '.github/workflows/publish-build328-ipa.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: build-328-kartpad-cache-fix
      ASSET: NeoStation-iOS-Build-328-KartPad-Cache-Fix.ipa
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download validated Build 328 artifact
        uses: actions/download-artifact@v4
        with:
          name: NeoStation-iOS-Build-328-KartPad-Cache-Fix
          run-id: 36029622755
          github-token: ${{ github.token }}
          path: build328

      - name: Locate and verify IPA
        shell: bash
        run: |
          set -euo pipefail
          IPA="$(find build328 -type f -name '*.ipa' | head -n1)"
          test -n "$IPA"
          cp "$IPA" "$ASSET"
          unzip -t "$ASSET" >/dev/null
          shasum -a 256 "$ASSET"

      - name: Publish direct IPA release asset
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --title "NeoStation iOS Build 328 KartPad Cache Fix" \
              --notes "Experimental KartPad startup candidate based on stable Build 322. Fixes the confirmed iOS startup failure where NeoStation replaced Library/Caches/KartPad with a symlink to an ephemeral temporary cache. KartPad now owns its canonical writable Library/Caches/KartPad directory and removes only stale symlinks left by prior candidates." \
              --prerelease
          fi
