name: Temporary repair Build 301 declaration

on:
  push:
    branches:
      - experimental
    paths:
      - '.github/workflows/fix-build301-forward-decl.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    name: Repair and validate JIT diagnostic declaration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout experimental
        uses: actions/checkout@v4
        with:
          ref: experimental
          fetch-depth: 0
          persist-credentials: true

      - name: Patch declaration and contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          patch = Path('build-utils/patch_rpcs3_build301_passive_dlopen.py')
          text = patch.read_text()
          old = '''std::string g_last_error;
          std::atomic<rpcs3::ios::jit::diagnostic_callback> g_diagnostic_callback{{nullptr}};
          // {MARKER}
          '''
          new = '''std::string g_last_error;
          std::atomic<rpcs3::ios::jit::diagnostic_callback> g_diagnostic_callback{{nullptr}};
          void emit_diagnostic(std::string message) noexcept;
          // {MARKER}
          '''
          if old not in text:
              raise SystemExit('Build 301 diagnostics state anchor drifted')
          text = text.replace(old, new, 1)

          anchor = '''    jit_ios = (root / "Utilities/JITIOS.cpp").read_text()
              for function in ("runtime_memory", "arena_capacity", "claim_runtime", "allocate"):
          '''
          replacement = '''    jit_ios = (root / "Utilities/JITIOS.cpp").read_text()
              diagnostic_declaration = "void emit_diagnostic(std::string message) noexcept;"
              diagnostic_definition = "void emit_diagnostic(std::string message) noexcept\\n{"
              if diagnostic_declaration not in jit_ios:
                  raise RuntimeError("JIT diagnostic emitter has no forward declaration")
              if jit_ios.index(diagnostic_declaration) > jit_ios.index("u8* reserve_arena_layout("):
                  raise RuntimeError("JIT diagnostic emitter is declared after its first use")
              if jit_ios.index(diagnostic_declaration) > jit_ios.index(diagnostic_definition):
                  raise RuntimeError("JIT diagnostic emitter declaration follows its definition")
              for function in ("runtime_memory", "arena_capacity", "claim_runtime", "allocate"):
          '''
          if anchor not in text:
              raise SystemExit('Build 301 validator anchor drifted')
          patch.write_text(text.replace(anchor, replacement, 1))

          test = Path('test/rpcs3_build301_passive_dlopen_test.py')
          text = test.read_text()
          anchor = '''    assert 'bool prepare_arena() noexcept' not in jit_ios
              assert api.count('jit::prepare_arena(') == 1
          '''
          replacement = '''    assert 'bool prepare_arena() noexcept' not in jit_ios
              declaration = 'void emit_diagnostic(std::string message) noexcept;'
              assert declaration in jit_ios
              assert jit_ios.index(declaration) < jit_ios.index('u8* reserve_arena_layout(')
              assert jit_ios.index(declaration) < jit_ios.index('void emit_diagnostic(std::string message) noexcept\\n{')
              assert api.count('jit::prepare_arena(') == 1
          '''
          if anchor not in text:
              raise SystemExit('Build 301 test anchor drifted')
          test.write_text(text.replace(anchor, replacement, 1))
          PY
          python3 -m py_compile \
            build-utils/patch_rpcs3_build301_passive_dlopen.py \
            test/rpcs3_build301_passive_dlopen_test.py
          python3 test/rpcs3_build301_passive_dlopen_test.py
          git diff --check

      - name: Validate exact RPCS3 postimage
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/rpcs3"
          git init -q "$SRC"
          git -C "$SRC" remote add origin https://github.com/XITRIX/rpcs3.git
          git -C "$SRC" fetch --depth 1 origin 22f1152783cef1f7e04af7b1c895173e28fd5b03
          git -C "$SRC" checkout -q --detach FETCH_HEAD
          python3 build-utils/patch_rpcs3_embedded_boot.py "$SRC"
          python3 build-utils/patch_rpcs3_jit_memory.py "$SRC"
          python3 build-utils/patch_rpcs3_neostation_session.py "$SRC"
          python3 build-utils/patch_rpcs3_serial_profiles.py "$SRC"
          python3 build-utils/patch_rpcs3_serial_profiles.py "$SRC"
          python3 build-utils/patch_rpcs3_iso_integrity.py "$SRC"
          python3 build-utils/patch_rpcs3_savestate_stability.py "$SRC"
          python3 build-utils/patch_rpcs3_savestate_stability.py "$SRC"
          python3 build-utils/patch_rpcs3_build256_savestates.py "$SRC"
          python3 build-utils/patch_rpcs3_build256_savestates.py "$SRC"
          python3 build-utils/patch_rpcs3_armsx3_performance.py "$SRC"
          python3 build-utils/patch_rpcs3_armsx3_performance.py "$SRC"
          python3 build-utils/patch_rpcs3_build258_core_architecture.py "$SRC"
          python3 build-utils/patch_rpcs3_build258_core_architecture.py "$SRC"
          python3 build-utils/patch_rpcs3_build258_runtime_resilience.py "$SRC"
          python3 build-utils/patch_rpcs3_build258_runtime_resilience.py "$SRC"
          python3 build-utils/patch_rpcs3_build264_gow3_core.py "$SRC"
          python3 build-utils/patch_rpcs3_build264_gow3_core.py "$SRC"
          python3 build-utils/patch_rpcs3_build265_core.py "$SRC"
          python3 build-utils/patch_rpcs3_build265_core.py "$SRC"
          python3 build-utils/patch_rpcs3_build266_v09_core.py "$SRC"
          python3 build-utils/patch_rpcs3_build266_v09_core.py "$SRC"
          python3 test/rpcs3_build266_v09_core_test.py "$SRC"
          python3 build-utils/patch_rpcs3_build295_fixed_reservation.py "$SRC"
          python3 build-utils/patch_rpcs3_build295_fixed_reservation.py "$SRC"
          python3 build-utils/patch_rpcs3_build301_passive_dlopen.py "$SRC"
          python3 build-utils/patch_rpcs3_build301_passive_dlopen.py "$SRC"
          python3 test/rpcs3_build301_passive_dlopen_test.py "$SRC"

      - name: Commit repaired Core patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            build-utils/patch_rpcs3_build301_passive_dlopen.py \
            test/rpcs3_build301_passive_dlopen_test.py
          git diff --cached --check
          git commit -m 'fix(rpcs3): declare JIT diagnostics before reservation [rpcs3-core-only]'
          git push origin HEAD:experimental
