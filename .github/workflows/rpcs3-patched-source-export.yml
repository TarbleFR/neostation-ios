name: Temporary apply RPCS3 Build 301

on:
  push:
    branches:
      - experimental
    paths:
      - '.github/workflows/rpcs3-patched-source-export.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    name: Apply passive dlopen refactor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout experimental
        uses: actions/checkout@v4
        with:
          ref: experimental
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize reviewed payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/build301-payload/part-* | base64 --decode > "$RUNNER_TEMP/build301-payload.tar.gz"
          printf '%s  %s\n' \
            '128761603930758164df93c60e9d6d45e8c1bf38ae731b49be5d30923f9006fa' \
            "$RUNNER_TEMP/build301-payload.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/build301-payload.tar.gz" -C .
          chmod +x \
            build-utils/patch_rpcs3_build301_passive_dlopen.py \
            build-utils/validate_rpcs3_passive_dlopen.py \
            test/rpcs3_build301_passive_dlopen_test.py
          git diff --check

      - name: Validate exact source transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            build-utils/patch_rpcs3_build301_passive_dlopen.py \
            build-utils/validate_rpcs3_passive_dlopen.py \
            test/rpcs3_build301_passive_dlopen_test.py
          python3 test/rpcs3_build301_passive_dlopen_test.py

          SRC="$RUNNER_TEMP/rpcs3"
          git init -q "$SRC"
          git -C "$SRC" remote add origin https://github.com/XITRIX/rpcs3.git
          git -C "$SRC" fetch --depth 1 origin 22f1152783cef1f7e04af7b1c895173e28fd5b03
          git -C "$SRC" checkout -q --detach FETCH_HEAD

          python3 build-utils/patch_rpcs3_embedded_boot.py "$SRC"
          python3 build-utils/patch_rpcs3_jit_memory.py "$SRC"
          python3 build-utils/patch_rpcs3_neostation_session.py "$SRC"
          python3 build-utils/patch_rpcs3_serial_profiles.py "$SRC"
          python3 build-utils/patch_rpcs3_serial_profiles.py "$SRC"
          python3 build-utils/patch_rpcs3_iso_integrity.py "$SRC"
          python3 build-utils/patch_rpcs3_savestate_stability.py "$SRC"
          python3 build-utils/patch_rpcs3_savestate_stability.py "$SRC"
          python3 build-utils/patch_rpcs3_build256_savestates.py "$SRC"
          python3 build-utils/patch_rpcs3_build256_savestates.py "$SRC"
          python3 build-utils/patch_rpcs3_armsx3_performance.py "$SRC"
          python3 build-utils/patch_rpcs3_armsx3_performance.py "$SRC"
          python3 build-utils/patch_rpcs3_build258_core_architecture.py "$SRC"
          python3 build-utils/patch_rpcs3_build258_core_architecture.py "$SRC"
          python3 build-utils/patch_rpcs3_build258_runtime_resilience.py "$SRC"
          python3 build-utils/patch_rpcs3_build258_runtime_resilience.py "$SRC"
          python3 build-utils/patch_rpcs3_build264_gow3_core.py "$SRC"
          python3 build-utils/patch_rpcs3_build264_gow3_core.py "$SRC"
          python3 build-utils/patch_rpcs3_build265_core.py "$SRC"
          python3 build-utils/patch_rpcs3_build265_core.py "$SRC"
          python3 build-utils/patch_rpcs3_build266_v09_core.py "$SRC"
          python3 build-utils/patch_rpcs3_build266_v09_core.py "$SRC"
          python3 test/rpcs3_build266_v09_core_test.py "$SRC"
          python3 build-utils/patch_rpcs3_build295_fixed_reservation.py "$SRC"
          python3 build-utils/patch_rpcs3_build295_fixed_reservation.py "$SRC"
          python3 build-utils/patch_rpcs3_build301_passive_dlopen.py "$SRC"
          python3 build-utils/patch_rpcs3_build301_passive_dlopen.py "$SRC"
          python3 test/rpcs3_build301_passive_dlopen_test.py "$SRC"

      - name: Commit verified non-workflow sources
        shell: bash
        run: |
          set -euo pipefail
          # GitHub Actions tokens cannot update workflow files. Restore the
          # reviewed workflow copy; it is published separately through GitHub's
          # workflow-authorized contents API after this source commit succeeds.
          git restore .github/workflows/rpcs3-core.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            build-utils/patch_rpcs3_build301_passive_dlopen.py \
            build-utils/validate_rpcs3_passive_dlopen.py \
            test/rpcs3_build301_passive_dlopen_test.py \
            build-utils/build_rpcs3_embedded_core.sh \
            build-utils/validate_rpcs3_embedded_core.py
          git rm -r .github/build301-payload
          git diff --cached --check
          git commit -m 'fix(rpcs3): make Core dlopen passive [rpcs3-core-only]'
          git push origin HEAD:experimental
