name: Temporary RetroArch TestFlight cleanup

on:
  push:
    branches:
      - feature/riisu-system-art-pack
    paths:
      - '.github/workflows/tmp-retroarch-testflight-cleanup.yml'
      - '.github/scripts/retroarch_testflight_cleanup.py'
      - '.github/scripts/retroarch_testflight_cleanup_fix.py'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/riisu-system-art-pack

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply cleanup patch
        run: |
          python3 .github/scripts/retroarch_testflight_cleanup.py
          python3 .github/scripts/retroarch_testflight_cleanup_fix.py
          sed -i "/manic_emu_locale.dart/d" lib/services/game/game_launch_service.dart
          git checkout -- .github/workflows/build-ios-ipa.yml

      - name: Format changed Dart files
        run: |
          dart format \
            lib/services/game/game_launch_service.dart \
            lib/services/retroarch_library_service.dart \
            lib/services/ios_linked_library_path_service.dart \
            lib/providers/sqlite_config_provider.dart \
            lib/providers/sqlite_config_provider/scanning.dart \
            lib/data/datasources/sqlite_database_service.dart \
            lib/widgets/setup_wizard.dart \
            lib/screens/settings_screen/new_settings_options/directories_settings_content.dart \
            packages/external_folder_access/lib/external_folder_access.dart \
            test/retroarch_testflight_library_test.dart \
            test/ios_retroarch_testflight_launch_guard_test.dart \
            test/ios_linked_library_path_service_test.dart \
            test/ios_linked_library_reassociation_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Validate focused regressions
        run: |
          flutter test \
            test/retroarch_testflight_library_test.dart \
            test/ios_retroarch_testflight_launch_guard_test.dart \
            test/ios_linked_library_path_service_test.dart \
            test/ios_linked_library_reassociation_test.dart
          flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Commit cleanup
        run: |
          git config user.name 'Tarble FR'
          git config user.email 'f9wynyv9qy@privaterelay.appleid.com'
          git add \
            lib/services/game/game_launch_service.dart \
            lib/services/retroarch_library_service.dart \
            lib/services/ios_linked_library_path_service.dart \
            lib/providers/sqlite_config_provider.dart \
            lib/providers/sqlite_config_provider/scanning.dart \
            lib/data/datasources/sqlite_database_service.dart \
            lib/widgets/setup_wizard.dart \
            lib/screens/settings_screen/new_settings_options/directories_settings_content.dart \
            packages/external_folder_access/lib/external_folder_access.dart \
            packages/external_folder_access/ios/Classes/ExternalFolderAccessPlugin.swift \
            test/retroarch_testflight_library_test.dart \
            test/ios_retroarch_testflight_launch_guard_test.dart \
            test/ios_linked_library_path_service_test.dart \
            test/ios_linked_library_reassociation_test.dart \
            pubspec.yaml
          git commit -m 'Fix RetroArch TestFlight sync and remove Open In fallbacks'
          git push origin HEAD:feature/riisu-system-art-pack
