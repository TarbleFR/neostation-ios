name: Preserve stable 198 and clean historical Actions
run-name: Archive stable Build 198 and clean repository history
on:
  push:
    branches: [maintenance/stable-198-cleanup]
    paths: [.github/workflows/stable-198-maintenance.yml]
permissions:
  contents: write
  actions: write
concurrency:
  group: neostation-stable-198-maintenance
  cancel-in-progress: false
jobs:
  preserve-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: TarbleFR/neostation-ios
      SOURCE_COMMIT: d23c681b84826fa694c07fa48d3a60d78282d0ef
      SOURCE_RUN: '33933842637'
      EXPECTED_IPA_SHA256: 0754f5967fa07370802271931c58004fa1dd782bdf577bac2db064c0d3292f5f
      RELEASE_TAG: ios-stable-198
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d23c681b84826fa694c07fa48d3a60d78282d0ef
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: TarbleFR/neostation-ios
          run-id: 33933842637
          name: NeoStation-Dolphin-Internal-Isolated-v3-Build-198
          path: stable-release
      - name: Verify the original IPA without rebuilding it
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,plistlib,zipfile
          from pathlib import Path
          root=Path('stable-release')
          report=json.loads((root/'dolphin-build-report.json').read_text())
          ipa=root/report['ipa']
          digest=hashlib.sha256(ipa.read_bytes()).hexdigest()
          assert digest == os.environ['EXPECTED_IPA_SHA256'] == report['sha256']
          assert report['commit'] == os.environ['SOURCE_COMMIT']
          assert str(report['runId']) == os.environ['SOURCE_RUN']
          assert report['structuralValidation'] == 'passed'
          with zipfile.ZipFile(ipa) as z:
              assert z.testzip() is None
              info=plistlib.loads(z.read('Payload/NeoStation.app/Info.plist'))
              assert str(info['CFBundleVersion']) == '198'
              for name in ('Payload/NeoStation.app/Runner','Payload/NeoStation.app/Frameworks/DolphinCore.framework/DolphinCore','Payload/NeoStation.app/PlugIns/DolphinJITHelper.appex/DolphinJITHelper'):
                  assert z.getinfo(name).file_size > 0
          print('Original Build 198 verified:',digest)
          PY
      - name: Preserve sources and build evidence outside Actions
        run: |
          set -euo pipefail
          git archive --format=zip --output=stable-release/NeoStation-Build-198-source.zip "$SOURCE_COMMIT"
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/jobs" > stable-release/original-build-jobs.json
          gh api "repos/$GH_REPO/actions/artifacts/9959662041/zip" > stable-release/NeoStation-Build-198-Diagnostics.zip
          cat > stable-release/RELEASE-NOTES.md <<'EOF'
          # NeoStation iOS — stable baseline, Build 198

          This is the original successful Build 198 IPA, preserved without recompilation or binary modification after the maintainer reported that it works on their device. That report is not a claim of universal game/device compatibility.

          Source commit: `d23c681b84826fa694c07fa48d3a60d78282d0ef`.
          Original Actions run: `33933842637` (success; archived evidence attached before historical runs are deleted).
          SHA-256: `0754f5967fa07370802271931c58004fa1dd782bdf577bac2db064c0d3292f5f`.

          The IPA is unsigned, as produced by the original build, and needs compatible sideload signing. The signing entitlements and original structural audit are attached. Automated auditing did not perform a physical-device test.

          ## Embedded components and attribution
          - NeoStation / this iOS fork: GPL-3.0; original NeoStation authors retain attribution. Fork maintained by TarbleFR.
          - Dolphin / DolphiniOS: contributors to Dolphin Emulator and DolphiniOS; source revision `7cac54161659421ed95c2cd1c0b0746539a4cd38`. Most original code is GPL-2.0-or-later; retain upstream COPYING, LICENSES and each file's notices. Embedded only for GameCube/Wii.
          - StikJIT framework 1.5.0, by StikDebug and contributors: MPL-2.0. This is the framework at https://github.com/StikDebug/StikJIT/tree/1.5.0, not a relicensing of the separate StikDebug application. Bundled idevice and JIT scripts retain their own licenses. Dolphin uses its isolated legacy helper; other emulator bridges are unchanged.

          Exact NeoStation sources and build scripts are attached. Pinned third-party sources and adaptations are documented in NOTICE.md at the source commit. No games, GameCube IPL, console firmware or pairing files are provided.
          EOF
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$SOURCE_COMMIT" --title 'NeoStation iOS — Stable Build 198' --notes-file stable-release/RELEASE-NOTES.md --latest
          fi
          python3 - <<'PY'
          import json,os,subprocess
          ref=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GH_REPO"]}/git/ref/tags/{os.environ["RELEASE_TAG"]}']))
          assert ref['object']['type'] == 'commit' and ref['object']['sha'] == os.environ['SOURCE_COMMIT'], 'Release tag does not identify the original binary source'
          PY
          gh release upload "$RELEASE_TAG" stable-release/* --clobber
          mkdir -p verify-release
          gh release download "$RELEASE_TAG" --pattern '*.ipa' --dir verify-release
          python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          files=list(Path('verify-release').glob('*.ipa'))
          assert len(files)==1
          assert hashlib.sha256(files[0].read_bytes()).hexdigest()==os.environ['EXPECTED_IPA_SHA256']
          print('Release download verified; historical run artifacts can now be removed safely.')
          PY
      - name: Delete historical runs and obsolete workflow caches
        run: |
          python3 - <<'PY'
          import json,os,subprocess,time
          from pathlib import Path
          repo=os.environ['GH_REPO']; current=int(os.environ['GITHUB_RUN_ID'])
          report={'sourceCommit':os.environ['SOURCE_COMMIT'],'releaseTag':os.environ['RELEASE_TAG'],'maintenanceRun':current,'deletedRuns':[],'deletedCaches':[],'disabledWorkflows':[],'errors':[],'remainingRuns':[]}
          def api(endpoint,method='GET',data=None):
              cmd=['gh','api',f'repos/{repo}/{endpoint}','-X',method]
              if data is not None: cmd+=['--input','-']
              result=subprocess.run(cmd,input=json.dumps(data) if data is not None else None,text=True,capture_output=True)
              if result.returncode: raise RuntimeError(result.stderr.strip())
              return json.loads(result.stdout) if result.stdout.strip() else None
          def pages(endpoint,key):
              result=[]; page=1
              while True:
                  batch=api(f'{endpoint}?per_page=100&page={page}')[key]
                  result.extend(batch)
                  if len(batch)<100: return result
                  page+=1
          # Snapshot the complete list before deleting anything; deleting while
          # paging would otherwise skip older runs when pages shift.
          runs=pages('actions/runs','workflow_runs')
          report['runsBefore']=len(runs)
          for run in runs:
              if run['id']==current: continue
              try:
                  if run['status']!='completed':
                      api(f'actions/runs/{run["id"]}/cancel','POST')
                      for _ in range(30):
                          if api(f'actions/runs/{run["id"]}')['status']=='completed': break
                          time.sleep(2)
                      else: raise RuntimeError('Cancellation not completed; run left intact')
                  api(f'actions/runs/{run["id"]}','DELETE')
                  report['deletedRuns'].append(run['id'])
              except Exception as exc: report['errors'].append({'run':run['id'],'error':str(exc)})
          for item in pages('actions/caches','actions_caches'):
              try:
                  api(f'actions/caches/{item["id"]}','DELETE'); report['deletedCaches'].append(item['id'])
              except Exception as exc: report['errors'].append({'cache':item['id'],'error':str(exc)})
          for wf in pages('actions/workflows','workflows'):
              if wf['path'] in ('.github/workflows/dolphin-internal-isolated-v3.yml','.github/workflows/stable-198-maintenance.yml'): continue
              try:
                  if wf['state']=='active': api(f'actions/workflows/{wf["id"]}/disable','PUT'); report['disabledWorkflows'].append(wf['id'])
              except Exception as exc: report['errors'].append({'workflow':wf['id'],'error':str(exc)})
          report['remainingRuns']=[{'id':r['id'],'status':r['status'],'name':r['name']} for r in pages('actions/runs','workflow_runs')]
          report['note']='The current maintenance run is retained; GitHub will not delete a newly running workflow from itself.'
          Path('stable-release/cleanup-report.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          subprocess.run(['gh','release','upload',os.environ['RELEASE_TAG'],'stable-release/cleanup-report.json','--clobber'],check=True)
          if report['errors']: raise SystemExit('Cleanup has partial failures; see the preserved report.')
          PY
