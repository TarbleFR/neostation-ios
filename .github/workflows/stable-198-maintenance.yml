name: Finalize stable baseline cleanup
run-name: Final stable 198 cleanup verification
on:
  push:
    branches: [maintenance/stable-198-cleanup]
    paths: [.github/workflows/stable-198-maintenance.yml]
permissions:
  contents: write
  actions: write
concurrency:
  group: neostation-stable-198-finalize
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: TarbleFR/neostation-ios
    steps:
      - name: Verify release, remove late experimental runs, and update repository summary where permitted
        run: |
          python3 - <<'PY'
          import json,os,subprocess,time
          from pathlib import Path
          repo=os.environ['GH_REPO']; current=int(os.environ['GITHUB_RUN_ID'])
          expected='41fb6cbd1401323f58224cee47c6e73091c55032'
          digest='sha256:0754f5967fa07370802271931c58004fa1dd782bdf577bac2db064c0d3292f5f'
          result={'currentMaintenanceRun':current,'deletedRuns':[],'errors':[]}
          def api(endpoint='',method='GET',data=None):
              cmd=['gh','api',f'repos/{repo}'+('/'+endpoint if endpoint else ''),'-X',method]
              if data is not None: cmd+=['--input','-']
              p=subprocess.run(cmd,input=json.dumps(data) if data is not None else None,capture_output=True,text=True)
              if p.returncode: raise RuntimeError(p.stderr.strip())
              return json.loads(p.stdout) if p.stdout.strip() else None
          def pages(endpoint,key):
              allitems=[]; page=1
              while True:
                  items=api(f'{endpoint}?per_page=100&page={page}')[key]
                  allitems+=items
                  if len(items)<100: return allitems
                  page+=1
          release=api('releases/tags/ios-stable-198')
          ipa=[a for a in release['assets'] if a['name'].endswith('.ipa')]
          assert len(ipa)==1 and ipa[0]['state']=='uploaded' and ipa[0]['digest']==digest
          result['releaseVerified']=True
          result['branches']={b:api('git/ref/heads/'+b)['object']['sha'] for b in ('main','backup')}
          assert all(sha==expected for sha in result['branches'].values()), 'Stable branches changed; refusing cleanup until reviewed'
          for run in pages('actions/runs','workflow_runs'):
              if run['id']==current: continue
              try:
                  if run['status']!='completed':
                      api(f'actions/runs/{run["id"]}/cancel','POST')
                      for _ in range(60):
                          if api(f'actions/runs/{run["id"]}')['status']=='completed': break
                          time.sleep(2)
                      else: raise RuntimeError('Cancellation incomplete; not deleted')
                  api(f'actions/runs/{run["id"]}','DELETE')
                  result['deletedRuns'].append(run['id'])
              except Exception as exc: result['errors'].append({'run':run['id'],'error':str(exc)})
          summary='iOS/iPadOS NeoStation frontend with embedded Dolphin/DolphiniOS (GPL-2.0-or-later) and StikJIT 1.5.0 (MPL-2.0), preserving existing emulator integrations. Stable Build 198.'
          try:
              result['repositoryDescription']=api(method='PATCH',data={'description':summary})['description']
              result['repositoryDescriptionUpdated']=True
          except Exception as exc:
              result['repositoryDescriptionUpdated']=False
              result['repositoryDescriptionError']=str(exc)
          result['workflows']=[{'id':w['id'],'path':w['path'],'name':w['name'],'state':w['state']} for w in pages('actions/workflows','workflows')]
          result['remainingRuns']=[{'id':r['id'],'status':r['status']} for r in pages('actions/runs','workflow_runs')]
          result['note']='The final maintenance run itself remains visible; it is not claimed to be deleted.'
          path=Path('final-cleanup-report.json'); path.write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          subprocess.run(['gh','release','upload','ios-stable-198',str(path),'--clobber'],check=True)
          if result['errors']: raise SystemExit('Some runs could not be cleaned; see report.')
          PY
