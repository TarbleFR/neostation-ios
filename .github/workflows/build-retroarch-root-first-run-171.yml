    branches:
      - test/retroarch-root-first-run-171

permissions:
  contents: read

concurrency:
  group: neostation-retroarch-root-first-run-171
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
