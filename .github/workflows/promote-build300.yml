name: Promote RPCS3 Build 300

on:
  push:
    branches:
      - experimental
    paths:
      - '.github/workflows/promote-build300.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  promote:
    name: Pin validated atomic Core and dispatch Build 300
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experimental
        uses: actions/checkout@v4
        with:
          ref: experimental
          fetch-depth: 0
          persist-credentials: true

      - name: Patch Build 300 workflow exactly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ios-ci.yml')
          text = path.read_text()
          original = text

          exact = {
              "RPCS3_CORE_HOST_SHA: 453eeda703d42ee4b9854083f3a8d04071453fe7":
                  "RPCS3_CORE_HOST_SHA: 6bf58ff2fda11e7074ea76c572b0a68f1fb934b8",
              "RPCS3_CORE_RUN_ID: '35535109526'":
                  "RPCS3_CORE_RUN_ID: '35539478606'",
              "RPCS3_CORE_SHA256: e3e6d48984616492322cd5ef88959b71be6d0915fae22223b271b42fe7ba5aa8":
                  "RPCS3_CORE_SHA256: fa1821520dba99ad5a58bb4b366d30cb46081caa7e84fdcaa9e29bb6ce833d03",
          }
          for old, new in exact.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new, 1)

          text = text.replace('NeoStation iOS Build 299 RPCS3 Launch Stability',
                              'NeoStation iOS Build 300 RPCS3 Atomic Reservation')
          text = text.replace('NeoStation iOS Build 299 •', 'NeoStation iOS Build 300 •')
          text = text.replace('neostation-ios-build-299', 'neostation-ios-build-300')
          text = text.replace('Build 299 RPCS3 Launch Stability IPA',
                              'Build 300 RPCS3 Atomic Reservation IPA')
          text = text.replace("BUILD_NUMBER: '299'", "BUILD_NUMBER: '300'")
          text = text.replace('NeoStation-iOS-Build-299-RPCS3-Launch-Stability',
                              'NeoStation-iOS-Build-300-RPCS3-Atomic-Reservation')
          text = text.replace('Build 299 diagnostics', 'Build 300 diagnostics')
          text = text.replace('Package and validate Build 299 IPA',
                              'Package and validate Build 300 IPA')

          if text == original:
              raise SystemExit('Build 300 promotion made no changes')

          required = (
              "BUILD_NUMBER: '300'",
              "IPA_NAME: 'NeoStation-iOS-Build-300-RPCS3-Atomic-Reservation'",
              "ARTIFACT_NAME: 'NeoStation-iOS-Build-300-RPCS3-Atomic-Reservation'",
              'DOLPHIN_CORE_HOST_SHA: 105f9138e8d5ab5301fd891381cc433072b787ae',
              "DOLPHIN_CORE_RUN_ID: '35519943003'",
              'ARMSX2_CORE_HOST_SHA: 017c9c2f1e0628e43506707bd6943a76f44f8f44',
              "ARMSX2_CORE_RUN_ID: '35519677053'",
              'RPCS3_CORE_HOST_SHA: 6bf58ff2fda11e7074ea76c572b0a68f1fb934b8',
              "RPCS3_CORE_RUN_ID: '35539478606'",
              'RPCS3_CORE_SHA256: fa1821520dba99ad5a58bb4b366d30cb46081caa7e84fdcaa9e29bb6ce833d03',
              'RPCS3_SOURCE_COMMIT: 22f1152783cef1f7e04af7b1c895173e28fd5b03',
              'python3 build-utils/embed_rpcs3_core_lazy.py',
              'python3 test/local_dev_vpn_route_contract_test.py',
              'test/game_deletion_regression_test.dart',
              'python3 build-utils/validate_rpcs3_ipa.py',
              'python3 build-utils/validate_single_ipa_distribution.py',
              'python3 build-utils/validate_armsx2_ipa.py',
              'com.apple.developer.networking.networkextension',
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('Build 300 preservation check failed: ' + repr(missing))

          forbidden = (
              "BUILD_NUMBER: '299'",
              'RPCS3_CORE_HOST_SHA: 453eeda703d42ee4b9854083f3a8d04071453fe7',
              "RPCS3_CORE_RUN_ID: '35535109526'",
              'RPCS3_CORE_SHA256: e3e6d48984616492322cd5ef88959b71be6d0915fae22223b271b42fe7ba5aa8',
          )
          stale = [item for item in forbidden if item in text]
          if stale:
              raise SystemExit('Stale Build 299 pin remains: ' + repr(stale))

          path.write_text(text)
          PY
          git diff --check
          git diff -- .github/workflows/ios-ci.yml

      - name: Run targeted promotion preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            build-utils/patch_rpcs3_build295_fixed_reservation.py \
            build-utils/validate_rpcs3_embedded_core.py \
            build-utils/validate_rpcs3_ipa.py \
            build-utils/validate_single_ipa_distribution.py
          python3 test/rpcs3_build295_fixed_reservation_test.py
          node test/rpcs3_debugger_handshake_test.js
          node test/rpcs3_stop_reply_behavior_test.js
          grep -q "RPCS3_CORE_HOST_SHA: 6bf58ff2fda11e7074ea76c572b0a68f1fb934b8" .github/workflows/ios-ci.yml
          grep -q "RPCS3_CORE_RUN_ID: '35539478606'" .github/workflows/ios-ci.yml
          grep -q "RPCS3_CORE_SHA256: fa1821520dba99ad5a58bb4b366d30cb46081caa7e84fdcaa9e29bb6ce833d03" .github/workflows/ios-ci.yml

      - name: Commit exact Build 300 promotion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ios-ci.yml
          git diff --cached --check
          git commit -m 'build(ios): promote atomic RPCS3 Core to Build 300'
          git push origin HEAD:experimental
          git rev-parse HEAD | tee /tmp/build300-sha

      - name: Dispatch complete Build 300 IPA
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ios-ci.yml/dispatches" \
            -d '{"ref":"experimental"}'
