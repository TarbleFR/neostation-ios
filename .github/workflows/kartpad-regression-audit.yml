name: KartPad language and session regression
run-name: KartPad language and session regression • ${{ github.sha }}
on:
  workflow_dispatch:
  push:
    branches: [experimental]
    paths:
      - .github/workflows/kartpad-regression-audit.yml
      - build-utils/kartpad/patch_donor_language_bridge.py
      - build-utils/kartpad/patch_donor_session_bridge.py
      - native/kartpad/**
      - test/kartpad_language_bridge_test.py
      - test/kartpad_session_bridge_test.py
      - test/kartpad_guest_language_state_test.cpp
      - test/kartpad_native_session_test.cpp
permissions:
  contents: read
jobs:
  language-session:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned instruction emulator and source witnesses
        run: |
          mkdir -p audit
          git rev-parse HEAD > audit/source-commit.txt
          git archive --format=tar.gz HEAD > audit/neostation-sources.tar.gz
          (cd audit && sha256sum neostation-sources.tar.gz > SHA256SUMS)
          python3 -m venv /tmp/kartpad-abi-tests
          /tmp/kartpad-abi-tests/bin/pip install --disable-pip-version-check unicorn==2.1.2
      - name: Execute ARM64 and production state-machine regressions
        shell: bash
        run: |
          set -euo pipefail
          /tmp/kartpad-abi-tests/bin/python test/kartpad_language_bridge_test.py 2>&1 | tee audit/language-abi-tests.txt
          /tmp/kartpad-abi-tests/bin/python test/kartpad_session_bridge_test.py 2>&1 | tee audit/session-bridge-tests.txt
          c++ -std=c++20 -Wall -Wextra -Werror -Inative/kartpad/core test/kartpad_guest_language_state_test.cpp -o /tmp/kartpad-language-state
          /tmp/kartpad-language-state
          c++ -std=c++20 -Wall -Wextra -Werror -Inative/kartpad/core -Ipackages/kartpad_internal_bridge/ios/Classes test/kartpad_native_session_test.cpp -o /tmp/kartpad-native-session
          /tmp/kartpad-native-session
          python3 test/kartpad_bridge_contract_test.py
          python3 test/kartpad_ipa_validation_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kartpad-regression-sources-${{ github.sha }}
          path: audit/
          retention-days: 7
          if-no-files-found: error
