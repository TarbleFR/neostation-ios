name: Remove abandoned emulator integration once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Remove abandoned integration completely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          PRE = 'bf4322cc13a67685c461d1abc7cd9a3794c34f84'

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          for file_name in (
              'lib/services/fin_library_service.dart',
              'test/fin_library_service_test.dart',
              'test/fin_persistence_regression_test.dart',
              'tools/.cleanup_trigger',
              'tools/.cleanup_trigger_2',
          ):
              Path(file_name).unlink(missing_ok=True)

          for file_name in (
              'packages/external_folder_access/lib/external_folder_access.dart',
              'packages/external_folder_access/ios/Classes/ExternalFolderAccessPlugin.swift',
              'lib/services/ios_shortcut_jit_launch_service.dart',
          ):
              data = subprocess.check_output(['git', 'show', f'{PRE}:{file_name}'])
              Path(file_name).write_bytes(data)

          p = 'lib/main.dart'
          s = read(p)
          s = s.replace("import 'package:neostation/services/fin_library_service.dart';\n", '')
          s = s.replace('    await FinLibraryService.initialize();\n', '')
          s = re.sub(
              r"\n      await FinLibraryService\.restoreAfterDatabaseReady\(\n        configProvider: sqliteConfigProvider,\n        databaseProvider: sqliteDatabaseProvider,\n      \);",
              '', s, count=1, flags=re.S,
          )
          write(p, s)

          p = 'lib/screens/settings_screen/new_settings_options/directories_settings_content.dart'
          s = read(p)
          s = s.replace("import 'package:neostation/services/fin_library_service.dart';\n", '')
          s = re.sub(
              r"\n  Future<void> _linkFinGamesFolder\(\) async \{.*?\n  Future<void> _linkRpcs3DataFolder\(\) async \{",
              '\n  Future<void> _linkRpcs3DataFolder() async {', s, count=1, flags=re.S,
          )
          s = s.replace('      _buildIOSFinLibrarySection(theme),\n', '')
          s = s.replace('      _buildIOSFinShortcutSection(theme),\n', '')
          s = re.sub(
              r"\n  Widget _buildIOSFinLibrarySection\(ThemeData theme\) \{.*?\n  Widget _buildIOSEmulatorCard\(\{",
              '\n  Widget _buildIOSEmulatorCard({', s, count=1, flags=re.S,
          )
          write(p, s)

          p = 'lib/services/game/game_launch_service.dart'
          s = read(p)
          s = s.replace("import 'package:neostation/services/fin_library_service.dart';\n", '')
          s = re.sub(
              r"\n      final isFinVirtualRom =\n          Platform\.isIOS &&\n          \(system\.folderName\.toLowerCase\(\) == 'gc' \|\|\n              system\.folderName\.toLowerCase\(\) == 'wii'\) &&\n          game\.romPath != null &&\n          FinLibraryService\.isVirtualLibraryPath\(game\.romPath!\);",
              '', s, count=1, flags=re.S,
          )
          s = s.replace(
              '            isRpcs3VirtualRom ||\n            isFinVirtualRom) {',
              '            isRpcs3VirtualRom) {',
          )
          s = re.sub(
              r"\n        // Nintendo GameCube / Wii: Fin exposes its game folder through Files\..*?\n        // Nintendo Switch: MeloNX exposes an alternate-frontend library export",
              '\n        // Nintendo Switch: MeloNX exposes an alternate-frontend library export',
              s, count=1, flags=re.S,
          )
          write(p, s)

          p = 'lib/data/datasources/sqlite_database_service.dart'
          s = read(p)
          s = s.replace(
              "        lowerPath.startsWith('rpcs3-library://') ||\n        lowerPath.startsWith('fin://');",
              "        lowerPath.startsWith('rpcs3-library://');",
          )
          write(p, s)

          Path('.github/workflows/remove-abandoned-integration-once.yml').unlink(missing_ok=True)
          PY

          dart format \
            lib/main.dart \
            lib/services/game/game_launch_service.dart \
            lib/services/ios_shortcut_jit_launch_service.dart \
            lib/screens/settings_screen/new_settings_options/directories_settings_content.dart \
            lib/data/datasources/sqlite_database_service.dart \
            packages/external_folder_access/lib/external_folder_access.dart

          git diff --check

          if grep -RniE \
            --exclude-dir=.git \
            --exclude='*.lock' \
            'FinLibraryService|fin_library_service|NeoStation\+Fin|finShortcutName|hasFinShortcutInstaller|openFinShortcutInstaller|fin://|fin-games|fin_sync_debug|fin_launch_debug|_linkFin|_syncWithFin|_configureFin|_testFin|_buildIOSFin|listBookmarkedFiles|bookmarkedURLForNativeAccess|Native iOS folder scan failed' \
            lib packages test .github 2>/dev/null; then
            echo 'Abandoned integration residue remains.' >&2
            exit 1
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Validate project
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test test/library_no_native_sources_test.dart

      - name: Commit cleanup to PR branch when needed
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Cleanup already applied.'
            exit 0
          fi
          git commit -m 'chore: remove abandoned emulator integration'
          git push origin HEAD:"$TARGET_BRANCH"
