name: RPCS3 native abort reproducer
on:
  push:
    branches: [experimental]
    paths: ['.github/workflows/rpcs3-302-abort-probe.yml', 'build-utils/migrations/build302_review.py']
permissions:
  contents: read
  actions: read
jobs:
  abort:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RPCS3-repair-source-37d226ae9e8f222f91631fff5e49015922d71e1d
          run-id: 35636317891
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/source-snapshot
      - name: Reproduce owned abort
        shell: bash
        run: |
          set -euo pipefail
          python3 build-utils/migrations/build302_apply.py
          python3 build-utils/migrations/build302_review.py
          python3 test/rpcs3_startup_abort_native_test.py 2>&1 | tee "$RUNNER_TEMP/build302-review/native-abort.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RPCS3-abort-reproducer-${{ github.sha }}
          path: ${{ runner.temp }}/build302-review/
          retention-days: 3
