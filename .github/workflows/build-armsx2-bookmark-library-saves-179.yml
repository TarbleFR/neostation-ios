name: Build ARMSX2 Bookmark Library Saves 179

on:
  push:
    branches:
      - fix/armsx2-bookmark-library-saves-from-171-179

permissions:
  contents: read

concurrency:
  group: neostation-armsx2-bookmark-library-saves-179
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      BUILD_NUMBER: '179'
      ARTIFACT_BASENAME: NeoStation-iOS-Build-179-ARMSX2-Bookmark-Library-Saves
      SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
      SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}

    steps:
      - name: Checkout Build 171 based branch
        uses: actions/checkout@v4
        with:
          ref: fix/armsx2-bookmark-library-saves-from-171-179
          fetch-depth: 1

      - name: Apply Build 171 and ARMSX2 bookmark patches
        shell: bash
        run: |
          set -euo pipefail
          python3 build-utils/patch_retroarch_root_first_run.py
          python3 build-utils/patch_remove_manic_from_171.py
          python3 build-utils/patch_armsx2_isolated_root_179.py
          python3 build-utils/patch_armsx2_isolated_root_postfix_179.py
          python3 build-utils/patch_armsx2_launch_encoding_179.py
          git diff --check

          # JIT/StikJIT remains exactly the Build 171 implementation.
          git diff --exit-code -- \
            lib/services/ios_shortcut_jit_launch_service.dart \
            lib/services/jit_backend_preference_service.dart \
            lib/services/stikjit_armsx2_service.dart \
            lib/services/stikjit_melonx_service.dart \
            packages/stikjit_bridge

          # ManicEMU is removed from the runtime, not merely hidden.
          test ! -e lib/services/manic_emu_launch_service.dart
          test ! -e lib/services/ios_emulator_preference_service.dart
          test ! -e lib/l10n/manic_emu_locale.dart
          if grep -RniE 'Manic[ _-]?EMU|ManicEMU|manicemu|manic_emu|IosEmulatorPreferenceService|IosLibraryEmulator|linkedManicEmuFolderPath' lib packages; then
            echo 'Removed ManicEMU runtime reference remains'
            exit 1
          fi

          # ARMSX2 has exactly one bookmark/root for library + save-folder reading.
          grep -q "static const String bookmarkKey = 'armsx2'" lib/services/armsx2_folder_service.dart
          grep -q 'linkedArmsx2FolderPath' lib/services/config_service.dart
          grep -q 'linkedArmsx2GameFolderPath' lib/services/config_service.dart
          ! grep -q 'linkedArmsx2SaveFolderPath' lib/services/config_service.dart
          ! grep -q 'armsx2NeoSyncBookmarkKey' lib/services/config_service.dart
          grep -q 'onLinkPressed: _linkArmsx2RootFolder' lib/screens/settings_screen/new_settings_options/directories_settings_content.dart
          ! grep -q 'Armsx2LibraryService.requestLibrarySync()' lib/screens/settings_screen/new_settings_options/directories_settings_content.dart

          # RetroArch and ARMSX2 ownership must never merge.
          grep -q 'final isArmsx2OwnedRom = Armsx2FolderService.ownsRomPath' lib/services/game/game_launch_service.dart
          grep -q 'if (isArmsx2OwnedRom || isArmsx2VirtualRom)' lib/services/game/game_launch_service.dart
          grep -q 'PS2 on iOS must never merge RetroArch and ARMSX2 save roots' lib/providers/neosync/neosync_path_resolver.dart
          grep -q 'return await Armsx2FolderService.resolveSaveDirectories' lib/providers/neosync/neosync_path_resolver.dart
          ! grep -q 'linkedExternalFolderPath' lib/services/armsx2_folder_service.dart

          # Physical ARMSX2 filenames must preserve spaces as %20, never form-style +.
          grep -q 'Uri.encodeComponent(fileName)' lib/services/armsx2_library_service.dart
          grep -q "armsx2://launch?game=\$encodedFileName" lib/services/armsx2_library_service.dart
          ! grep -q "queryParameters: {'game': fileName}" lib/services/armsx2_library_service.dart

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare build defines
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          required = ('SCREENSCRAPER_DEV_ID', 'SCREENSCRAPER_DEV_PASSWORD')
          values = {name: os.environ.get(name, '') for name in required}
          missing = [name for name, value in values.items() if not value]
          if missing:
              raise SystemExit('Missing secrets: ' + ', '.join(missing))
          values.update({
              'NEOSTATION_EXPERIMENTAL_STIKJIT_MELONX': 'true',
              'NEOSTATION_MELONX_BUNDLE_ID': 'com.nur.nx',
              'NEOSTATION_EXPERIMENTAL_STIKJIT_ARMSX2': 'true',
              'NEOSTATION_ARMSX2_BUNDLE_ID': 'com.armsx2.ios',
              'NEOSTATION_EXPERIMENTAL_STIKJIT_RPCS3': 'true',
              'NEOSTATION_RPCS3_BUNDLE_ID': 'com.xitrix.RPCS3',
          })
          Path('.dart-defines.json').write_text(json.dumps(values), encoding='utf-8')
          PY

      - name: Restore StikJIT framework
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE=/tmp/StikJIT.xcframework.zip
          EXTRACT=/tmp/neostation-stikjit
          DEST=packages/stikjit_bridge/ios/Frameworks
          rm -rf "$EXTRACT" "$DEST/StikJIT.xcframework" "$ARCHIVE"
          mkdir -p "$EXTRACT" "$DEST"
          curl -fL --retry 3 --retry-delay 2 'https://github.com/StikDebug/StikJIT/releases/download/1.5.0/StikJIT.xcframework.zip' -o "$ARCHIVE"
          echo '444b8d439df8455c34afbb51e279fd225265279195475f9b3fdbcf3a71a27e85  /tmp/StikJIT.xcframework.zip' | shasum -a 256 -c -
          unzip -q "$ARCHIVE" -d "$EXTRACT"
          FRAMEWORK=$(find "$EXTRACT" -type d -name 'StikJIT.xcframework' -print -quit)
          test -n "$FRAMEWORK"
          cp -R "$FRAMEWORK" "$DEST/StikJIT.xcframework"

      - name: Analyze and test ownership isolation
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format \
            lib/services/armsx2_folder_service.dart \
            test/armsx2_isolated_root_test.dart \
            test/armsx2_retroarch_routing_isolation_test.dart \
            test/armsx2_launch_url_encoding_test.dart
          flutter analyze --no-fatal-infos \
            lib/services/armsx2_folder_service.dart \
            lib/services/armsx2_library_service.dart \
            lib/services/game/game_launch_service.dart \
            lib/services/ios_rom_library_root_resolver.dart \
            lib/widgets/setup_wizard.dart \
            lib/widgets/permission_check_wrapper.dart \
            lib/screens/settings_screen/new_settings_options/directories_settings_content.dart \
            lib/services/retroarch_config_service.dart \
            lib/services/config_service.dart \
            lib/providers/neo_sync_provider.dart \
            lib/providers/sqlite_config_provider.dart \
            lib/data/datasources/sqlite_database_service.dart \
            lib/main.dart
          flutter test \
            test/armsx2_isolated_root_test.dart \
            test/armsx2_retroarch_routing_isolation_test.dart \
            test/armsx2_launch_url_encoding_test.dart \
            test/ios_rom_library_root_resolver_test.dart \
            test/jit_backend_preference_service_test.dart \
            test/stikjit_armsx2_isolation_test.dart \
            test/stikjit_rpcs3_isolation_test.dart

      - name: Generate clean iOS scaffold
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ios
          flutter create --platforms=ios --org com.neogamelab --project-name neostation .

      - name: Configure iOS runtime
        shell: bash
        run: |
          set -euo pipefail
          if [ -f build-utils/patch_ios_video_player_audio_session.py ]; then python3 build-utils/patch_ios_video_player_audio_session.py; fi
          DEVICE_INFO_FILE=$(find "$HOME/.pub-cache" -path '*device_info_plus*/FPPDeviceInfoPlusPlugin.m' 2>/dev/null | head -1 || true)
          if [ -n "$DEVICE_INFO_FILE" ]; then sed -i '' '/isiOSAppOnVision/d' "$DEVICE_INFO_FILE"; fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          podfile = Path('ios/Podfile')
          text = podfile.read_text(encoding='utf-8')
          pattern = re.compile(r"(?m)^\s*#?\s*platform\s+:ios\s*,\s*['\"][^'\"]+['\"]\s*$")
          podfile.write_text(pattern.sub("platform :ios, '18.0'", text, count=1) if pattern.search(text) else "platform :ios, '18.0'\n\n" + text, encoding='utf-8')
          project = Path('ios/Runner.xcodeproj/project.pbxproj')
          value = project.read_text(encoding='utf-8')
          value, count = re.subn(r'IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;', 'IPHONEOS_DEPLOYMENT_TARGET = 18.0;', value)
          if count == 0:
              raise SystemExit('No deployment target')
          value = value.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;')
          project.write_text(value, encoding='utf-8')
          PY
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c 'Delete :UISupportedInterfaceOrientations' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations array' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Delete :UISupportedInterfaceOrientations~ipad' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations~ipad array' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationLandscapeLeft' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationLandscapeRight' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :UIFileSharingEnabled bool true' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :LSSupportsOpeningDocumentsInPlace bool true' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Delete :CFBundleURLTypes' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes array' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes:0 dict' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes:0:CFBundleURLName string com.neogamelab.neostation' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes:0:CFBundleURLSchemes array' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string neostation' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Delete :LSApplicationQueriesSchemes' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :LSApplicationQueriesSchemes array' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :LSApplicationQueriesSchemes:0 string retroarch' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :LSApplicationQueriesSchemes:1 string shortcuts' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :LSApplicationQueriesSchemes:2 string armsx2' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :LSApplicationQueriesSchemes:3 string melonx' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :LSApplicationQueriesSchemes:4 string neomelonx' "$PLIST"

      - name: Generate app icon
        shell: bash
        run: |
          set -euo pipefail
          dart run flutter_launcher_icons
          if [ -f build-utils/force_ios_fork_icon.sh ]; then chmod +x build-utils/force_ios_fork_icon.sh && build-utils/force_ios_fork_icon.sh; fi

      - name: Build unsigned app
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --build-number="$BUILD_NUMBER" --dart-define-from-file=.dart-defines.json 2>&1 | tee build-ios.log
          test -d build/ios/iphoneos/Runner.app

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          STAGING=/tmp/neostation-armsx2-bookmark-179
          rm -rf "$STAGING"
          mkdir -p "$STAGING/Payload"
          cp -R build/ios/iphoneos/Runner.app "$STAGING/Payload/Runner.app"
          (cd "$STAGING" && /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/${ARTIFACT_BASENAME}.ipa")
          test -s "${ARTIFACT_BASENAME}.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_BASENAME }}
          path: |
            ${{ env.ARTIFACT_BASENAME }}.ipa
            build-ios.log
          if-no-files-found: error
          retention-days: 30
