name: One-shot Fin and Library fix build

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-fin-library-push-build.yml'
  workflow_dispatch: {}

permissions:
  contents: write
  statuses: write

jobs:
  fix-build:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
      SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
      GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply fixes
        run: python3 tools/fix_fin_library_build144.py
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format and validate
        run: |
          set -euo pipefail
          dart format \
            lib/services/library_metadata_provider_service.dart \
            packages/external_folder_access/lib/external_folder_access.dart \
            lib/services/fin_library_service.dart \
            lib/screens/settings_screen/new_settings_options/directories_settings_content.dart \
            test/library_no_native_sources_test.dart
          git diff --check
          flutter test test/library_no_native_sources_test.dart
          flutter test test/library_metadata_provider_service_test.dart
          flutter test test/fin_library_service_test.dart
          flutter test test/fin_persistence_regression_test.dart
          flutter analyze --no-fatal-warnings --no-fatal-infos
          test ! -e assets/data/manga-providers.json
          ! grep -R "rootBundle.loadString(manifestAsset)" -n lib/services
          grep -q "Native candidates:" lib/services/fin_library_service.dart
          grep -q "prefixRead" packages/external_folder_access/ios/Classes/ExternalFolderAccessPlugin.swift
          grep -q "version: 1.0.0+144" pubspec.yaml
      - name: Commit validated fixes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            lib/services/library_metadata_provider_service.dart \
            packages/external_folder_access/lib/external_folder_access.dart \
            packages/external_folder_access/ios/Classes/ExternalFolderAccessPlugin.swift \
            lib/services/fin_library_service.dart \
            lib/screens/settings_screen/new_settings_options/directories_settings_content.dart \
            test/library_no_native_sources_test.dart \
            pubspec.yaml pubspec.lock assets/data/manga-providers.json
          git commit -m "fix: harden Fin iOS sync and make Library sources import-only"
          git push origin HEAD:main
      - name: Prepare build env
        run: |
          set -euo pipefail
          mkdir -p build/ci
          python3 - <<'PY'
          import os, pathlib, sys
          req={'SCREENSCRAPER_DEV_ID':os.environ.get('SCREENSCRAPER_DEV_ID',''),'SCREENSCRAPER_DEV_PASSWORD':os.environ.get('SCREENSCRAPER_DEV_PASSWORD','')}
          missing=[k for k,v in req.items() if not v]
          if missing: raise SystemExit('Missing required secrets: '+', '.join(missing))
          vals={**req,'GOOGLE_BOOKS_API_KEY':os.environ.get('GOOGLE_BOOKS_API_KEY','')}
          pathlib.Path('.env').write_text('\n'.join(f'{k}={v}' for k,v in vals.items())+'\n',encoding='utf-8')
          PY
      - name: Patch plugins for Xcode
        run: |
          set -euo pipefail
          PLUGIN_FILE="$HOME/.pub-cache/hosted/pub.dev/flutter_localization-0.4.1/ios/flutter_localization/Sources/flutter_localization/FlutterLocalizationPlugin.swift"
          test -f "$PLUGIN_FILE"
          python3 - "$PLUGIN_FILE" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text(encoding='utf-8')
          if 'registrar.messenger(),' in s: p.write_text(s.replace('registrar.messenger(),','registrar.messenger()'),encoding='utf-8')
          elif 'registrar.messenger()' not in s: raise SystemExit('Could not patch flutter_localization')
          PY
          DEVICE_INFO_FILE=$(find "$HOME/.pub-cache" -path "*device_info_plus*/FPPDeviceInfoPlusPlugin.m" -print -quit)
          if [ -n "$DEVICE_INFO_FILE" ]; then sed -i '' '/isiOSAppOnVision/d' "$DEVICE_INFO_FILE"; fi
      - name: Configure iOS
        run: |
          set -euo pipefail
          if [ ! -d ios ]; then flutter create --platforms=ios --org com.neogamelab --project-name neostation .; fi
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '18.0'/" ios/Podfile || true
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 18.0;/g' ios/Runner.xcodeproj/project.pbxproj || true
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.neogamelab.neostation" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string neostation" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :LSApplicationQueriesSchemes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:0 string retroarch" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:1 string shortcuts" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:2 string armsx2" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:3 string melonx" "$PLIST"
          plutil -lint "$PLIST"
      - name: Build unsigned IPA
        run: |
          set -euo pipefail
          dart run flutter_launcher_icons
          chmod +x build-utils/force_ios_fork_icon.sh
          build-utils/force_ios_fork_icon.sh
          (cd ios && pod install --repo-update)
          flutter build ios --release --no-codesign --dart-define-from-file=.env
          APP_PATH=$(find build/ios/iphoneos build/ios/Release-iphoneos -maxdepth 2 -type d -name '*.app' -print 2>/dev/null | head -n 1)
          test -n "$APP_PATH"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist" | grep -qx '144'
          test ! -d "$APP_PATH/_CodeSignature"
          test ! -f "$APP_PATH/embedded.mobileprovision"
          rm -rf build/ipa-package
          mkdir -p build/ipa-package/Payload
          cp -R "$APP_PATH" build/ipa-package/Payload/NeoStation.app
          (cd build/ipa-package && zip -qr ../../NeoStation-iOS-Unsigned-Build144.ipa Payload)
          shasum -a 256 NeoStation-iOS-Unsigned-Build144.ipa | tee build/ci/ipa-sha256.txt
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NeoStation-iOS-Unsigned-Build144
          path: |
            NeoStation-iOS-Unsigned-Build144.ipa
            build/ci/ipa-sha256.txt
          if-no-files-found: error
      - name: Report status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s NeoStation-iOS-Unsigned-Build144.ipa ]; then state=success; description='Build 144 IPA succeeded'; else state=failure; description='Build 144 IPA failed'; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$state" -f context=fin-library-build144 -f description="$description" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Cleanup secrets
        if: always()
        run: rm -f .env
