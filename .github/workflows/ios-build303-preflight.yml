name: NeoStation Build 303 RPCS3 preflight

run-name: Build 303 RPCS3 preflight • ${{ github.sha }}

on:
  push:
    branches:
      - experimental
    paths:
      - '.github/workflows/ios-build303-preflight.yml'
      - 'packages/rpcs3_internal_bridge/ios/Classes/Rpcs3InternalBridgePlugin.mm'
      - 'packages/rpcs3_internal_bridge/ios/Classes/Rpcs3JitBridgePlugin.mm'
      - 'packages/rpcs3_internal_bridge/ios/Classes/Rpcs3CoreABI.h'
      - 'packages/rpcs3_internal_bridge/lib/rpcs3_internal_bridge.dart'
      - 'lib/services/rpcs3_internal_service.dart'
      - 'lib/services/rpcs3_startup_transaction.dart'
      - 'lib/services/rpcs3_launch_service.dart'
      - 'lib/services/local_dev_vpn_route_service.dart'
      - 'test/rpcs3_bridge_memory_mode_test.dart'
      - 'test/rpcs3_internal_integration_test.dart'
      - 'test/rpcs3_lazy_load_contract_test.dart'
      - 'test/rpcs3_pod_header_visibility_test.py'
      - 'test/rpcs3_startup_transaction_test.dart'
      - 'test/rpcs3_boot_watchdog_test.dart'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: neostation-build-303-rpcs3-preflight
  cancel-in-progress: true

jobs:
  preflight:
    name: Validate Build 303 before full IPA
    runs-on: macos-15
    timeout-minutes: 35
    env:
      RPCS3_CORE_HOST_SHA: 7a3f9a1adaabde3d9d4441457ef8981f09665513
      RPCS3_CORE_RUN_ID: '35756574023'
      RPCS3_CORE_SHA256: b6a9bdccd5078e27336b3767df0632b901383edf3d3d498a52f6ad9a2ac681d5
      RPCS3_SOURCE_COMMIT: 22f1152783cef1f7e04af7b1c895173e28fd5b03
      HOMEBREW_NO_AUTO_UPDATE: '1'

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Validate minimal-launch source contract
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          from pathlib import Path

          bridge = Path('packages/rpcs3_internal_bridge/ios/Classes/Rpcs3InternalBridgePlugin.mm').read_text()
          abi = Path('packages/rpcs3_internal_bridge/ios/Classes/Rpcs3CoreABI.h').read_text()

          forbidden = (
              'reset_failed_startup',
              '_reservation',
              'Rpcs3ArenaReservation',
              'Rpcs3ArenaLayout',
              'reserveAddressSpace',
              'RPCS3_VA_NOT_RESERVED',
              'RPCS3_VA_OWNERSHIP_CHANGED',
              'RPCS3_VA_ROLLBACK_FAILED',
              'NEOSTATION_BUILD302_RESERVED_STARTUP_V1',
              '[N  if ([call.method',
          )
          for marker in forbidden:
              if marker in bridge or marker in abi:
                  raise SystemExit(f'Retired/corrupt Build 302 marker remains: {marker}')

          required = (
              'NEOSTATION_RPCS3_BUILD301_SINGLE_DLOPEN_V1',
              'RPCS3JitConfirmCoreLoadHandoff',
              'RPCS3_DEBUGGER_AUTHORIZATION_MISSING',
              'verifyJitExecution',
              'self->_api.shutdown()',
              'options.expanded_jit_region = expanded ? 1 : 0;',
              '@"core_load_begin"',
              '@"core_load_end"',
              '@"rpcs3_initialize_begin"',
              '@"rpcs3_initialize_end"',
              '@"game_boot_begin"',
              '@"game_boot_return"',
          )
          for marker in required:
              if marker not in bridge:
                  raise SystemExit(f'Required Build 303 marker missing: {marker}')

          if bridge.count('if ([call.method isEqualToString:@"abortStartup"])') != 1:
              raise SystemExit('abortStartup must have exactly one owner')
          if bridge.count('dlopen(') != 1:
              raise SystemExit('RPCS3 Core must have exactly one dlopen call')
          handoff = bridge.index('if (!RPCS3JitConfirmCoreLoadHandoff())')
          dlopen = bridge.index('handle = dlopen(')
          init = bridge.index('self->_api.initialize(&options)')
          if not handoff < dlopen < init:
              raise SystemExit('Required handoff -> dlopen -> initialize ordering is broken')
          print('Build 303 minimal-launch source contract: OK')
          PY
          python3 -m py_compile             build-utils/validate_rpcs3_recovery_core.py             build-utils/validate_rpcs3_passive_dlopen.py             build-utils/validate_rpcs3_ipa.py             test/rpcs3_recovery_core_contract_test.py             test/rpcs3_build303_restartable_lifecycle_test.py             test/rpcs3_loader_stability_280_test.py             test/rpcs3_build283_boot_stability_test.py             test/rpcs3_build285_core_handoff_test.py             test/rpcs3_diagnostics_native_test.py             test/rpcs3_jit_handshake_test.py             test/rpcs3_startup_abort_native_test.py             test/rpcs3_pod_header_visibility_test.py             test/rpcs3_reporter_send_order_test.py             test/rpcs3_host_entitlements_test.py             test/rpcs3_ipa_validation_test.py             test/local_dev_vpn_route_contract_test.py             test/rpcs3_helper_journal_test.py

      - name: Syntax-check RPCS3 Objective-C++ bridge
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          STUB="$RUNNER_TEMP/flutter-stub"
          mkdir -p "$STUB/Flutter"
          cat > "$STUB/Flutter/Flutter.h" <<'EOF'
          #import <Foundation/Foundation.h>
          typedef void (^FlutterResult)(id _Nullable result);
          FOUNDATION_EXPORT NSObject* const FlutterMethodNotImplemented;
          @protocol FlutterBinaryMessenger <NSObject>
          @end
          @class FlutterMethodCall;
          @class FlutterMethodChannel;
          @protocol FlutterPluginRegistrar <NSObject>
          @property(nonatomic, readonly) NSObject<FlutterBinaryMessenger>* messenger;
          - (void)addMethodCallDelegate:(id)delegate channel:(FlutterMethodChannel*)channel;
          @end
          @protocol FlutterPlugin <NSObject>
          + (void)registerWithRegistrar:(NSObject<FlutterPluginRegistrar>*)registrar;
          @end
          @interface FlutterMethodCall : NSObject
          @property(nonatomic, readonly) NSString* method;
          @property(nonatomic, readonly) id arguments;
          @end
          @interface FlutterMethodChannel : NSObject
          + (instancetype)methodChannelWithName:(NSString*)name
                            binaryMessenger:(NSObject<FlutterBinaryMessenger>*)messenger;
          - (void)invokeMethod:(NSString*)method arguments:(id)arguments;
          @end
          EOF
          COMMON=(
            -std=c++20 -fobjc-arc -fblocks -fsyntax-only -x objective-c++
            -isysroot "$SDK" -miphoneos-version-min=17.4
            -I"$STUB"
            -Ipackages/rpcs3_internal_bridge/ios/Classes
          )
          xcrun --sdk iphoneos clang++ "${COMMON[@]}"             packages/rpcs3_internal_bridge/ios/Classes/Rpcs3InternalBridgePlugin.mm
          xcrun --sdk iphoneos clang++ "${COMMON[@]}"             packages/rpcs3_internal_bridge/ios/Classes/Rpcs3JitBridgePlugin.mm

      - name: Resolve Flutter and analyze
        shell: bash
        run: |
          set -euo pipefail
          flutter clean
          flutter pub get --enforce-lockfile
          flutter analyze --no-fatal-infos

      - name: Run complete Build 303 pre-build regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 test/dolphin_account_267_test.py
          python3 test/dolphin_cheats_menu_test.py
          python3 test/rpcs3_recovery_core_contract_test.py
          python3 test/rpcs3_build303_restartable_lifecycle_test.py
          python3 test/rpcs3_build301_passive_dlopen_test.py
          python3 test/rpcs3_loader_stability_280_test.py
          python3 test/rpcs3_build283_boot_stability_test.py
          python3 test/rpcs3_build285_core_handoff_test.py
          python3 test/rpcs3_diagnostics_native_test.py
          python3 test/rpcs3_jit_handshake_test.py
          python3 test/rpcs3_startup_abort_native_test.py
          python3 test/rpcs3_pod_header_visibility_test.py
          python3 test/rpcs3_reporter_send_order_test.py
          python3 test/rpcs3_host_entitlements_test.py
          python3 test/rpcs3_ipa_validation_test.py
          python3 test/dolphin_ipa_validator_test.py
          python3 test/local_dev_vpn_route_contract_test.py
          python3 test/armsx2_vm_shutdown_test.py
          python3 test/rpcs3_helper_journal_test.py
          node test/rpcs3_debugger_handshake_test.js
          node test/rpcs3_stop_reply_behavior_test.js
          flutter test             test/rpcs3_startup_transaction_test.dart             test/rpcs3_bridge_memory_mode_test.dart             test/local_jit_route_proof_test.dart             test/rpcs3_boot_watchdog_test.dart             test/rpcs3_internal_integration_test.dart             test/rpcs3_lazy_load_contract_test.dart             test/game_deletion_regression_test.dart             test/game_repository_test.dart             test/rpcs3_library_service_test.dart             test/rpcs3_regular_arena_dolphin_multidelete_contract_test.dart             test/stikjit_armsx2_isolation_test.dart             test/armsx2_launch_url_encoding_test.dart             test/armsx2_retroarch_routing_isolation_test.dart             test/armsx2_embedded_library_contract_test.dart             test/armsx2_bios_selection_test.dart             test/jit_backend_preference_service_test.dart             test/emulator_seed_default_test.dart

      - name: Download validated recovery Core
        uses: actions/download-artifact@v4
        with:
          name: RPCS3Core-${{ env.RPCS3_CORE_HOST_SHA }}
          run-id: ${{ env.RPCS3_CORE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/rpcs3-native

      - name: Validate exact recovery Core and source drift
        shell: bash
        run: |
          set -euo pipefail
          CORE=dist/rpcs3-native/libRPCS3Core.dylib
          IDENTITY=dist/rpcs3-native/identity.json
          test -s "$CORE"
          test -s "$IDENTITY"
          git diff --exit-code "$RPCS3_CORE_HOST_SHA" "$GITHUB_SHA" --             build-utils/build_rpcs3_recovery_core.sh             build-utils/patch_rpcs3_build301_passive_dlopen.py             build-utils/patch_rpcs3_build303_restartable_lifecycle.py             build-utils/validate_rpcs3_recovery_core.py             build-utils/validate_rpcs3_passive_dlopen.py             test/rpcs3_recovery_core_contract_test.py             test/rpcs3_build303_restartable_lifecycle_test.py             .github/workflows/rpcs3-core.yml
          python3 build-utils/validate_rpcs3_recovery_core.py "$CORE"
          python3 build-utils/validate_rpcs3_passive_dlopen.py "$CORE"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          core=Path('dist/rpcs3-native/libRPCS3Core.dylib')
          identity=json.loads(Path('dist/rpcs3-native/identity.json').read_text())
          actual=hashlib.sha256(core.read_bytes()).hexdigest()
          assert identity['host_commit'] == os.environ['RPCS3_CORE_HOST_SHA'], identity
          assert identity['source_commit'] == os.environ['RPCS3_SOURCE_COMMIT'], identity
          assert identity['abi_version'] == 30, identity
          assert identity['architectures'] == ['arm64'], identity
          assert identity['sha256'] == os.environ['RPCS3_CORE_SHA256'], identity
          assert actual == identity['sha256'], (actual, identity)
          assert identity['reservation'] == 'Core-owned mmap exact-hint search; no Build295/302 fixed host reservation', identity
          assert identity['jit_policy'] == 'Build266 adaptive Core-owned arena + Build301 passive dlopen', identity
          assert identity['restartable_lifecycle_marker'] == 'NEOSTATION_BUILD303_RESTARTABLE_LIFECYCLE_V1', identity
          print(json.dumps(identity, indent=2))
          PY
          nm -gU "$CORE" > /tmp/rpcs3-303-exports.txt
          grep -q ' _rpcs3_ios_initialize$' /tmp/rpcs3-303-exports.txt
          grep -q ' _rpcs3_ios_boot_game$' /tmp/rpcs3-303-exports.txt
          grep -q ' _rpcs3_ios_run_llvm_self_test$' /tmp/rpcs3-303-exports.txt
          grep -q ' _rpcs3_ios_shutdown$' /tmp/rpcs3-303-exports.txt
          ! grep -q ' _neostation_rpcs3_adopt_jit_layout$' /tmp/rpcs3-303-exports.txt
          ! grep -q ' _neostation_rpcs3_reset_failed_startup$' /tmp/rpcs3-303-exports.txt
