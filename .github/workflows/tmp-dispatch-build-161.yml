name: Temporary dispatch NeoStation iOS Build 161

on:
  push:
    branches:
      - feature/riisu-system-art-pack
    paths:
      - '.github/workflows/tmp-dispatch-build-161.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Build NeoStation iOS IPA on feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-ios-ipa.yml --repo "$GITHUB_REPOSITORY" --ref feature/riisu-system-art-pack
