name: Repair cleaned tree syntax

on:
  push:
    branches: [fix/disable-ios-standalone-neosync]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Restore dialog closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/game_screen/my_games_list.dart')
          text = p.read_text()
          old = "        onGameDeleted: _handleGameDeleted,\n    );\n  }\n\n  /// Terminates all active multimedia and background processing tasks."
          new = "        onGameDeleted: _handleGameDeleted,\n      ),\n    );\n  }\n\n  /// Terminates all active multimedia and background processing tasks."
          if old not in text:
              raise SystemExit('Expected dialog-closure anchor not found')
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          rm .github/workflows/syntax-repair.yml
          git config user.name "Tarble FR"
          git config user.email "f9wynyv9qy@privaterelay.appleid.com"
          git add -A
          git commit -m "fix: restore settings dialog closure"
          git push origin HEAD:"$GITHUB_REF_NAME"
