name: NeoStation iOS - Dolphin Internal Isolated v2
run-name: Dolphin Internal Isolated v2 • ${{ github.sha }}

on:
  push:
    branches:
      - test/dolphin-internal-engine-isolated-v2
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: neostation-dolphin-internal-isolated-v2
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build isolated internal Dolphin IPA
    runs-on: macos-15
    timeout-minutes: 360

    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      ARTIFACT_BASENAME: NeoStation-Dolphin-Internal-Isolated-v2
      SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
      SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}

    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4
        with:
          ref: test/dolphin-internal-engine-isolated-v2
          fetch-depth: 0

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install native build tools
        shell: bash
        run: |
          set -euo pipefail
          command -v cmake >/dev/null || brew install cmake
          command -v ninja >/dev/null || brew install ninja
          command -v bartycrouch >/dev/null || brew install bartycrouch
          python3 -m pip install --user --break-system-packages polib
          chmod +x \
            build-utils/apply_dolphin_internal_patch.py \
            build-utils/apply_dolphin_isolation_v2.py \
            build-utils/check_dolphin_isolation.py \
            build-utils/build_dolphin_internal_framework.sh \
            build-utils/refine_dolphin_internal_core_v2.py

      - name: Materialize isolated Dolphin integration
        shell: bash
        run: |
          set -euo pipefail
          python3 build-utils/apply_dolphin_isolation_v2.py
          git diff --stat | tee dolphin-source-diff.txt

      - name: Validate non-regression boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 build-utils/check_dolphin_isolation.py | tee dolphin-isolation-check.txt

      - name: Prepare build-time defines
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          values = {
              'SCREENSCRAPER_DEV_ID': os.environ.get('SCREENSCRAPER_DEV_ID', ''),
              'SCREENSCRAPER_DEV_PASSWORD': os.environ.get('SCREENSCRAPER_DEV_PASSWORD', ''),
              'NEOSTATION_EXPERIMENTAL_STIKJIT_MELONX': 'true',
              'NEOSTATION_MELONX_BUNDLE_ID': 'com.nur.nx',
              'NEOSTATION_EXPERIMENTAL_STIKJIT_ARMSX2': 'true',
              'NEOSTATION_ARMSX2_BUNDLE_ID': 'com.xitrix.ARMSX2',
              'NEOSTATION_EXPERIMENTAL_STIKJIT_RPCS3': 'true',
              'NEOSTATION_RPCS3_BUNDLE_ID': 'com.xitrix.RPCS3',
          }
          Path('.dart-defines.json').write_text(json.dumps(values), encoding='utf-8')
          print('Prepared Dart defines without printing secret values.')
          PY

      - name: Restore StikJIT 1.5.0
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/StikJIT.xcframework.zip"
          EXTRACT="$RUNNER_TEMP/stikjit-1.5.0"
          DEST="$GITHUB_WORKSPACE/packages/stikjit_bridge/ios/Frameworks"
          rm -rf "$EXTRACT" "$DEST/StikJIT.xcframework" "$ARCHIVE"
          mkdir -p "$EXTRACT" "$DEST"
          curl -fL --retry 3 --retry-delay 2 \
            'https://github.com/StikDebug/StikJIT/releases/download/1.5.0/StikJIT.xcframework.zip' \
            -o "$ARCHIVE"
          echo '444b8d439df8455c34afbb51e279fd225265279195475f9b3fdbcf3a71a27e85  '"$ARCHIVE" | shasum -a 256 -c -
          unzip -q "$ARCHIVE" -d "$EXTRACT"
          FOUND="$(find "$EXTRACT" -type d -name StikJIT.xcframework -print -quit)"
          test -n "$FOUND"
          cp -R "$FOUND" "$DEST/StikJIT.xcframework"
          test -f "$DEST/StikJIT.xcframework/ios-arm64/StikJIT.framework/StikJIT"

      - name: Build pinned arm64 Dolphin Core framework
        shell: bash
        run: |
          set -euo pipefail
          build-utils/build_dolphin_internal_framework.sh

      - name: Resolve Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get

      - name: Scaffold iOS platform
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d ios ]; then
            flutter create \
              --platforms=ios \
              --org com.neogamelab \
              --project-name neostation \
              .
          fi

      - name: Configure iOS application without changing emulator routes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          podfile = Path('ios/Podfile')
          text = podfile.read_text(encoding='utf-8')
          if re.search(r"^platform :ios, '[^']+'", text, flags=re.M):
              text = re.sub(r"^platform :ios, '[^']+'", "platform :ios, '17.4'", text, flags=re.M)
          elif re.search(r"^# platform :ios, '[^']+'", text, flags=re.M):
              text = re.sub(r"^# platform :ios, '[^']+'", "platform :ios, '17.4'", text, flags=re.M)
          else:
              text = "platform :ios, '17.4'\n" + text
          podfile.write_text(text, encoding='utf-8')

          project = Path('ios/Runner.xcodeproj/project.pbxproj')
          project_text = project.read_text(encoding='utf-8')
          project_text = re.sub(
              r'IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;',
              'IPHONEOS_DEPLOYMENT_TARGET = 17.4;',
              project_text,
          )
          project.write_text(project_text, encoding='utf-8')
          PY

          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName NeoStation' "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c 'Add :CFBundleDisplayName string NeoStation' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Delete :UISupportedInterfaceOrientations' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations array' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Delete :UISupportedInterfaceOrientations~ipad' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations~ipad array' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationLandscapeLeft' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationLandscapeRight' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Set :UIFileSharingEnabled true' "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c 'Add :UIFileSharingEnabled bool true' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Set :LSSupportsOpeningDocumentsInPlace true' "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c 'Add :LSSupportsOpeningDocumentsInPlace bool true' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Set :CADisableMinimumFrameDurationOnPhone true' "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c 'Add :CADisableMinimumFrameDurationOnPhone bool true' "$PLIST"

          # Preserve all pre-existing external integration query schemes. Dolphin
          # itself receives no URL scheme and never opens a second application.
          /usr/libexec/PlistBuddy -c 'Delete :CFBundleURLTypes' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes array' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes:0 dict' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes:0:CFBundleURLName string com.neogamelab.neostation' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes:0:CFBundleURLSchemes array' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string neostation' "$PLIST"

          /usr/libexec/PlistBuddy -c 'Delete :LSApplicationQueriesSchemes' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :LSApplicationQueriesSchemes array' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :LSApplicationQueriesSchemes:0 string retroarch' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :LSApplicationQueriesSchemes:1 string shortcuts' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :LSApplicationQueriesSchemes:2 string armsx2' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :LSApplicationQueriesSchemes:3 string melonx' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :LSApplicationQueriesSchemes:4 string stikdebug' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :LSApplicationQueriesSchemes:5 string rpcs3' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :LSApplicationQueriesSchemes:6 string armsx3' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :LSApplicationQueriesSchemes:7 string manicemu' "$PLIST"
          plutil -lint "$PLIST"

          cat > ios/Runner/Runner.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>get-task-allow</key><true/>
          </dict></plist>
          PLIST

          python3 - <<'PY'
          from pathlib import Path
          project = Path('ios/Runner.xcodeproj/project.pbxproj')
          text = project.read_text(encoding='utf-8')
          anchor = 'PRODUCT_BUNDLE_IDENTIFIER = com.neogamelab.neostation;'
          replacement = anchor + '\n\t\t\t\tCODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements;'
          if 'CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements;' not in text:
              if anchor not in text:
                  raise SystemExit('Runner bundle identifier anchor not found')
              text = text.replace(anchor, replacement)
          project.write_text(text, encoding='utf-8')
          PY

      - name: Patch device_info_plus runner compatibility
        shell: bash
        run: |
          DEVICE_INFO_FILE="$(find "$HOME/.pub-cache" -path '*device_info_plus*/FPPDeviceInfoPlusPlugin.m' 2>/dev/null | head -1)"
          if [ -n "$DEVICE_INFO_FILE" ]; then
            sed -i '' '/isiOSAppOnVision/d' "$DEVICE_INFO_FILE"
          fi

      - name: Generate and enforce NeoStation icon
        shell: bash
        run: |
          set -euo pipefail
          dart run flutter_launcher_icons
          chmod +x build-utils/force_ios_fork_icon.sh
          build-utils/force_ios_fork_icon.sh

      - name: Install CocoaPods dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          pod install --repo-update | tee ../build/pod-install-dolphin.log

      - name: Configure release build
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios \
            --release \
            --no-codesign \
            --config-only \
            --dart-define-from-file=.dart-defines.json

      - name: Analyze and test all integrations
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-infos | tee build/flutter-analyze.log
          flutter test | tee build/flutter-test.log

      - name: Build unsigned arm64 application
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/ios/DolphinDerivedData build/ios/dolphin-unsigned
          mkdir -p build/ios
          set -o pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DolphinDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            PROVISIONING_PROFILE_SPECIFIER='' \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            build | tee build/ios/xcodebuild-dolphin-internal.log

      - name: Verify embedded engines and package real IPA
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_DIR=build/ios/DolphinDerivedData/Build/Products/Release-iphoneos
          APP_PATH="$(find "$PRODUCT_DIR" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"

          rm -rf "$APP_PATH/Sys"
          ditto build/dolphin-internal/Sys "$APP_PATH/Sys"
          test -f "$APP_PATH/Sys/GC/dsp_rom.bin"

          test -f "$APP_PATH/Frameworks/DolphinCore.framework/DolphinCore"
          test -f "$APP_PATH/Frameworks/StikJIT.framework/StikJIT"
          lipo -info "$APP_PATH/Frameworks/DolphinCore.framework/DolphinCore" | tee build/dolphin-framework-arch.txt
          nm -gU "$APP_PATH/Frameworks/DolphinCore.framework/DolphinCore" | tee build/dolphin-framework-symbols.txt
          grep -q '_neostation_dolphin_launch$' build/dolphin-framework-symbols.txt
          grep -q '_neostation_dolphin_prepare_legacy_jit$' build/dolphin-framework-symbols.txt

          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"
          test -f "$APP_PATH/$EXECUTABLE"
          file "$APP_PATH/$EXECUTABLE" | tee build/neostation-executable-file.txt
          otool -L "$APP_PATH/$EXECUTABLE" | tee build/neostation-linked-frameworks.txt
          grep -q 'DolphinCore.framework/DolphinCore' build/neostation-linked-frameworks.txt

          plutil -extract LSApplicationQueriesSchemes json -o - "$APP_PATH/Info.plist" | tee build/ios-query-schemes.json
          for scheme in retroarch shortcuts armsx2 melonx stikdebug rpcs3 armsx3 manicemu; do
            grep -q "\"$scheme\"" build/ios-query-schemes.json
          done
          ! grep -qi 'dolphinios' build/ios-query-schemes.json
          ! find "$APP_PATH" -type d -name 'DolphiniOS.app' -print -quit | grep -q .

          PACKAGE_ROOT=build/ios/dolphin-unsigned
          mkdir -p "$PACKAGE_ROOT/Payload"
          ditto "$APP_PATH" "$PACKAGE_ROOT/Payload/NeoStation.app"
          test "$(find "$PACKAGE_ROOT/Payload" -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')" = '1'
          test ! -d "$PACKAGE_ROOT/Payload/DolphiniOS.app"
          (
            cd "$PACKAGE_ROOT"
            zip -qry "$GITHUB_WORKSPACE/${ARTIFACT_BASENAME}.ipa" Payload
          )
          test -s "${ARTIFACT_BASENAME}.ipa"
          unzip -l "${ARTIFACT_BASENAME}.ipa" | tee build/ipa-contents.txt
          grep -q 'Payload/NeoStation.app/' build/ipa-contents.txt
          grep -q 'Payload/NeoStation.app/Frameworks/DolphinCore.framework/DolphinCore' build/ipa-contents.txt
          ! grep -q 'DolphiniOS.app' build/ipa-contents.txt
          shasum -a 256 "${ARTIFACT_BASENAME}.ipa" | tee "${ARTIFACT_BASENAME}.ipa.sha256"

      - name: Upload compilation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeoStation-Dolphin-Internal-Isolated-v2-Logs
          path: |
            dolphin-source-diff.txt
            dolphin-isolation-check.txt
            build/dolphin-internal/dolphin-core-build.log
            build/dolphin-internal/dolphin-revision.txt
            build/pod-install-dolphin.log
            build/flutter-analyze.log
            build/flutter-test.log
            build/ios/xcodebuild-dolphin-internal.log
            build/dolphin-framework-arch.txt
            build/dolphin-framework-symbols.txt
            build/neostation-executable-file.txt
            build/neostation-linked-frameworks.txt
            build/ios-query-schemes.json
            build/ipa-contents.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload installable IPA
        uses: actions/upload-artifact@v4
        with:
          name: NeoStation-Dolphin-Internal-Isolated-v2-IPA
          path: |
            NeoStation-Dolphin-Internal-Isolated-v2.ipa
            NeoStation-Dolphin-Internal-Isolated-v2.ipa.sha256
          if-no-files-found: error
          retention-days: 30
