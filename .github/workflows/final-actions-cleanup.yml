name: Final Actions cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/final-actions-cleanup.yml

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete previous runs and remove this workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          WORKFLOW_PATH: .github/workflows/final-actions-cleanup.yml
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          current = int(os.environ['CURRENT_RUN_ID'])
          base = f'https://api.github.com/repos/{repo}'
          headers = {
              'Authorization': 'Bearer ' + token,
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'neostation-final-actions-cleanup',
          }
          request = urllib.request.Request(base + '/actions/runs?per_page=100', headers=headers)
          with urllib.request.urlopen(request, timeout=30) as response:
              runs = json.loads(response.read()).get('workflow_runs', [])
          for run in runs:
              run_id = int(run['id'])
              if run_id == current:
                  continue
              req = urllib.request.Request(base + f'/actions/runs/{run_id}', method='DELETE', headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      print(f'previous run {run_id}: DELETE -> {response.status}')
              except urllib.error.HTTPError as exc:
                  if exc.code not in (403, 404, 409, 422):
                      raise
                  print(f'previous run {run_id}: DELETE -> {exc.code}')
          PY

          encoded_path=".github/workflows/final-actions-cleanup.yml"
          file_sha=$(curl -fsS "${auth[@]}" "$api/contents/$encoded_path?ref=main" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
          curl -fsS -X DELETE "${auth[@]}" "$api/contents/$encoded_path" \
            -d "{\"message\":\"chore: remove final Actions cleanup\",\"sha\":\"$file_sha\",\"branch\":\"main\"}" >/dev/null

          cat > /tmp/delete-current-run.sh <<'SH'
          #!/usr/bin/env bash
          sleep 6
          for delay in 0 2 4 6 8; do
            [ "$delay" = 0 ] || sleep "$delay"
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/actions/runs/$CURRENT_RUN_ID" || true)
            [ "$code" = 204 ] && exit 0
          done
          exit 0
          SH
          chmod 700 /tmp/delete-current-run.sh
          env -u RUNNER_TRACKING_ID nohup /tmp/delete-current-run.sh >/dev/null 2>&1 < /dev/null &
          echo "Final self-cleanup scheduled."
