name: Temporary Build 324 IPA transfer
run-name: Temporary Build 324 IPA transfer • ${{ github.sha }}

on:
  push:
    branches: [experimental]
    paths:
      - '.github/workflows/tmp-build324-transfer.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: tmp-build-324-kartpad-rvz-settings-candidate
      ASSET: NeoStation-iOS-Build-324-KartPad-RVZ-Settings-Candidate.ipa
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download validated Build 324
        uses: actions/download-artifact@v4
        with:
          name: NeoStation-iOS-Build-324-KartPad-RVZ-Settings-Candidate
          run-id: 36008875247
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build324

      - name: Publish temporary direct IPA asset
        shell: bash
        run: |
          set -euo pipefail
          IPA="$(find build324 -type f -name '*.ipa' | head -n1)"
          test -n "$IPA"
          cp "$IPA" "$ASSET"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$ASSET"             --prerelease             --title "Temporary Build 324 IPA transfer"             --notes "Temporary transfer asset for the validated Build 324 KartPad RVZ Settings Candidate."
          shasum -a 256 "$ASSET"
