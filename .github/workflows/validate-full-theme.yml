name: Validate Full Theme

on:
  push:
    branches:
      - feature/full-theme-arcadeplanet
      - work/full-theme-build262-sync260
    paths:
      - 'lib/**'
      - 'test/full_theme_category_contract_test.py'
      - 'pubspec.yaml'
      - '.github/workflows/validate-full-theme.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-full-theme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Validate Build 260 preservation contract
        run: python3 test/full_theme_category_contract_test.py
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze full-theme integration
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
