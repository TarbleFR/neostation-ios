name: Build RetroArch Root First Run 171 V2

on:
  push:
    branches:
      - test/retroarch-root-first-run-171

permissions:
  contents: read

concurrency:
  group: neostation-retroarch-root-first-run-171-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      BUILD_NUMBER: '171'
      ARTIFACT_BASENAME: NeoStation-iOS-Build-171-RetroArch-Root-Autodetect
      SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
      SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: test/retroarch-root-first-run-171
          fetch-depth: 1

      - name: Apply source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 build-utils/patch_retroarch_root_first_run.py
          git diff --check
          grep -q 'IosRomLibraryRootResolver' lib/widgets/setup_wizard.dart
          grep -q 'romScanRoot' lib/screens/settings_screen/new_settings_options/directories_settings_content.dart

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare build defines
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import json,os; from pathlib import Path; req=('SCREENSCRAPER_DEV_ID','SCREENSCRAPER_DEV_PASSWORD'); vals={k:os.environ.get(k,'') for k in req}; missing=[k for k,v in vals.items() if not v]; (_ for _ in ()).throw(SystemExit('Missing secrets: '+', '.join(missing))) if missing else None; vals.update({'NEOSTATION_EXPERIMENTAL_STIKJIT_MELONX':'true','NEOSTATION_MELONX_BUNDLE_ID':'com.nur.nx','NEOSTATION_EXPERIMENTAL_STIKJIT_ARMSX2':'true','NEOSTATION_ARMSX2_BUNDLE_ID':'com.armsx2.ios','NEOSTATION_EXPERIMENTAL_STIKJIT_RPCS3':'true','NEOSTATION_RPCS3_BUNDLE_ID':'com.xitrix.RPCS3'}); Path('.dart-defines.json').write_text(json.dumps(vals),encoding='utf-8')"

      - name: Restore StikJIT framework
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE=/tmp/StikJIT.xcframework.zip
          EXTRACT=/tmp/neostation-stikjit
          DEST=packages/stikjit_bridge/ios/Frameworks
          rm -rf "$EXTRACT" "$DEST/StikJIT.xcframework" "$ARCHIVE"
          mkdir -p "$EXTRACT" "$DEST"
          curl -fL --retry 3 --retry-delay 2 'https://github.com/StikDebug/StikJIT/releases/download/1.5.0/StikJIT.xcframework.zip' -o "$ARCHIVE"
          echo '444b8d439df8455c34afbb51e279fd225265279195475f9b3fdbcf3a71a27e85  /tmp/StikJIT.xcframework.zip' | shasum -a 256 -c -
          unzip -q "$ARCHIVE" -d "$EXTRACT"
          FRAMEWORK=$(find "$EXTRACT" -type d -name 'StikJIT.xcframework' -print -quit)
          test -n "$FRAMEWORK"
          cp -R "$FRAMEWORK" "$DEST/StikJIT.xcframework"

      - name: Analyze and test
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze --no-fatal-infos lib/services/ios_rom_library_root_resolver.dart lib/widgets/setup_wizard.dart lib/screens/settings_screen/new_settings_options/directories_settings_content.dart lib/services/retroarch_config_service.dart lib/main.dart
          flutter test test/ios_rom_library_root_resolver_test.dart test/jit_backend_preference_service_test.dart test/stikjit_armsx2_isolation_test.dart test/stikjit_rpcs3_isolation_test.dart

      - name: Generate clean iOS scaffold
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ios
          flutter create --platforms=ios --org com.neogamelab --project-name neostation .

      - name: Configure iOS runtime
        shell: bash
        run: |
          set -euo pipefail
          if [ -f build-utils/patch_ios_video_player_audio_session.py ]; then python3 build-utils/patch_ios_video_player_audio_session.py; fi
          DEVICE_INFO_FILE=$(find "$HOME/.pub-cache" -path '*device_info_plus*/FPPDeviceInfoPlusPlugin.m' 2>/dev/null | head -1 || true)
          if [ -n "$DEVICE_INFO_FILE" ]; then sed -i '' '/isiOSAppOnVision/d' "$DEVICE_INFO_FILE"; fi
          python3 -c "from pathlib import Path; import re; p=Path('ios/Podfile'); t=p.read_text(); pattern=re.compile(r\"(?m)^\\s*#?\\s*platform\\s+:ios\\s*,\\s*['\\\"][^'\\\"]+['\\\"]\\s*$\"); p.write_text(pattern.sub(\"platform :ios, '18.0'\",t,count=1) if pattern.search(t) else \"platform :ios, '18.0'\\n\\n\"+t); q=Path('ios/Runner.xcodeproj/project.pbxproj'); s=q.read_text(); s,n=re.subn(r'IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;', 'IPHONEOS_DEPLOYMENT_TARGET = 18.0;', s); (_ for _ in ()).throw(SystemExit('No deployment target')) if n==0 else None; s=s.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;\\n\\t\\t\\t\\tCODE_SIGNING_ALLOWED = NO;\\n\\t\\t\\t\\tCODE_SIGNING_REQUIRED = NO;'); q.write_text(s)"
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c 'Delete :UISupportedInterfaceOrientations' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations array' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Delete :UISupportedInterfaceOrientations~ipad' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations~ipad array' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationLandscapeLeft' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationLandscapeRight' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :UIFileSharingEnabled bool true' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :LSSupportsOpeningDocumentsInPlace bool true' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Delete :CFBundleURLTypes' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes array' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes:0 dict' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes:0:CFBundleURLName string com.neogamelab.neostation' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes:0:CFBundleURLSchemes array' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string neostation' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Delete :LSApplicationQueriesSchemes' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :LSApplicationQueriesSchemes array' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :LSApplicationQueriesSchemes:0 string retroarch' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :LSApplicationQueriesSchemes:1 string shortcuts' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :LSApplicationQueriesSchemes:2 string armsx2' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :LSApplicationQueriesSchemes:3 string melonx' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :LSApplicationQueriesSchemes:4 string neomelonx' "$PLIST"

      - name: Generate app icon
        shell: bash
        run: |
          set -euo pipefail
          dart run flutter_launcher_icons
          if [ -f build-utils/force_ios_fork_icon.sh ]; then chmod +x build-utils/force_ios_fork_icon.sh && build-utils/force_ios_fork_icon.sh; fi

      - name: Build unsigned app
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --build-number="$BUILD_NUMBER" --dart-define-from-file=.dart-defines.json 2>&1 | tee build-ios.log
          test -d build/ios/iphoneos/Runner.app

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          STAGING=/tmp/neostation-retroarch-root-171
          rm -rf "$STAGING"
          mkdir -p "$STAGING/Payload"
          cp -R build/ios/iphoneos/Runner.app "$STAGING/Payload/Runner.app"
          (cd "$STAGING" && /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/${ARTIFACT_BASENAME}.ipa")
          test -s "${ARTIFACT_BASENAME}.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_BASENAME }}
          path: |
            ${{ env.ARTIFACT_BASENAME }}.ipa
            build-ios.log
          if-no-files-found: error
          retention-days: 30
