name: NeoPlay Windows application
on:
  push:
    branches: [experimental]
    paths:
      - 'tools/neoplay-receiver/**'
      - '.github/workflows/neoplay-exe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and build integrated NeoPlay
        working-directory: tools/neoplay-receiver
        env:
          NEOPLAY_SOURCE_SHA: ${{ github.sha }}
        run: |
          npm ci --ignore-scripts
          npm test
          node node_modules/electron/install.js
          npm run build:windows
          $p = Start-Process -FilePath '.\dist\win-unpacked\NeoPlay.exe' -ArgumentList '--smoke-test', '--report=embedded-smoke.json' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          npm run build:installer
      - uses: actions/upload-artifact@v4
        with:
          name: NeoPlay-0.8.0-${{ github.sha }}
          path: |
            tools/neoplay-receiver/dist/NeoPlay-Setup-0.8.0.exe
            tools/neoplay-receiver/dist/build.json
            tools/neoplay-receiver/dist/installer.json
            tools/neoplay-receiver/embedded-smoke.json
          if-no-files-found: error
          retention-days: 30
