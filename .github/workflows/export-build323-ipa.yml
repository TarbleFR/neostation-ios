name: Export Build 323 IPA chunks
run-name: Export Build 323 IPA chunks • ${{ github.sha }}

on:
  push:
    branches: [experimental]
    paths:
      - '.github/workflows/export-build323-ipa.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  export:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download validated Build 323 artifact
        uses: actions/download-artifact@v4
        with:
          name: NeoStation-iOS-Build-323-KartPad-Donor-Candidate
          run-id: 35995082095
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build323

      - name: Extract IPA and split for transfer
        shell: bash
        run: |
          set -euo pipefail
          IPA="$(find build323 -type f -name '*.ipa' | head -n1)"
          test -n "$IPA"
          mkdir -p transfer
          cp "$IPA" transfer/NeoStation-iOS-Build-323-KartPad-Donor-Candidate.ipa
          shasum -a 256 transfer/NeoStation-iOS-Build-323-KartPad-Donor-Candidate.ipa | tee transfer/NeoStation-iOS-Build-323-KartPad-Donor-Candidate.sha256
          split -b 70m -d -a 2 transfer/NeoStation-iOS-Build-323-KartPad-Donor-Candidate.ipa transfer/ipa.part.
          rm transfer/NeoStation-iOS-Build-323-KartPad-Donor-Candidate.ipa
          ls -lh transfer

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: Build323-IPA-part-00
          path: transfer/ipa.part.00
          compression-level: 0
          if-no-files-found: error
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: Build323-IPA-part-01
          path: transfer/ipa.part.01
          compression-level: 0
          if-no-files-found: error
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: Build323-IPA-part-02
          path: transfer/ipa.part.02
          compression-level: 0
          if-no-files-found: error
      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: Build323-IPA-checksum
          path: transfer/NeoStation-iOS-Build-323-KartPad-Donor-Candidate.sha256
          if-no-files-found: error
