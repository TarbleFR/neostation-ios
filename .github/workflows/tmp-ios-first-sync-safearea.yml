name: Temporary iOS branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-ios-first-sync-safearea.yml'

permissions:
  contents: write

jobs:
  cleanup-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete merged feature branch
        run: git push origin --delete automation/ios-first-sync-safearea-159 || true
