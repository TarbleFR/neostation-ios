name: Temporary iOS onboarding and Safe Area fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-ios-first-sync-safearea.yml'

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply fixes
        run: |
          set -euo pipefail
          git checkout -B automation/ios-first-sync-safearea-159
          python3 build-utils/tmp_apply_ios_first_sync_safearea.py
          git diff --check
          git diff --stat

      - name: Commit feature branch
        run: |
          set -euo pipefail
          git config user.name 'Tarble FR'
          git config user.email 'f9wynyv9qy@privaterelay.appleid.com'
          git add \
            lib/widgets/setup_wizard.dart \
            lib/screens/game_screen/my_games_list.dart \
            lib/screens/game_screen/my_games_grid.dart \
            lib/screens/game_screen/my_games_carousel.dart \
            pubspec.yaml
          git commit -m 'Auto-sync iOS libraries and respect Dynamic Island'
          git push --force origin HEAD:automation/ios-first-sync-safearea-159
