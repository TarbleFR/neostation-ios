name: Temporary iOS library routing fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-ios-library-routing.yml'

permissions:
  contents: write

jobs:
  prepare-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply routing fix
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B automation/ios-library-routing-160
          python3 build-utils/tmp_apply_ios_library_routing.py
          dart format \
            lib/services/ios_emulator_preference_service.dart \
            lib/services/game/game_launch_service.dart \
            test/ios_system_emulator_association_test.dart
          git diff --check

      - name: Run targeted regression tests
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter test test/ios_system_emulator_association_test.dart

      - name: Commit feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tarble FR'
          git config user.email 'f9wynyv9qy@privaterelay.appleid.com'
          git add \
            lib/services/ios_emulator_preference_service.dart \
            lib/services/game/game_launch_service.dart \
            test/ios_system_emulator_association_test.dart \
            pubspec.yaml
          git commit -m 'Route iOS games by actual library membership'
          git push --force origin HEAD:automation/ios-library-routing-160
