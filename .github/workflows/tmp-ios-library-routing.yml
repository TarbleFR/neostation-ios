name: Temporary iOS routing cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-ios-library-routing.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete merged routing branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete automation/ios-library-routing-160 || true
