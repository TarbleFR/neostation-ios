name: Temporary iOS library routing fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-ios-library-routing.yml'

permissions:
  contents: write

jobs:
  prepare-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply routing fix
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B automation/ios-library-routing-160
          python3 build-utils/tmp_apply_ios_library_routing.py
          sed -i "/import 'package:neostation\/services\/manic_emu_library_service.dart';/a import 'package:path/path.dart' as path;" test/manic_emu_library_service_test.dart
          dart format \
            lib/services/manic_emu_library_service.dart \
            lib/services/game/game_launch_service.dart \
            test/manic_emu_library_service_test.dart
          git diff --check

      - name: Run targeted regression tests
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter test test/ios_system_emulator_association_test.dart
          flutter test test/manic_emu_library_service_test.dart

      - name: Commit feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tarble FR'
          git config user.email 'f9wynyv9qy@privaterelay.appleid.com'
          git add \
            lib/services/manic_emu_library_service.dart \
            lib/services/game/game_launch_service.dart \
            test/manic_emu_library_service_test.dart
          git commit -m 'Detect Manic membership across linked libraries'
          git push --force origin HEAD:automation/ios-library-routing-160
