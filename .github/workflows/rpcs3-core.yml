name: RPCS3 native core

run-name: RPCS3 native core • ${{ github.sha }}

on:
  push:
    branches:
      - experimental
    paths:
      - '.github/workflows/rpcs3-core.yml'
      - 'build-utils/build_rpcs3_embedded_core.sh'
      - 'build-utils/patch_rpcs3_build295_fixed_reservation.py'
      - 'build-utils/patch_rpcs3_build266_v09_core.py'
      - 'build-utils/rpcs3/**'
      - 'test/rpcs3_build295_fixed_reservation_test.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neostation-rpcs3-core-experimental
  cancel-in-progress: true

jobs:
  build:
    name: Build RPCS3 Core arm64
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Prepare pinned native toolchain
        shell: bash
        run: |
          set -euo pipefail
          for formula in ccache ninja cmake llvm@22; do
            brew list --versions "$formula" >/dev/null 2>&1 || brew install "$formula"
          done
          python3 -m py_compile build-utils/patch_rpcs3_build295_fixed_reservation.py
          python3 test/rpcs3_build295_fixed_reservation_test.py
          mkdir -p dist/rpcs3 build/rpcs3-core-diagnostics

      - name: Build patched RPCS3 Core
        shell: bash
        run: |
          set -euo pipefail
          env -u GITHUB_ENV \
            OUTPUT_DIR="$PWD/dist/rpcs3" \
            BUILD_JOBS=3 \
            bash build-utils/build_rpcs3_embedded_core.sh \
            2>&1 | tee build/rpcs3-core-diagnostics/build.log

      - name: Validate Core identity and exports
        shell: bash
        run: |
          set -euo pipefail
          CORE="dist/rpcs3/libRPCS3Core.dylib"
          test -s "$CORE"
          python3 build-utils/validate_rpcs3_embedded_core.py "$CORE"
          file "$CORE" | tee build/rpcs3-core-diagnostics/file.txt
          lipo -archs "$CORE" | tee build/rpcs3-core-diagnostics/archs.txt
          nm -gU "$CORE" > build/rpcs3-core-diagnostics/exports.txt
          grep -q '_rpcs3_ios_initialize$' build/rpcs3-core-diagnostics/exports.txt
          grep -q '_rpcs3_ios_boot_game$' build/rpcs3-core-diagnostics/exports.txt
          grep -q '_neostation_rpcs3_ios_save_state$' build/rpcs3-core-diagnostics/exports.txt
          strings "$CORE" | grep -q 'NEOSTATION_BUILD295_FIXED_JIT_RESERVATION_V1'
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          core=Path('dist/rpcs3/libRPCS3Core.dylib')
          identity={
            'schema_version':1,
            'repository':'https://github.com/TarbleFR/neostation-ios',
            'host_commit':os.environ['GITHUB_SHA'],
            'source_commit':Path('dist/rpcs3/RPCS3_SOURCE_COMMIT.txt').read_text().strip(),
            'abi_version':int(Path('dist/rpcs3/RPCS3_IOS_ABI.txt').read_text().strip()),
            'sha256':hashlib.sha256(core.read_bytes()).hexdigest(),
            'architectures':['arm64'],
            'reservation':'mach_vm_allocate fixed, no VM_FLAGS_OVERWRITE',
            'marker':'NEOSTATION_BUILD295_FIXED_JIT_RESERVATION_V1',
            'device_runtime_tested':False,
          }
          Path('dist/rpcs3/identity.json').write_text(json.dumps(identity,indent=2)+'\n')
          print(json.dumps(identity,indent=2))
          PY
          cp dist/rpcs3/identity.json build/rpcs3-core-diagnostics/identity.json

      - name: Upload RPCS3 Core
        uses: actions/upload-artifact@v4
        with:
          name: RPCS3Core-${{ github.sha }}
          path: dist/rpcs3/
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RPCS3Core-diagnostics-${{ github.sha }}
          path: build/rpcs3-core-diagnostics/
          if-no-files-found: warn
          retention-days: 7
