name: RPCS3 recovery core
run-name: RPCS3 recovery core Build 303 • ${{ github.sha }}
on:
  push:
    branches: [experimental]
    paths:
      - '.github/workflows/rpcs3-core.yml'
      - 'build-utils/build_rpcs3_recovery_core.sh'
      - 'build-utils/patch_rpcs3_build301_passive_dlopen.py'
      - 'build-utils/validate_rpcs3_recovery_core.py'
      - 'test/rpcs3_recovery_core_contract_test.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neostation-rpcs3-core-recovery
  cancel-in-progress: true
jobs:
  build:
    name: Build recovery RPCS3 Core arm64
    runs-on: macos-15
    timeout-minutes: 180
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Validate recovery contracts before compiling
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          bash -n build-utils/build_rpcs3_recovery_core.sh
          python3 -m py_compile build-utils/patch_rpcs3_build301_passive_dlopen.py build-utils/validate_rpcs3_recovery_core.py
          python3 test/rpcs3_recovery_core_contract_test.py
          python3 test/rpcs3_build301_passive_dlopen_test.py
          python3 test/rpcs3_jit_handshake_test.py
          node test/rpcs3_debugger_handshake_test.js
          for formula in ccache ninja cmake llvm@22; do
            brew list --versions "$formula" >/dev/null 2>&1 || brew install "$formula"
          done
          mkdir -p dist/rpcs3 build/rpcs3-core-diagnostics
      - name: Build Build266 allocator plus Build301 passive dlopen
        shell: bash
        run: |
          set -euo pipefail
          env -u GITHUB_ENV OUTPUT_DIR="$PWD/dist/rpcs3" BUILD_JOBS=3 \
            bash build-utils/build_rpcs3_recovery_core.sh 2>&1 | tee build/rpcs3-core-diagnostics/build.log
      - name: Validate recovery Core identity and exports
        shell: bash
        run: |
          set -euo pipefail
          CORE=dist/rpcs3/libRPCS3Core.dylib
          test -s "$CORE"
          python3 build-utils/validate_rpcs3_recovery_core.py "$CORE"
          python3 build-utils/validate_rpcs3_passive_dlopen.py "$CORE" | tee build/rpcs3-core-diagnostics/passive-dlopen.txt
          file "$CORE" | tee build/rpcs3-core-diagnostics/file.txt
          lipo -archs "$CORE" | tee build/rpcs3-core-diagnostics/archs.txt
          nm -gU "$CORE" > build/rpcs3-core-diagnostics/exports.txt
          for symbol in _rpcs3_ios_initialize _rpcs3_ios_boot_game _neostation_rpcs3_ios_save_state _neostation_rpcs3_ios_save_state_slot _rpcs3_ios_run_llvm_self_test _rpcs3_ios_shutdown; do
            grep -q " $symbol$" build/rpcs3-core-diagnostics/exports.txt
          done
          ! grep -q ' _neostation_rpcs3_adopt_jit_layout$' build/rpcs3-core-diagnostics/exports.txt
          ! grep -q ' _neostation_rpcs3_reset_failed_startup$' build/rpcs3-core-diagnostics/exports.txt
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          core=Path('dist/rpcs3/libRPCS3Core.dylib')
          identity={
            'schema_version':1,
            'repository':'https://github.com/TarbleFR/neostation-ios',
            'host_commit':os.environ['GITHUB_SHA'],
            'source_commit':Path('dist/rpcs3/RPCS3_SOURCE_COMMIT.txt').read_text().strip(),
            'abi_version':int(Path('dist/rpcs3/RPCS3_IOS_ABI.txt').read_text().strip()),
            'sha256':hashlib.sha256(core.read_bytes()).hexdigest(),
            'architectures':['arm64'],
            'jit_policy':'Build266 adaptive Core-owned arena + Build301 passive dlopen',
            'reservation':'Core-owned mmap exact-hint search; no Build295/302 fixed host reservation',
            'lifecycle_marker':'NEOSTATION_BUILD301_PASSIVE_DLOPEN_V1',
            'allocator_marker':'NEOSTATION_BUILD266_JIT_V09_SHADER_V1',
            'device_runtime_tested':False,
          }
          Path('dist/rpcs3/identity.json').write_text(json.dumps(identity,indent=2)+'\n')
          print(json.dumps(identity,indent=2))
          PY
          cp dist/rpcs3/identity.json build/rpcs3-core-diagnostics/identity.json
      - name: Upload RPCS3 recovery Core
        uses: actions/upload-artifact@v4
        with:
          name: RPCS3Core-${{ github.sha }}
          path: dist/rpcs3/
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RPCS3Core-diagnostics-${{ github.sha }}
          path: build/rpcs3-core-diagnostics/
          if-no-files-found: warn
          retention-days: 14
