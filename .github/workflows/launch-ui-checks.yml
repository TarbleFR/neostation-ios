name: Launch and carousel UI regressions
on:
  push:
    branches: [experimental]
    paths:
      - '.github/workflows/launch-ui-checks.yml'
      - 'lib/utils/game_launch_utils.dart'
      - 'lib/widgets/game_launch_dialog.dart'
      - 'test/game_launch_route_test.py'
      - 'test/carousel_chrome_layout_test.py'
      - 'lib/widgets/carousel_chrome_layout.dart'
      - 'lib/screens/game_screen/my_games_carousel.dart'
      - 'lib/services/game_launch_manager.dart'
      - 'lib/services/audio_policy_service.dart'
      - 'test/game_audio_handoff_test.py'
      - 'lib/services/kartpad_internal_service.dart'
      - 'lib/l10n/ports_locale.dart'
      - 'lib/widgets/ports_internal_playlist_actions.dart'
      - 'lib/screens/game_screen/my_games_list.dart'
      - 'lib/providers/sqlite_config_provider.dart'
      - 'lib/providers/sqlite_config_provider/scanning.dart'
      - 'lib/services/game/game_launch_service.dart'
      - 'assets/systems/ports.json'
      - 'test/dusklight_ports_stage1_test.dart'
      - 'test/kartpad_locale_test.dart'
      - 'packages/kartpad_internal_bridge/**'
      - 'build-utils/kartpad/**'
      - 'test/kartpad_bridge_contract_test.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Exercise production launch routes with Flutter Navigator
        run: python3 test/game_launch_route_test.py
      - name: Exercise carousel rail and alphabet layout
        run: python3 test/carousel_chrome_layout_test.py
      - name: Exercise native-to-menu audio handoff and rapid relaunch
        run: python3 test/game_audio_handoff_test.py
      - name: Resolve Flutter dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze Ports Stage 1 sources
        run: flutter analyze --no-fatal-infos lib/services/kartpad_internal_service.dart lib/l10n/ports_locale.dart lib/widgets/ports_internal_playlist_actions.dart lib/screens/game_screen/my_games_list.dart lib/providers/sqlite_config_provider.dart lib/services/game/game_launch_service.dart lib/services/game_launch_manager.dart packages/kartpad_internal_bridge/lib/kartpad_internal_bridge.dart
      - name: Exercise Ports multi-import and KartPad isolation
        run: flutter test test/dusklight_ports_stage1_test.dart test/kartpad_locale_test.dart
      - name: Exercise KartPad bridge contract
        run: python3 test/kartpad_bridge_contract_test.py
