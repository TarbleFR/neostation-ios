name: NeoStation iOS - Dolphin Internal Test
run-name: Dolphin Internal Test 192 • ${{ github.sha }}

on:
  push:
    branches:
      - test/dolphin-internal-engine-v1
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: neostation-dolphin-internal-test
  cancel-in-progress: true

jobs:
  build:
    name: Build internal Dolphin IPA
    runs-on: macos-15
    timeout-minutes: 360
    env:
      BUILD_NUMBER: '192'
      IPA_NAME: NeoStation-iOS-Dolphin-Internal-Test-192
      HOMEBREW_NO_AUTO_UPDATE: '1'
      SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
      SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}

    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4
        with:
          ref: test/dolphin-internal-engine-v1
          fetch-depth: 1

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Require the iOS 26 ExtensionFoundation SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iPhoneOS SDK: $SDK_VERSION"
          python3 - "$SDK_VERSION" <<'PY'
          import sys
          major = int(sys.argv[1].split('.', 1)[0])
          if major < 26:
              raise SystemExit('Xcode/iPhoneOS 26 or newer is required for the built-in JIT helper.')
          PY

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply the fail-closed Dolphin source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 build-utils/apply_dolphin_internal_patch.py
          python3 build-utils/configure_dolphin_internal_systems.py
          dart format \
            lib/services/dolphin_embedded_service.dart \
            lib/widgets/dolphin_playlist_actions.dart \
            lib/providers/sqlite_config_provider.dart \
            lib/providers/sqlite_config_provider/scanning.dart \
            lib/screens/game_screen/my_games_list.dart \
            lib/services/game/game_launch_service.dart \
            test/dolphin_embedded_service_test.dart

          grep -q "version: 1.0.0+192" pubspec.yaml
          grep -q "DolphinEmbeddedService.launchGame" lib/services/game/game_launch_service.dart
          grep -q "DolphinPlaylistActions" lib/screens/game_screen/my_games_list.dart
          grep -q "isNativeDolphin" lib/providers/sqlite_config_provider/scanning.dart
          grep -q '"ios_native_engine": "dolphin_internal"' assets/systems/gc.json
          grep -q '"ios_native_engine": "dolphin_internal"' assets/systems/wii.json
          ! grep -q '"ios"' assets/systems/gc.json
          ! grep -q '"ios"' assets/systems/wii.json

      - name: Prepare build-time defines
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          required = ('SCREENSCRAPER_DEV_ID', 'SCREENSCRAPER_DEV_PASSWORD')
          values = {name: os.environ.get(name, '').strip() for name in required}
          missing = [name for name, value in values.items() if not value]
          if missing:
              raise SystemExit('Missing GitHub Actions secrets: ' + ', '.join(missing))
          values.update({
              'NEOSTATION_EXPERIMENTAL_STIKJIT_MELONX': 'true',
              'NEOSTATION_MELONX_BUNDLE_ID': 'com.nur.nx',
              'NEOSTATION_EXPERIMENTAL_STIKJIT_ARMSX2': 'true',
              'NEOSTATION_ARMSX2_BUNDLE_ID': 'xyz.aethersx2.AetherSX2',
              'NEOSTATION_EXPERIMENTAL_STIKJIT_RPCS3': 'true',
              'NEOSTATION_RPCS3_BUNDLE_ID': 'com.xitrix.RPCS3',
              'NEOSTATION_DOLPHIN_INTERNAL': 'true',
          })
          Path('.dart-defines.json').write_text(
              json.dumps(values, ensure_ascii=False),
              encoding='utf-8',
          )
          PY

      - name: Restore and validate StikJIT 1.5.0
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/StikJIT.xcframework.zip"
          EXTRACT="$RUNNER_TEMP/stikjit-1.5.0"
          DEST="$GITHUB_WORKSPACE/packages/stikjit_bridge/ios/Frameworks"
          rm -rf "$EXTRACT" "$DEST/StikJIT.xcframework" "$ARCHIVE"
          mkdir -p "$EXTRACT" "$DEST"
          curl -fL --retry 3 --retry-delay 2 \
            'https://github.com/StikDebug/StikJIT/releases/download/1.5.0/StikJIT.xcframework.zip' \
            -o "$ARCHIVE"
          echo '444b8d439df8455c34afbb51e279fd225265279195475f9b3fdbcf3a71a27e85  '"$ARCHIVE" | shasum -a 256 -c -
          unzip -q "$ARCHIVE" -d "$EXTRACT"
          FOUND=$(find "$EXTRACT" -type d -name StikJIT.xcframework -print -quit)
          test -n "$FOUND"
          cp -R "$FOUND" "$DEST/StikJIT.xcframework"
          test -f "$DEST/StikJIT.xcframework/ios-arm64/StikJIT.framework/StikJIT"

          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          root = Path('packages/stikjit_bridge/ios/Frameworks/StikJIT.xcframework')
          interfaces = list(root.rglob('*.swiftinterface'))
          if not interfaces:
              raise SystemExit('StikJIT Swift interface is missing.')
          for interface in interfaces:
              text = interface.read_text(encoding='utf-8')
              for name in ('DDIPaths', 'DeveloperDiskImageService', 'StikJITError'):
                  text = text.replace(f'StikJIT.{name}', name)
              text = text.replace('StikJIT.StikJIT.', 'StikJIT.')
              interface.write_text(text, encoding='utf-8')

          framework = root / 'ios-arm64' / 'StikJIT.framework'
          info = framework / 'Info.plist'
          payload = {}
          if info.exists():
              try:
                  payload = plistlib.loads(info.read_bytes())
              except Exception:
                  payload = {}
          payload.update({
              'CFBundleDevelopmentRegion': 'en',
              'CFBundleExecutable': 'StikJIT',
              'CFBundleIdentifier': 'com.stik.StikJIT',
              'CFBundleInfoDictionaryVersion': '6.0',
              'CFBundleName': 'StikJIT',
              'CFBundlePackageType': 'FMWK',
              'CFBundleShortVersionString': '1.5.0',
              'CFBundleVersion': '1',
              'CFBundleSupportedPlatforms': ['iPhoneOS'],
              'MinimumOSVersion': '17.4',
              'UIDeviceFamily': [1, 2],
          })
          info.write_bytes(plistlib.dumps(payload, fmt=plistlib.FMT_XML, sort_keys=False))
          PY

      - name: Resolve Flutter dependencies and run tests
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Scaffold and configure the iOS host
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d ios ]; then
            flutter create \
              --platforms=ios \
              --org com.neogamelab \
              --project-name neostation \
              .
          fi

          python3 - <<'PY'
          import re
          from pathlib import Path

          podfile = Path('ios/Podfile')
          text = podfile.read_text(encoding='utf-8')
          pattern = r'^\s*#?\s*platform\s+:ios,\s*[\'\"][^\'\"]+[\'\"]\s*$'
          replacement = "platform :ios, '26.0'"
          if re.search(pattern, text, flags=re.MULTILINE):
              text = re.sub(pattern, replacement, text, count=1, flags=re.MULTILINE)
          else:
              text = replacement + '\n\n' + text
          podfile.write_text(text, encoding='utf-8')

          plist = Path('ios/Flutter/AppFrameworkInfo.plist')
          if plist.exists():
              data = plist.read_text(encoding='utf-8')
              data = re.sub(
                  r'(<key>MinimumOSVersion</key>\s*<string>)[^<]+(</string>)',
                  r'\g<1>26.0\g<2>',
                  data,
                  count=1,
              )
              plist.write_text(data, encoding='utf-8')
          PY

          flutter build ios \
            --release \
            --no-codesign \
            --config-only \
            --build-number="$BUILD_NUMBER" \
            --dart-define-from-file=.dart-defines.json

          ruby build-utils/configure_dolphin_internal_xcode.rb
          python3 build-utils/finalize_dolphin_internal_xcode.py

          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c 'Delete :UIFileSharingEnabled' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :UIFileSharingEnabled bool true' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Delete :LSSupportsOpeningDocumentsInPlace' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :LSSupportsOpeningDocumentsInPlace bool true' "$PLIST"
          plutil -lint "$PLIST"
          plutil -lint ios/DolphinJITHelper/Info.plist

          DEVICE_INFO_FILE=$(find "$HOME/.pub-cache" \
            -path '*device_info_plus*/FPPDeviceInfoPlusPlugin.m' \
            2>/dev/null | head -1)
          if [ -n "$DEVICE_INFO_FILE" ]; then
            sed -i '' '/isiOSAppOnVision/d' "$DEVICE_INFO_FILE"
          fi

          dart run flutter_launcher_icons
          chmod +x build-utils/force_ios_fork_icon.sh
          build-utils/force_ios_fork_icon.sh

          cd ios
          pod install --repo-update

      - name: Build the pinned embedded Dolphin core
        shell: bash
        run: |
          set -euo pipefail
          command -v cmake >/dev/null || brew install cmake
          command -v ninja >/dev/null || brew install ninja
          command -v bartycrouch >/dev/null || brew install bartycrouch
          python3 -m pip install --user --break-system-packages polib
          export PATH="$HOME/Library/Python/3.9/bin:$HOME/Library/Python/3.10/bin:$HOME/Library/Python/3.11/bin:$HOME/Library/Python/3.12/bin:/opt/homebrew/bin:$PATH"

          DOLPHIN_SHA=$(tr -d '[:space:]' < build-utils/dolphin_internal_commit.txt)
          DOLPHIN_SRC="$RUNNER_TEMP/dolphin-ios"
          rm -rf "$DOLPHIN_SRC"
          git clone --depth 1 --recursive \
            https://github.com/OatmealDome/dolphin-ios.git \
            "$DOLPHIN_SRC"
          if [ "$(git -C "$DOLPHIN_SRC" rev-parse HEAD)" != "$DOLPHIN_SHA" ]; then
            git -C "$DOLPHIN_SRC" fetch --depth 1 origin "$DOLPHIN_SHA"
            git -C "$DOLPHIN_SRC" checkout --detach "$DOLPHIN_SHA"
            git -C "$DOLPHIN_SRC" submodule sync --recursive
            git -C "$DOLPHIN_SRC" submodule update --init --recursive --depth 1
          fi
          test "$(git -C "$DOLPHIN_SRC" rev-parse HEAD)" = "$DOLPHIN_SHA"

          python3 build-utils/patch_dolphin_internal_core.py "$DOLPHIN_SRC"
          python3 build-utils/finalize_dolphin_internal_core.py "$DOLPHIN_SRC"
          grep -q 'BRK #0x69' "$DOLPHIN_SRC/Source/iOS/Library/NeoStationBridge.mm"
          grep -q 'PowerPC::CPUCore::JITARM64' "$DOLPHIN_SRC/Source/iOS/Library/NeoStationBridge.mm"
          grep -q 'MAIN_GFX_BACKEND, "Metal"' "$DOLPHIN_SRC/Source/iOS/Library/NeoStationBridge.mm"

          export PROJECT_DIR="$DOLPHIN_SRC/Source/iOS/App"
          export PLATFORM_NAME=iphoneos
          export DOL_CORE_BUILD_TARGET=Release
          export IPHONEOS_DEPLOYMENT_TARGET=26.0
          mkdir -p build/dolphin
          set -o pipefail
          bash "$PROJECT_DIR/Project/Scripts/BuildCore.sh" \
            2>&1 | tee build/dolphin/dolphin-core-build.log

          DOLPHIN_LIB="$DOLPHIN_SRC/build-iphoneos-Release/Source/iOS/Library/libdolphin.dylib"
          test -f "$DOLPHIN_LIB"
          cp "$DOLPHIN_LIB" build/dolphin/libdolphin.dylib
          cp -R "$DOLPHIN_SRC/Data/Sys" build/dolphin/Sys
          file build/dolphin/libdolphin.dylib | tee build/dolphin/file.txt
          nm -gU build/dolphin/libdolphin.dylib | \
            grep 'neostation_dolphin_' | tee build/dolphin/exported-symbols.txt
          test "$(wc -l < build/dolphin/exported-symbols.txt | tr -d ' ')" -ge 8
          otool -L build/dolphin/libdolphin.dylib | tee build/dolphin/otool.txt

      - name: Build unsigned NeoStation app and helper
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/ios/DerivedData build/ios/unsigned
          mkdir -p build/ios
          set -o pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            PROVISIONING_PROFILE_SPECIFIER='' \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            build 2>&1 | tee build/ios/xcodebuild-unsigned.log

      - name: Assemble and audit the internal Dolphin IPA
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTS=build/ios/DerivedData/Build/Products/Release-iphoneos
          APP_PATH=$(find "$PRODUCTS" -maxdepth 1 -type d -name '*.app' -print -quit)
          HELPER_PATH=$(find "$PRODUCTS" -maxdepth 2 -type d -name 'DolphinJITHelper.appex' -print -quit)
          test -n "$APP_PATH" && test -d "$APP_PATH"
          test -n "$HELPER_PATH" && test -d "$HELPER_PATH"

          mkdir -p "$APP_PATH/Frameworks" "$APP_PATH/Extensions"
          cp build/dolphin/libdolphin.dylib "$APP_PATH/Frameworks/libdolphin.dylib"
          rm -rf "$APP_PATH/Sys"
          cp -R build/dolphin/Sys "$APP_PATH/Sys"
          rm -rf "$APP_PATH/Extensions/DolphinJITHelper.appex"
          cp -R "$HELPER_PATH" "$APP_PATH/Extensions/DolphinJITHelper.appex"

          HELPER_DEST="$APP_PATH/Extensions/DolphinJITHelper.appex"
          mkdir -p "$HELPER_DEST/Frameworks"
          rm -rf "$HELPER_DEST/Frameworks/StikJIT.framework"
          cp -R \
            packages/stikjit_bridge/ios/Frameworks/StikJIT.xcframework/ios-arm64/StikJIT.framework \
            "$HELPER_DEST/Frameworks/StikJIT.framework"

          install_name_tool -id '@rpath/libdolphin.dylib' \
            "$APP_PATH/Frameworks/libdolphin.dylib"
          xattr -cr "$APP_PATH"

          test -x "$APP_PATH/Runner"
          test -x "$HELPER_DEST/DolphinJITHelper"
          test -f "$HELPER_DEST/Frameworks/StikJIT.framework/StikJIT"
          test -d "$APP_PATH/Sys"
          test -f "$APP_PATH/Frameworks/libdolphin.dylib"
          file "$APP_PATH/Runner" | grep -q arm64
          file "$APP_PATH/Frameworks/libdolphin.dylib" | grep -q arm64
          file "$HELPER_DEST/DolphinJITHelper" | grep -q arm64
          plutil -extract CFBundlePackageType raw "$HELPER_DEST/Info.plist" | grep -qx 'XPC!'
          plutil -extract EXAppExtensionAttributes.EXExtensionPointIdentifier raw \
            "$HELPER_DEST/Info.plist" | \
            grep -qx 'com.neogamelab.neostation.DolphinJITHelper'
          otool -L "$HELPER_DEST/DolphinJITHelper" | grep -q 'StikJIT.framework/StikJIT'
          nm -gU "$APP_PATH/Frameworks/libdolphin.dylib" | \
            grep -q '_neostation_dolphin_launch'

          APPEXT=$(find "$APP_PATH/Extensions" -maxdepth 1 -type f -name '*.appexpt' -print -quit)
          if [ -z "$APPEXT" ]; then
            APPEXT=$(find build/ios/DerivedData -type f -name '*.appexpt' -print -quit)
            if [ -n "$APPEXT" ]; then
              cp "$APPEXT" "$APP_PATH/Extensions/"
            fi
          fi
          test -n "$(find "$APP_PATH/Extensions" -maxdepth 1 -type f -name '*.appexpt' -print -quit)"

          if find "$APP_PATH" -type d -name 'DolphiniOS.app' -print -quit | grep -q .; then
            echo 'External DolphiniOS app bundle found in product.' >&2
            exit 1
          fi
          if grep -R -a -n -E \
            'dolphinios://|DolphinSingleSessionLaunchScript|DolphinRuntimeLaunchScript|StikjitDolphinBridgePlugin' \
            "$APP_PATH"; then
            echo 'Forbidden external Dolphin routing token found in app.' >&2
            exit 1
          fi

          mkdir -p build/ios/unsigned/Payload
          cp -R "$APP_PATH" build/ios/unsigned/Payload/Runner.app

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          ipa_root = Path('build/ios/unsigned/Payload/Runner.app')
          dolphin = ipa_root / 'Frameworks/libdolphin.dylib'
          helper = ipa_root / 'Extensions/DolphinJITHelper.appex/DolphinJITHelper'
          manifest = {
              'schema': 1,
              'repositoryCommit': os.environ['GITHUB_SHA'],
              'buildNumber': os.environ['BUILD_NUMBER'],
              'dolphinCommit': Path('build-utils/dolphin_internal_commit.txt').read_text().strip(),
              'stikjitVersion': '1.5.0',
              'stikjitScript': 'legacy',
              'architecture': 'NeoStation -> helper StikJIT -> NeoStation PID -> embedded Dolphin -> JITARM64 -> Metal',
              'noInterpreterFallback': True,
              'noExternalDolphinApp': True,
              'files': {},
          }
          for name, file in {'libdolphin.dylib': dolphin, 'DolphinJITHelper': helper}.items():
              data = file.read_bytes()
              manifest['files'][name] = {
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              }
          Path('build/ios/dolphin-internal-manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

          (
            cd build/ios/unsigned
            /usr/bin/zip -qry "../../../$IPA_NAME.ipa" Payload
          )
          test -s "$IPA_NAME.ipa"
          unzip -l "$IPA_NAME.ipa" | tee build/ios/ipa-contents.txt
          unzip -l "$IPA_NAME.ipa" | grep -q 'Payload/Runner.app/Frameworks/libdolphin.dylib'
          unzip -l "$IPA_NAME.ipa" | grep -q 'Payload/Runner.app/Extensions/DolphinJITHelper.appex/DolphinJITHelper'
          unzip -l "$IPA_NAME.ipa" | grep -q 'Payload/Runner.app/Sys/'
          shasum -a 256 "$IPA_NAME.ipa" | tee "$IPA_NAME.ipa.sha256"

      - name: Upload verified IPA
        uses: actions/upload-artifact@v4
        with:
          name: NeoStation-Dolphin-Internal-Test-192
          path: |
            NeoStation-iOS-Dolphin-Internal-Test-192.ipa
            NeoStation-iOS-Dolphin-Internal-Test-192.ipa.sha256
            build/ios/dolphin-internal-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeoStation-Dolphin-Internal-Test-192-Diagnostics
          path: |
            build/dolphin/
            build/ios/xcodebuild-unsigned.log
            build/ios/ipa-contents.txt
            .dart-defines.json
          if-no-files-found: warn
          retention-days: 14
