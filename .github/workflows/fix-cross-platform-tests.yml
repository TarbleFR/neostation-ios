name: Fix Cross Platform Regression Tests

on:
  push:
    branches:
      - cleanup/canonical
    paths:
      - '.github/workflows/fix-cross-platform-tests.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/canonical
          fetch-depth: 0

      - name: Apply cross-platform fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(file_path, old, new, label):
              p = Path(file_path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{label}: anchor missing in {file_path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Linux executable discovery intentionally short-circuits on non-Linux
          # hosts. Keep its behavioral tests on Linux while retaining the pure
          # RetroArch argument/path helpers on every host.
          replace_once(
              'test/linux_emulator_discovery_test.dart',
              """  group('executable resolution', () {\n""",
              """  group('executable resolution', () {\n    if (!Platform.isLinux) {\n      test('Linux executable discovery is exercised only on Linux hosts', () {\n        expect(Platform.isLinux, isFalse);\n      });\n      return;\n    }\n\n""",
              'Linux executable group gate',
          )

          # ManicEMU is now removed entirely; the rollback regression should
          # guarantee absence rather than require the old bookmark cleanup line.
          replace_once(
              'test/ios_selective_rollback_test.dart',
              """      expect(service, contains(\"clearBookmark(key: 'manicemu')\"));\n""",
              """      expect(service.toLowerCase(), isNot(contains('manic')));\n""",
              'stale ManicEMU rollback expectation',
          )

          # The host-specific seed test runs on macOS in iOS CI as well as Linux.
          replace_once(
              'test/emulator_seed_authority_test.dart',
              """    osMap = {'windows': 1, 'android': androidOsId, 'linux': linuxOsId};\n""",
              """    osMap = {\n      'windows': 1,\n      'android': androidOsId,\n      'linux': linuxOsId,\n      'macos': 4,\n    };\n""",
              'host OS fixture map',
          )

          db = Path('lib/data/datasources/sqlite_database_service.dart')
          text = db.read_text(encoding='utf-8')

          old = """    final scanTargets =\n        <({String dirPath, String canonicalPath, bool useSaf})>[];\n"""
          new = """    final scanTargets =\n        <({\n          String dirPath,\n          String canonicalPath,\n          bool useSaf,\n          bool isAlias,\n        })>[];\n"""
          if old not in text:
              raise SystemExit('scan target record anchor missing')
          text = text.replace(old, new, 1)

          old = """        scanTargets.add((\n          dirPath: romFolder,\n          canonicalPath: await _canonicalScanPath(romFolder, useSaf: false),\n          useSaf: false,\n        ));\n"""
          new = """        scanTargets.add((\n          dirPath: romFolder,\n          canonicalPath: await _canonicalScanPath(romFolder, useSaf: false),\n          useSaf: false,\n          isAlias: await _isDirectSymbolicLink(romFolder),\n        ));\n"""
          if old not in text:
              raise SystemExit('direct ARMSX2 scan-target anchor missing')
          text = text.replace(old, new, 1)

          old = """          scanTargets.add((\n            dirPath: dirPath,\n            canonicalPath: await _canonicalScanPath(dirPath, useSaf: useSaf),\n            useSaf: useSaf,\n          ));\n"""
          new = """          scanTargets.add((\n            dirPath: dirPath,\n            canonicalPath: await _canonicalScanPath(dirPath, useSaf: useSaf),\n            useSaf: useSaf,\n            isAlias: useSaf ? false : await _isDirectSymbolicLink(dirPath),\n          ));\n"""
          if old not in text:
              raise SystemExit('standard scan-target anchor missing')
          text = text.replace(old, new, 1)

          old = """    final orderedTargets = [\n      ...scanTargets.where((t) => t.dirPath == t.canonicalPath),\n      ...scanTargets.where((t) => t.dirPath != t.canonicalPath),\n    ];\n"""
          new = """    final orderedTargets = [\n      ...scanTargets.where((t) => !t.isAlias),\n      ...scanTargets.where((t) => t.isAlias),\n    ];\n"""
          if old not in text:
              raise SystemExit('scan target ordering anchor missing')
          text = text.replace(old, new, 1)

          marker = """  /// Returns the key identifying a scan target's physical directory, so alias\n"""
          helper = """  /// Returns whether the final path component itself is a symbolic link.\n  ///\n  /// This is deliberately separate from [Directory.resolveSymbolicLinks]: on\n  /// macOS even a real directory under `/var` resolves through `/private/var`,\n  /// so comparing literal and canonical path strings incorrectly marks every\n  /// target as an alias.\n  static Future<bool> _isDirectSymbolicLink(String dirPath) async {\n    try {\n      return await FileSystemEntity.type(\n            dirPath,\n            followLinks: false,\n          ) ==\n          FileSystemEntityType.link;\n    } catch (_) {\n      return false;\n    }\n  }\n\n"""
          if marker not in text:
              raise SystemExit('canonical scan helper insertion marker missing')
          text = text.replace(marker, helper + marker, 1)
          db.write_text(text, encoding='utf-8')
          PY

          git diff --check

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NeoStation CI'
          git config user.email 'actions@users.noreply.github.com'
          git add lib test
          git commit -m 'fix: stabilize cross-platform scan and regression tests'
          git push origin HEAD:cleanup/canonical
