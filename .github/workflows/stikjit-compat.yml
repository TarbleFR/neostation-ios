name: StikJIT 1.9 iOS 18 compatibility and modern non-regression
on:
  push:
    branches: [experimental]
    paths:
      - 'build-utils/stikjit/**'
      - 'build-utils/build_patched_stikjit.py'
      - 'test/stikjit_unified_build_test.py'
      - 'build-utils/patch_stikjit_compat.py'
      - 'build-utils/install_patched_stikjit.py'
      - 'test/stikjit_compat_test.py'
      - 'packages/rpcs3_jit_helper/**'
      - 'packages/armsx2_jit_helper/**'
      - '.github/workflows/stikjit-compat.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neostation-stikjit-compat
  cancel-in-progress: true
jobs:
  validate-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Build and validate canonical StikJIT source
        run: |
          set -euo pipefail
          command -v xcodegen || brew install xcodegen
          python3 build-utils/build_patched_stikjit.py
          python3 test/stikjit_unified_build_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: StikJIT-source-validated-${{ github.sha }}
          path: |
            build/stikjit-current/*.json
            build/stikjit-current/*.zip
            build/stikjit-current/*.sha256
            build/stikjit-current/host-commit.txt
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: StikJIT-source-build-failure-${{ github.sha }}
          path: build/stikjit-current/build.log
          if-no-files-found: ignore
          retention-days: 3
