name: Clean Rainbow UI Diff

on:
  push:
    branches:
      - feature/dolphin-rainbow-selection-ui

permissions:
  contents: write

concurrency:
  group: clean-rainbow-ui-diff
  cancel-in-progress: true

jobs:
  clean-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore focused diffs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          def main_file(path: str) -> str:
              return subprocess.check_output(['git', 'show', f'origin/main:{path}'], text=True)

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          grid_path = 'lib/screens/game_screen/my_games_grid.dart'
          grid = main_file(grid_path)
          grid = replace_once(grid, "import 'package:neostation/widgets/game_view_footer.dart';\n", "import 'package:neostation/widgets/game_view_footer.dart';\nimport 'package:neostation/widgets/rainbow_selection_border.dart';\n", 'grid import')
          grid = replace_once(grid, "                    final borderColor = theme.colorScheme.secondary;\n\n", "", 'grid old border color')
          old_grid_border = "\n".join([
              "                                  child: DecoratedBox(",
              "                                    decoration: BoxDecoration(",
              "                                      border: Border.all(",
              "                                        color: borderColor,",
              "                                        width: 4.r,",
              "                                      ),",
              "                                      borderRadius: BorderRadius.circular(12.r),",
              "                                    ),",
              "                                  ),",
          ])
          new_grid_border = "\n".join([
              "                                  child: RainbowSelectionBorder(",
              "                                    key: ValueKey(",
              "                                      'grid-rainbow-${widget.games[idx].romname}',",
              "                                    ),",
              "                                    borderRadius: BorderRadius.circular(12.r),",
              "                                    borderWidth: 4.r,",
              "                                    glowWidth: 7.r,",
              "                                    glowBlur: 4.r,",
              "                                    child: const SizedBox.expand(),",
              "                                  ),",
          ])
          grid = replace_once(grid, old_grid_border, new_grid_border, 'grid selection border')
          Path(grid_path).write_text(grid)

          dolphin_path = 'lib/widgets/dolphin_internal_playlist_actions.dart'
          dolphin = main_file(dolphin_path)
          old_container = "\n".join([
              "    return SizedBox(",
              "      width: 36.r,",
              "      height: 36.r,",
              "      child: PopupMenuButton<String>(",
          ])
          new_container = "\n".join([
              "    final scheme = Theme.of(context).colorScheme;",
              "",
              "    return Container(",
              "      width: 36.r,",
              "      height: 36.r,",
              "      decoration: BoxDecoration(",
              "        color: scheme.tertiaryFixed,",
              "        borderRadius: BorderRadius.circular(10.r),",
              "        border: Border.all(color: scheme.tertiaryFixed, width: 2.r),",
              "        boxShadow: [",
              "          BoxShadow(",
              "            color: Theme.of(context).colorScheme.shadow.withValues(alpha: 0.3),",
              "            blurRadius: 3.r,",
              "            offset: Offset(1.5.r, 1.5.r),",
              "          ),",
              "        ],",
              "      ),",
              "      child: PopupMenuButton<String>(",
          ])
          dolphin = replace_once(dolphin, old_container, new_container, 'dolphin themed container')
          old_icon = "\n".join([
              "        icon: _busy",
              "            ? SizedBox(width: 18.r, height: 18.r, child: const CircularProgressIndicator(strokeWidth: 2))",
              "            : Icon(Icons.file_upload_outlined, size: 18.r),",
          ])
          new_icon = "\n".join([
              "        icon: _busy",
              "            ? SizedBox(",
              "                width: 18.r,",
              "                height: 18.r,",
              "                child: CircularProgressIndicator(",
              "                  strokeWidth: 2,",
              "                  color: scheme.onTertiaryFixed,",
              "                ),",
              "              )",
              "            : Icon(",
              "                Icons.file_upload_outlined,",
              "                size: 18.r,",
              "                color: scheme.onTertiaryFixed,",
              "              ),",
          ])
          dolphin = replace_once(dolphin, old_icon, new_icon, 'dolphin icon')
          Path(dolphin_path).write_text(dolphin)
          PY

      - name: Commit focused cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/game_screen/my_games_grid.dart lib/widgets/dolphin_internal_playlist_actions.dart
          git commit -m "chore: keep rainbow UI diff focused"
          git push origin HEAD:feature/dolphin-rainbow-selection-ui

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze changed UI files
        run: |
          flutter analyze --no-fatal-infos \
            lib/widgets/rainbow_selection_border.dart \
            lib/widgets/dolphin_internal_playlist_actions.dart \
            lib/screens/game_screen/game_list_view.dart \
            lib/screens/game_screen/my_games_grid.dart \
            lib/screens/game_screen/my_games_carousel.dart
