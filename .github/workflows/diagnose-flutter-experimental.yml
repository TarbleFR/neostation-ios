name: NeoStation scoped Flutter diagnostics
run-name: Scoped Flutter diagnostics • ${{ github.sha }}

on:
  push:
    branches:
      - experimental
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neostation-scoped-flutter-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Analyze and test diagnostics
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Reproduce Analyze and test Flutter commands
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/scoped-flutter-diagnostics
          flutter pub get --enforce-lockfile 2>&1 | tee build/scoped-flutter-diagnostics/flutter-pub-get.log
          flutter analyze --no-fatal-infos 2>&1 | tee build/scoped-flutter-diagnostics/flutter-analyze.log
          flutter test --no-pub 2>&1 | tee build/scoped-flutter-diagnostics/flutter-test.log

      - name: Re-run scoped VPN/JIT contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/scoped-flutter-diagnostics
          python3 test/local_jit_tunnel_contract_test.py 2>&1 | tee build/scoped-flutter-diagnostics/local-jit-tunnel-contract.log

      - name: Record revision
        if: always()
        shell: bash
        run: |
          mkdir -p build/scoped-flutter-diagnostics
          printf 'commit=%s\n' "$GITHUB_SHA" > build/scoped-flutter-diagnostics/revision.txt

      - name: Upload scoped Flutter diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoped-flutter-diagnostics-${{ github.sha }}
          path: build/scoped-flutter-diagnostics/
          if-no-files-found: error
          retention-days: 7
