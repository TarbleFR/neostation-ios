name: Apply Fin Persistence Fix

on:
  push:
    branches:
      - feature/library-native
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fin-persistence-source-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/library-native
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply Fin persistence and launch diagnostics
        run: |
          set -euo pipefail
          python3 tools/apply_fin_persistence_and_launch_diagnostics.py
          dart format \
            lib/data/datasources/sqlite_database_service.dart \
            lib/services/fin_library_service.dart \
            test/fin_persistence_regression_test.dart
          git diff --check

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run Fin persistence regression test
        run: flutter test test/fin_persistence_regression_test.dart

      - name: Commit validated source fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/data/datasources/sqlite_database_service.dart \
            lib/services/fin_library_service.dart \
            test/fin_persistence_regression_test.dart
          if git diff --cached --quiet; then
            echo "Fin persistence source fix already applied."
            exit 0
          fi
          git commit -m "fix: persist Fin library across cold starts"
          git push origin HEAD:feature/library-native
