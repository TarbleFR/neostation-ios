name: KartPad UIKit lifecycle harness
run-name: KartPad UIKit lifecycle harness • ${{ github.sha }}
on:
  workflow_dispatch:
  push:
    branches: [experimental]
    paths:
      - .github/workflows/kartpad-simulator-lifecycle.yml
      - test/kartpad_simulator_probe.mm
      - native/kartpad/core/DonorSessionReset.h
permissions:
  contents: read
  actions: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - uses: actions/download-artifact@v4
        with:
          name: KartPadCore-b51206dbf50a8fc2520107a6269265e075262362
          run-id: 36277444837
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: donor
      - name: Build isolated simulator test app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe/Probe.app/Frameworks evidence
          git rev-parse HEAD > evidence/source.txt
          APP="$PWD/probe/Probe.app"
          ditto donor/KartPadRuntime.framework "$APP/Frameworks/KartPadRuntime.framework"
          RUNTIME="$APP/Frameworks/KartPadRuntime.framework/KartPadRuntime"
          # Test-only platform adjustment: no text instruction is modified.
          python3 - "$RUNTIME" <<'PY'
          from pathlib import Path
          import struct,sys
          p=Path(sys.argv[1]); b=bytearray(p.read_bytes()); cursor=32; count=0
          for _ in range(struct.unpack_from('<I',b,16)[0]):
              cmd,size=struct.unpack_from('<II',b,cursor)
              if cmd==0x32:
                  assert struct.unpack_from('<I',b,cursor+8)[0]==2
                  struct.pack_into('<I',b,cursor+8,7)
                  count+=1
              cursor+=size
          assert count==1
          p.write_bytes(b)
          PY
          chmod 755 "$RUNTIME"
          curl -fL --retry 3 https://raw.githubusercontent.com/chrissotraidis/wiicompiled/d0b8dec62a8c98dd45736a996ae18327ada8fe3f/aurora-main/include/aurora/aurora.h -o "$RUNNER_TEMP/aurora-probe-api.h"
          echo "3959cc80683a3f674353a77b452219fc7276a2b55b96d5f42e90f5043f12908d  $RUNNER_TEMP/aurora-probe-api.h" | shasum -a 256 -c -
          ditto donor/runtime-resources "$APP"
          curl -fL --retry 3 https://pub.dev/api/archives/flutter_soloud-4.0.12.tar.gz -o "$RUNNER_TEMP/soloud.tar.gz"
          echo "5ffc8db6d9e5751ff2e8c3b7934b1973dc788fb541b9000561b1168c7798dae0  $RUNNER_TEMP/soloud.tar.gz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/soloud"
          tar -xzf "$RUNNER_TEMP/soloud.tar.gz" -C "$RUNNER_TEMP/soloud"
          SOLOUD="$RUNNER_TEMP/soloud/src"
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun clang++ -target arm64-apple-ios17.4-simulator -isysroot "$SDK" \
            -x objective-c++ -std=c++20 -O1 -fobjc-arc -fblocks -DWITH_MINIAUDIO -I"$RUNNER_TEMP" \
            -I"$SOLOUD" -I"$SOLOUD/soloud/include" -I"$SOLOUD/soloud/src/backend/miniaudio" \
            -framework UIKit -framework Foundation -framework AVFAudio -framework AudioToolbox \
            "$SOLOUD"/soloud/src/core/*.cpp "$SOLOUD/soloud/src/backend/miniaudio/soloud_miniaudio.cpp" \
            "$SOLOUD/soloud_common.cpp" test/kartpad_simulator_probe.mm -o "$APP/Probe"
          python3 - "$APP/Info.plist" <<'PY'
          import plistlib,sys
          plistlib.dump({'CFBundleIdentifier':'com.neostation.kartpad.lifecycle-probe',
              'CFBundleExecutable':'Probe','CFBundleName':'KartPad Lifecycle Probe',
              'CFBundlePackageType':'APPL','CFBundleVersion':'1','CFBundleShortVersionString':'1.0',
              'LSRequiresIPhoneOS':True,'MinimumOSVersion':'17.4','UIDeviceFamily':[1,2],
              'UILaunchScreen':{},'UISupportedInterfaceOrientations':['UIInterfaceOrientationLandscapeLeft']},open(sys.argv[1],'wb'))
          PY
          codesign --force --sign - "$APP/Frameworks/KartPadRuntime.framework"
          codesign --force --sign - "$APP"
      - name: Run real UIKit/native ABI probe
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > evidence/simulators.json
          DEVICE="$(python3 - <<'PY'
          import json
          d=json.load(open('evidence/simulators.json'))['devices']
          items=[x for runtime,ds in d.items() if 'iOS-18' in runtime for x in ds if x.get('isAvailable') and 'iPhone' in x['name']]
          if not items: raise SystemExit('No compatible iOS simulator available')
          print(items[0]['udid'])
          PY
          )"
          echo "PROBE_DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true
          python3 - "$DEVICE" <<'PY'
          import subprocess,sys
          subprocess.run(['xcrun','simctl','bootstatus',sys.argv[1],'-b'],check=True,timeout=300)
          PY
          xcrun simctl install "$DEVICE" "$PWD/probe/Probe.app"
          DATA="$(xcrun simctl get_app_container "$DEVICE" com.neostation.kartpad.lifecycle-probe data)"
          echo "PROBE_DATA=$DATA" >> "$GITHUB_ENV"
          xcrun simctl launch --console "$DEVICE" com.neostation.kartpad.lifecycle-probe > evidence/probe-console.log 2>&1 &
          for i in $(seq 1 90); do
            if [ -f "$DATA/Documents/probe.json" ]; then break; fi
            sleep 1
          done
          cp "$DATA/Documents/probe.json" evidence/probe.json
          cat evidence/probe.json
          python3 - <<'PY'
          import json
          result=json.load(open('evidence/probe.json'))
          assert result.get('success'), result
          assert result['profileFinalizeCycles']==4, result
          assert result['reproducedStaleCallback'] and result['reproducedStaleTimer'], result
          assert result['hleResetCycles']==20 and result['rendererAudioCycles']==3, result
          assert result['frontendAudioCycles']==3, result
          assert result['threadSize']==8 and result['mutexSize']==64, result
          assert result['vectorSize']==24 and result['mapSize']==24 and result['hashMapSize']==40, result
          PY
      - name: Collect simulator diagnostics
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          mkdir -p evidence
          cp ~/Library/Logs/DiagnosticReports/Probe* evidence/ 2>/dev/null || true
          if [ -n "${PROBE_DATA:-}" ]; then
            cp "$PROBE_DATA/Documents/"probe* evidence/ 2>/dev/null || true
          fi
          if [ -n "${PROBE_DEVICE:-}" ]; then
            xcrun simctl spawn "$PROBE_DEVICE" log show --last 3m --style compact \
              --predicate 'process == "Probe"' > evidence/probe-system.log 2>&1 || true
            xcrun simctl shutdown "$PROBE_DEVICE" || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KartPad-UIKit-probe-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
