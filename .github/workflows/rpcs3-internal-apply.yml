name: Apply RPCS3 Internal Integration

on:
  push:
    branches:
      - feature/rpcs3-internal-engine-v1
    paths:
      - .github/workflows/rpcs3-internal-apply.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rpcs3-internal-engine-v1
          fetch-depth: 0

      - name: Apply RPCS3 internal routing
        run: |
          python3 build-utils/apply_rpcs3_internal_v1.py
          python3 build-utils/fix_rpcs3_internal_plugin_v1.py

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Verify pinned RPCS3 core source
        run: python3 build-utils/materialize_rpcs3_internal.py core

      - name: Resolve and format
        run: |
          flutter pub get
          dart format \
            packages/rpcs3_internal_bridge/lib/rpcs3_internal_bridge.dart \
            lib/services/rpcs3_internal_service.dart \
            lib/services/rpcs3_launch_service.dart \
            lib/services/rpcs3_library_service.dart \
            lib/widgets/rpcs3_internal_playlist_actions.dart \
            lib/screens/game_screen/my_games_list.dart \
            lib/screens/settings_screen/new_settings_options/directories_settings_content.dart \
            lib/services/game/game_launch_service.dart

      - name: Analyze and test
        run: |
          flutter analyze --no-fatal-infos
          flutter test --no-pub

      - name: Commit validated integration
        shell: bash
        run: |
          set -euo pipefail
          rm -rf packages/rpcs3_internal_bridge/ios/Frameworks
          rm -f .github/workflows/rpcs3-internal-apply.yml
          rm -f build-utils/apply_rpcs3_internal_v1.py
          rm -f build-utils/fix_rpcs3_internal_plugin_v1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(rpcs3): route PS3 library to internal engine"
          git push origin HEAD:feature/rpcs3-internal-engine-v1
