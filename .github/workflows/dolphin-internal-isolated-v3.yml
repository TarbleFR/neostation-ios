name: Build NeoStation iOS IPA
run-name: NeoSync Dolphin source audit
on:
  push:
    branches: [feature/neosync-dolphin-internal]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 41fb6cbd1401323f58224cee47c6e73091c55032
          fetch-depth: 1
          persist-credentials: false
      - name: Export exact stable source without local secrets
        run: git archive --format=zip --output=neosync-stable-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: neosync-stable-source
          path: neosync-stable-source.zip
          retention-days: 2
          if-no-files-found: error
