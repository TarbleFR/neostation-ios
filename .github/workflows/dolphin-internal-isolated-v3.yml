name: Final repository purge

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge Actions history and remove workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          repo = os.environ['REPO']
          current = int(os.environ['CURRENT_RUN'])
          raw = subprocess.check_output(['gh','api',f'/repos/{repo}/actions/runs?per_page=100','--paginate','--slurp'], text=True)
          pages = json.loads(raw)
          runs=[]
          for page in pages:
              runs.extend(page.get('workflow_runs', []))
          for run in runs:
              rid=int(run['id'])
              if rid==current:
                  continue
              subprocess.run(['gh','api','--method','DELETE',f'/repos/{repo}/actions/runs/{rid}'], check=True)
          for branch in ('backup','main'):
              try:
                  sha=subprocess.check_output(['gh','api',f'/repos/{repo}/contents/.github/workflows/dolphin-internal-isolated-v3.yml?ref={branch}','--jq','.sha'], text=True).strip()
              except subprocess.CalledProcessError:
                  continue
              subprocess.run([
                  'gh','api','--method','DELETE',f'/repos/{repo}/contents/.github/workflows/dolphin-internal-isolated-v3.yml',
                  '-f',f'message=chore: remove GitHub Actions workflow from {branch}',
                  '-f',f'sha={sha}',
                  '-f',f'branch={branch}'
              ], check=True)
          # Best effort: remove the purge run itself so Actions history is empty.
          subprocess.run(['gh','api','--method','DELETE',f'/repos/{repo}/actions/runs/{current}'], check=False)
          PY
