name: NeoSync Dolphin safety review
on:
  push:
    branches: [review/neosync-dolphin-safety]
permissions:
  contents: read
jobs:
  source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Export tracked sources only
        run: git archive --format=zip --output=neosync-safety-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: neosync-safety-source
          path: neosync-safety-source.zip
          if-no-files-found: error
          retention-days: 2
