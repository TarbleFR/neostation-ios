name: NeoStation iOS - Dolphin Internal Isolated v3
run-name: Dolphin Internal Isolated v3 Build 194 • ${{ github.sha }}

on:
  push:
    branches: [test/dolphin-internal-engine-isolated-v3]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: neostation-dolphin-internal-isolated-v3
  cancel-in-progress: true

jobs:
  build:
    name: Build and audit isolated Dolphin IPA
    runs-on: macos-15
    timeout-minutes: 180
    env:
      BUILD_NUMBER: '194'
      IPA_NAME: NeoStation-iOS-Dolphin-Internal-Isolated-v3-Build-194
      ARTIFACT_NAME: NeoStation-Dolphin-Internal-Isolated-v3-Build-194
      DOLPHIN_SHA: 7cac54161659421ed95c2cd1c0b0746539a4cd38
      HOMEBREW_NO_AUTO_UPDATE: '1'
      BUNDLE_GEMFILE: ${{ github.workspace }}/build-utils/Gemfile.dolphin
      BUNDLE_PATH: ${{ runner.temp }}/dolphin-ruby-gems
      CCACHE_DIR: ${{ github.workspace }}/.dolphin-ccache
      CCACHE_BASEDIR: ${{ runner.temp }}/dolphin-ios
      SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
      SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}

    steps:
      - name: Checkout exact isolated-v3 commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Snapshot source and verify isolation before compilation
        run: |
          set -euo pipefail
          python3 packages/dolphin_internal_bridge/ci/build_support.py snapshot
          python3 build-utils/check_dolphin_isolation_v2.py --base origin/main 2>&1 | tee build/dolphin-ci/isolation.txt
          python3 -m unittest discover -s test -p 'dolphin_*test.py' -v 2>&1 | tee build/dolphin-ci/ipa-validator-tests.txt

      - name: Upload auditable source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Dolphin-v3-source-${{ github.run_id }}
          path: build/dolphin-ci/source-review.zip
          if-no-files-found: error
          retention-days: 14

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Record toolchain and install pinned Ruby dependency
        run: |
          set -euo pipefail
          { xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; flutter --version; ruby --version; command -v ruby; bundle --version; pod --version; } | tee build/dolphin-ci/toolchain.txt
          bundle install
          cp build-utils/Gemfile.dolphin.lock build/dolphin-ci/Gemfile.dolphin.lock
          command -v cmake >/dev/null || brew install cmake
          command -v ninja >/dev/null || brew install ninja
          command -v ccache >/dev/null || brew install ccache
          ccache --max-size=2G

      - name: Prepare existing emulator build definitions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          required = ('SCREENSCRAPER_DEV_ID', 'SCREENSCRAPER_DEV_PASSWORD')
          values = {key: os.environ.get(key, '').strip() for key in required}
          missing = [key for key, value in values.items() if not value]
          if missing:
              raise SystemExit('Missing build secrets: ' + ', '.join(missing))
          values.update({
              'NEOSTATION_EXPERIMENTAL_STIKJIT_MELONX': 'true',
              'NEOSTATION_MELONX_BUNDLE_ID': 'com.nur.nx',
              'NEOSTATION_EXPERIMENTAL_STIKJIT_ARMSX2': 'true',
              'NEOSTATION_ARMSX2_BUNDLE_ID': 'xyz.aethersx2.AetherSX2',
              'NEOSTATION_EXPERIMENTAL_STIKJIT_RPCS3': 'true',
              'NEOSTATION_RPCS3_BUNDLE_ID': 'com.xitrix.RPCS3',
          })
          Path('.dart-defines.json').write_text(json.dumps(values))
          PY

      - name: Restore verified StikJIT 1.5.0
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://github.com/StikDebug/StikJIT/releases/download/1.5.0/StikJIT.xcframework.zip' -o "$RUNNER_TEMP/StikJIT.xcframework.zip"
          python3 packages/dolphin_internal_bridge/ci/build_support.py stik "$RUNNER_TEMP/StikJIT.xcframework.zip"

      - name: Analyze and test every existing integration
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter analyze --no-fatal-infos 2>&1 | tee build/dolphin-ci/flutter-analyze.txt
          flutter test --no-pub 2>&1 | tee build/dolphin-ci/flutter-tests.txt
          git diff --exit-code -- pubspec.yaml pubspec.lock

      - name: Generate iOS host without modifying application sources
        run: |
          set -euo pipefail
          flutter config --no-enable-swift-package-manager
          python3 packages/dolphin_internal_bridge/ci/build_support.py scaffold

      - name: Restore exact pinned Dolphin build product
        id: core-cache
        uses: actions/cache/restore@v4
        with:
          key: dolphin-v3-ios-arm64-xcode16.4-7cac5416-${{ hashFiles('build-utils/patch_dolphin_internal_core_v2.py') }}
          path: |
            ${{ runner.temp }}/dolphin-ios/build-iphoneos-Release/Source/iOS/Library/libdolphin.dylib
            ${{ runner.temp }}/dolphin-ios/Data/Sys
            ${{ runner.temp }}/dolphin-ios/Source/iOS/Library/NeoStationBridge.mm
            ${{ runner.temp }}/dolphin-ios/Source/iOS/Library/CMakeLists.txt
            ${{ runner.temp }}/dolphin-ios/Source/Core/Common/MemoryUtil_iOS_LuckTXM.cpp

      - name: Restore compiler cache
        if: steps.core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          key: dolphin-v3-ccache-xcode16.4-${{ github.run_id }}
          restore-keys: dolphin-v3-ccache-xcode16.4-
          path: .dolphin-ccache

      - name: Compile pinned real Dolphin arm64 core
        id: compile-core
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/dolphin-ios"
          rm -rf "$SRC"
          git init "$SRC"
          git -C "$SRC" remote add origin https://github.com/OatmealDome/dolphin-ios.git
          git -C "$SRC" fetch --depth 1 origin "$DOLPHIN_SHA"
          git -C "$SRC" checkout --detach FETCH_HEAD
          git -C "$SRC" submodule update --init --recursive --depth 1
          test "$(git -C "$SRC" rev-parse HEAD)" = "$DOLPHIN_SHA"
          python3 build-utils/patch_dolphin_internal_core_v2.py "$SRC"
          cmake -S "$SRC" -B "$SRC/build-iphoneos-Release" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$SRC/Externals/ios-cmake/ios.toolchain.cmake" \
            -DPLATFORM=OS64 -DDEPLOYMENT_TARGET=17.4 -DENABLE_VISIBILITY=ON \
            -DENABLE_BITCODE=OFF -DENABLE_ARC=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS=-fPIC -DIOS=ON -DENABLE_ANALYTICS=NO \
            -DUSE_SYSTEM_LIBS=OFF -DENABLE_TESTS=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache \
            2>&1 | tee build/dolphin-ci/dolphin-configure.txt
          cmake --build "$SRC/build-iphoneos-Release" --target dolphin --parallel 3 \
            2>&1 | tee build/dolphin-ci/dolphin-core-build.txt
          ccache --show-stats | tee build/dolphin-ci/ccache.txt

      - name: Validate core ABI and prepare embedded framework
        id: framework
        run: |
          set -euo pipefail
          python3 packages/dolphin_internal_bridge/ci/build_support.py framework "$RUNNER_TEMP/dolphin-ios"

      - name: Save verified pinned core for native build retries
        if: steps.core-cache.outputs.cache-hit != 'true' && steps.framework.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          key: dolphin-v3-ios-arm64-xcode16.4-7cac5416-${{ hashFiles('build-utils/patch_dolphin_internal_core_v2.py') }}
          path: |
            ${{ runner.temp }}/dolphin-ios/build-iphoneos-Release/Source/iOS/Library/libdolphin.dylib
            ${{ runner.temp }}/dolphin-ios/Data/Sys
            ${{ runner.temp }}/dolphin-ios/Source/iOS/Library/NeoStationBridge.mm
            ${{ runner.temp }}/dolphin-ios/Source/iOS/Library/CMakeLists.txt
            ${{ runner.temp }}/dolphin-ios/Source/Core/Common/MemoryUtil_iOS_LuckTXM.cpp

      - name: Configure Flutter release and test helper idempotence
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --config-only --no-pub \
            --build-number="$BUILD_NUMBER" --dart-define-from-file=.dart-defines.json \
            2>&1 | tee build/dolphin-ci/flutter-configure.txt
          python3 packages/dolphin_internal_bridge/ci/build_support.py configure
          dart run flutter_launcher_icons
          bash build-utils/force_ios_fork_icon.sh
          env -u BUNDLE_GEMFILE -u BUNDLE_PATH pod install --project-directory=ios \
            2>&1 | tee build/dolphin-ci/pod-install.txt
          xcodebuild -list -workspace ios/Runner.xcworkspace 2>&1 | tee build/dolphin-ci/xcode-schemes.txt
          git diff --exit-code -- pubspec.yaml pubspec.lock

      - name: Compile NeoStation and Dolphin helper without signing
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DolphinDerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' PROVISIONING_PROFILE_SPECIFIER='' \
            COMPILER_INDEX_STORE_ENABLE=NO build \
            2>&1 | tee build/dolphin-ci/xcodebuild.txt

      - name: Audit actual Mach-O linkage and package the IPA
        run: |
          set -euo pipefail
          python3 build-utils/check_dolphin_isolation_v2.py --base origin/main
          python3 packages/dolphin_internal_bridge/ci/build_support.py package

      - name: Upload unsigned IPA for sideload signing
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Save incremental compiler cache
        if: always() && steps.compile-core.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          key: dolphin-v3-ccache-xcode16.4-${{ github.run_id }}
          path: .dolphin-ccache

      - name: Upload compilation diagnostics without secrets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-Diagnostics
          path: build/dolphin-ci/
          if-no-files-found: warn
          retention-days: 14
