name: NeoSwap storage-backed prototype validation
on:
  workflow_dispatch:
  push:
    branches: [experimental]
permissions:
  contents: read
# Independent checks: no global concurrency group and no changes to Core/IPA.
jobs:
  storage:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Linux compression development dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y liblz4-dev zlib1g-dev clang
      - name: Select Xcode 16.4
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Real file tests, sanitized lifetime tests and paired benchmarks
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            python3 native/neoswap-storage/run_validation.py --output "$RUNNER_TEMP/storage-proof" --ios-sdk
          else
            python3 native/neoswap-storage/run_validation.py --output "$RUNNER_TEMP/storage-proof"
          fi
      - name: Verify optional host policy and exact evidence contract
        run: |
          python3 test/neoswap_shader_storage_host_test.py
          python3 test/neoswap_managed_swap_host_test.py
          python3 test/neoswap_source_archive_host_test.py
      - name: Actual shader consumer, Apple host SDK and real Vulkan lifetime
        run: python3 native/neoswap-storage/run_shader_validation.py --output "$RUNNER_TEMP/storage-proof"
      - name: Owned mutable CPU RAM-storage-RAM cycle and Swift interface
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            python3 native/neoswap-storage/run_managed_validation.py --output "$RUNNER_TEMP/storage-proof" --ios-sdk
          else
            python3 native/neoswap-storage/run_managed_validation.py --output "$RUNNER_TEMP/storage-proof"
          fi
      - name: Actual Core source client with real owned RAM-storage-RAM bytes
        run: python3 native/neoswap-storage/run_source_validation.py --output "$RUNNER_TEMP/storage-proof"
      - name: Preserve exact-source evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeoSwap-storage-prototype-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/storage-proof
          if-no-files-found: error
          retention-days: 14
