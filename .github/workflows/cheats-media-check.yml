name: Cheats and frontend media tests
on:
  push:
    branches: [experimental]
    paths:
      - 'lib/**'
      - 'native/cheats/**'
      - 'packages/**'
      - 'test/*cheat*'
      - 'test/frontend_media_gate_test.dart'
      - '.github/workflows/cheats-media-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cheats-media-validation
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Execute parser and atomic store tests
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -Wall -Wextra -Werror -Inative/cheats test/cheat_parser_test.cpp -o /tmp/cheat-parser
          /tmp/cheat-parser
          clang++ -std=c++20 -fobjc-arc -fblocks -Wno-deprecated-declarations -Inative/cheats test/cheat_store_test.mm -framework Foundation -o /tmp/cheat-store
          /tmp/cheat-store
          python3 test/cheats_media_source_contract_test.py
      - name: Compile actual native menus for iOS arm64
        shell: bash
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun clang++ -std=c++20 -fobjc-arc -fblocks -fsyntax-only -x objective-c++ -isysroot "$SDK" -target arm64-apple-ios17.4 packages/dolphin_internal_bridge/ios/Classes/DolphinSessionMenu.mm
          xcrun clang++ -std=c++20 -fobjc-arc -fblocks -fsyntax-only -x objective-c++ -isysroot "$SDK" -target arm64-apple-ios17.4 packages/armsx2_internal_bridge/ios/Classes/Armsx2SessionMenu.mm
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-fatal-infos
      - name: Execute frontend media and existing preview regression tests
        run: flutter test test/frontend_media_gate_test.dart test/video_preview_lifecycle_test.dart
