name: Complete release 0.0.1 legal metadata

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/complete-release-0.0.1-legal.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete:
    name: Add notices and source metadata without touching IPA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: '0.0.1'
      RELEASE_COMMIT: '5e6dc00b35b7bb7847c24198d9f4b08ade8ed9a0'
      IPA_SHA256: 'e1017b96842ec970be3ed0cd981083ee945d069cf76e689a4ca3c81339299b46'
      IPA_SIZE: '143538718'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record and verify existing IPA identity
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release-before.json"

          jq -e --arg commit "$RELEASE_COMMIT" '.target_commitish == $commit'             "$RUNNER_TEMP/release-before.json" >/dev/null

          IPA_ID="$(jq -r '.assets[] | select(.name=="NeoStation.ipa") | .id' "$RUNNER_TEMP/release-before.json")"
          IPA_SIZE_ACTUAL="$(jq -r '.assets[] | select(.name=="NeoStation.ipa") | .size' "$RUNNER_TEMP/release-before.json")"
          IPA_UPDATED="$(jq -r '.assets[] | select(.name=="NeoStation.ipa") | .updated_at' "$RUNNER_TEMP/release-before.json")"

          test -n "$IPA_ID" && test "$IPA_ID" != "null"
          test "$IPA_SIZE_ACTUAL" = "$IPA_SIZE"

          {
            echo "ORIGINAL_IPA_ID=$IPA_ID"
            echo "ORIGINAL_IPA_UPDATED=$IPA_UPDATED"
          } >> "$GITHUB_ENV"

          mkdir -p "$RUNNER_TEMP/ipa-before"
          gh release download "$RELEASE_TAG"             --repo "$GITHUB_REPOSITORY"             --pattern 'NeoStation.ipa'             --dir "$RUNNER_TEMP/ipa-before"

          echo "$IPA_SHA256  $RUNNER_TEMP/ipa-before/NeoStation.ipa" | sha256sum -c -

      - name: Build legal and source companion assets
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/release-assets"
          mkdir -p "$OUT/legal"

          cp LICENSE.md "$OUT/legal/NeoStation-GPL-3.0.txt"
          cp NOTICE.md "$OUT/legal/NeoStation-NOTICE.md"
          cp docs/LEGAL_AND_CREDITS.md "$OUT/legal/LEGAL_AND_CREDITS.md"
          cp docs/RELEASE_0.0.1_SOURCE_MANIFEST.md "$OUT/legal/RELEASE_0.0.1_SOURCE_MANIFEST.md"
          cp -R assets/legal/. "$OUT/legal/"

          (
            cd "$OUT"
            zip -qr NeoStation-0.0.1-Licenses-and-Notices.zip legal
          )

          cp docs/RELEASE_0.0.1_SOURCE_MANIFEST.md             "$OUT/NeoStation-0.0.1-Source-Manifest.md"

          git archive             --format=tar.gz             --prefix=neostation-ios-0.0.1/             --output="$OUT/NeoStation-0.0.1-NeoStation-Source.tar.gz"             "$RELEASE_COMMIT"

          {
            echo "$IPA_SHA256  NeoStation.ipa"
            cd "$OUT"
            sha256sum               NeoStation-0.0.1-Licenses-and-Notices.zip               NeoStation-0.0.1-Source-Manifest.md               NeoStation-0.0.1-NeoStation-Source.tar.gz
          } > "$OUT/NeoStation-0.0.1-SHA256SUMS.txt"

          ls -lh "$OUT"

      - name: Prepare improved release description
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'RELEASE_NOTES'
          <p align="center">
            <img src="https://raw.githubusercontent.com/TarbleFR/neostation-ios/5e6dc00b35b7bb7847c24198d9f4b08ade8ed9a0/assets/images/fork-icon-valid.jpg" width="180" alt="NeoStation iOS logo">
          </p>

          <h1 align="center">🎮 NeoStation iOS — 0.0.1</h1>

          <p align="center"><strong>First public GitHub release of NeoStation iOS.</strong></p>

          > [!IMPORTANT]
          > Please read the requirements, source information and third-party credits below before installing or redistributing NeoStation.

          NeoStation brings **embedded emulators, external integrations, native iOS ports, JIT workflows and library management** together in one interface.

          ---

          ## 📱 Compatible devices

          - ✅ iPhone or iPad
          - ✅ **iOS 18 or later**
          - ✅ **Developer Mode enabled**
          - ✅ NeoStation installed as a **standalone IPA**

          An **Apple Developer account** is recommended, especially to avoid the standard three-app sideloading limit and to use required entitlements more easily.

          Performance depends on the device, iOS version, emulator and game.

          ---

          ## 📦 Installation & signing

          NeoStation must be installed as a properly signed **standalone IPA**.

          Compatible methods can include:

          - SideStore
          - AltStore
          - compatible sideloading services
          - TrollStore, when supported
          - Apple Developer signing

          ### ❌ LiveContainer is not supported

          NeoStation relies on native iOS behavior including JIT, memory entitlements, URL schemes/deep links, external-app communication, native lifecycle management and emulator-specific permissions.

          ---

          ## 🕹️ Embedded emulators

          ### 🐬 Nintendo GameCube / Wii — DolphiniOS / Dolphin
          The GameCube/Wii engine is embedded directly in NeoStation.

          ### 🔵 PlayStation 2 — ARMSX2 / PCSX2
          The PS2 engine is embedded directly in NeoStation.

          ### 🔷 PlayStation 3 — RPCS3
          The PS3 engine is embedded directly in NeoStation.

          These are modified/integrated open-source components. Their original authors and licenses remain fully credited below.

          ---

          ## 👾 External emulator integrations

          ### 🔥 RetroArch
          The **RetroArch TestFlight / Beta version** is recommended for the supported external integration. RetroArch is installed separately.

          NeoStation can provide library synchronization, playlists, metadata and supported direct-launch/deep-link flows. Additional RetroArch cores/BIOS files may be required by the systems you use.

          ---

          ## ⚡ JIT — StikJIT

          NeoStation uses **StikJIT** for supported JIT workflows.

          Your environment may require:

          - a valid pairing file
          - **Alt Pairing File** when required
          - a compatible JIT route
          - appropriate app entitlements

          **NeoStation → Select Game → Play → JIT Activation → Game**

          ---

          ## 🔷 PlayStation 3 requirements

          RPCS3 may require:

          - JIT access
          - Virtual Addressing entitlement
          - Increased Memory entitlement
          - sufficient available RAM
          - correct pairing/JIT configuration

          Depending on the signing environment, **GetMoreRam** may also be required.

          ### ⚠️ Official PS3 firmware required
          You must provide and import your own legitimate PlayStation 3 system firmware.

          ---

          ## 🎮 Native iOS ports

          NeoStation includes integrations for native/recompiled game runtimes such as **KartPad** and **Dusklight**.

          > [!WARNING]
          > **NeoStation does not provide original commercial game files, ROMs, ISOs, firmware, BIOS files or copyrighted commercial game assets.**

          ### 🏎️ KartPad
          KartPad targets Mario Kart Wii. The pinned integration expects supported data from the user's own legally obtained copy; the current profile is PAL **RMCP01 revision 0**.

          ### 🗡️ Dusklight
          Dusklight is a Twilight Princess reimplementation. Users must provide supported game data from their own legally obtained copy as required by the upstream project.

          Software licenses for these runtimes do **not** grant rights in Nintendo-owned game content.

          ---

          ## 📚 Library setup

          NeoStation can:

          - add game folders
          - import supported games
          - synchronize emulator libraries
          - configure integrations
          - import BIOS and firmware files
          - download metadata/artwork
          - configure per-game settings
          - launch supported games

          Additional requirements can include:

          - **PlayStation 2** → your own BIOS
          - **PlayStation 3** → official PS3 firmware
          - **RetroArch** → appropriate cores / BIOS when required
          - **Native ports** → data from your legally obtained supported game

          ---

          ## ⚖️ Credits, licenses & source

          NeoStation iOS is possible because of many upstream projects. **Attribution does not imply endorsement.**

          | Project | Credit / license note |
          | --- | --- |
          | **NeoStation** | Original frontend by **Miguel Soto / @misobadev**, with @androosio, @ItsRetroPup and all upstream contributors. GPL-3.0-or-later upstream. |
          | **NeoStation iOS** | iOS fork, native integrations and maintenance by **@TarbleFR**. Upstream rights are preserved. |
          | **Dolphin / DolphiniOS** | Dolphin Emulator, OatmealDome and contributors. Most original Dolphin code is GPL-2.0-or-later; per-file SPDX notices apply. |
          | **RPCS3 / XITRIX** | RPCS3 contributors and XITRIX, with ARMSX3/StikDebug/iOS-community credits preserved. The pinned RPCS3 source states most files are GPL-2.0-only; NeoStation does not claim to relicense RPCS3. |
          | **ARMSX2 / PCSX2** | ARMSX2 and PCSX2 contributors. GPLv3/upstream component notices apply. |
          | **Dusklight** | TwilitRealm/Dusklight, Twilight Princess decompilation contributors, Aurora/Borealis and dependency authors. Dusklight root license: CC0-1.0. |
          | **KartPad / WiiCompiled** | KartPad by **@chrissotraidis**; WiiCompiled by **@patchzyy**. KartPad software is GPL-3.0-only where stated; commercial game-derived rights remain separate. |
          | **StikJIT** | StikDebug/StikJIT contributors. MPL-2.0. |
          | **GameDB / GameDB-PS3** | **Niema / @niemasd**, with GameDB-PS3 source attribution including **MiSTer Addons** and **Redump**. |
          | **RetroArch / libretro** | External integration; RetroArch/libretro contributors retain their own licenses and notices. |
          | **MeloNX / Ryujinx/Ryubing** | External integration where used; upstream credits and notices apply. |
          | **ScreenScraper / RetroAchievements** | External metadata/account services; their own terms, data and trademarks remain theirs. |

          ### Source records supplied with this release

          Additional release assets now include:

          - **NeoStation-0.0.1-Licenses-and-Notices.zip** — collected project and pinned third-party license/notices
          - **NeoStation-0.0.1-Source-Manifest.md** — exact embedded source revisions and legal/source boundaries
          - **NeoStation-0.0.1-NeoStation-Source.tar.gz** — exact NeoStation host source tree used to package Build 350
          - **NeoStation-0.0.1-SHA256SUMS.txt** — checksums for the IPA and companion assets

          GitHub's automatic source archives for tag **0.0.1** also point to the exact packaging source commit.

          > [!NOTE]
          > The source manifest is an identity/transparency record, not a claim that unavailable third-party/game-derived source has become licensed or publicly available. In particular, KartPad's own documentation separates GPL-covered software from rights in Nintendo-owned content and the pinned source metadata records a generated translation/profile-source limitation.

          Full maintained legal record:
          https://github.com/TarbleFR/neostation-ios/blob/main/docs/LEGAL_AND_CREDITS.md

          ---

          ## ™️ Trademark notice

          Nintendo, PlayStation, Sony, Xbox, Microsoft, SEGA, Dolphin, RPCS3, PCSX2, ARMSX2, RetroArch, MeloNX, KartPad, StikJIT and other referenced names/logos are the property of their respective owners where applicable.

          NeoStation iOS is an independent project and is not affiliated with, sponsored by or endorsed by those rights holders unless explicitly stated.

          ---

          ## ✨ One app. One library. Multiple systems.

          **Library → Metadata → Emulator → JIT → Launch**

          **One library. One interface. The fewest possible steps between choosing a game and playing it.**

          ---

          ## 📦 Release file

          Download **`NeoStation.ipa`** from the Assets section and sign it using a compatible method.

          **GitHub release:** 0.0.1  
          **Validated internal build:** Build 350  
          **Packaging source:** `5e6dc00b35b7bb7847c24198d9f4b08ade8ed9a0`  
          **IPA size:** `143538718` bytes  
          **IPA SHA-256:** `e1017b96842ec970be3ed0cd981083ee945d069cf76e689a4ca3c81339299b46`

          The original `NeoStation.ipa` published with this release has **not been replaced or modified** by the legal/documentation update.
          RELEASE_NOTES

      - name: Upload companion assets and update release text
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/release-assets"

          gh release upload "$RELEASE_TAG"             "$OUT/NeoStation-0.0.1-Licenses-and-Notices.zip"             "$OUT/NeoStation-0.0.1-Source-Manifest.md"             "$OUT/NeoStation-0.0.1-NeoStation-Source.tar.gz"             "$OUT/NeoStation-0.0.1-SHA256SUMS.txt"             --repo "$GITHUB_REPOSITORY"             --clobber

          gh release edit "$RELEASE_TAG"             --repo "$GITHUB_REPOSITORY"             --title "NeoStation iOS 0.0.1"             --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Prove NeoStation.ipa was not changed
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release-after.json"

          IPA_ID="$(jq -r '.assets[] | select(.name=="NeoStation.ipa") | .id' "$RUNNER_TEMP/release-after.json")"
          IPA_SIZE_ACTUAL="$(jq -r '.assets[] | select(.name=="NeoStation.ipa") | .size' "$RUNNER_TEMP/release-after.json")"
          IPA_UPDATED="$(jq -r '.assets[] | select(.name=="NeoStation.ipa") | .updated_at' "$RUNNER_TEMP/release-after.json")"

          test "$IPA_ID" = "$ORIGINAL_IPA_ID"
          test "$IPA_SIZE_ACTUAL" = "$IPA_SIZE"
          test "$IPA_UPDATED" = "$ORIGINAL_IPA_UPDATED"
          jq -e --arg commit "$RELEASE_COMMIT" '.target_commitish == $commit'             "$RUNNER_TEMP/release-after.json" >/dev/null

          mkdir -p "$RUNNER_TEMP/ipa-after"
          gh release download "$RELEASE_TAG"             --repo "$GITHUB_REPOSITORY"             --pattern 'NeoStation.ipa'             --dir "$RUNNER_TEMP/ipa-after"

          echo "$IPA_SHA256  $RUNNER_TEMP/ipa-after/NeoStation.ipa" | sha256sum -c -

          echo "NeoStation.ipa asset ID: $IPA_ID"
          echo "NeoStation.ipa size: $IPA_SIZE_ACTUAL"
          echo "NeoStation.ipa updated_at: $IPA_UPDATED"
          echo "NeoStation.ipa SHA-256: $IPA_SHA256"
