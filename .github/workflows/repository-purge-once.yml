name: Repository purge once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repository-purge-once.yml

permissions:
  contents: write
  actions: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete remaining historical workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          current = int(os.environ['CURRENT_RUN_ID'])
          base = f'https://api.github.com/repos/{repo}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'neostation-final-actions-purge',
          }
          def req(method, path):
              request = urllib.request.Request(base + path, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = response.read()
                      return response.status, json.loads(body) if body else None
              except urllib.error.HTTPError as exc:
                  if exc.code in (403, 404, 409, 422):
                      return exc.code, None
                  raise
          _, payload = req('GET', '/actions/runs?per_page=100')
          for run in payload.get('workflow_runs', []):
              run_id = int(run['id'])
              if run_id == current:
                  continue
              code, _ = req('DELETE', f'/actions/runs/{run_id}')
              print(f'run {run_id}: DELETE -> {code}')
          code, _ = req('DELETE', f'/actions/runs/{current}')
          print(f'current run {current}: DELETE -> {code}')
          PY
