            test/native/rpcs3_source_archive_client_test.cpp
          # RPCS3_CORE_INPUTS_END
          # The independent host broker/donation is rebuilt by this IPA job.
          # Only the Core source, client ABI, recipe and native tests are pinned.
          python3 test/neo_swap_core_pin_test.py
          python3 - <<'PY'
          import json, os, shutil, sys
          from pathlib import Path
          sys.path.insert(0, 'build-utils')
          sys.path.insert(0, 'test')
          from neo_swap_core_pin_test import validate_core_input_identity
          from validate_rpcs3_ipa import validate_core_identity
          from validate_rpcs3_embedded_core import validate_core
          from validate_rpcs3_passive_dlopen import validate as validate_passive_dlopen

          source = Path('dist/rpcs3-native/libRPCS3Core.dylib')
          identity_path = Path('dist/rpcs3-native/identity.json')
          destination = Path('packages/rpcs3_internal_bridge/ios/Frameworks/libRPCS3Core.dylib')
          data = source.read_bytes()
          identity = validate_core_identity(data, identity_path, os.environ['RPCS3_CORE_HOST_SHA'])
          validate_core(data)
          assert identity['neoswap_client_abi'] == 1, identity
          assert identity['neoswap_client_stats_abi'] == 1, identity
          assert identity['neoswap_relay_abi'] == 1, identity
          assert identity['neoswap_storage_abi'] == 1, identity
          assert identity['neoswap_source_archive_abi'] == 1, identity
          validate_core_input_identity(identity)
          passive = validate_passive_dlopen(data)
          assert passive['forbiddenReachability'] is False, passive

          shutil.copy2(source, destination)
          destination.chmod(0o755)
          assert destination.read_bytes() == data, 'RPCS3 Core installation changed artifact bytes'
          fast_path = Path('build/fast-native/identity.json')
