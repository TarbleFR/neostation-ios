      - name: Require completed exact Dusklight 2.0.3 Core
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, shutil, subprocess, time
          endpoint = 'repos/TarbleFR/neostation-ios/actions/runs/' + os.environ['DUSKLIGHT_CORE_RUN_ID']
          deadline = time.monotonic() + 3600
          while True:
              result = json.loads(subprocess.check_output(['gh', 'api', endpoint]))
              assert result['head_sha'] == os.environ['DUSKLIGHT_CORE_HOST_SHA'], result
              assert result['path'] == '.github/workflows/dusklight-core.yml', result
              if result['status'] == 'completed':
                  assert result['conclusion'] == 'success', result
                  break
              assert time.monotonic() < deadline, 'Pinned Dusklight Core did not complete'
              print('Waiting for exact Dusklight Core', result['id'], result['status'], flush=True)
              time.sleep(30)
          # The retained donor was verified separately. Remove its complete
          # Dusklight tree so retired resources cannot survive the update.
          shutil.rmtree('dist/dusklight')
          PY
          git diff --exit-code "$DUSKLIGHT_CORE_HOST_SHA" "$GITHUB_SHA" -- \
            native/dusklight build-utils/dusklight .github/workflows/dusklight-core.yml \
            packages/dusklight_internal_bridge/ios/Classes/DusklightCoreABI.h

