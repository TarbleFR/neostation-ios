          }
          expected_sources.update({
              'neostation/' + item.name: item
              for item in (canonical / 'core').iterdir() if item.is_file()
          })
          expected_sources['neostation/DusklightCoreABI.h'] = Path(
              'packages/dusklight_internal_bridge/ios/Classes/DusklightCoreABI.h')
          assert set(identity['canonical_sources']) == set(expected_sources)
          for relative, source in expected_sources.items():
              assert hashlib.sha256(source.read_bytes()).hexdigest() == identity['canonical_sources'][relative], relative
          framework = root / 'DusklightCore.framework'
          assert hashlib.sha256((framework / 'DusklightCore').read_bytes()).hexdigest() == identity['sha256']
          for relative, digest in identity['resources'].items():
