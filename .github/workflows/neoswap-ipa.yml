          cp dist/neoswap-validation.json build/private-test/
          cp dist/neoplay-validation.json build/private-test/
          cp docs/neoplay/BUILD397.md build/private-test/Notes-NeoPlay-Build397.md
          cp "$RUNNER_TEMP/neoswap-evidence/capacity-8GiB-macOS.json" build/private-test/
          cp -R "$RUNNER_TEMP/neoswap-evidence/donation" build/private-test/donation-evidence
          cp -R "$RUNNER_TEMP/neoswap-evidence/vulkan" build/private-test/vulkan-evidence
          cp -R "$RUNNER_TEMP/neoswap-evidence/relay" build/private-test/relay-evidence
          cp docs/cheats-bulk365.md build/private-test/Notes-Cheats-Build365.md
          cp dist/0.0.2-validation.json build/private-test/
          cp "$RUNNER_TEMP/neoswap-evidence/phone-shake-tests.json" build/private-test/
          cp docs/releases/0.0.2.md build/private-test/Notes-0.0.2.md
          printf 'NeoStation-Build%s-%s.ipa\n' "$BUILD_NUMBER" "$GITHUB_SHA" > build/private-test/delivery-name.txt
          cp build/stikjit-current/modern-baseline.json build/private-test/
          cp build/fast-native/identity.json build/private-test/native-identity.json
          printf 'commit=%s\nbuild=%s\nrelease_published=false\n' "$GITHUB_SHA" "$BUILD_NUMBER" > build/private-test/identity.txt
          test -s build/private-test/NeoStation.ipa
          test "$(find build/private-test -maxdepth 1 -type f -name '*.ipa' | wc -l | tr -d ' ')" = 1

      - name: Upload direct private IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: build/private-test/
          if-no-files-found: error
          retention-days: 3

      - name: Collect fast diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p build/fast-diagnostics
          test -f "$RUNNER_TEMP/neoswap-stikjit-step.log" && tail -n 150 "$RUNNER_TEMP/neoswap-stikjit-step.log" > build/fast-diagnostics/stikjit-step.log || true
          test -f "$RUNNER_TEMP/neostation-fast-xcodebuild.log" &&             tail -n 350 "$RUNNER_TEMP/neostation-fast-xcodebuild.log" > build/fast-diagnostics/xcodebuild.log || true
          cp -f build/fast-native/identity.json build/fast-diagnostics/ 2>/dev/null || true
          cp -f build/fast-native/rpcs3-core-identity.json build/fast-diagnostics/ 2>/dev/null || true
          printf 'commit=%s\nbuild=%s\n' "$GITHUB_SHA" "$BUILD_NUMBER" > build/fast-diagnostics/build.txt

      - name: Upload fast diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-diagnostics
          path: build/fast-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Remove temporary secrets
        if: always()
        shell: bash
        run: rm -f .dart-defines.json
