      - name: Download validated Build 350 native donor
        uses: actions/download-artifact@v4
        with:
          # Build 270 was pruned from Actions history after the stable Build
          # 350 baseline was accepted. Pin the exact retained Build 350 IPA;
          # only its native Core and UI resources are used, never its JIT framework.
          artifact-ids: 10932894067
          run-id: 36323843067
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/native-donor

      - name: Reuse validated native runtimes
        shell: bash
        run: |
          set -euo pipefail
