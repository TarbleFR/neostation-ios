              'rpcs3CoreSourceCommit': identity['source_commit'],
              'rpcs3CorePatchSha256': identity['source_patch_sha256'],
              'rpcs3CoreAbiVersion': identity['abi_version'],
              'rpcs3CoreRunId': int(os.environ['RPCS3_CORE_RUN_ID']),
              'rpcs3PassiveDlopen': passive,
          })
          fast_path.write_text(json.dumps(fast, indent=2) + '\n')
          shutil.copy2(identity_path, 'build/fast-native/rpcs3-core-identity.json')
          print(json.dumps({'identity': identity, 'passiveDlopen': passive}, indent=2))
          PY
          file "$CORE"
          test "$(lipo -archs "$CORE")" = arm64
          nm -gU "$CORE" > build/rpcs3-core-exports.txt
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'build-utils')
          from validate_rpcs3_ipa import REQUIRED_CORE_SYMBOLS, FORBIDDEN_CORE_SYMBOLS
          exports = Path('build/rpcs3-core-exports.txt').read_text().splitlines()
          symbols = {line.split()[-1] for line in exports if line.split()}
          missing = (set(REQUIRED_CORE_SYMBOLS) | {
              '_rpcs3_ios_set_neoswap_api', '_rpcs3_ios_get_neoswap_client_stats',
          }) - symbols
          forbidden = set(FORBIDDEN_CORE_SYMBOLS) & symbols
          assert not missing, f'Missing RPCS3 Core exports: {sorted(missing)}'
          assert not forbidden, f'Retired RPCS3 Core exports: {sorted(forbidden)}'
          PY

