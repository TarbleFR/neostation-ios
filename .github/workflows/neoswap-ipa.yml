name: NeoStation NeoSwap + NeoPlay private • Build 398
run-name: NeoStation NeoSwap + NeoPlay private • Build 398 • ${{ github.sha }}

on:
  push:
    branches:
      - experimental
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Candidate build number (used only for manual runs)'
        required: true
        default: '398'
        type: string
      kartpad_core_run_id:
        description: 'Validated KartPadCore artifact workflow run ID; leave empty for a non-KartPad manual build'
        required: false
        default: ''
        type: string
      kartpad_core_host_sha:
        description: 'Commit SHA recorded by the KartPadCore artifact'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

# Keep candidate IPA runs separate from native validation.
concurrency:
  group: neostation-neoswap-neoplay-build398
  cancel-in-progress: true

jobs:
  wait-evidence:
    # Do not occupy a scarce macOS runner while the exact-SHA native workflows
    # are still queued. This Linux gate prevents the previous build/donation
    # runner deadlock; the macOS build revalidates and downloads the evidence.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[neoswap-ipa]') }}
    name: Wait for exact candidate evidence
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Require completed Build 396 without cancelling its run
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PREVIOUS'
          import json, subprocess, time
          repo = 'TarbleFR/neostation-ios'
          run_id = 37065639799
          expected_sha = 'd3d5681cc8b10af1cd503ea72a4886c82faaa3ef'
          deadline = time.monotonic() + 3600
          while True:
              run = json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run_id}']))
              assert run['head_sha'] == expected_sha and run['path'] == '.github/workflows/neoswap-ipa.yml'
              if run['status'] == 'completed':
                  assert run['conclusion'] == 'success', 'Build396 did not succeed; inspect it before packaging Build398'
                  break
              if time.monotonic() >= deadline:
                  raise SystemExit('Timed out waiting for Build396; no build was cancelled')
              print('Build396 is still running; Build398 packaging remains gated', flush=True)
              time.sleep(30)
          artifacts = json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100']))['artifacts']
          expected = 'NeoStation-NeoSwap-Build-396-' + expected_sha
          assert any(a['name'] == expected and not a['expired'] for a in artifacts), 'Build396 IPA artifact is absent'
          print('Build396 completed successfully; its IPA artifact is preserved', flush=True)
          PREVIOUS

      - name: Wait for exact-SHA validation workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, time
          workflows = (
              'neoswap-check.yml',
              'neoswap-donation-check.yml',
              'neoswap-vulkan-proof.yml',
              'neoswap-relay-check.yml',
              'dolphin-pacing-check.yml',
              'dolphin-motion-check.yml',
              'cheats-media-check.yml',
              'neoswap-storage-prototype.yml',
              'neoplay-check.yml',
          )
          sha = os.environ['GITHUB_SHA']
          deadline = time.monotonic() + 5100
          pending = set(workflows)
          while pending:
              for workflow in tuple(pending):
                  endpoint = f'repos/TarbleFR/neostation-ios/actions/workflows/{workflow}/runs?head_sha={sha}&per_page=10'
                  rows = json.loads(subprocess.check_output(['gh','api',endpoint]))['workflow_runs']
                  rows = [row for row in rows if row['head_sha'] == sha]
                  if not rows or rows[0]['status'] != 'completed':
                      continue
                  if rows[0]['conclusion'] != 'success':
                      raise SystemExit(f'{workflow} failed: {rows[0]["id"]} {rows[0]["conclusion"]}')
                  print(f'Validated {workflow} run {rows[0]["id"]}', flush=True)
                  pending.remove(workflow)
              if pending:
                  if time.monotonic() >= deadline:
                      raise SystemExit('Timed out waiting for: ' + ', '.join(sorted(pending)))
                  time.sleep(15)
          PY

  build:
    needs: wait-evidence
    # Core-only development commits validate their native engine separately,
    # not a mislabeled full NeoStation IPA.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[neoswap-ipa]') }}
    name: Neostation iOS 0.0.2 private IPA (398)
    runs-on: macos-15
    timeout-minutes: 210
    env:
      BUILD_NUMBER: ${{ inputs.build_number || '398' }}
      IPA_NAME: NeoStation
      ARTIFACT_NAME: NeoStation-NeoSwap-NeoPlay-Build-398-${{ github.sha }}
      KARTPAD_CORE_RUN_ID: ${{ inputs.kartpad_core_run_id || '36322395443' }}
      KARTPAD_CORE_HOST_SHA: ${{ inputs.kartpad_core_host_sha || '3934ac9d333247d5374b9fb7d71f8ef49bbcd79e' }}
      KARTPAD_CANDIDATE: '1'
      # Preserve the validated KartPad session recovery while testing the new pinned RPCS3 Core.
      DOLPHIN_SHA: 7cac54161659421ed95c2cd1c0b0746539a4cd38
      DOLPHIN_CORE_HOST_SHA: ae7d46f90dff64ce698b8c18e0c12510dbae96fe
      ARMSX2_CORE_HOST_SHA: 82351b75114df5fb33387f2157745bccaf1c872d
      RPCS3_CORE_HOST_SHA: 43dac44766c10714fe41baf45badcec926dffcd8
      RPCS3_CORE_RUN_ID: '37058087412'
      DUSKLIGHT_CORE_HOST_SHA: 94ed2d91e1547e1879fab214b6ef082b642dff84
      DUSKLIGHT_CORE_RUN_ID: '36720032937'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      BUNDLE_GEMFILE: ${{ github.workspace }}/build-utils/Gemfile.dolphin
      SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
      SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate pinned notices before tests and compilation
        run: |
          set -euo pipefail
          python3 test/legal_bundle_preflight_test.py
          python3 build-utils/embed_legal_bundle.py --validate-only --dolphin-sha "$DOLPHIN_SHA"

      - name: Require exact import, memory donation and retained simulator checks before compilation
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess,time,os,shutil,runpy,sys
          from pathlib import Path
          sys.path.insert(0,str(Path(os.environ['GITHUB_WORKSPACE'])/'test'))
          validate_relay_simulator=runpy.run_path(str(Path(os.environ['GITHUB_WORKSPACE'])/'test/neoswap_relay_simulator_test.py'))['validate_evidence']
          validate_simulator=runpy.run_path(str(Path(os.environ['GITHUB_WORKSPACE'])/'test/neoswap_donor_simulator_test.py'))['validate_evidence']
          for workflow in ('neoswap-check.yml','neoswap-donation-check.yml','neoswap-vulkan-proof.yml','neoswap-relay-check.yml','dolphin-pacing-check.yml','dolphin-motion-check.yml','cheats-media-check.yml'):
              deadline=time.monotonic()+3600
              while True:
                  endpoint='repos/TarbleFR/neostation-ios/actions/workflows/'+workflow+'/runs?head_sha='+os.environ['GITHUB_SHA']+'&per_page=10'
                  rows=json.loads(subprocess.check_output(['gh','api',endpoint]))['workflow_runs']
                  rows=[r for r in rows if r['head_sha']==os.environ['GITHUB_SHA']]
                  if rows and rows[0]['status']=='completed':
                      assert rows[0]['conclusion']=='success',rows[0]
                      print('Verified exact candidate',workflow,rows[0]['id'])
                      if workflow=='neoswap-vulkan-proof.yml':
                          import hashlib
                          evidence=Path(os.environ['RUNNER_TEMP'])/'neoswap-evidence'/'vulkan';evidence.mkdir(parents=True,exist_ok=True)
                          subprocess.run(['gh','run','download',str(rows[0]['id']),'-n','NeoSwap-Vulkan-'+os.environ['GITHUB_SHA'],'-D',str(evidence)],check=True)
                          identity=json.loads((evidence/'identity.json').read_text())
                          canonical=json.loads(Path('build-utils/rpcs3/canonical-source.json').read_text())
                          assert identity['source']==os.environ['GITHUB_SHA']
                          assert identity['moltenVK']=='1.4.2' and identity['moltenVKSHA256']=='f95765a6229cb7b915990a2890ce12ebe36a730b021545d3d52ae69ce4c4024e'
                          assert identity['canonicalPatchSHA256']==canonical['patch_sha256']
                          assert identity['productionImportSHA256']==canonical['files_sha256']['rpcs3/ios/NeoSwapVulkanBuffer.h']
                          for path,digest in identity['inputsSHA256'].items():
                              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,(path,digest)
                          report=json.loads((evidence/'report.json').read_text());gpu=report['vulkanDonation']
                          assert report['passed'] is True and report['residentTargetVerified'] is True
                          assert report['hostPID']!=report['donorPID'] and report['donorResidentBytes']>=134217728-1024**2
                          assert gpu['passed'] is True and gpu['importedBytes']==gpu['donatedLiveBytesDuringGPU']==gpu['gpuWrittenBytes']==134217728
                          assert gpu['gpuToCpuAliasVerified'] is True and gpu['retiredLiveBytes']==0
                          assert gpu['rendererBudgetDuringGPU']==134217728 and gpu['rendererBudgetAfterRetirement']==0
                          assert gpu['productionRPCS3ImportPath'] is True and gpu['productionHostBroker'] is True
                          assert gpu['hostNonvolatileDeltaBytes']<1024**2 and gpu['hostFootprintDeltaBytes']<64*1024**2
                          assert gpu['realIPhoneValidated'] is False and gpu['realRPCS3GameplayValidated'] is False
                      if workflow=='neoswap-relay-check.yml':
                          import hashlib
                          evidence=Path(os.environ['RUNNER_TEMP'])/'neoswap-evidence'/'relay';evidence.mkdir(parents=True,exist_ok=True)
                          subprocess.run(['gh','run','download',str(rows[0]['id']),'-n','NeoSwap-Relay-'+os.environ['GITHUB_SHA'],'-D',str(evidence)],check=True)
                          identity=json.loads((evidence/'identity.json').read_text())
                          assert identity['source']==os.environ['GITHUB_SHA'] and identity['realIPhoneValidated'] is False
                          assert identity['realRPCS3GameplayValidated'] is False
                          assert identity['macOSWrittenTargetBytes']==1073741824 and identity['simulatorWrittenTargetBytes']==33554432
                          assert identity['productionManagerCapacityTargetBytes']==8589934592
                          assert identity['macOSCapacityTargetBytes']==8589934592 and identity['macOSCapacitySampleWrittenTargetBytes']==1048576
                          required={'native/neoswap-relay/'+name for name in ('Backend.cpp','Backend.h','NeoSwapPageRelay.mm','NeoSwapPageRelay.h','NeoSwapPageRelayHandler.mm','NeoSwapPageRelayHandler.h','Info.plist','NeoSwapPageRelay.entitlements','relay_macos_probe.mm','run_relay_macos_probe.sh')}
                          required.update({'packages/neo_swap/ios/Classes/'+name for name in ('NeoSwapRelay.h','NeoSwapRelayService.h','NeoSwapRelayService.mm')})
                          required.update(('build-utils/configure_neoswap_relay.py','test/relay_backend_test.cpp','test/neoswap_relay_extension_test.py','test/neoswap_relay_simulator_test.py','.github/workflows/neoswap-relay-check.yml'))
                          assert required<=set(identity['inputsSHA256']),identity
                          for path,digest in identity['inputsSHA256'].items():
                              assert hashlib.sha256((Path(os.environ['GITHUB_WORKSPACE'])/path).read_bytes()).hexdigest()==digest,(path,digest)
                          native=json.loads((evidence/'macos/report.json').read_text())
                          assert native['schema']==1 and native['passed'] is True and native['platform']=='macOS-real-NSXPC-creator-exit'
                          assert native['iphoneExtensionValidated'] is False and native['realRPCS3GameValidated'] is False
                          assert native['hostPID']>0 and native['creatorPID']>0 and native['hostPID']!=native['creatorPID']
                          assert native['creatorExitObserved'] is True and native['aliasesMatched'] is True
                          assert native['capacityBytes']==native['actualWrittenBytes']==1073741824
                          assert 1073741824-1048576<=native['residentBytesMeasured']<=1073741824
                          assert native['hostFootprintDelta']<67108864 and native['hostNonvolatileDelta']<1048576
                          assert native['reservedVirtualBytesClaimedAsRAM']==0 and native['liveBytesAfterRelease']==native['aliasesAfterRelease']==0
                          assert native['reusedIntervalZeroed'] is True and native['relaunchSucceeded'] is True
                          assert len(native['negativeScenarios'])==5 and all(case['passed'] is True for case in native['negativeScenarios'])
                          capacity=native['capacity8GiB']
                          assert capacity['passed'] is True and capacity['creatorExitObserved'] is True and capacity['aliasesMatched'] is True
                          assert capacity['requestedCapacityBytes']==capacity['capacityBytes']==8589934592
                          assert capacity['entryCount']==16 and capacity['segmentBytes']==536870912
                          assert capacity['actualWrittenBytes']==1048576 and capacity['perSegmentWrittenBytes']==65536
                          assert 0<capacity['residentBytesForSample']<=1048576 and capacity['fullCapacityResidentValidated'] is False
                          assert capacity['liveBytesAfterRelease']==capacity['retainedBytesAfterShutdown']==0
                          simulator=json.loads((evidence/'simulator/report.json').read_text())
                          validate_relay_simulator(simulator)
                          arm64=json.loads((evidence/'simulator/arm64-report.json').read_text())
                          assert arm64['passed'] is True and arm64['platform']=='iOS18-arm64-compile-only'
                          assert arm64['realIPhoneValidated'] is False and arm64['realRPCS3GameplayValidated'] is False
                          assert arm64['buildPreflight']['deviceArm64Linked'] is True
                          for proof in (simulator,arm64):
                              assert proof['source']==os.environ['GITHUB_SHA']
                              assert proof['buildPreflight']['hostLauncherAbsentFromExtension'] is True
                              for path,digest in proof['buildPreflight']['sourceSHA256'].items():
                                  assert identity['inputsSHA256'][path]==digest,(path,digest)
                      if workflow=='neoswap-check.yml':
                          # Flutter clean removes build/ after this gate.
                          evidence=Path(os.environ['RUNNER_TEMP'])/'neoswap-evidence';evidence.mkdir(parents=True,exist_ok=True)
                          subprocess.run(['gh','run','download',str(rows[0]['id']),'-n','NeoSwap-checks-'+os.environ['GITHUB_SHA'],'-D',str(evidence)],check=True)
                          logs=list(evidence.rglob('capacity-8GiB-macOS.txt'));assert len(logs)==1
                          reports=[json.loads(line) for line in logs[0].read_text().splitlines() if line.startswith('{')]
                          assert len(reports)==1 and reports[0]['verifiedBytes']==8589934592 and reports[0]['realIPhoneValidated'] is False
                          assert reports[0]['footprintPeak']>=reports[0]['footprintBefore']>0
                          (evidence/'capacity-8GiB-macOS.json').write_text(json.dumps(reports[0],indent=2)+'\n')
                      if workflow=='neoswap-donation-check.yml':
                          evidence=Path(os.environ['RUNNER_TEMP'])/'neoswap-evidence'/'donation';evidence.mkdir(parents=True,exist_ok=True)
                          for phase in ('kernel','ipc','simulator'):
                              destination=evidence/phase
                              subprocess.run(['gh','run','download',str(rows[0]['id']),'-n','NeoSwap-donation-'+phase+'-'+os.environ['GITHUB_SHA'],'-D',str(destination)],check=True)
                              assert (destination/'source.txt').read_text().strip()==os.environ['GITHUB_SHA']
                              report=json.loads((destination/'report.json').read_text())
                              assert report['passed'] is True,(phase,report)
                              if phase=='kernel':
                                  assert report['realIPhoneValidated'] is False and report['source']==os.environ['GITHUB_SHA']
                              elif phase=='ipc':
                                  assert report['iphoneExtensionValidated'] is False and report['hostPID']!=report['donorPID']
                                  assert report['schema']==2 and report['verifiedChunkCount']>=2
                                  assert report['distinctChunkRights'] is True and report['priorBorrowedDataPreserved'] is True
                                  assert report['machHandleCleanupRetried'] is True
                              else:
                                  validate_simulator(report)
                                  for path,digest in report['sourceSHA256'].items():
                                      import hashlib
                                      assert hashlib.sha256((Path(os.environ['GITHUB_WORKSPACE'])/path).read_bytes()).hexdigest()==digest,(path,digest)
                          stress=evidence/'stress'
                          subprocess.run(['gh','run','download',str(rows[0]['id']),'-n','NeoSwap-donation-stress-'+os.environ['GITHUB_SHA'],'-D',str(stress)],check=True)
                          assert (stress/'source.txt').read_text().strip()==os.environ['GITHUB_SHA']
                          stress_report=json.loads((stress/'report.json').read_text())
                          assert stress_report['iphoneExtensionValidated'] is False
                          assert stress_report['targetBytes']==8589934592
                          if stress_report['passed']:
                              assert stress_report['preparedBytes']==8589934592 and stress_report['residentTargetVerified'] is True
                              assert stress_report['donorResidentBytes']>=8589934592-1024**2
                          else:
                              assert stress_report.get('technicalError'),stress_report
                          (evidence/'identity.json').write_text(json.dumps({'source':os.environ['GITHUB_SHA'],'realIPhoneValidated':False,'validatedPlatforms':['macOS kernel','macOS NSXPC','iOS18Simulator']},indent=2)+'\n')
                      break
                  assert time.monotonic()<deadline,'Candidate evidence did not complete: '+workflow
                  time.sleep(15)
          subprocess.run(['python3','test/stikjit_scoped_host_test.py'],check=True)
          subprocess.run(['python3','test/dolphin_phone_shake_test.py'],check=True)
          subprocess.run(['python3','test/dolphin_phone_shake_routing_test.py'],check=True)
          shutil.copy2('build/dolphin-motion/tests.json',Path(os.environ['RUNNER_TEMP'])/'neoswap-evidence'/'phone-shake-tests.json')
          PY

      - name: Validate KartPad candidate inputs
        if: ${{ env.KARTPAD_CANDIDATE == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KARTPAD_CORE_RUN_ID"
          test -n "$KARTPAD_CORE_HOST_SHA"
          [[ "$KARTPAD_CORE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$KARTPAD_CORE_HOST_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$BUILD_NUMBER" != "322" || {
            echo "KartPad candidates must not reuse the stable Build 322 number." >&2
            exit 1
          }

      - name: Download validated native session and CoreAudio evidence
        uses: actions/download-artifact@v4
        with:
          # Pin successful attempt 2; attempt 1 never launched the simulator app.
          artifact-ids: 10932827839
          merge-multiple: true
          run-id: 36322565781
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/kartpad-lifecycle-evidence

      - name: Require tested lifecycle and frontend sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTEST'
          import json
          from pathlib import Path
          evidence=Path('build/kartpad-lifecycle-evidence')
          assert (evidence/'source.txt').read_text().strip() == 'd3e558fad05feeb0838b4d3d80fc854546eaf0a4'
          identity=json.loads((evidence/'donor-identity.json').read_text())
          assert identity['host_commit']=='3934ac9d333247d5374b9fb7d71f8ef49bbcd79e'
          assert identity['runtime_sha256']=='ad5c00a0a508bbfcc0dc3eb1ee04a17f10919cde0b5cccd90d1d9e6a31c39eb0'
          report=json.loads((evidence/'probe.json').read_text())
          assert report['success'] and report['reproducedStaleCallback'] and report['reproducedStaleTimer'], report
          assert report['hleResetCycles']==20 and report['rendererAudioCycles']==3 and report['frontendAudioCycles']==3, report
          assert report['uikitStackGuardBound'] and report['uikitHostPumps']>0, report
          PYTEST
          # Permit only the two new native identities; compare all existing lifecycle code byte-for-byte.
          python3 test/cheats_media_source_contract_test.py
          # The UIKit probe covers these unchanged lifecycle/audio reset sources.
          # Donor menu and ARM64 instruction changes are separately bound to
          # KARTPAD_CORE_HOST_SHA and exercised by the native donor workflow.
          git diff --exit-code d3e558fad05feeb0838b4d3d80fc854546eaf0a4 "$GITHUB_SHA" -- \
            native/kartpad/core/DonorSessionReset.h \
            native/kartpad/core/DonorAudioSession.h \
            native/kartpad/core/DonorDataLifecycle.h \
            native/kartpad/core/UIKitEventPump.h test/kartpad_simulator_probe.mm \
            lib/services/music_player_service.dart lib/services/home_music_service.dart

      - name: Download exact iOS 18 Flutter guest-stack evidence
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 10932119768
          merge-multiple: true
          run-id: 36322395458
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/kartpad-readiness-evidence/iOS-18

      - name: Download exact iOS 27 Flutter guest-stack evidence
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 10933147219
          merge-multiple: true
          run-id: 36322395458
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/kartpad-readiness-evidence/iOS-27

      - name: Require tested readiness, guest-stack recovery and iOS 27 menu exits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          def cycles(rows, fiber=False):
              assert rows[-1]['stage']=='success', rows[-1]
              for stage in ('launch_acknowledged','returned','after'):
                  assert sum(r['stage']==stage for r in rows)==5, stage
              assert sum(r['stage']=='waiter_contract_passed' for r in rows)==1
              after=[r['values']['arguments'] for r in rows if r['stage']=='after']
              assert all(r['frames']>0 and r['delayMs']<2000 for r in after), after
              if fiber:
                  guest=[r['values'] for r in rows if r['stage']=='guest_stack_end']
                  assert len(guest)==5
                  assert all(r['guardBound'] and r['skipped']>0 and r['hostPumps']>0 for r in guest)
          for system in ('iOS-18','iOS-27'):
              evidence=Path('build/kartpad-readiness-evidence')/system
              assert (evidence/'source.txt').read_text().strip()=='3934ac9d333247d5374b9fb7d71f8ef49bbcd79e'
              identity=json.loads((evidence/'donor-identity.json').read_text())
              assert identity['host_commit']=='3934ac9d333247d5374b9fb7d71f8ef49bbcd79e'
              assert identity['runtime_sha256']=='ad5c00a0a508bbfcc0dc3eb1ee04a17f10919cde0b5cccd90d1d9e6a31c39eb0'
              cycles(json.loads((evidence/'automatic-cycles.json').read_text()))
              cycles(json.loads((evidence/'fiber-probe.json').read_text()),True)
              unsafe=json.loads((evidence/'unsafe-fiber-probe.json').read_text())
              assert unsafe[-1]['stage']=='returned'
              assert sum(r['stage']=='guest_stack_end' for r in unsafe)==1
              assert not any(r['stage'] in ('launch_acknowledged','after','success') for r in unsafe)
              if system=='iOS-27':
                  # Final probe.json is collected even when xcodebuild hangs
                  # after its suite. Require the actual five menu exit events.
                  menu=json.loads((evidence/'flutter-probe.json').read_text())
                  cycles(menu,True)
                  assert sum(r['stage']=='menu_exit_requested' for r in menu)==5
          # iOS 18's menu XCTest still aborts in the pre-existing donor
          # worker-thread UIKit size read. It is not counted as passing here.
          PY
          git diff --exit-code 3934ac9d333247d5374b9fb7d71f8ef49bbcd79e "$GITHUB_SHA" -- \
            packages/kartpad_internal_bridge/ios/Classes \
            lib/services/kartpad_internal_service.dart lib/utils/game_launch_utils.dart \
            native/kartpad/core/UIKitEventPump.h native/kartpad/donor \
            build-utils/kartpad/patch_donor_session_bridge.py \
            test/kartpad_flutter_probe.dart test/kartpad_flutter_probe.mm test/kartpad_menu_probe.swift

      - name: Select Xcode 26.3 for NeoPlay and Google Cast
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Validate canonical host sources
        shell: bash
        run: |
          set -euo pipefail
