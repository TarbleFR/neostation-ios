name: Repository Cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repository-cleanup.yml

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    name: Purge obsolete branches and Actions history
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Delete obsolete branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          obsolete_branches=(
            'backup/main-before-build-167'
            'feature/pairing-file-settings'
            'feature/stikjit-armsx2'
            'feature/stikjit-rpcs3'
          )

          for branch in "${obsolete_branches[@]}"; do
            encoded=$(python3 - "$branch" <<'PY'
          import sys
          import urllib.parse
          print(urllib.parse.quote(sys.argv[1], safe=''))
          PY
          )

            if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$encoded" >/dev/null 2>&1; then
              echo "Deleting branch: $branch"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$encoded"
            else
              echo "Branch already absent: $branch"
            fi
          done

      - name: Purge previous workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mapfile -t run_ids < <(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
              --jq '.workflow_runs[].id'
          )

          for run_id in "${run_ids[@]}"; do
            if [ "$run_id" = "$GITHUB_RUN_ID" ]; then
              continue
            fi
            echo "Deleting workflow run: $run_id"
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" || true
          done

      - name: Purge remaining Actions artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mapfile -t artifact_ids < <(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
              --jq '.artifacts[].id'
          )

          for artifact_id in "${artifact_ids[@]}"; do
            echo "Deleting artifact: $artifact_id"
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" || true
          done

      - name: Confirm retained branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/branches?per_page=100" \
            --jq '.[].name'
