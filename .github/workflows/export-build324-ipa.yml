name: Export Build 324 IPA chunks
run-name: Export Build 324 IPA chunks • ${{ github.sha }}

on:
  push:
    branches: [experimental]
    paths:
      - '.github/workflows/export-build324-ipa.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  export:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download validated Build 324 artifact
        uses: actions/download-artifact@v4
        with:
          name: NeoStation-iOS-Build-324-KartPad-RVZ-Settings-Candidate
          run-id: 36008875247
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build324

      - name: Split validated IPA
        shell: bash
        run: |
          set -euo pipefail
          IPA="$(find build324 -type f -name '*.ipa' | head -n1)"
          test -n "$IPA"
          mkdir -p transfer
          shasum -a 256 "$IPA" | tee transfer/build324.sha256
          split -b 70m -d -a 2 "$IPA" transfer/ipa.part.
          ls -lh transfer

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: Build324-IPA-part-00
          path: transfer/ipa.part.00
          compression-level: 0
          if-no-files-found: error

      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: Build324-IPA-part-01
          path: transfer/ipa.part.01
          compression-level: 0
          if-no-files-found: error

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: Build324-IPA-checksum
          path: transfer/build324.sha256
          if-no-files-found: error
