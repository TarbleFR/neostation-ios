name: Debug ARMSX2 179 Guard

on:
  push:
    branches:
      - fix/armsx2-bookmark-library-saves-from-171-179

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/armsx2-bookmark-library-saves-from-171-179
      - name: Apply patches and inspect guards
        shell: bash
        run: |
          set -euxo pipefail
          python3 build-utils/patch_retroarch_root_first_run.py
          python3 build-utils/patch_remove_manic_from_171.py
          python3 build-utils/patch_armsx2_isolated_root_179.py
          python3 build-utils/patch_armsx2_isolated_root_postfix_179.py
          python3 build-utils/patch_armsx2_launch_encoding_179.py
          git diff --check
          echo G1
          git diff --exit-code -- lib/services/ios_shortcut_jit_launch_service.dart lib/services/jit_backend_preference_service.dart lib/services/stikjit_armsx2_service.dart lib/services/stikjit_melonx_service.dart packages/stikjit_bridge
          echo G2
          test ! -e lib/services/manic_emu_launch_service.dart
          test ! -e lib/services/ios_emulator_preference_service.dart
          test ! -e lib/l10n/manic_emu_locale.dart
          ! grep -RniE 'Manic[ _-]?EMU|ManicEMU|manicemu|manic_emu|IosEmulatorPreferenceService|IosLibraryEmulator|linkedManicEmuFolderPath' lib packages
          echo G3
          grep -Fq "static const String bookmarkKey = 'armsx2'" lib/services/armsx2_folder_service.dart
          grep -Fq 'linkedArmsx2FolderPath' lib/services/config_service.dart
          grep -Fq 'linkedArmsx2GameFolderPath' lib/services/config_service.dart
          ! grep -Fq 'linkedArmsx2SaveFolderPath' lib/services/config_service.dart
          ! grep -Fq 'armsx2NeoSyncBookmarkKey' lib/services/config_service.dart
          grep -Fq 'onLinkPressed: _linkArmsx2RootFolder' lib/screens/settings_screen/new_settings_options/directories_settings_content.dart
          ! grep -Fq 'Armsx2LibraryService.requestLibrarySync()' lib/screens/settings_screen/new_settings_options/directories_settings_content.dart
          echo G4
          grep -Fq 'final isArmsx2OwnedRom = Armsx2FolderService.ownsRomPath' lib/services/game/game_launch_service.dart
          grep -Fq 'if (isArmsx2OwnedRom || isArmsx2VirtualRom)' lib/services/game/game_launch_service.dart
          grep -Fq 'PS2 on iOS must never merge RetroArch and ARMSX2 save roots' lib/providers/neosync/neosync_path_resolver.dart
          grep -Fq 'return await Armsx2FolderService.resolveSaveDirectories' lib/providers/neosync/neosync_path_resolver.dart
          ! grep -Fq 'linkedExternalFolderPath' lib/services/armsx2_folder_service.dart
          echo G5
          grep -Fq 'Uri.encodeComponent(fileName)' lib/services/armsx2_library_service.dart
          grep -Fq 'armsx2://launch?game=$encodedFileName' lib/services/armsx2_library_service.dart
          ! grep -Fq "queryParameters: {'game': fileName}" lib/services/armsx2_library_service.dart
          echo ALL_GUARDS_OK
