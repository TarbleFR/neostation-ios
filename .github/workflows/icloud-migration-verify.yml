name: iCloud migration validation toolchain
on:
  push:
    branches: [work/icloud-saves-208]
permissions:
  contents: read
jobs:
  native-test-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter test --no-pub test/bounded_concurrency_test.dart
      - name: Archive cached native dependencies
        run: |
          set -euo pipefail
          find .dart_tool/hooks_runner/shared -type f -printf '%p %s bytes\n'
          tar -C .dart_tool/hooks_runner -czf /tmp/icloud-native-dependencies.tgz shared
      - uses: actions/upload-artifact@v4
        with:
          name: icloud-native-dependencies
          path: /tmp/icloud-native-dependencies.tgz
          retention-days: 2
