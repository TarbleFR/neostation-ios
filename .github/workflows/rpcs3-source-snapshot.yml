name: RPCS3 targeted startup preflight
on:
  push:
    branches: [experimental]
    paths: ['.github/workflows/rpcs3-source-snapshot.yml']
permissions:
  contents: write
concurrency:
  group: neostation-rpcs3-source-consolidation
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Apply checked host-only result correction
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/final302-review"
          python3 build-utils/migrations/final302.py
          git diff --check
          python3 test/rpcs3_completion_result_native_test.py
          python3 test/rpcs3_startup_abort_native_test.py
          python3 test/rpcs3_jit_handshake_test.py
          python3 test/rpcs3_memory_preflight_test.py
          python3 test/rpcs3_loader_stability_280_test.py
          python3 test/rpcs3_build283_boot_stability_test.py
          python3 test/rpcs3_build285_core_handoff_test.py
          node test/rpcs3_debugger_handshake_test.js
          node test/rpcs3_stop_reply_behavior_test.js
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Analyze and test host integration
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter analyze --no-fatal-infos > "$RUNNER_TEMP/final302-review/analyze.txt" 2>&1 || { cat "$RUNNER_TEMP/final302-review/analyze.txt"; exit 1; }
          flutter test --reporter expanded test/rpcs3_startup_transaction_test.dart test/rpcs3_bridge_memory_mode_test.dart test/rpcs3_internal_integration_test.dart test/rpcs3_lazy_load_contract_test.dart test/local_jit_route_proof_test.dart test/game_deletion_regression_test.dart test/armsx2_embedded_library_contract_test.dart > "$RUNNER_TEMP/final302-review/tests.txt" 2>&1 || { tail -100 "$RUNNER_TEMP/final302-review/tests.txt"; exit 1; }
          tail -5 "$RUNNER_TEMP/final302-review/tests.txt"
      - name: Compile exact host bridge against iPhoneOS SDK
        run: |
          set -euo pipefail
          flutter precache --ios
          FRAMEWORK="$(find "$FLUTTER_ROOT/bin/cache/artifacts/engine" -type d -path '*/ios-arm64/Flutter.framework' -print -quit)"
          test -n "$FRAMEWORK"
          CLASSES=packages/rpcs3_internal_bridge/ios/Classes
          xcrun --sdk iphoneos clang++ -target arm64-apple-ios16.3 -std=c++20 -fobjc-arc -fblocks -fsyntax-only -F "$(dirname "$FRAMEWORK")" -I "$CLASSES" "$CLASSES/Rpcs3JitBridgePlugin.mm"
      - name: Publish only tested host result code
        run: |
          set -euo pipefail
          git rm build-utils/migrations/final302.py
          git add packages/rpcs3_internal_bridge/ios/Classes/Rpcs3JitBridgePlugin.mm
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(rpcs3): return observed completion failures instead of stale helper success text [rpcs3-host-only]'
          git rev-parse HEAD > "$RUNNER_TEMP/final302-review/HOST_SHA.txt"
          git diff HEAD~1 HEAD > "$RUNNER_TEMP/final302-review/final-diagnostics.patch"
          git branch build302-final-host HEAD
          git bundle create "$RUNNER_TEMP/final302-review/host.bundle" --all
          git push origin HEAD:experimental
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RPCS3-final-host-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/final302-review/
          retention-days: 7
