name: Publish Build 329 IPA direct
run-name: Publish Build 329 IPA • ${{ github.sha }}

on:
  push:
    branches: [experimental]
    paths:
      - '.github/workflows/publish-build329-ipa.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: build-329-kartpad-cache-entry-fix
      ASSET: NeoStation-iOS-Build-329-KartPad-Cache-Entry-Fix.ipa
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download validated Build 329 artifact
        uses: actions/download-artifact@v4
        with:
          name: NeoStation-iOS-Build-329-KartPad-Cache-Entry-Fix
          run-id: 36032445333
          github-token: ${{ github.token }}
          path: build329

      - name: Locate and verify IPA
        shell: bash
        run: |
          set -euo pipefail
          IPA="$(find build329 -type f -name '*.ipa' | head -n1)"
          test -n "$IPA"
          cp "$IPA" "$ASSET"
          unzip -t "$ASSET" >/dev/null
          shasum -a 256 "$ASSET"

      - name: Publish direct IPA release asset
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --title "NeoStation iOS Build 329 KartPad Cache Entry Fix" \
              --notes "Experimental KartPad startup candidate based on stable Build 322. Detects stale or dangling Library/Caches/KartPad entries with lstat, removes only invalid entries, recreates the canonical cache directory and verifies actual write access before loading KartPad." \
              --prerelease
          fi
