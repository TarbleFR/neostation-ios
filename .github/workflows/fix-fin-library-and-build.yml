      expect(metadata.existsSync(), isTrue);
      final metadataSource = metadata.readAsStringSync();
      expect(metadataSource, isNot(contains('rootBundle.loadString')));
      expect(metadataSource, isNot(contains('manifestAsset')));
""",
              'Library import-only metadata test',
          )
          p.write_text(s, encoding='utf-8')

          # Distinguishable build number so the user can verify the IPA.
          p = Path('pubspec.yaml')
          s = p.read_text(encoding='utf-8')
          s = replace_required(s, 'version: 1.0.0+143\n', 'version: 1.0.0+144\n', 'build number 144')
          p.write_text(s, encoding='utf-8')

          print('Applied Fin native-scan and Library import-only fixes.')
