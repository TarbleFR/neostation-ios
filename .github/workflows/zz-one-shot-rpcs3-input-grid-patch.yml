name: One-shot RPCS3 input and grid repair

on:
  push:
    branches:
      - fix/rpcs3-universal-jit-region-build236
    paths:
      - .github/workflows/zz-one-shot-rpcs3-input-grid-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/rpcs3-universal-jit-region-build236
          fetch-depth: 0

      - name: Apply patch
        run: python3 build-utils/one_shot_rpcs3_input_grid_patch.py

      - name: Validate source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 test/rpcs3_input_bridge_test.py
          python3 test/rpcs3_input_abi_test.py
          git diff --check
          grep -q "showTitle: false" lib/screens/game_screen/my_games_grid.dart
          grep -q "if (showTitle)" lib/widgets/game_view_footer.dart
          grep -q "uint32_t connected;" packages/rpcs3_internal_bridge/ios/Classes/Rpcs3CoreABI.h
          grep -q "uint64_t buttons;" packages/rpcs3_internal_bridge/ios/Classes/Rpcs3CoreABI.h

      - name: Commit repaired sources
        shell: bash
        run: |
          set -euo pipefail
          git restore .github/workflows/build-ipa-once.yml
          git config user.name "NeoStation CI"
          git config user.email "actions@users.noreply.github.com"
          git add packages/rpcs3_internal_bridge/ios/Classes/Rpcs3CoreABI.h
          git add packages/rpcs3_internal_bridge/ios/Classes/RPCS3GameInputController.mm
          git add lib/widgets/game_view_footer.dart
          git add lib/screens/game_screen/my_games_grid.dart
          git add test/rpcs3_input_bridge_test.py
          git add test/rpcs3_input_abi_test.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: restore RPCS3 controller/touch ABI and hide grid marquee [skip ci]"
          git push origin HEAD:fix/rpcs3-universal-jit-region-build236
