name: NeoStation Dolphin v2 - Materialize Source

on:
  push:
    branches:
      - test/dolphin-internal-engine-isolated-v2
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: neostation-dolphin-v2-materialize
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/dolphin-internal-engine-isolated-v2
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Materialize and validate dependency graph
        shell: bash
        run: |
          set -euo pipefail
          python3 build-utils/materialize_dolphin_isolated_v2.py
          python3 build-utils/dolphin_v2_compile_fixes.py
          flutter pub get
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'fix(dolphin): finalize isolated v2 source materialization'
            git push origin HEAD:test/dolphin-internal-engine-isolated-v2
          else
            echo 'Isolated Dolphin v2 source is already materialized.'
          fi
