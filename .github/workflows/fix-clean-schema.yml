name: Fix cleaned SQLite schema

on:
  push:
    branches: [fix/disable-ios-standalone-neosync]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Remove trailing SQL commas left by schema cleanup
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path('lib/data/datasources/sqlite_service.dart'),
              Path('test/database_test_helper.dart'),
          ]
          old = 'multidisc INTEGER NOT NULL DEFAULT 0,'
          new = 'multidisc INTEGER NOT NULL DEFAULT 0'
          for path in files:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one trailing SQL comma in {path}, found {count}')
              path.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Commit schema repair and remove this temporary workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-clean-schema.yml
          git config user.name 'Tarble FR'
          git config user.email 'f9wynyv9qy@privaterelay.appleid.com'
          git add lib/data/datasources/sqlite_service.dart test/database_test_helper.dart
          git commit -m 'fix: repair SQLite schema after cloud removal'
          git push origin HEAD:fix/disable-ios-standalone-neosync
