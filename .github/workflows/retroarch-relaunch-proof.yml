name: RetroArch same-game relaunch isolation
'on':
  push:
    branches: [experimental]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: retroarch-relaunch-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cache-persistence:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[retroarch-relaunch-only]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CI: 'true'
      BOT: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Verify unchanged product inputs and successful Build422 evidence
      run: |
        python3 - <<'PY'
        import json,subprocess
        ref='00285ba5cfec694d59e1ca2bcf9de31418fd4e1a'
        changes=subprocess.check_output(['git','diff','--name-only',ref,'HEAD','--','lib','packages','native','assets','pubspec.yaml','pubspec.lock'],text=True).splitlines()
        assert not changes, 'Product inputs changed: '+repr(changes)
        run=json.loads(subprocess.check_output(['gh','api','repos/TarbleFR/neostation-ios/actions/runs/37847695065']))
        assert run['head_sha']==ref and run['conclusion']=='success'
        print('Existing library/runtime tests retain their prior SHA; product inputs match Build422 exactly')
        PY
        python3 build-utils/verify_delivery_reuse.py
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.47.2'
        channel: stable
        cache: true
    - run: flutter pub get --enforce-lockfile
    - name: Validate only the new successive-request regression
      run: |
        flutter analyze --no-fatal-infos test/retroarch_relaunch_cache_test.dart
        flutter test --no-pub test/retroarch_relaunch_cache_test.dart
  uikit-relaunch:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[retroarch-relaunch-only]') }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.4'
    - name: Compile receiver scene proposal for real iPhone SDK, ARC and MRR
      run: |
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        xcrun clang -fsyntax-only -fobjc-arc -Werror -target arm64-apple-ios17.0 -isysroot "$SDK" test/fixtures/retroarch_handoff/PatchedSceneSyntax.m
        xcrun clang -fsyntax-only -Werror -target arm64-apple-ios17.0 -isysroot "$SDK" test/fixtures/retroarch_handoff/PatchedSceneSyntax.m
    - name: Install fixture project generator
      run: brew install xcodegen
    - name: Exercise same URL twice warm, then after receiver termination
      env:
        HANDOFF_RELAUNCH_ONLY: '1'
        HANDOFF_FIX_INITIAL_URLS: '0'
        HANDOFF_EVIDENCE_NAME: relaunch-omission
      run: python3 tools/test_retroarch_uikit_handoff.py
    - name: Exercise the proposed initial-scene fix with the identical sequence
      env:
        HANDOFF_RELAUNCH_ONLY: '1'
        HANDOFF_FIX_INITIAL_URLS: '1'
        HANDOFF_EVIDENCE_NAME: relaunch-fixed-receiver
      run: python3 tools/test_retroarch_uikit_handoff.py
    - name: Seal transport-only evidence for the authorized recipient
      if: always()
      run: |
        mkdir -p evidence
        python3 - <<'PY'
        import os,shutil
        from pathlib import Path
        for item in Path(os.environ['RUNNER_TEMP']).glob('relaunch-*.json'):
            shutil.copy2(item,Path('evidence')/item.name)
        PY
        python3 build-utils/delivery_cipher.py artifact evidence encrypted-relaunch-evidence
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: RetroArch-relaunch-proof-${{ github.sha }}
        path: encrypted-relaunch-evidence/
        if-no-files-found: error
        retention-days: 14
