name: NeoStation iOS source audit
run-name: Source audit only - ${{ github.sha }}

on:
  push:
    branches: [experimental]

permissions:
  contents: read

concurrency:
  group: neostation-ios-experimental-audit
  cancel-in-progress: true

jobs:
  source-audit:
    name: Export exact source for regression audit (no IPA)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Archive tracked source only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-export
          git archive --format=tar HEAD | gzip > audit-export/neostation-source.tar.gz
          git rev-parse HEAD > audit-export/commit.txt
          sha256sum audit-export/neostation-source.tar.gz > audit-export/source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: NeoStation-source-audit
          path: audit-export/
          retention-days: 3
          if-no-files-found: error
