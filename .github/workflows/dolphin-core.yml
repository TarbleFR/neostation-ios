name: Dolphin native core
run-name: Dolphin native core • ${{ github.sha }}

on:
  push:
    branches:
      - experimental
    paths:
      - '.github/workflows/dolphin-core.yml'
      - 'build-utils/patch_dolphin_internal_core_v2.py'
      - 'packages/dolphin_internal_bridge/core/**'
      - 'packages/dolphin_internal_bridge/ci/build_support.py'
      - 'test/dolphin_cheat_manager_test.py'
      - 'test/dolphin_cheat_catalog_test.py'
      - 'test/dolphin_memory_permissions_test.py'
      - 'test/dolphin_metal_shutdown_test.py'
      - 'test/dolphin_process_lifecycle_test.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neostation-dolphin-core-experimental
  cancel-in-progress: true

jobs:
  build:
    name: Build Dolphin Core arm64
    runs-on: macos-15
    timeout-minutes: 180
    env:
      BUILD_NUMBER: '298'
      DOLPHIN_SHA: 7cac54161659421ed95c2cd1c0b0746539a4cd38
      HOMEBREW_NO_AUTO_UPDATE: '1'
      CCACHE_DIR: ${{ github.workspace }}/.dolphin-ccache

    steps:
      - name: Checkout exact NeoStation commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Validate native integration contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 -m py_compile build-utils/patch_dolphin_internal_core_v2.py
          python3 test/dolphin_cheat_manager_test.py
          python3 test/dolphin_https_resource_test.py
          python3 test/dolphin_memory_permissions_test.py
          python3 test/dolphin_process_lifecycle_test.py

      - name: Prepare native toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v cmake >/dev/null || brew install cmake
          command -v ninja >/dev/null || brew install ninja
          command -v ccache >/dev/null || brew install ccache
          ccache --max-size=2G
          mkdir -p dist/dolphin build/dolphin-core-diagnostics

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          key: dolphin-core-ccache-xcode16.4-${{ hashFiles('build-utils/patch_dolphin_internal_core_v2.py', 'packages/dolphin_internal_bridge/core/**') }}-${{ github.run_id }}
          restore-keys: |
            dolphin-core-ccache-xcode16.4-${{ hashFiles('build-utils/patch_dolphin_internal_core_v2.py', 'packages/dolphin_internal_bridge/core/**') }}-
            dolphin-core-ccache-xcode16.4-
          path: .dolphin-ccache

      - name: Checkout pinned DolphiniOS source
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/dolphin-ios"
          rm -rf "$SRC"
          git init "$SRC"
          git -C "$SRC" remote add origin https://github.com/OatmealDome/dolphin-ios.git
          git -C "$SRC" fetch --depth 1 origin "$DOLPHIN_SHA"
          git -C "$SRC" checkout --detach FETCH_HEAD
          git -C "$SRC" submodule update --init --recursive --depth 1
          test "$(git -C "$SRC" rev-parse HEAD)" = "$DOLPHIN_SHA"
          printf 'host=%s\ndolphin=%s\n' "$GITHUB_SHA" "$DOLPHIN_SHA"             > build/dolphin-core-diagnostics/source.txt

      - name: Patch and compile Dolphin Core
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/dolphin-ios"
          python3 build-utils/patch_dolphin_internal_core_v2.py "$SRC"
          python3 test/dolphin_metal_shutdown_test.py
          python3 test/dolphin_cheat_catalog_test.py --upstream "$SRC"

          cmake -S "$SRC" -B "$SRC/build-iphoneos-Release" -G Ninja             -DCMAKE_TOOLCHAIN_FILE="$SRC/Externals/ios-cmake/ios.toolchain.cmake"             -DPLATFORM=OS64             -DDEPLOYMENT_TARGET=17.4             -DENABLE_VISIBILITY=ON             -DENABLE_BITCODE=OFF             -DENABLE_ARC=ON             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_CXX_FLAGS=-fPIC             -DIOS=ON             -DENABLE_ANALYTICS=NO             -DUSE_SYSTEM_LIBS=OFF             -DENABLE_TESTS=OFF             -DCMAKE_POLICY_VERSION_MINIMUM=3.5             -DCMAKE_C_COMPILER_LAUNCHER=ccache             -DCMAKE_CXX_COMPILER_LAUNCHER=ccache             -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache             -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache             2>&1 | tee build/dolphin-core-diagnostics/configure.log

          cmake --build "$SRC/build-iphoneos-Release" --target dolphin --parallel 3             2>&1 | tee build/dolphin-core-diagnostics/compile.log

      - name: Materialize and validate Dolphin framework
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/dolphin-ios"
          mkdir -p ios/Runner
          python3 packages/dolphin_internal_bridge/ci/build_support.py framework "$SRC"

          FRAMEWORK="packages/dolphin_internal_bridge/ios/Frameworks/DolphinCore.framework"
          CORE="$FRAMEWORK/DolphinCore"
          test -s "$CORE"
          file "$CORE" | tee build/dolphin-core-diagnostics/file.txt
          test "$(lipo -archs "$CORE")" = "arm64"

          nm -gU "$CORE" > build/dolphin-core-diagnostics/exports.txt
          for symbol in             _neostation_dolphin_initialize             _neostation_dolphin_launch             _neostation_dolphin_menu_snapshot             _neostation_dolphin_cheats_snapshot             _neostation_dolphin_set_cheats_enabled             _neostation_dolphin_set_cheat_enabled             _neostation_dolphin_download_gecko_codes; do
            grep -q " $symbol$" build/dolphin-core-diagnostics/exports.txt
          done

          ditto "$FRAMEWORK" dist/dolphin/DolphinCore.framework
          ditto "$SRC/Data/Sys" dist/dolphin/Sys
          cp "$SRC/Source/iOS/App/Project/Assets/cacert.pem" dist/dolphin/cacert.pem
          test -s dist/dolphin/cacert.pem

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          core = Path('dist/dolphin/DolphinCore.framework/DolphinCore')
          identity = {
              'schema_version': 1,
              'repository': 'https://github.com/OatmealDome/dolphin-ios.git',
              'host_commit': os.environ['GITHUB_SHA'],
              'source_revision': os.environ['DOLPHIN_SHA'],
              'sha256': hashlib.sha256(core.read_bytes()).hexdigest(),
              'architectures': ['arm64'],
              'abi': 'NeoStation Dolphin internal v3 + cheat manager',
              'cheat_catalogues': ['Gecko/WiiRD', 'Action Replay/local INI'],
              'device_runtime_tested': False,
          }
          Path('dist/dolphin/identity.json').write_text(
              json.dumps(identity, indent=2) + '\n'
          )
          Path('build/dolphin-core-diagnostics/identity.json').write_text(
              json.dumps(identity, indent=2) + '\n'
          )
          print(json.dumps(identity, indent=2))
          PY

      - name: Upload Dolphin Core
        uses: actions/upload-artifact@v4
        with:
          name: DolphinCore-${{ github.sha }}
          path: dist/dolphin/
          if-no-files-found: error
          retention-days: 14

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          key: dolphin-core-ccache-xcode16.4-${{ hashFiles('build-utils/patch_dolphin_internal_core_v2.py', 'packages/dolphin_internal_bridge/core/**') }}-${{ github.run_id }}
          path: .dolphin-ccache

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DolphinCore-diagnostics-${{ github.sha }}
          path: build/dolphin-core-diagnostics/
          if-no-files-found: warn
          retention-days: 7
