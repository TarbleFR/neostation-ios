name: Prepare NeoStation iOS Build 214

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bump-build-214.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bump build workflow to 214
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/build-ipa-once.yml')
          text = p.read_text()
          if 'Build 213' not in text or "BUILD_NUMBER: '213'" not in text:
              raise SystemExit('Build 213 markers not found')
          text = text.replace('213', '214')
          p.write_text(text)
          PY
          rm -f .github/workflows/bump-build-214.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-ipa-once.yml .github/workflows/bump-build-214.yml
          git commit -m "ci: build NeoStation iOS Build 214"
          git push origin HEAD:main
