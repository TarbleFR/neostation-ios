name: Materialize Build 179 Canonical Source

on:
  push:
    branches:
      - cleanup/canonical
    paths:
      - '.github/workflows/materialize-build179-canonical.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/canonical
          fetch-depth: 0

      - name: Materialize validated Build 179 runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 build-utils/patch_retroarch_root_first_run.py
          python3 build-utils/patch_remove_manic_from_171.py
          python3 build-utils/patch_armsx2_isolated_root_179.py
          python3 build-utils/patch_armsx2_isolated_root_postfix_179.py
          python3 build-utils/patch_armsx2_launch_encoding_179.py
          python3 build-utils/verify_armsx2_bookmark_179.py
          git diff --check

          # Remove one-off CI/build patch machinery. Runtime behavior is now
          # materialized directly into the Dart source.
          rm -f \
            .github/workflows/build-armsx2-bookmark-library-saves-179.yml \
            .github/workflows/build-retroarch-root-first-run-171.yml \
            .github/workflows/build-retroarch-root-first-run-171-v2.yml \
            .github/workflows/debug-armsx2-179.yml \
            build-utils/patch_armsx2_isolated_root_179.py \
            build-utils/patch_armsx2_isolated_root_postfix_179.py \
            build-utils/patch_armsx2_launch_encoding_179.py \
            build-utils/patch_remove_manic_from_171.py \
            build-utils/patch_retroarch_root_first_run.py \
            build-utils/verify_armsx2_bookmark_179.py

          # This workflow is one-shot and must not remain in the canonical tree.
          rm -f .github/workflows/materialize-build179-canonical.yml

          # No ManicEMU runtime/code reference is allowed to survive.
          if grep -RniE \
            --exclude-dir=.git \
            --exclude='*.md' \
            'Manic[ _-]?EMU|ManicEMU|manicemu|manic_emu|IosEmulatorPreferenceService|IosLibraryEmulator|linkedManicEmuFolderPath' \
            lib packages assets 2>/dev/null; then
            echo 'ERROR: ManicEMU code/runtime reference remains after materialization.'
            exit 1
          fi

          git status --short

      - name: Commit canonical source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NeoStation CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat(ios): materialize Build 179 canonical source'
          git push origin HEAD:cleanup/canonical
