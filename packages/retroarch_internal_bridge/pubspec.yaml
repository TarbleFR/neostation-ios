name: retroarch_internal_bridge
resolution: workspace
description: Host-owned embedded RetroArch session bridge for NeoStation iOS.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.9.2'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: RetroArchInternalBridgePlugin
