name: rpcs3_internal_bridge
resolution: workspace
description: Isolated in-process RPCS3 Core bridge for NeoStation iOS PlayStation 3 routes.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.9.2'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.4

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: Rpcs3CompositeBridgePlugin
