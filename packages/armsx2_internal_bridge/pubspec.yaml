name: armsx2_internal_bridge
resolution: workspace
description: Isolated in-process ARMSX2 Core bridge for NeoStation iOS PlayStation 2 routes.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.9.2'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: Armsx2InternalBridgePlugin
